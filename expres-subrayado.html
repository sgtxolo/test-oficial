<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exprés subrayado</title>
<link rel="stylesheet" href="expres-subrayado/esquema.css">
<style>
:root{--fondo:#f5f4ee;--panel:#fff;--panel-alt:#eeece3;--texto:#1f2a24;--gris:#767a70;--texto-gris:#767a70;--borde:#e2e0d5;--verde-osc:#163f30;--verde:#1c4d3c;--verde-med:#2f6b52;--verde-suave:#e7efe8;--ambar:#e0a800;--ambar-bg:#fff4d6;--rojo:#c0392b;--ok:#2f9e6e;--dud:#e0a800;--mal:#d1554a;--radio:18px;--radio-sm:12px;--ancho:980px;--sombra:0 1px 3px rgba(20,40,30,.12),0 6px 18px rgba(20,40,30,.06);font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
:root[data-theme="dark"]{--fondo:#141917;--panel:#1e2523;--panel-alt:#262f2b;--texto:#eef1ee;--gris:#9aa39c;--texto-gris:#9aa39c;--borde:#333d37;--verde-osc:#7fd9ac;--verde:#3f8a68;--verde-med:#57a683;--verde-suave:#16332a;--ambar:#e0a800;--ambar-bg:#3a2f12;--rojo:#ef7a6c;--sombra:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0;background:var(--fondo);color:var(--texto)}
button{font:inherit;color:inherit;cursor:pointer}
.oculto{display:none!important}
/* barra superior */
#top{position:sticky;top:0;z-index:20;background:var(--fondo);border-bottom:1px solid var(--borde);padding:10px max(16px,env(safe-area-inset-left)) 8px}
#top .fila{display:flex;align-items:center;gap:8px;max-width:var(--ancho);margin:0 auto}
#top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--verde-osc)}
.ib{border:1.5px solid var(--borde);background:var(--panel);border-radius:12px;min-width:38px;height:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}
.ib:hover{background:var(--panel-alt)}.ib.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.menu{position:absolute;right:16px;top:54px;background:var(--panel);border:1.5px solid var(--borde);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:8px;min-width:250px;z-index:30}
.menu button,.menu a{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--texto);text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--panel-alt)}.menu hr{border:0;border-top:1px solid var(--borde);margin:6px 0}
main{max-width:var(--ancho);margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 110px}
/* dashboard */
.hero{background:linear-gradient(135deg,var(--verde-osc),var(--verde-med));color:#fff;border-radius:var(--radio);padding:22px 22px 18px;box-shadow:var(--sombra)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1c4d3c,#2f6b52)}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.88;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.14);border-radius:var(--radio-sm);padding:10px 12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.85}
.barra{height:8px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:var(--ambar);border-radius:99px;transition:width .3s}
.cont{display:flex;align-items:center;gap:12px;background:var(--ambar-bg);border:1.5px solid var(--ambar);border-radius:var(--radio);padding:12px 16px;margin-top:14px;flex-wrap:wrap}
.cont b{display:block}.cont span{font-size:13px;color:var(--gris)}
.cont button{margin-left:auto;background:var(--verde);color:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:700}
h3.sec{font-size:15px;margin:22px 4px 10px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tema{background:var(--panel);border:1.5px solid var(--borde);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tema:hover{border-color:var(--verde-med)}
.tema .num{display:inline-block;background:var(--verde-suave);color:var(--verde-osc);font-weight:800;border-radius:10px;padding:2px 10px;font-size:13px;align-self:flex-start}
.tema h4{margin:0;font-size:16px;line-height:1.3}.tema .meta{font-size:12.5px;color:var(--gris);display:flex;gap:10px;flex-wrap:wrap}
.tema .barra{background:var(--panel-alt);margin-top:2px}.tema .barra i{background:var(--verde-med)}.tema .barra.q i{background:var(--ok)}
.apps{display:flex;gap:10px;flex-wrap:wrap}.apps a{flex:1;min-width:160px;text-align:center;text-decoration:none;color:var(--verde-osc);background:var(--panel);border:1.5px solid var(--borde);border-radius:var(--radio-sm);padding:12px;font-weight:700}
/* cabecera de tema */
.ttema{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--gris);text-transform:uppercase}
.htema{font-size:24px;margin:2px 0 12px;color:var(--verde-osc)}
.est{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ebtn{border:1.5px solid var(--verde-med);background:var(--panel);color:var(--verde-osc);border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px}
.ebtn.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.est small{color:var(--gris);font-size:13px}
.cnts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cnt{background:var(--panel-alt);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.cob{background:var(--panel-alt);border-radius:var(--radio-sm);padding:14px;margin:8px 0}
.cob b.t{display:block;margin-bottom:8px}.cob .bar2{height:14px;border-radius:99px;background:#f3c4cc;overflow:hidden}.cob .bar2 i{display:block;height:100%;background:var(--ok)}
.cob p{margin:8px 0 0;font-size:13.5px}.cob small{color:var(--gris);font-size:12px}
.ley{background:var(--panel-alt);border-radius:var(--radio-sm);padding:12px 14px;margin:8px 0;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;align-items:center}
/* barra de herramientas fija */
#herr{position:sticky;top:59px;z-index:15;background:var(--fondo);border-bottom:1px solid var(--borde);padding:8px 0 10px}
#herr .in{max-width:var(--ancho);margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.buscar{width:100%;border:1.5px solid var(--borde);background:var(--panel);color:var(--texto);border-radius:12px;padding:9px 12px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--borde);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--gris)}
.prog .barra{flex:1;margin:0;background:var(--panel-alt)}.prog .barra i{background:var(--verde-med)}
.grupo{margin:20px 2px 8px;font-size:13px;font-weight:800;color:var(--verde-med);text-transform:uppercase;letter-spacing:.05em}
/* tarjeta de artículo */
.card{background:var(--panel);border:1.5px solid var(--borde);border-left:6px solid var(--borde);border-radius:var(--radio);margin:0 0 14px;box-shadow:var(--sombra);overflow:hidden;scroll-margin-top:210px}
.card.st-ok{border-left-color:var(--ok)}.card.st-dud{border-left-color:var(--dud)}.card.st-mal{border-left-color:var(--mal)}
.card.visto{opacity:.55}.card.diana{outline:3px solid var(--verde-med)}
.card .cab{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex-wrap:wrap}
.card .cab .nom{flex:1;min-width:150px;font-weight:800;font-size:15px;color:var(--verde-osc);text-transform:uppercase;letter-spacing:.02em}
.card .cab .nom small{display:block;font-weight:500;color:var(--gris);font-size:12px;text-transform:none;letter-spacing:0;margin-top:2px}
.mk{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;font-weight:800;font-size:11px;min-width:30px;height:30px;padding:0 7px;border:2px solid;background:var(--panel);line-height:1}
.mk.exof{border-color:#a3166b;color:#a3166b;border-radius:99px;font-size:10.5px;height:28px}.mk.ex{border-color:#d1332a;color:#d1332a}.mk.ast{border-color:#1f5fbf;color:#1f5fbf;font-size:17px}.mk.r{border-color:#767a70;color:#4c554f;border-radius:50% 50% 50% 4px;font-size:11px}
.stc{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--panel-alt)}
.stc.ok{background:#d8f0e4;color:#116a45}.stc.dud{background:#fff0c2;color:#7a5b00}.stc.mal{background:#fbd9d4;color:#9b2b20}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--verde-suave);color:var(--verde-osc)}.tag.extra{background:var(--ambar-bg);color:var(--ambar)}
.card .acc{display:flex;gap:6px;flex-wrap:wrap;padding:4px 12px 10px}
.sb{border:1.5px solid var(--borde);background:var(--panel);border-radius:10px;padding:5px 11px;font-size:13px;font-weight:600;text-decoration:none;color:var(--texto);display:inline-flex;align-items:center;gap:5px}
.sb:hover{background:var(--panel-alt)}.sb.on{background:var(--verde-suave);border-color:var(--verde-med);color:var(--verde-osc)}
.sb.dif.on{background:var(--ambar-bg);border-color:var(--ambar);color:var(--ambar)}.sb.fijo{opacity:.65;cursor:default}
.card img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in}
.esqs{padding:10px 12px 12px;display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--borde);background:var(--fondo)}
.esqs .vis{margin:0}
.esq-t{font-size:12px;font-weight:800;color:var(--verde-med);text-transform:uppercase;letter-spacing:.06em;margin:0 0 -4px}
.nota{display:block;width:calc(100% - 24px);margin:0 12px 12px;border:1.5px solid var(--borde);background:var(--panel-alt);color:var(--texto);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;min-height:60px;resize:vertical}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}
/* ventanas */
#mod{position:fixed;inset:0;z-index:70;background:rgba(10,15,12,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#mod .caja{background:var(--panel);color:var(--texto);border-radius:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#mod .caja.ancha{max-width:1040px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs .chip{padding:8px 16px;font-size:14px}
.bloque{background:var(--panel-alt);border-radius:var(--radio-sm);padding:14px;margin:10px 0}
.bloque h5{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.fila-t{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--borde);margin-top:8px;cursor:pointer}
.fila-t b{flex:1}.fila-t small{display:block;color:var(--gris);font-weight:400;margin-top:2px}
.big{font-size:42px;font-weight:800;color:var(--verde-med);line-height:1}
.dias{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=text].f,select.f{font:inherit;border:1.5px solid var(--borde);background:var(--panel);color:var(--texto);border-radius:10px;padding:7px 10px}
.herr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.herr-grid button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid var(--borde);border-radius:14px;padding:12px}
.herr-grid button:hover{border-color:var(--verde-med)}.herr-grid b{display:block;font-size:14px}.herr-grid small{color:var(--gris);font-size:12px}
@media(max-width:560px){.herr-grid{grid-template-columns:1fr}.hero h2{font-size:19px}.htema{font-size:20px}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp img{width:100%;background:#fff;border-radius:8px}
/* visor */
#vis{position:fixed;inset:0;z-index:50;background:rgba(10,15,12,.94);display:flex;flex-direction:column}
#vis .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;color:#fff}#vis .bar b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vis .bar .ib{background:#ffffff1c;border-color:#ffffff30;color:#fff}
#vis .lienzo{flex:1;overflow:auto;text-align:center;-webkit-overflow-scrolling:touch}#vis img{background:#fff;max-width:none}
/* aviso «aquí te quedaste» */
#pill{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;background:var(--verde-osc);color:#fff;border-radius:99px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:min(720px,calc(100vw - 20px))}
:root[data-theme="dark"] #pill{color:#10201a}
#pill span{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pill button{border:0;border-radius:99px;padding:8px 16px;font-weight:800;background:#fff;color:var(--verde-osc)}#pill .x{background:transparent;color:inherit;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--verde-osc);color:#fff;padding:10px 18px;border-radius:99px;z-index:80;font-size:14px}
:root[data-theme="dark"] .toast{color:#10201a}
@media(max-height:759px){#herr{position:static}}
/* marcas propias: dibujo encima de cada captura */
.imgw{position:relative;line-height:0}.imgw img{display:block}
svg.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
body.marcando svg.ov{pointer-events:auto;touch-action:none;cursor:crosshair}
body.marcando.mano svg.ov{pointer-events:none;touch-action:auto}
body.marcando .imgw img{cursor:crosshair}
#tb{position:fixed;left:8px;top:90px;z-index:45;background:var(--panel);border:1.5px solid var(--borde);border-radius:22px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.3);max-height:calc(100vh - 110px);overflow:auto}
#tb button{width:42px;height:40px;border:0;border-radius:12px;background:transparent;font-size:17px;font-weight:700;color:var(--texto);display:flex;align-items:center;justify-content:center;padding:0}
#tb button:hover{background:var(--panel-alt)}#tb button.on{background:var(--verde);color:#fff}
#tb hr{border:0;border-top:1px solid var(--borde);margin:4px 6px}#tb .col{display:block;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--borde)}
#pop{position:fixed;z-index:90;background:var(--panel);color:var(--texto);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.4);padding:14px;width:min(360px,calc(100vw - 20px))}
#pop h5{margin:0 0 10px;font-size:15px}#pop .pcs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#pop .pc{border:2px solid transparent;border-radius:8px;padding:5px 12px;font-size:14px;font-weight:600;background:var(--panel-alt);color:#1f2a24}#pop .pc.on{border-color:var(--verde)}
#pop .pb{display:block;width:100%;border-radius:12px;border:1.5px solid var(--borde);background:var(--panel);padding:10px;margin-top:8px;font-size:14px}
#pop .pb.rojo{border-color:#d1554a;color:#d1554a}
@media(max-width:560px){#tb{top:auto;bottom:70px;left:50%;transform:translateX(-50%);flex-direction:row;border-radius:20px;padding:6px;max-width:calc(100vw - 12px);overflow-x:auto;max-height:none}#tb hr{display:none}#tb button{flex:none}}
body.marcando #pill{display:none}
body.embed #top{display:none}body.embed #herr{top:0}body.embed #info{display:none}
@media print{#top,#herr,#info,.acc,.nota,.toast,#vis,#pill,#mod{display:none!important}.card{box-shadow:none;break-inside:avoid;border:0;opacity:1!important}.card .cab{padding:2px 0}.card img{cursor:auto}body{background:#fff}}
</style></head><body>
<div id="top"><div class="fila">
  <button class="ib oculto" id="b-atras" title="Inicio">←</button>
  <h1 id="tit">Exprés · Temario subrayado</h1>

</div>
<div class="menu oculto" id="menu"></div></div>
<div id="herr" class="oculto"><div class="in"></div></div>
<main><div id="info"></div><div id="m"></div></main>
<div id="pill" class="oculto"></div>
<div id="mod" class="oculto"></div>
<div id="tb" class="oculto"></div>
<div id="pop" class="oculto"></div>
<div id="vis" class="oculto"></div>
<script src="expres-subrayado/datos-t1.js"></script>
<script src="expres-subrayado/datos-t7.js"></script>
<script src="expres-subrayado/cuadros-t1.js"></script>
<script src="expres-subrayado/cuadros-t7.js"></script>
<script>
"use strict";
const D = window.EXSUB || {}, C = window.EXSUB_C || {}, LS = 'exsub2', $ = s => document.querySelector(s), emb = /[?&]embed=1/.test(location.search);
const NOMBRES = ['Derechos humanos', 'Terrorismo internacional', 'Tratados de la Unión Europea', 'Fronteras de la UE', 'Bases de datos europeas', 'Extranjería', 'Derechos y deberes fundamentales (Constitución)', 'Poder judicial', 'Derecho civil', 'Derecho civil (II)', 'Derecho administrativo', 'Gobierno y Administración', 'Jurisdicción contencioso-administrativa', 'Defensor del Pueblo', 'VioGén', 'Igualdad entre mujeres y hombres', 'Menores', 'Derecho penal · parte general', 'Derecho penal · parte especial', 'Derecho procesal (I)', 'Derecho procesal · normas complementarias', 'Seguridad ciudadana', 'Seguridad privada', 'Estructura orgánica básica', 'Cooperación y coordinación policial', 'Estatuto de la Guardia Civil', 'Deontología profesional'];
const nomTema = n => 'Tema ' + n + '.- ' + (NOMBRES[n - 1] || '');
let st = {vis: {}, dif: {}, nota: {}, ent: {}, esq: {}, pin: {}, ult: {}, temas: {}, plazos: [], examen: '2027-07-01', escala: 100, vista: 'expres', extras: false, modoEsq: false};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || '{}')); const v0 = JSON.parse(localStorage.getItem('exsub-vis') || '{}'); for (const k in v0) if (v0[k] && st.vis[k] === undefined) st.vis[k] = 1; } catch (e) {}
const guarda = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let tema = null, filtro = 'todos', inst = 'todas', marca = null, busca = '', dest = null, destAp = null;
const key = (t, id) => t + '/' + id;
const hoyISO = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const fmtF = iso => iso ? iso.split('-').reverse().join('/') : '';
const diasHasta = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(hoyISO() + 'T00:00:00')) / 864e5);
// ---------- datos derivados ----------
const inv = {}; for (const t in D) { inv[t] = {}; for (const q in D[t].preg) (inv[t][D[t].preg[q]] = inv[t][D[t].preg[q]] || []).push(q); }
const visibles = t => D[t].piezas.filter(p => !p.extra);
const hechos = t => visibles(t).filter(p => st.vis[key(t, p.id)]).length;
const instDe = (t, p) => { const l = p.id.split('-')[0]; return (D[t].cit || []).find(c => c.p === l) || {}; };
const leerStats = () => { try { return (JSON.parse(localStorage.getItem('oficialAppState_v1') || '{}').qStats) || {}; } catch (e) { return {}; } };
// estado del artículo según los tests (como en Esquemas): 🟢 dominado · 🟡 a medias · 🔴 con fallos · ○ sin practicar
function estadoDe(t, p, S) {
  const ids = inv[t][p.id] || []; if (!ids.length) return null; let vistas = 0, mal = 0, dud = 0;
