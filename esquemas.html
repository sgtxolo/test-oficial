  + articuloResp("Artículo 84 TFUE — Prevención de la delincuencia · R19", ["con exclusión de toda armonización"], "<p>El Parlamento Europeo y el Consejo podrán establecer, con arreglo al procedimiento legislativo ordinario, medidas que impulsen y apoyen la actuación de los Estados miembros en el ámbito de la <mark class=\"m-destacable\">prevención de la delincuencia</mark>, con exclusión de <mark class=\"m-resp\">toda armonización de las disposiciones legales y reglamentarias de los Estados miembros</mark>.</p>", false)
  + articuloResp("Artículos 85 y 86 TFUE — Eurojust y Fiscalía Europea", ["Eurojust: coordinación y cooperación entre autoridades nacionales, delincuencia grave de 2 o más EM o criterios comunes","estructura: PE y Consejo mediante reglamentos, ordinario","actos procesales: funcionarios nacionales","Fiscalía a partir de Eurojust: Consejo por unanimidad, previa aprobación del PE","con Europol","ampliación: Consejo Europeo por unanimidad, aprobación PE y consulta Comisión"], "<p><b>85.1.</b> La función de <mark class=\"m-resp\">Eurojust</mark> es <mark class=\"m-resp\">apoyar y reforzar la coordinación y la cooperación entre las autoridades nacionales encargadas de investigar y perseguir la delincuencia grave que afecte a dos o más Estados miembros o que deba perseguirse según criterios comunes</mark>, basándose en las operaciones efectuadas y en la información proporcionada por las autoridades de los Estados miembros y por Europol. A tal fin, <mark class=\"m-resp\">el Parlamento Europeo y el Consejo determinarán, mediante reglamentos adoptados con arreglo al procedimiento legislativo ordinario</mark>, la estructura, el funcionamiento, el ámbito de actuación y las competencias de Eurojust. (…)</p><p><b>85.2.</b> En el contexto de las acciones penales contempladas en el apartado 1, y sin perjuicio del artículo 86, los actos formales de carácter procesal serán llevados a cabo por <mark class=\"m-resp\">los funcionarios nacionales competentes</mark>.</p><p><b>86.1.</b> Para combatir las infracciones que perjudiquen a los <mark class=\"m-destacable\">intereses financieros de la Unión</mark>, el <mark class=\"m-autoridad\">Consejo</mark> podrá crear, mediante reglamentos adoptados con arreglo a un procedimiento legislativo especial, <mark class=\"m-resp\">una Fiscalía Europea a partir de Eurojust</mark>. El Consejo se pronunciará <mark class=\"m-resp\">por unanimidad</mark>, previa aprobación del Parlamento Europeo. En caso de falta de unanimidad, un grupo de al menos <mark class=\"m-plazo\">nueve Estados miembros</mark> podrá solicitar que el proyecto de reglamento se remita al Consejo Europeo (…).</p><p><b>86.2.</b> <mark class=\"m-resp\">La Fiscalía Europea</mark>, en su caso en colaboración con <mark class=\"m-resp\">Europol</mark>, será competente para <mark class=\"m-resp\">descubrir a los autores y cómplices de infracciones que perjudiquen a los intereses financieros de la Unión</mark> (…), y para incoar un procedimiento penal y solicitar la apertura de juicio contra ellos. (…)</p><p><b>86.4.</b> Simultáneamente o con posterioridad, <mark class=\"m-resp\">el Consejo Europeo</mark> podrá adoptar una decisión que modifique el apartado 1 con el fin de <mark class=\"m-accion\">ampliar las competencias</mark> de la Fiscalía Europea a la lucha contra la delincuencia grave que tenga una dimensión transfronteriza (…). El Consejo Europeo se pronunciará <mark class=\"m-resp\">por unanimidad, previa aprobación del Parlamento Europeo y previa consulta a la Comisión</mark>.</p>", true)
  + trampa("Trampa de examen", "EUROJUST = cooperación JUDICIAL. EUROPOL = POLICIAL. La Fiscalía Europea nace de EUROJUST y colabora con EUROPOL.")
  + articuloResp("Artículos 87 a 89 TFUE — Cooperación policial y Europol · R20", ["policía, aduanas y otros servicios coercitivos","cooperación operativa: Consejo, especial, unanimidad, consulta PE","no aplicable al acervo de Schengen","Europol","estructura: PE y Consejo","control: PE con los Parlamentos nacionales","en contacto y de acuerdo con las autoridades del territorio afectado","coercitivas: autoridades nacionales","actuación en otro Estado: Consejo, especial, unanimidad, consulta PE"], "<p><b>87.1.</b> La Unión desarrollará una <mark class=\"m-destacable\">cooperación policial</mark> en la que participen todas las autoridades competentes de los Estados miembros, incluidos <mark class=\"m-resp\">los servicios de policía, los servicios de aduanas y otros servicios con funciones coercitivas</mark> especializados en la prevención y en la detección e investigación de infracciones penales.</p><p><b>87.3.</b> <mark class=\"m-resp\">El Consejo</mark> podrá establecer, con arreglo a un <mark class=\"m-resp\">procedimiento legislativo especial</mark>, medidas relativas a la <mark class=\"m-destacable\">cooperación operativa</mark> entre las autoridades a que se refiere el presente artículo. El Consejo se pronunciará <mark class=\"m-resp\">por unanimidad, previa consulta al Parlamento Europeo</mark>. (…) El procedimiento específico establecido en los párrafos segundo y tercero <u class=\"m-clave\">no</u> será de aplicación a <mark class=\"m-resp\">los actos que constituyan un desarrollo del acervo de Schengen</mark>.</p><p><b>88.1.</b> La función de <mark class=\"m-resp\">Europol</mark> es <mark class=\"m-accion\">apoyar y reforzar</mark> la actuación de las autoridades policiales y de los demás servicios con funciones coercitivas de los Estados miembros, así como su colaboración mutua en la prevención de la delincuencia grave que afecte a dos o más Estados miembros, del terrorismo y de las formas de delincuencia que lesionen un interés común que sea objeto de una política de la Unión, así como en la lucha en contra de ellos.</p><p><b>88.2.</b> <mark class=\"m-resp\">El Parlamento Europeo y el Consejo</mark> determinarán, mediante reglamentos (…), la <mark class=\"m-resp\">estructura</mark>, el funcionamiento, el ámbito de actuación y las competencias de Europol. (…) En dichos reglamentos se fijará asimismo el procedimiento de control de las actividades de Europol <mark class=\"m-resp\">por el Parlamento Europeo, control en el que participarán los Parlamentos nacionales</mark>.</p><p><b>88.3.</b> Cualquier actividad operativa de Europol deberá llevarse a cabo <mark class=\"m-resp\">en contacto y de acuerdo con las autoridades de los Estados miembros cuyo territorio resulte afectado</mark>. La aplicación de <mark class=\"m-destacable\">medidas coercitivas</mark> corresponderá <u class=\"m-clave\">exclusivamente</u> a <mark class=\"m-resp\">las autoridades nacionales competentes</mark>.</p><p><b>89.</b> <mark class=\"m-resp\">El Consejo</mark> fijará, con arreglo a un <mark class=\"m-resp\">procedimiento legislativo especial</mark>, las condiciones y límites dentro de los cuales las autoridades competentes de los Estados miembros (…) podrán actuar en el territorio de otro Estado miembro (…). El Consejo se pronunciará <mark class=\"m-resp\">por unanimidad, previa consulta al Parlamento Europeo</mark>.</p>", true)
  + bloqueTitulo("SEXTA PARTE TFUE. DISPOSICIONES INSTITUCIONALES — SECCIÓN 1.ª EL PARLAMENTO EUROPEO")
  + articuloResp("Artículos 223 a 225 TFUE — Elección, estatuto y partidos · R21", ["elección: Consejo por unanimidad, especial, previa aprobación del PE por mayoría de miembros","estatuto de los diputados: previo dictamen de la Comisión y aprobación del Consejo","régimen fiscal: Consejo por unanimidad","partidos: procedimiento ordinario","Comisión comunica las razones"], "<p><b>223.1.</b> El Parlamento Europeo elaborará un proyecto encaminado a establecer las disposiciones necesarias para hacer posible la elección de sus miembros por <mark class=\"m-destacable\">sufragio universal directo</mark> (…). El <mark class=\"m-resp\">Consejo</mark> establecerá las disposiciones necesarias por <mark class=\"m-resp\">unanimidad</mark> con arreglo a un <mark class=\"m-resp\">procedimiento legislativo especial</mark>, previa aprobación del Parlamento Europeo, que se pronunciará por <mark class=\"m-resp\">mayoría de los miembros que lo componen</mark>. Dichas disposiciones entrarán en vigor una vez que hayan sido aprobadas por los Estados miembros de conformidad con sus respectivas normas constitucionales.</p><p><b>223.2.</b> El Parlamento Europeo establecerá mediante reglamentos adoptados por propia iniciativa, con arreglo a un procedimiento legislativo especial, el <mark class=\"m-destacable\">estatuto</mark> y las condiciones generales de ejercicio de las funciones de sus miembros, <mark class=\"m-resp\">previo dictamen de la Comisión y con la aprobación del Consejo</mark>. Toda norma o condición relativas al <mark class=\"m-destacable\">régimen fiscal</mark> de los miembros o de los antiguos miembros se decidirán <mark class=\"m-resp\">en el Consejo por unanimidad</mark>.</p><p><b>224.</b> El Parlamento Europeo y el Consejo, con arreglo al <mark class=\"m-resp\">procedimiento legislativo ordinario</mark>, establecerán mediante reglamentos el estatuto de los <mark class=\"m-destacable\">partidos políticos a escala europea</mark> (…) y en particular las normas relativas a su financiación.</p><p><b>225.</b> Por decisión de la <mark class=\"m-plazo\">mayoría de los miembros</mark> que lo componen, el Parlamento Europeo podrá solicitar a la Comisión que presente las propuestas oportunas (…). Si la Comisión no presenta propuesta alguna, <mark class=\"m-resp\">comunicará las razones al Parlamento Europeo</mark>.</p>", true)
  + articuloResp("Artículos 226 a 228 TFUE — Investigación, petición y Defensor del Pueblo", ["comisión de investigación: la cuarta parte","salvo que conozca un órgano jurisdiccional","petición: ciudadanos y residentes","Defensor: mala administración, excluido el TJUE jurisdiccional","3 meses","informe cada año al PE","elegido tras cada elección para toda la legislatura","renovable","destituye el Tribunal de Justicia a petición del PE","total independencia"], "<p><b>226.</b> En cumplimiento de sus cometidos y a petición de <mark class=\"m-resp\">la cuarta parte de los miembros que lo componen</mark>, el Parlamento Europeo podrá constituir una <mark class=\"m-destacable\">comisión temporal de investigación</mark> para examinar (…) alegaciones de infracción o de mala administración en la aplicación del Derecho de la Unión, <mark class=\"m-resp\">salvo que de los hechos alegados esté conociendo un órgano jurisdiccional, hasta tanto concluya el procedimiento jurisdiccional</mark>. La existencia de la comisión temporal de investigación terminará con la presentación de su informe. (…)</p><p><b>227.</b> <mark class=\"m-resp\">Cualquier ciudadano de la Unión, así como cualquier persona física o jurídica que resida o tenga su domicilio social en un Estado miembro</mark>, tendrá derecho a presentar al Parlamento Europeo, individualmente o asociado con otros ciudadanos o personas, una <mark class=\"m-destacable\">petición</mark> sobre un asunto propio de los ámbitos de actuación de la Unión que le afecte directamente.</p><p><b>228.1.</b> <mark class=\"m-resp\">El Parlamento Europeo elegirá</mark> a un <mark class=\"m-autoridad\">Defensor del Pueblo Europeo</mark>, que estará facultado para recibir las reclamaciones de cualquier ciudadano de la Unión o de cualquier persona física o jurídica que resida o tenga su domicilio social en un Estado miembro, relativas a <mark class=\"m-resp\">casos de mala administración en la acción de las instituciones, órganos u organismos de la Unión, con exclusión del Tribunal de Justicia de la Unión Europea en el ejercicio de sus funciones jurisdiccionales</mark>. (…) Cuando el Defensor del Pueblo haya comprobado un caso de mala administración, lo pondrá en conocimiento de la institución, órgano u organismo interesado, que dispondrá de un plazo de <mark class=\"m-resp\">tres meses</mark> para exponer su posición al Defensor del Pueblo. (…) El Defensor del Pueblo presentará <mark class=\"m-resp\">cada año al Parlamento Europeo</mark> un informe sobre el resultado de sus investigaciones.</p><p><b>228.2.</b> El Defensor del Pueblo será elegido <mark class=\"m-resp\">después de cada elección del Parlamento Europeo para toda la legislatura</mark>. Su mandato será <mark class=\"m-personalizado\">renovable</mark>. A petición del Parlamento Europeo, <mark class=\"m-resp\">el Tribunal de Justicia podrá destituir</mark> al Defensor del Pueblo si éste dejare de cumplir las condiciones necesarias para el ejercicio de sus funciones o hubiere cometido una falta grave.</p><p><b>228.3.</b> <mark class=\"m-resp\">El Defensor del Pueblo ejercerá sus funciones con total independencia. En el ejercicio de tales funciones no solicitará ni admitirá instrucciones de ningún gobierno, institución, órgano u organismo. Durante su mandato, el Defensor del Pueblo no podrá desempeñar ninguna otra actividad profesional, sea o no retribuida.</mark></p>", true)

  + articuloResp("Artículos 229 a 234 TFUE — Funcionamiento del PE y moción de censura · R22", ["un período de sesiones al año","segundo martes de marzo","extraordinaria: mayoría de miembros, Consejo o Comisión","Comisión contesta oralmente o por escrito","decide por mayoría de votos emitidos","reglamento: mayoría de miembros","informe general anual","moción: 3 días, votación pública, 2/3 de votos emitidos que sean mayoría de diputados","siguen despachando"], "<p><b>229.</b> El Parlamento Europeo celebrará <mark class=\"m-resp\">cada año un período de sesiones</mark>. Se reunirá <u class=\"m-clave\">sin necesidad</u> de previa convocatoria el <mark class=\"m-resp\">segundo martes de marzo</mark>. El Parlamento Europeo podrá reunirse en período parcial de sesiones extraordinario a petición de: • <mark class=\"m-resp\">la mayoría de los miembros que lo componen</mark>, • <mark class=\"m-resp\">del Consejo</mark> o • <mark class=\"m-resp\">de la Comisión</mark>.</p><p><b>230.</b> La Comisión podrá asistir a todas las sesiones del Parlamento Europeo (…). La Comisión contestará <mark class=\"m-resp\">oralmente o por escrito</mark> a todas las preguntas que le sean formuladas por el Parlamento Europeo o por sus miembros. (…)</p><p><b>231.</b> <u class=\"m-clave\">Salvo</u> disposición en contrario de los Tratados, el Parlamento Europeo decidirá por <mark class=\"m-resp\">mayoría de los votos emitidos</mark>. El reglamento interno fijará el quórum.</p><p><b>232.</b> El Parlamento Europeo establecerá su propio <mark class=\"m-destacable\">reglamento interno</mark> por <mark class=\"m-resp\">mayoría de los miembros que lo componen</mark>. (…)</p><p><b>233.</b> El Parlamento Europeo procederá a la discusión, en sesión pública, del <mark class=\"m-resp\">informe general anual</mark> que le presentará la Comisión.</p><p><b>234.</b> El Parlamento Europeo, en caso de que se le someta una <mark class=\"m-destacable\">moción de censura</mark> sobre la gestión de la Comisión, <u class=\"m-clave\">sólo</u> podrá pronunciarse sobre dicha moción transcurridos <mark class=\"m-resp\">tres días como mínimo desde la fecha de su presentación y en votación pública</mark>. Si la moción de censura es aprobada por <mark class=\"m-resp\">mayoría de dos tercios de los votos emitidos que representen, a su vez, la mayoría de los diputados</mark> que componen el Parlamento Europeo, los miembros de la Comisión deberán dimitir colectivamente de sus cargos y el Alto Representante (…) deberá dimitir del cargo que ejerce en la Comisión. <mark class=\"m-resp\">Permanecerán en sus cargos y continuarán despachando los asuntos de administración ordinaria hasta que sean sustituidos</mark> (…).</p>", true)

  + articuloResp("Artículos 235 y 236 TFUE — Consejo Europeo", ["representa a uno solo","Presidentes del CE y de la Comisión no votan","invitar al Presidente del PE","mayoría simple en procedimiento y reglamento","Secretaría General del Consejo","lista de formaciones: mayoría cualificada"], "<p><b>235.1.</b> En caso de votación, cada miembro del Consejo Europeo podrá <mark class=\"m-resp\">actuar en representación de uno solo de los demás miembros</mark>. (…) El Presidente del Consejo Europeo y el Presidente de la Comisión <mark class=\"m-resp\">no participarán en las votaciones</mark> del Consejo Europeo cuando éste se pronuncie por votación. La <mark class=\"m-destacable\">abstención</mark> de los miembros presentes o representados <u class=\"m-clave\">no obstará</u> a la adopción de los acuerdos del Consejo Europeo que requieran unanimidad.</p><p><b>235.2.</b> El Consejo Europeo podrá invitar <mark class=\"m-resp\">al Presidente del Parlamento Europeo</mark> a comparecer ante él.</p><p><b>235.3.</b> El Consejo Europeo se pronunciará por <mark class=\"m-resp\">mayoría simple</mark> en las cuestiones de procedimiento y para la aprobación de su reglamento interno.</p><p><b>235.4.</b> El Consejo Europeo estará asistido por la <mark class=\"m-autoridad\">Secretaría General del Consejo</mark>.</p><p><b>236.</b> El Consejo Europeo adoptará por <mark class=\"m-resp\">mayoría cualificada</mark>: a) una decisión por la que se establezca la lista de las formaciones del Consejo, distintas de la de Asuntos Generales y la de Asuntos Exteriores (…); b) una decisión relativa a la presidencia de las formaciones del Consejo, con excepción de la de Asuntos Exteriores (…).</p>", true)
  + articuloResp("Artículos 237 a 243 TFUE — El Consejo · R23", ["convoca su Presidente, a iniciativa de éste, de un miembro o de la Comisión","mayoría simple = mayoría de miembros","72 % sin propuesta Comisión/AR","55 % y 65 % cuando no votan todos","bloqueo 35 % + 1","COREPER","Secretario General nombrado por el Consejo","Secretaría, procedimiento y reglamento: mayoría simple","estatutos de los Comités: mayoría simple, previa consulta a la Comisión","sueldos: el Consejo"], "<p><b>237.</b> El Consejo se reunirá por convocatoria de su Presidente, <mark class=\"m-resp\">a iniciativa de éste, de uno de sus miembros o de la Comisión</mark>.</p><p><b>238.1.</b> Cuando deba adoptar un acuerdo por <mark class=\"m-destacable\">mayoría simple</mark>, el Consejo se pronunciará por <mark class=\"m-resp\">mayoría de los miembros que lo componen</mark>.</p><p><b>238.2.</b> (…) a partir del <mark class=\"m-plazo\">1 de noviembre de 2014</mark> (…), cuando el Consejo <u class=\"m-clave\">no</u> actúe a propuesta de la Comisión o del Alto Representante (…), la mayoría cualificada se definirá como un mínimo del <mark class=\"m-resp\">72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población</mark> de la Unión.</p><p><b>238.3.</b> (…) en aquellos casos en que (…) <u class=\"m-clave\">no todos</u> los miembros del Consejo participen en la votación, la mayoría cualificada se definirá como sigue:</p><p><b>a)</b> La mayoría cualificada se definirá como un mínimo del <mark class=\"m-resp\">55 % de los miembros del Consejo que represente a Estados miembros participantes que reúnan como mínimo el 65 % de la población de dichos Estados</mark>. Una minoría de bloqueo estará compuesta al menos por <mark class=\"m-resp\">el número mínimo de miembros del Consejo que represente más del 35 % de la población de los Estados miembros participantes, más un miembro</mark>, a falta de lo cual la mayoría cualificada se considerará alcanzada.</p><p><b>b)</b> (…) cuando el Consejo no actúe a propuesta de la Comisión o del Alto Representante, la mayoría cualificada se definirá como un mínimo del <mark class=\"m-plazo\">72 %</mark> de los miembros del Consejo que represente a Estados miembros participantes que reúnan como mínimo el <mark class=\"m-plazo\">65 %</mark> de la población de dichos Estados.</p><p><b>240.1.</b> Un <mark class=\"m-resp\">Comité compuesto por Representantes Permanentes</mark> de los Gobiernos de los Estados miembros (COREPER) se encargará de <mark class=\"m-resp\">preparar los trabajos del Consejo</mark> y de realizar las tareas que éste le confíe. El Comité podrá adoptar <mark class=\"m-resp\">decisiones de procedimiento</mark> en los casos establecidos por el reglamento interno del Consejo.</p><p><b>240.2.</b> El Consejo estará asistido por una <mark class=\"m-autoridad\">Secretaría General</mark>, que estará bajo la responsabilidad de un <mark class=\"m-autoridad\">Secretario General</mark> <mark class=\"m-resp\">nombrado por el Consejo</mark>. El Consejo decidirá por <mark class=\"m-resp\">mayoría simple</mark> la organización de la Secretaría General.</p><p><b>240.3.</b> El Consejo se pronunciará por <mark class=\"m-resp\">mayoría simple</mark> en las cuestiones de procedimiento y para la aprobación de su reglamento interno.</p><p><b>242.</b> El Consejo, <mark class=\"m-resp\">por mayoría simple</mark>, establecerá, <mark class=\"m-resp\">previa consulta a la Comisión</mark>, los estatutos de los Comités previstos en los Tratados.</p><p><b>243.</b> <mark class=\"m-resp\">El Consejo</mark> fijará los <mark class=\"m-destacable\">sueldos, dietas y pensiones</mark> del Presidente del Consejo Europeo, del Presidente de la Comisión, del Alto Representante, de los miembros de la Comisión, de los Presidentes, miembros y secretarios del Tribunal de Justicia de la Unión Europea y del Secretario General del Consejo. (…)</p>", true)

  + articuloResp("Artículos 244 a 250 TFUE — La Comisión · R24", ["rigurosa igualdad","diferencia nunca superior a uno","ninguna otra actividad profesional","dimisión voluntaria o cese","sustituto de la misma nacionalidad: Consejo de común acuerdo con el Presidente, consulta al PE","no sustitución: Consejo por unanimidad a propuesta del Presidente","cese por falta GRAVE: TJ a instancia del Consejo (mayoría simple) o de la Comisión","informe un mes antes","acuerdos por mayoría de sus miembros"], "<p><b>244.</b> (…) los miembros de la Comisión serán elegidos mediante un <mark class=\"m-destacable\">sistema de rotación</mark> establecido por <mark class=\"m-plazo\">unanimidad</mark> por el <mark class=\"m-autoridad\">Consejo Europeo</mark>, basado en los principios siguientes:</p><p><b>a)</b> Se tratará a los Estados miembros en condiciones de <mark class=\"m-resp\">rigurosa igualdad</mark> en lo que se refiere a la determinación del orden de turno y del período de permanencia de sus nacionales en la Comisión; por lo tanto, la diferencia entre el número total de los mandatos que ejerzan nacionales de dos determinados Estados miembros <u class=\"m-clave\">nunca</u> podrá ser superior a <mark class=\"m-resp\">uno</mark>.</p><p><b>b)</b> (…) cada una de las sucesivas Comisiones se constituirá de forma que refleje de manera satisfactoria la diversidad demográfica y geográfica (…).</p><p><b>245.</b> Los miembros de la Comisión <mark class=\"m-resp\">se abstendrán de todo acto incompatible con el carácter de sus funciones</mark>. (…) Los miembros de la Comisión <mark class=\"m-resp\">no podrán, mientras dure su mandato, ejercer ninguna otra actividad profesional</mark>, retribuida o no. (…)</p><p><b>246.</b> Aparte de los casos de renovación periódica y fallecimiento, el mandato de los miembros de la Comisión concluirá individualmente por <mark class=\"m-resp\">dimisión voluntaria o cese</mark>. El miembro dimisionario, cesado o fallecido será sustituido por el resto de su mandato por <mark class=\"m-resp\">un nuevo miembro de la misma nacionalidad, nombrado por el Consejo, de común acuerdo con el Presidente de la Comisión, previa consulta al Parlamento Europeo</mark> (…). El Consejo, <mark class=\"m-resp\">por unanimidad y a propuesta del Presidente de la Comisión</mark>, podrá decidir que <u class=\"m-clave\">no ha lugar</u> a tal sustitución, en particular cuando quede poco tiempo para que termine el mandato de dicho miembro. (…)</p><p><b>247.</b> Todo miembro de la Comisión que deje de reunir las condiciones necesarias para el ejercicio de sus funciones o haya cometido una <mark class=\"m-resp\">falta grave</mark> podrá ser cesado por el <mark class=\"m-autoridad\">Tribunal de Justicia</mark>, a instancia <mark class=\"m-resp\">del Consejo, por mayoría simple, o de la Comisión</mark>.</p><p><b>249.2.</b> La Comisión publicará <mark class=\"m-resp\">todos los años, al menos un mes antes</mark> de la apertura del período de sesiones del Parlamento Europeo, un <mark class=\"m-destacable\">informe general</mark> sobre las actividades de la Unión.</p><p><b>250.</b> Los acuerdos de la Comisión se adoptarán por <mark class=\"m-resp\">mayoría de sus miembros</mark>. Su reglamento interno fijará el quórum.</p>", true)

  + articuloResp("Artículos 251 a 255 TFUE — Composición del TJUE", ["Salas, Gran Sala o Pleno (nunca juez único)","ocho abogados generales, aumento: Consejo por unanimidad","conclusiones motivadas","seis años","renovación parcial cada tres","Reglamento: aprobación del Consejo","TG: número lo fija el Estatuto","comité de siete personalidades (una propuesta por el PE)"], "<p><b>251.</b> El Tribunal de Justicia actuará en <mark class=\"m-resp\">Salas o en Gran Sala</mark> (…). Cuando el Estatuto así lo disponga, el Tribunal de Justicia también podrá actuar en <mark class=\"m-resp\">Pleno</mark>.</p><p><b>252.</b> El Tribunal de Justicia estará asistido por <mark class=\"m-resp\">ocho abogados generales</mark>. Si el Tribunal de Justicia lo solicitare, el Consejo, <mark class=\"m-resp\">por unanimidad</mark>, podrá aumentar el número de abogados generales. La función del abogado general consistirá en <mark class=\"m-resp\">presentar públicamente, con toda imparcialidad e independencia, conclusiones motivadas</mark> sobre los asuntos que (…) requieran su intervención.</p><p><b>253.</b> Los jueces y los abogados generales del Tribunal de Justicia, elegidos entre personalidades que ofrezcan <mark class=\"m-personalizado\">absolutas garantías de independencia</mark> (…), serán designados de común acuerdo por los Gobiernos de los Estados miembros por un período de <mark class=\"m-resp\">seis años</mark>, tras consultar al comité a que se refiere el artículo 255. Cada <mark class=\"m-resp\">tres años</mark> tendrá lugar una <mark class=\"m-destacable\">renovación parcial</mark> de los jueces y abogados generales (…). Los jueces elegirán de entre ellos al Presidente del Tribunal de Justicia por un período de <mark class=\"m-plazo\">tres años</mark>. Su mandato será renovable. Los jueces y los abogados generales salientes podrán ser nuevamente designados. El Tribunal de Justicia nombrará a su secretario (…). El Tribunal de Justicia establecerá su <mark class=\"m-destacable\">Reglamento de Procedimiento</mark>. Dicho reglamento requerirá <mark class=\"m-resp\">la aprobación del Consejo</mark>.</p><p><b>254.</b> El número de jueces del Tribunal General será fijado <mark class=\"m-resp\">por el Estatuto del Tribunal de Justicia de la Unión Europea</mark>. (…) Serán designados de común acuerdo por los Gobiernos de los Estados miembros por un período de <mark class=\"m-resp\">seis años</mark> (…). Cada <mark class=\"m-resp\">tres años</mark> tendrá lugar una renovación parcial. (…) El Tribunal General establecerá su Reglamento de Procedimiento de acuerdo con el Tribunal de Justicia. Dicho reglamento requerirá <mark class=\"m-resp\">la aprobación del Consejo</mark>. (…)</p><p><b>255.</b> Se constituirá un <mark class=\"m-destacable\">comité</mark> para que se pronuncie sobre la <mark class=\"m-personalizado\">idoneidad de los candidatos</mark> para el ejercicio de las funciones de juez y abogado general del Tribunal de Justicia y del Tribunal General (…). El comité estará compuesto por <mark class=\"m-resp\">siete personalidades</mark> elegidas de entre antiguos miembros del Tribunal de Justicia y del Tribunal General, miembros de los órganos jurisdiccionales nacionales superiores y juristas de reconocida competencia, <mark class=\"m-resp\">uno de los cuales será propuesto por el Parlamento Europeo</mark>. (…)</p>", true)

  + articuloResp("Artículos 256 y 257 TFUE — Tribunal General y tribunales especializados", ["casación ante el TJ limitada a cuestiones de Derecho","el TG puede conocer cuestiones prejudiciales en materias del Estatuto","crean: PE y Consejo, ordinario","miembros: Consejo por unanimidad"], "<p><b>256.1.</b> El <mark class=\"m-autoridad\">Tribunal General</mark> será competente para conocer en <mark class=\"m-plazo\">primera instancia</mark> de los recursos contemplados en los artículos 263, 265, 268, 270 y 272 (…). Contra las resoluciones dictadas por el Tribunal General en virtud del presente apartado podrá interponerse <mark class=\"m-resp\">recurso de casación ante el Tribunal de Justicia limitado a las cuestiones de Derecho</mark>, en las condiciones y dentro de los límites fijados en el Estatuto.</p><p><b>256.3.</b> <mark class=\"m-resp\">El Tribunal General será competente para conocer de las cuestiones prejudiciales, planteadas en virtud del artículo 267, en materias específicas determinadas por el Estatuto</mark>. (…)</p><p><b>257.</b> <mark class=\"m-resp\">El Parlamento Europeo y el Consejo, con arreglo al procedimiento legislativo ordinario</mark>, podrán crear <mark class=\"m-destacable\">tribunales especializados</mark> adjuntos al Tribunal General, encargados de conocer en primera instancia de determinadas categorías de recursos interpuestos en materias específicas. (…) Los miembros de los tribunales especializados serán elegidos entre personas que ofrezcan absolutas garantías de independencia (…). Serán designados <mark class=\"m-resp\">por el Consejo por unanimidad</mark>. (…)</p>", true)
  + articuloResp("Artículos 258 a 261 TFUE — Recurso por incumplimiento · R25", ["Comisión: dictamen motivado tras observaciones","Estado contra Estado: antes a la Comisión","3 meses","suma a tanto alzado o multa coercitiva","transposición: ya en el recurso inicial","competencia plena en sanciones (reglamentos del PE y el Consejo, y del Consejo)"], "<p><b>258.</b> Si la Comisión estimare que un Estado miembro ha incumplido una de las obligaciones que le incumben en virtud de los Tratados, <mark class=\"m-resp\">emitirá un dictamen motivado</mark> al respecto, <mark class=\"m-resp\">después de haber ofrecido a dicho Estado la posibilidad de presentar sus observaciones</mark>. Si el Estado de que se trate no se atuviere a este dictamen en el plazo determinado por la Comisión, ésta podrá recurrir al Tribunal de Justicia de la Unión Europea.</p><p><b>259.</b> (…) Antes de que un Estado miembro interponga, contra otro Estado miembro, un recurso fundado en un supuesto incumplimiento (…), deberá someter el asunto a <mark class=\"m-resp\">la Comisión</mark>. (…) Si la Comisión no hubiere emitido el dictamen en el plazo de <mark class=\"m-plazo\">tres meses</mark> desde la fecha de la solicitud, la falta de dictamen no será obstáculo para poder recurrir al Tribunal.</p><p><b>260.2.</b> Si la Comisión estimare que el Estado miembro afectado no ha adoptado las medidas necesarias para la ejecución de la sentencia del Tribunal, <mark class=\"m-resp\">podrá someter el asunto al Tribunal de Justicia</mark> (…). La Comisión <mark class=\"m-resp\">indicará el importe de la suma a tanto alzado o de la multa coercitiva</mark> que deba ser pagada por el Estado miembro afectado (…).</p><p><b>260.3.</b> Cuando la Comisión presente un recurso (…) en virtud del artículo 258 por considerar que el Estado miembro afectado ha incumplido la obligación de informar sobre las medidas de <mark class=\"m-destacable\">transposición de una directiva</mark> (…), podrá, si lo considera oportuno, <mark class=\"m-resp\">indicar el importe</mark> de la suma a tanto alzado o de la multa coercitiva (…) (es decir, <mark class=\"m-resp\">ya en el recurso inicial del art. 258</mark>).</p><p><b>261.</b> Los reglamentos adoptados conjuntamente por <mark class=\"m-resp\">el Parlamento Europeo y el Consejo, y por el Consejo</mark>, (…) podrán atribuir al Tribunal de Justicia de la Unión Europea una <mark class=\"m-resp\">competencia jurisdiccional plena</mark> respecto de las sanciones previstas en dichos reglamentos.</p>", true)

  + articuloResp("Artículos 263 a 267 TFUE — Anulación, omisión y prejudicial · R26", ["actos destinados a producir efectos frente a terceros","Tribunal de Cuentas, BCE y Comité de las Regiones","dos meses","nulo y sin valor ni efecto alguno","omisión: requerimiento previo y dos meses","prejudicial: interpretación de los Tratados y validez e interpretación de los actos","privado de libertad: con la mayor brevedad"], "<p><b>263.</b> El Tribunal de Justicia de la Unión Europea <mark class=\"m-accion\">controlará la legalidad</mark> de los actos legislativos, de los actos del Consejo, de la Comisión y del Banco Central Europeo que <u class=\"m-clave\">no</u> sean recomendaciones o dictámenes, y de los actos del Parlamento Europeo y del Consejo Europeo <mark class=\"m-resp\">destinados a producir efectos jurídicos frente a terceros</mark>. Controlará también la legalidad de los actos de los órganos u organismos de la Unión destinados a producir efectos jurídicos frente a terceros. (…) El Tribunal de Justicia de la Unión Europea será competente en las mismas condiciones para pronunciarse sobre los recursos interpuestos por <mark class=\"m-resp\">el Tribunal de Cuentas, por el Banco Central Europeo y por el Comité de las Regiones</mark> con el fin de salvaguardar prerrogativas de éstos. (…) Los recursos previstos en el presente artículo deberán interponerse en el plazo de <mark class=\"m-resp\">dos meses</mark> a partir, según los casos, de la publicación del acto, de su notificación al recurrente o, a falta de ello, desde el día en que éste haya tenido conocimiento del mismo.</p><p><b>264.</b> Si el recurso fuere fundado, el Tribunal de Justicia de la Unión Europea declarará <mark class=\"m-resp\">nulo y sin valor ni efecto alguno</mark> el acto impugnado. (…)</p><p><b>265.</b> (…) Este recurso <u class=\"m-clave\">solamente</u> será admisible si la institución, órgano u organismo de que se trate <mark class=\"m-resp\">hubieren sido requeridos previamente para que actúen</mark>. Si transcurrido un plazo de <mark class=\"m-resp\">dos meses</mark>, a partir de dicho requerimiento, la institución (…) no hubiere definido su posición, el recurso podrá ser interpuesto dentro de un nuevo plazo de <mark class=\"m-plazo\">dos meses</mark>. (…)</p><p><b>267.</b> El Tribunal de Justicia de la Unión Europea será competente para pronunciarse, con <mark class=\"m-resp\">carácter prejudicial</mark>:</p><p><b>a)</b> <mark class=\"m-resp\">sobre la interpretación de los Tratados</mark>;</p><p><b>b)</b> <mark class=\"m-resp\">sobre la validez e interpretación de los actos adoptados por las instituciones, órganos u organismos de la Unión</mark>.</p><p>Cuando se plantee una cuestión de esta naturaleza ante un órgano jurisdiccional de uno de los Estados miembros, dicho órgano <mark class=\"m-personalizado\">podrá</mark> pedir al Tribunal que se pronuncie sobre la misma (…). Cuando se plantee (…) ante un órgano jurisdiccional nacional, cuyas decisiones no sean susceptibles de ulterior recurso judicial de Derecho interno, dicho órgano estará <u class=\"m-clave\">obligado</u> a someter la cuestión al Tribunal. Cuando se plantee una cuestión de este tipo (…) en relación con una <mark class=\"m-personalizado\">persona privada de libertad</mark>, el Tribunal de Justicia de la Unión Europea se pronunciará <mark class=\"m-resp\">con la mayor brevedad</mark>.</p>", true)

  + articuloResp("Artículos 269 a 281 TFUE — Otras competencias del TJUE · R27", ["art. 7 TUE: solo a petición del Estado afectado y solo procedimiento","un mes y un mes","litigios con sus agentes","BEI: solo EM o Comisión, vicio de forma","cláusula compromisoria","compromiso entre Estados","no PESC salvo art. 40 y medidas restrictivas","no operaciones policiales","excepción de ilegalidad","sin efecto suspensivo salvo que lo acuerde","medidas provisionales"], "<p><b>269.</b> El Tribunal de Justicia será competente para pronunciarse sobre la legalidad de un acto adoptado por el Consejo Europeo o por el Consejo en virtud del artículo 7 del TUE, <mark class=\"m-resp\">solamente a petición del Estado miembro objeto de la constatación</mark> del Consejo Europeo o del Consejo y <mark class=\"m-resp\">únicamente en lo que se refiere al respeto de las disposiciones de procedimiento</mark> establecidas en el citado artículo. Esta petición deberá presentarse en el plazo de <mark class=\"m-resp\">un mes a partir de la constatación</mark>. El Tribunal se pronunciará en el plazo de <mark class=\"m-resp\">un mes a partir de la fecha de la petición</mark>.</p><p><b>270.</b> <mark class=\"m-resp\">El Tribunal de Justicia de la Unión Europea</mark> será competente para pronunciarse sobre cualquier <mark class=\"m-destacable\">litigio entre la Unión y sus agentes</mark> dentro de los límites y en las condiciones que establezca el Estatuto de los funcionarios (…).</p><p><b>271.c)</b> a los acuerdos del Consejo de Administración del <mark class=\"m-autoridad\">Banco Europeo de Inversiones</mark>. <mark class=\"m-resp\">Sólo podrán interponer recurso contra tales acuerdos los Estados miembros o la Comisión</mark>, en las condiciones establecidas en el artículo 263 y <mark class=\"m-resp\">únicamente por vicio de forma</mark> en el procedimiento (…).</p><p><b>272.</b> El Tribunal de Justicia de la Unión Europea será competente para juzgar en virtud de una <mark class=\"m-destacable\">cláusula compromisoria</mark> contenida en <mark class=\"m-resp\">un contrato de Derecho público o de Derecho privado celebrado por la Unión o por su cuenta</mark>.</p><p><b>273.</b> <mark class=\"m-resp\">El Tribunal de Justicia</mark> será competente para pronunciarse sobre cualquier controversia entre Estados miembros relacionada con el objeto de los Tratados, si dicha controversia le es sometida en virtud de un <mark class=\"m-destacable\">compromiso</mark>.</p><p><b>275.</b> El Tribunal de Justicia de la Unión Europea <mark class=\"m-resp\">no será competente</mark> para pronunciarse sobre las disposiciones relativas a la <mark class=\"m-destacable\">política exterior y de seguridad común</mark> (…). No obstante, el Tribunal de Justicia será competente <mark class=\"m-resp\">para controlar el respeto del artículo 40 del TUE</mark> y para pronunciarse sobre los recursos (…) relativos al control de la legalidad de las decisiones (…) por las que se establezcan <mark class=\"m-resp\">medidas restrictivas frente a personas físicas o jurídicas</mark>.</p><p><b>276.</b> (…) el Tribunal de Justicia de la Unión Europea <mark class=\"m-resp\">no será competente para comprobar la validez o proporcionalidad de operaciones efectuadas por la policía</mark> u otros servicios con funciones coercitivas de un Estado miembro, ni para pronunciarse sobre el ejercicio de las responsabilidades que incumben a los Estados miembros respecto del <mark class=\"m-resp\">mantenimiento del orden público y de la salvaguardia de la seguridad interior</mark>.</p><p><b>277.</b> <mark class=\"m-resp\">Aunque haya expirado el plazo</mark> previsto en el párrafo sexto del artículo 263, cualquiera de las partes de un litigio en el que se cuestione un <mark class=\"m-resp\">acto de alcance general</mark> adoptado por una institución, órgano u organismo de la Unión podrá recurrir al Tribunal de Justicia de la Unión Europea <mark class=\"m-resp\">alegando la inaplicabilidad de dicho acto</mark> por los motivos previstos en el párrafo segundo del artículo 263 (excepción de ilegalidad).</p><p><b>278.</b> Los recursos interpuestos ante el Tribunal de Justicia de la Unión Europea <mark class=\"m-resp\">no tendrán efecto suspensivo</mark>. <u class=\"m-clave\">Sin embargo</u>, el Tribunal podrá, si estima que las circunstancias así lo exigen, <mark class=\"m-resp\">ordenar la suspensión de la ejecución del acto impugnado</mark>.</p><p><b>279.</b> El Tribunal de Justicia de la Unión Europea podrá ordenar <mark class=\"m-resp\">las medidas provisionales necesarias</mark> en los asuntos de que esté conociendo.</p><p><b>280.</b> Las sentencias del Tribunal de Justicia de la Unión Europea tendrán <mark class=\"m-destacable\">fuerza ejecutiva</mark> en las condiciones que establece el artículo 299.</p>", true)

  + articuloResp("Artículo 300 TFUE — CES y Comité de las Regiones", ["asisten a PE, Consejo y Comisión","funciones consultivas","CES: empresarios, trabajadores y sociedad civil","sin mandato imperativo","interés general de la Unión"], "<p><b>1.</b> <mark class=\"m-resp\">El Parlamento Europeo, el Consejo y la Comisión</mark> estarán asistidos por un <mark class=\"m-autoridad\">Comité Económico y Social</mark> y por un <mark class=\"m-autoridad\">Comité de las Regiones</mark>, que ejercerán funciones <mark class=\"m-resp\">consultivas</mark>.</p><p><b>2.</b> El <mark class=\"m-resp\">Comité Económico y Social</mark> estará compuesto por <mark class=\"m-resp\">representantes de las organizaciones de empresarios, de trabajadores y de otros sectores representativos de la sociedad civil</mark>, en particular en los ámbitos socioeconómico, cívico, profesional y cultural.</p><p><b>3.</b> El Comité de las Regiones estará compuesto por representantes de los <mark class=\"m-destacable\">entes regionales y locales</mark> que sean titulares de un <mark class=\"m-personalizado\">mandato electoral</mark> en un ente regional o local, o que tengan responsabilidad política ante una asamblea elegida.</p><p><b>4.</b> Los miembros del Comité Económico y Social y del Comité de las Regiones <mark class=\"m-resp\">no estarán vinculados por ningún mandato imperativo</mark>. Ejercerán sus funciones con plena independencia, <mark class=\"m-resp\">en interés general de la Unión</mark>.</p>", true)
  + articuloResp("Artículos 301 a 304 TFUE — Comité Económico y Social · R28", ["no excederá de 350","composición: Consejo por unanimidad a propuesta de la Comisión","5 años, renovable","Presidente y Mesa: 2 años y medio","dictamen: no inferior a un mes"], "<p><b>301.</b> El número de miembros del Comité Económico y Social <u class=\"m-clave\">no excederá</u> de <mark class=\"m-resp\">trescientos cincuenta</mark>. El <mark class=\"m-resp\">Consejo adoptará por unanimidad, a propuesta de la Comisión</mark>, una decisión por la que se establezca la <mark class=\"m-destacable\">composición</mark> del Comité. El Consejo establecerá las dietas de los miembros del Comité.</p><p><b>302.1.</b> Los miembros del Comité serán nombrados para un período de <mark class=\"m-resp\">cinco años</mark>. El Consejo adoptará la lista de miembros establecida de conformidad con las propuestas presentadas por cada Estado miembro. El mandato de los miembros del Comité será <mark class=\"m-resp\">renovable</mark>.</p><p><b>303.</b> El Comité designará de entre sus miembros al <mark class=\"m-autoridad\">Presidente</mark> y a la <mark class=\"m-autoridad\">Mesa</mark>, por un período de <mark class=\"m-resp\">dos años y medio</mark>. (…)</p><p><b>304.</b> (…) Si lo estimaren necesario, el Parlamento Europeo, el Consejo o la Comisión fijarán al Comité un plazo para la presentación de su dictamen, que <u class=\"m-clave\">no</u> podrá ser inferior a <mark class=\"m-resp\">un mes</mark> a partir de la fecha de la notificación (…). Transcurrido el plazo fijado sin haberse recibido el dictamen, podrá prescindirse del mismo. (…)</p>", true)
  + articuloResp("Artículos 305 a 307 TFUE — Comité de las Regiones · R29", ["no excederá de 350","5 años renovables, con igual número de suplentes","lista: el Consejo según propuestas de cada EM","concluye con el mandato electoral","incompatible con diputado del PE","Presidente y Mesa 2 años y medio","si se consulta al CES se informa al CdR"], "<p><b>305.</b> El número de miembros del Comité de las Regiones <u class=\"m-clave\">no excederá</u> de <mark class=\"m-resp\">trescientos cincuenta</mark>. El Consejo adoptará por unanimidad, a propuesta de la Comisión, una decisión por la que se establezca la composición del Comité. Los miembros del Comité, así como un <mark class=\"m-personalizado\">número igual de suplentes</mark>, serán nombrados para un período de <mark class=\"m-resp\">cinco años</mark>. Su mandato será <mark class=\"m-resp\">renovable</mark>. <mark class=\"m-resp\">El Consejo adoptará la lista de miembros y suplentes establecida de conformidad con las propuestas presentadas por cada Estado miembro</mark>. <mark class=\"m-resp\">Al término del mandato</mark> mencionado en el apartado 3 del artículo 300 (el mandato electoral) <mark class=\"m-resp\">en virtud del cual hayan sido propuestos</mark>, el mandato de los miembros del Comité <mark class=\"m-resp\">concluirá automáticamente</mark> (…). <mark class=\"m-resp\">Ningún miembro del Comité podrá ser simultáneamente miembro del Parlamento Europeo</mark>.</p><p><b>306.</b> El Comité de las Regiones designará de entre sus miembros al Presidente y a la Mesa, por un período de <mark class=\"m-resp\">dos años y medio</mark>. (…)</p><p><b>307.</b> (…) Cuando el Comité Económico y Social sea consultado en aplicación del artículo 304, el Parlamento Europeo, el Consejo o la Comisión <mark class=\"m-resp\">informarán al Comité de las Regiones</mark> de esta solicitud de dictamen. El Comité de las Regiones <mark class=\"m-resp\">podrá emitir un dictamen al respecto cuando estime que hay intereses regionales específicos en juego</mark>. (…)</p>", true);

    + recuerda(["<b>R1</b> Valores de respeto: dignidad humana, libertad, democracia, igualdad, Estado de Derecho y derechos humanos (incluidas las minorías).","<b>R2</b> Sociedad caracterizada por: pluralismo, no discriminación, tolerancia, justicia, solidaridad e igualdad entre mujeres y hombres.","<b>R3</b> Delimitación de competencias → principio de atribución. <b>R4</b> Ejercicio → subsidiariedad y proporcionalidad.","<b>R5</b> El funcionamiento de la Unión se basa en la democracia representativa. <b>R6</b> PE, Consejo y Comisión asistidos por el CES y el Comité de las Regiones (funciones consultivas).","<b>R7</b> Consejo: un representante de cada Estado, de rango ministerial. <b>R8</b> Mandato de la Comisión: cinco años.","<b>R9</b> El Consejo Europeo nombra al Alto Representante por mayoría cualificada, con aprobación del Presidente de la Comisión. <b>R10</b> TJUE: Tribunal de Justicia, Tribunal General y tribunales especializados.","<b>R11</b> Intereses y objetivos estratégicos: el Consejo Europeo por unanimidad, sobre recomendación del Consejo. <b>R12</b> Enfoque de la Unión: asunto concreto de carácter geográfico o temático.","<b>R13</b> El representante especial actúa bajo la autoridad del Alto Representante. <b>R14</b> Si un Estado abandona la cooperación estructurada permanente, lo notifica al Consejo, que toma nota.","<b>R15</b> Libre circulación: sin discriminación por nacionalidad en empleo, retribución y demás condiciones de trabajo. <b>R16</b> Servicios: industriales, mercantiles, artesanales y profesiones liberales.","<b>R17</b> Reconocimiento mutuo de resoluciones judiciales y extrajudiciales en materia civil. <b>R18</b> Fronteras, asilo e inmigración: solidaridad y reparto equitativo, también financiero.","<b>R19</b> Prevención de la delincuencia: con exclusión de toda armonización. <b>R20</b> Medidas coercitivas: exclusivamente las autoridades nacionales.","<b>R21</b> Estatuto de los diputados: reglamentos del PE, previo dictamen de la Comisión y aprobación del Consejo. <b>R22</b> El PE se reúne sin convocatoria el segundo martes de marzo.","<b>R23</b> El Consejo se reúne por convocatoria de su Presidente, a iniciativa de éste, de un miembro o de la Comisión. <b>R24</b> Cese de un comisario: el TJ, a instancia del Consejo (mayoría simple) o de la Comisión.","<b>R25</b> Los reglamentos pueden dar al TJUE competencia jurisdiccional plena sobre sanciones. <b>R26</b> Prejudicial: interpretación de los Tratados y validez e interpretación de los actos.","<b>R27</b> Los recursos ante el TJUE no tienen efecto suspensivo. <b>R28</b> CES: no más de 350. <b>R29</b> Comité de las Regiones: no más de 350.","<b>Cifras clave</b>: PE 750 + Presidente, 6-96, 5 años; Consejo Europeo 2 veces por semestre, Presidente 2,5 años; mayoría cualificada 55 % (≥ 15) + 65 %, bloqueo ≥ 4, 72 % sin propuesta; iniciativa ciudadana 1 millón; jueces 6 años, renovación cada 3, 8 abogados generales, comité de 7; moción de censura 3 días y 2/3; anulación 2 meses; frenos de emergencia 4 meses y 9 Estados."]);

/* T1_LO */ T1.lo = bloqueTitulo("1.1 — LEY ORGÁNICA 18/2003, DE 10 DE DICIEMBRE, DE COOPERACIÓN CON LA CORTE PENAL INTERNACIONAL")
  + articuloResp("Artículo 1 — Objeto y fuentes jurídicas · R1", ["regular las relaciones de cooperación Estado español – Corte","supletorias: normas orgánicas y procesales de aplicación general","normativa complementaria: en lo no previsto en el Estatuto, en la medida en que resulten pertinentes"], "<p>El <mark class=\"m-destacable\">objeto</mark> de esta ley orgánica es <mark class=\"m-resp\">regular las relaciones de cooperación entre el Estado español y la Corte Penal Internacional</mark> en el ejercicio de la <mark class=\"m-destacable\">jurisdicción</mark> y funciones encomendadas a esta institución por el <mark class=\"m-destacable\">Estatuto de Roma</mark> de <mark class=\"m-plazo\">17 de julio de 1998</mark> -en lo sucesivo, el Estatuto- y su <mark class=\"m-destacable\">normativa complementaria</mark>, mediante la <mark class=\"m-accion\">atribución</mark> de <mark class=\"m-destacable\">competencias</mark> a los <mark class=\"m-autoridad\">órganos estatales</mark> y el <mark class=\"m-accion\">establecimiento</mark> de <mark class=\"m-destacable\">procedimientos internos</mark> adecuados, aplicables <mark class=\"m-resp\">en lo no previsto en el Estatuto y sus normas complementarias en la medida en que éstas resulten pertinentes</mark>, <u class=\"m-clave\">en particular</u> las <mark class=\"m-destacable\">reglas de procedimiento y prueba</mark>, así como en los <mark class=\"m-destacable\">acuerdos específicos de cooperación</mark> que España <u class=\"m-clave\">pueda</u> celebrar con la <mark class=\"m-autoridad\">Corte</mark>.</p><p>Con <mark class=\"m-personalizado\">carácter supletorio</mark> a esta ley se <mark class=\"m-accion\">aplicarán</mark> las <mark class=\"m-resp\">normas orgánicas y procesales de aplicación general</mark>.</p>")
  + articuloResp("Artículo 2 — De la cooperación pasiva", ["España prestará PLENA cooperación","en especial art. 86 del Estatuto","pasiva = la que España presta a la Corte"], "<p>España <mark class=\"m-accion\">prestará</mark> <mark class=\"m-resp\">plena cooperación</mark> a la <mark class=\"m-autoridad\">Corte Penal Internacional</mark> -en lo sucesivo, la Corte- de conformidad con lo prevenido en el <mark class=\"m-destacable\">Estatuto</mark> y <u class=\"m-clave\">en especial</u> en su <mark class=\"m-resp\">artículo 86</mark> (obligación general de los Estados Partes de cooperar plenamente con la Corte).</p>")
  + articuloResp("Artículo 3 — De la cooperación activa", ["por conducto del Ministerio de Justicia","en un proceso que se siguiere en España","art. 93.10 del Estatuto"], "<p>Los <mark class=\"m-autoridad\">órganos judiciales</mark> y el <mark class=\"m-autoridad\">Ministerio Fiscal</mark> <u class=\"m-clave\">podrán</u> <mark class=\"m-accion\">dirigir</mark>, por conducto del <mark class=\"m-resp\">Ministerio de Justicia</mark>, <mark class=\"m-destacable\">solicitudes de cooperación</mark> a la <mark class=\"m-autoridad\">Corte</mark> que se consideren necesarias en el marco de <mark class=\"m-resp\">un proceso que se siguiere en España</mark> y en los casos y condiciones que establece el <mark class=\"m-resp\">artículo 93.10 del Estatuto</mark> (asistencia de la Corte a un Estado Parte que investiga).</p>")
  + trampa("Trampa de examen", "«Pasiva» = España ayuda a la Corte (art. 2, plena cooperación, art. 86 ER). «Activa» = España pide ayuda a la Corte (art. 3, vía Ministerio de Justicia, art. 93.10 ER).")
  + articuloResp("Artículo 4 — De las autoridades competentes", ["Gobierno","Ministerio de Justicia","Exteriores: en los casos previstos y, en todo caso, con factores de política exterior","Defensa e Interior: si afecta a sus competencias","jurisdicción ordinaria, en particular la AUDIENCIA NACIONAL","militares, en particular el TRIBUNAL MILITAR CENTRAL","Ministerio Fiscal"], "<p>Son <mark class=\"m-destacable\">autoridades competentes</mark> para la aplicación de esta ley:</p><p>a) El <mark class=\"m-resp\">Gobierno</mark>.</p><p>b) El <mark class=\"m-resp\">Ministerio de Justicia</mark>.</p><p>c) El <mark class=\"m-resp\">Ministerio de Asuntos Exteriores</mark>, <mark class=\"m-resp\">en los casos previstos en esta ley, y, en todo caso, cuando intervinieran factores de política exterior</mark>.</p><p>d) El <mark class=\"m-autoridad\">Ministerio de Defensa</mark> y el <mark class=\"m-autoridad\">Ministerio del Interior</mark>, <u class=\"m-clave\">cuando</u> el acto de cooperación <mark class=\"m-accion\">afecte</mark> a sus <mark class=\"m-destacable\">competencias</mark>.</p><p>e) Los <mark class=\"m-autoridad\">órganos judiciales de la jurisdicción ordinaria</mark> y, <u class=\"m-clave\">en particular</u>, la <mark class=\"m-resp\">Audiencia Nacional</mark>.</p><p>f) Los <mark class=\"m-autoridad\">órganos judiciales militares</mark> y, <u class=\"m-clave\">en particular</u>, el <mark class=\"m-resp\">Tribunal Militar Central</mark>.</p><p>g) El <mark class=\"m-resp\">Ministerio Fiscal</mark>.</p>", true)
  + trampa("Trampa de examen", "NO es autoridad competente la Fiscalía General de la Unión Europea ni el Defensor del Pueblo. Ojo: varias preguntas citan como «art. 5» lo que está en el art. 4.")
  + articuloResp("Artículo 5 — De la representación y defensa procesal · R2", ["Abogados del Estado (Abogacía General del Estado)","instrucciones conjuntas Justicia + Exteriores","agente de España: por motivos excepcionales, oído el Abogado General del Estado","asume las funciones de Abogado del Estado"], "<p><b>1.</b> La <mark class=\"m-destacable\">representación y defensa en juicio</mark> de España ante los órganos de la Corte <mark class=\"m-accion\">corresponderá</mark> a los <mark class=\"m-resp\">Abogados del Estado integrados en la Abogacía General del Estado</mark> y de acuerdo con las <mark class=\"m-destacable\">instrucciones</mark> impartidas <mark class=\"m-resp\">conjuntamente</mark>, en cada caso, por el <mark class=\"m-resp\">Ministerio de Justicia y el Ministerio de Asuntos Exteriores</mark>. En los supuestos en que el procedimiento afecte a materias propias de algún departamento ministerial, se <mark class=\"m-accion\">oirá</mark> a éste <u class=\"m-clave\">antes</u> de impartir las citadas instrucciones.</p><p><b>2.</b> El <mark class=\"m-autoridad\">Gobierno</mark>, por <mark class=\"m-personalizado\">motivos excepcionales</mark> y <mark class=\"m-accion\">oído</mark> el <mark class=\"m-autoridad\">Abogado General del Estado</mark>, <u class=\"m-clave\">podrá</u> <mark class=\"m-accion\">acordar</mark> que una persona, <mark class=\"m-personalizado\">especialmente designada</mark> al efecto, actúe como <mark class=\"m-destacable\">agente de España</mark> en un determinado procedimiento ante los órganos de la Corte. La persona designada por el Gobierno <mark class=\"m-resp\">asumirá en el desempeño de sus servicios las funciones de Abogado del Estado y se ajustará a las disposiciones que regulan el ejercicio de dichas funciones</mark>.</p>")
  + articuloResp("Artículo 6 — De los órganos de relación y consulta con la Corte", ["Justicia = ÚNICO órgano de relación","Justicia = órgano de consulta (informa antes a Exteriores)","Interior o Defensa: recabará su informe","política exterior: competente Exteriores, en coordinación con Justicia"], "<p><b>1.</b> El <mark class=\"m-resp\">Ministerio de Justicia</mark> es el <mark class=\"m-resp\">único órgano de relación</mark> entre la Corte, por un lado, y los <mark class=\"m-autoridad\">órganos judiciales</mark> y <mark class=\"m-autoridad\">Ministerio Fiscal</mark>, por otro, <u class=\"m-clave\">sin perjuicio</u> de las competencias del <mark class=\"m-autoridad\">Ministerio de Asuntos Exteriores</mark>.</p><p><b>2.</b> El <mark class=\"m-autoridad\">Ministerio de Justicia</mark> es también el <mark class=\"m-destacable\">órgano de consulta</mark> con la Corte en los casos previstos en el Estatuto, <u class=\"m-clave\">debiendo</u> <mark class=\"m-accion\">informar</mark> <u class=\"m-clave\">previamente</u> de cada consulta al <mark class=\"m-autoridad\">Ministerio de Asuntos Exteriores</mark>.</p><p>En el supuesto de que la consulta afecte a materias propias del ámbito competencial de los <mark class=\"m-autoridad\">Ministerios del Interior o Defensa</mark>, <mark class=\"m-resp\">recabará el informe de estos departamentos</mark>.</p><p><u class=\"m-clave\">Cuando</u> la consulta incluya, a juicio del <mark class=\"m-autoridad\">Ministerio de Asuntos Exteriores</mark>, aspectos de <mark class=\"m-destacable\">política exterior</mark>, <mark class=\"m-resp\">será éste el competente, en coordinación con el Ministerio de Justicia</mark> y, en su caso, con otros ministerios concernidos.</p>")
  + articuloResp("Artículo 7 — De la solicitud para iniciar una investigación por el Fiscal de la Corte", ["EXCLUSIVAMENTE el Gobierno, por Acuerdo del Consejo de Ministros","propuesta conjunta Exteriores + Justicia","reconsideración: art. 53.3.a) ER","hechos en otros Estados y autores no españoles: se ABSTENDRÁN e informarán de acudir al Fiscal de la Corte"], "<p><b>1.</b> Corresponde <u class=\"m-clave\">exclusivamente</u> al <mark class=\"m-resp\">Gobierno, mediante Acuerdo del Consejo de Ministros</mark>, a <mark class=\"m-destacable\">propuesta conjunta</mark> del <mark class=\"m-autoridad\">Ministro de Asuntos Exteriores</mark> y del <mark class=\"m-autoridad\">Ministro de Justicia</mark>, <mark class=\"m-resp\">decidir la presentación de la denuncia de una situación ante el Fiscal de la Corte</mark>, de conformidad con lo prevenido en los artículos 13, párrafo a), y 14 del Estatuto (remisión de una situación por un Estado Parte), y en su caso, para <mark class=\"m-accion\">instar</mark> de la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> que el Fiscal <mark class=\"m-accion\">reconsidere</mark> su decisión de no iniciar actuaciones, conforme al <mark class=\"m-resp\">artículo 53.3.a) del Estatuto</mark>.</p><p><b>2.</b> <u class=\"m-clave\">Cuando</u> se presentare una <mark class=\"m-destacable\">denuncia o querella</mark> ante un órgano judicial o del Ministerio Fiscal o una solicitud en un departamento ministerial, en relación con <mark class=\"m-personalizado\">hechos sucedidos en otros Estados</mark>, cuyos presuntos autores <u class=\"m-clave\">no</u> sean <mark class=\"m-personalizado\">nacionales españoles</mark> y para cuyo enjuiciamiento pudiera ser competente la Corte, dichos órganos <mark class=\"m-resp\">se abstendrán de todo procedimiento</mark>, <mark class=\"m-resp\">limitándose a informar al denunciante, querellante o solicitante de la posibilidad de acudir directamente al Fiscal de la Corte</mark>, que <u class=\"m-clave\">podrá</u>, en su caso, iniciar una investigación, <u class=\"m-clave\">sin perjuicio</u> de adoptar, si fuera necesario, las <mark class=\"m-destacable\">primeras diligencias urgentes</mark> para las que pudieran tener competencia. En iguales circunstancias, los órganos judiciales y el Ministerio Fiscal se <mark class=\"m-accion\">abstendrán</mark> de proceder <mark class=\"m-personalizado\">de oficio</mark>.</p><p><b>3.</b> <u class=\"m-clave\">No obstante</u>, si el Fiscal de la Corte no acordara la apertura de la investigación o la Corte acordara la <mark class=\"m-destacable\">inadmisibilidad</mark> del asunto, la denuncia, querella o solicitud <u class=\"m-clave\">podrá</u> ser <mark class=\"m-accion\">presentada nuevamente</mark> ante los órganos correspondientes.</p>", true)
  + articuloResp("Artículo 8 — Del requerimiento de inhibición al Fiscal de la Corte", ["notificación del art. 18.1 ER: Justicia pide información urgente al Fiscal General del Estado","propuesta conjunta Justicia + Exteriores en VEINTE DÍAS","inhibición conforme al art. 18.2 ER","formula la petición: MINISTERIO DE JUSTICIA"], "<p><b>1.</b> Recibida en el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-destacable\">notificación</mark> del <mark class=\"m-autoridad\">Fiscal de la Corte</mark> de inicio de una investigación conforme al artículo 18.1 del Estatuto, de tratarse de hechos cuyo conocimiento podría corresponder a la <mark class=\"m-destacable\">jurisdicción española</mark> por haber acaecido en <mark class=\"m-personalizado\">territorio español</mark> u ostentar sus presuntos responsables la <mark class=\"m-personalizado\">nacionalidad española</mark>, dicho departamento ministerial <mark class=\"m-accion\">solicitará</mark> del <mark class=\"m-autoridad\">Fiscal General del Estado</mark> <mark class=\"m-personalizado\">información urgente</mark> sobre la existencia de actuaciones penales (…).</p><p><b>2.</b> Cuando de la información suministrada por el Fiscal General del Estado apareciera que se ha ejercido jurisdicción en España, se está ejerciendo o (…) se ha iniciado una investigación por las autoridades españolas, los <mark class=\"m-autoridad\">Ministros de Justicia y de Asuntos Exteriores</mark>, en plazo que <u class=\"m-clave\">no podrá rebasar</u> los <mark class=\"m-resp\">veinte días</mark> desde la recepción de la notificación del Fiscal de la Corte, <mark class=\"m-accion\">elevarán</mark> <mark class=\"m-destacable\">propuesta conjunta</mark> al <mark class=\"m-autoridad\">Consejo de Ministros</mark> para que resuelva sobre <mark class=\"m-accion\">sostener</mark> la competencia de las autoridades españolas y, en su caso, <mark class=\"m-accion\">pedir</mark> la <mark class=\"m-destacable\">inhibición</mark> al Fiscal de la Corte conforme al <mark class=\"m-resp\">artículo 18.2 del Estatuto</mark>.</p><p><b>3.</b> Una vez aprobado el Acuerdo del Consejo de Ministros del apartado anterior, corresponderá al <mark class=\"m-resp\">Ministerio de Justicia</mark> <mark class=\"m-resp\">formular la petición de inhibición</mark> y realizar las restantes actuaciones previstas en el Estatuto para dar cumplimiento a dicho Acuerdo.</p><p><b>4.</b> El <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-accion\">responderá</mark> con <mark class=\"m-personalizado\">carácter urgente</mark> a cualquier petición de información del Fiscal de la Corte (…).</p><p><b>5.</b> <u class=\"m-clave\">Cuando</u> (…) resulte que <u class=\"m-clave\">no</u> se ha ejercido jurisdicción, ni se está ejerciendo, ni se ha iniciado investigación en España, el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> lo <mark class=\"m-accion\">comunicará</mark> <mark class=\"m-plazo\">urgentemente</mark> al Fiscal de la Corte.</p>", true)
  + articuloResp("Artículo 9 — De la impugnación de la competencia de la Corte o de la admisibilidad de la causa", ["EXCLUSIVAMENTE el Gobierno, Acuerdo del Consejo de Ministros","a la mayor brevedad, ANTES del inicio del juicio","después del inicio: SOLO por cosa juzgada en España"], "<p><b>1.</b> Corresponde <u class=\"m-clave\">exclusivamente</u> al <mark class=\"m-resp\">Gobierno, mediante Acuerdo del Consejo de Ministros</mark> (igual que para denunciar una situación, art. 7), a propuesta conjunta del <mark class=\"m-autoridad\">Ministro de Justicia</mark> y del <mark class=\"m-autoridad\">Ministro de Asuntos Exteriores</mark>, <mark class=\"m-accion\">acordar</mark> la <mark class=\"m-destacable\">impugnación de la competencia</mark> de la Corte o de la <mark class=\"m-destacable\">admisibilidad de la causa</mark>, de conformidad con lo previsto en los artículos 17 y 19 del Estatuto, <u class=\"m-clave\">cuando</u> los tribunales españoles hayan conocido del asunto y haya recaído <mark class=\"m-destacable\">sentencia</mark>, o se haya decretado el <mark class=\"m-destacable\">sobreseimiento libre</mark> de la causa o estén conociendo del asunto. Dicho acuerdo <mark class=\"m-accion\">habilitará</mark>, en su caso, al <mark class=\"m-autoridad\">Ministerio de Justicia</mark> para llevar a cabo la impugnación.</p><p><b>2.</b> Tal impugnación se <mark class=\"m-accion\">formalizará</mark> <mark class=\"m-resp\">a la mayor brevedad posible, antes del inicio del juicio en la Corte</mark> y, <mark class=\"m-personalizado\">excepcionalmente</mark>, en el momento de su iniciación o en un momento posterior, fundándose en este último caso en el <u class=\"m-clave\">solo</u> motivo de <mark class=\"m-resp\">haberse producido ya cosa juzgada en España</mark>.</p>")
  + articuloResp("Artículo 10 — De la inhibición de la jurisdicción española a favor de la Corte", ["presupone: solicitud de inhibición (art. 8) o impugnación (art. 9)","la Sala autoriza al Fiscal o mantiene su competencia","España se INHIBE y remite lo actuado"], "<p><u class=\"m-clave\">Si</u>, a pesar de la <mark class=\"m-resp\">solicitud de inhibición al Fiscal de la Corte prevista en el artículo 8</mark> de esta ley <u class=\"m-clave\">o</u> de la <mark class=\"m-resp\">impugnación de la competencia o la admisibilidad de la causa contemplada en el artículo 9</mark>, la <mark class=\"m-autoridad\">Sala competente de la Corte</mark> <mark class=\"m-resp\">autoriza al Fiscal a proceder a la investigación o mantiene su competencia</mark>, el <mark class=\"m-autoridad\">órgano jurisdiccional español</mark> <mark class=\"m-resp\">se inhibirá a favor de la Corte y a su solicitud le remitirá lo actuado</mark>.</p>")
  + articuloResp("Artículo 11 — De la detención · R3", ["comunicará INMEDIATAMENTE a Justicia y al Juez Central de Instrucción de la AN","a disposición sin demora y, en todo caso, en 72 HORAS","el JCI le oirá en otras 72 HORAS"], "<p><b>1.</b> <u class=\"m-clave\">Cuando</u> fuere <mark class=\"m-accion\">detenida</mark> una persona, en cumplimiento de una <mark class=\"m-destacable\">orden de la Corte de detención provisional o de detención y entrega</mark>, la autoridad que practicare la detención lo <mark class=\"m-accion\">comunicará</mark> <mark class=\"m-plazo\">inmediatamente</mark> <mark class=\"m-resp\">al Ministerio de Justicia y al Juez Central de Instrucción de la Audiencia Nacional</mark>, debiendo ser puesta dicha persona a disposición del <mark class=\"m-autoridad\">Juez Central de Instrucción</mark> <mark class=\"m-resp\">sin demora y, en todo caso, dentro del plazo de setenta y dos horas siguientes a la detención</mark>.</p><p><b>2.</b> El <mark class=\"m-autoridad\">Juez Central de Instrucción</mark> <mark class=\"m-accion\">oirá</mark> a la persona reclamada, asistida de <mark class=\"m-destacable\">letrado</mark> y, en su caso, de <mark class=\"m-destacable\">intérprete</mark> y al <mark class=\"m-autoridad\">Ministerio Fiscal</mark>, <mark class=\"m-resp\">dentro de las setenta y dos horas siguientes a su puesta a disposición judicial</mark>. Después de verificar la <mark class=\"m-destacable\">identidad</mark> del detenido, el contenido de la orden de detención y las circunstancias previstas en el artículo 59.2 del Estatuto <mark class=\"m-accion\">informará</mark> al detenido del contenido de la orden de detención y de su derecho a solicitar la <mark class=\"m-destacable\">libertad provisional</mark>.</p><p><b>3.</b> (…) la <mark class=\"m-autoridad\">autoridad penitenciaria competente</mark> <mark class=\"m-accion\">informará</mark> con <mark class=\"m-personalizado\">antelación suficiente</mark> sobre la fecha de <mark class=\"m-destacable\">excarcelación</mark> al Juez Central de Instrucción y al Ministerio de Justicia, que informará a la Corte (…).</p>", true)
