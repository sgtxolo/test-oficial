  + articuloResp("Artículo 13 — Marco institucional · R6", ["7 instituciones","el CES NO es institución","PE, Consejo y Comisión asistidos por CES y CdR","funciones consultivas"], "<p><b>1.</b> La Unión dispone de un <mark class=\"m-destacable\">marco institucional</mark> que tiene como finalidad <mark class=\"m-personalizado\">promover sus valores, perseguir sus objetivos, defender sus intereses, los de sus ciudadanos y los de los Estados miembros, así como garantizar la coherencia, eficacia y continuidad de sus políticas y acciones</mark>. Las instituciones de la Unión son (<mark class=\"m-resp\">siete</mark>):</p><p>• el <mark class=\"m-autoridad\">PARLAMENTO EUROPEO</mark>, • el <mark class=\"m-autoridad\">CONSEJO EUROPEO</mark>, • el <mark class=\"m-autoridad\">CONSEJO</mark>, • la <mark class=\"m-autoridad\">COMISIÓN EUROPEA</mark>, • el <mark class=\"m-autoridad\">TRIBUNAL DE JUSTICIA DE LA UNIÓN EUROPEA</mark>, • el <mark class=\"m-autoridad\">BANCO CENTRAL EUROPEO</mark>, • el <mark class=\"m-autoridad\">TRIBUNAL DE CUENTAS</mark>.</p><p><b>2.</b> Cada institución actuará dentro de los límites de las atribuciones que le confieren los Tratados (…). Las instituciones mantendrán entre sí una <mark class=\"m-destacable\">cooperación leal</mark>.</p><p><b>4.</b> El <mark class=\"m-resp\">PARLAMENTO EUROPEO, el CONSEJO y la COMISIÓN</mark> estarán asistidos por un <mark class=\"m-resp\">Comité Económico y Social y por un Comité de las Regiones</mark> que ejercerán funciones <mark class=\"m-resp\">consultivas</mark>.</p>", true)
  + trampa("Trampa de examen", "El Comité Económico y Social y el Comité de las Regiones son ÓRGANOS CONSULTIVOS, no instituciones. NO asisten al Consejo Europeo ni al TJUE.")
  + articuloResp("Artículo 14 — Parlamento Europeo", ["función legislativa y presupuestaria con el Consejo","elige al Presidente de la Comisión","representantes de los ciudadanos","máx. 750 + Presidente","mín. 6","máx. 96","composición: Consejo Europeo por unanimidad, a iniciativa del PE y con su aprobación","5 años","Presidente y Mesa de entre sus diputados"], "<p><b>1.</b> El <mark class=\"m-autoridad\">PARLAMENTO EUROPEO</mark> ejercerá <mark class=\"m-resp\">conjuntamente con el Consejo la función legislativa y la función presupuestaria</mark>. Ejercerá funciones de <mark class=\"m-destacable\">control político y consultivas</mark>, en las condiciones establecidas en los Tratados. <mark class=\"m-resp\">Elegirá al Presidente de la Comisión</mark>.</p><p><b>2.</b> El Parlamento Europeo estará compuesto por <mark class=\"m-resp\">representantes de los ciudadanos de la Unión</mark>. Su número <u class=\"m-clave\">no excederá</u> de <mark class=\"m-resp\">setecientos cincuenta, más el Presidente</mark>. La representación de los ciudadanos será <mark class=\"m-personalizado\">decrecientemente proporcional</mark>, con un mínimo de <mark class=\"m-resp\">seis diputados</mark> por Estado miembro. <u class=\"m-clave\">No</u> se asignará a ningún Estado miembro más de <mark class=\"m-resp\">noventa y seis escaños</mark>. El <mark class=\"m-resp\">Consejo Europeo adoptará por unanimidad, a iniciativa del Parlamento Europeo y con su aprobación</mark>, una decisión por la que se fije la <mark class=\"m-destacable\">composición del Parlamento Europeo</mark> (…).</p><p><b>3.</b> Los diputados al Parlamento Europeo serán elegidos por <mark class=\"m-destacable\">sufragio universal directo, libre y secreto</mark>, para un mandato de <mark class=\"m-resp\">cinco años</mark>.</p><p><b>4.</b> El Parlamento Europeo elegirá a su <mark class=\"m-autoridad\">Presidente</mark> y a la <mark class=\"m-autoridad\">Mesa</mark> <mark class=\"m-resp\">de entre sus diputados</mark>.</p>", true)
  + trampa("Trampa de examen", "750 (no 700) más el Presidente · mínimo 6 · máximo 96 (no 86).")
  + articuloResp("Artículo 15 — Consejo Europeo y su Presidente", ["impulsos, orientaciones y prioridades","NO ejercerá función legislativa","composición","2 veces por semestre","asistencia de un ministro","CONSENSO","Presidente: mayoría cualificada, 2 años y medio, renovable una vez","informe al PARLAMENTO EUROPEO","representación exterior PESC","no mandato nacional"], "<p><b>1.</b> El <mark class=\"m-autoridad\">CONSEJO EUROPEO</mark> <mark class=\"m-resp\">dará a la Unión los impulsos necesarios para su desarrollo y definirá sus orientaciones y prioridades políticas generales</mark>. <mark class=\"m-resp\">No ejercerá función legislativa</mark> alguna.</p><p><b>2.</b> El Consejo Europeo estará compuesto por <mark class=\"m-resp\">los Jefes de Estado o de Gobierno de los Estados miembros, así como por su Presidente y por el Presidente de la Comisión</mark>. <mark class=\"m-personalizado\">Participará en sus trabajos</mark> el <mark class=\"m-autoridad\">Alto Representante</mark> de la Unión para Asuntos Exteriores y Política de Seguridad.</p><p><b>3.</b> El Consejo Europeo se reunirá <mark class=\"m-resp\">dos veces por semestre</mark> por convocatoria de su <mark class=\"m-autoridad\">Presidente</mark>. Cuando el orden del día lo exija, los miembros del Consejo Europeo podrán decidir contar, cada uno de ellos, con la asistencia de <mark class=\"m-resp\">un ministro y, en el caso del Presidente de la Comisión, con la de un miembro de la Comisión</mark>. Cuando la situación lo exija, el Presidente convocará una <mark class=\"m-destacable\">reunión extraordinaria</mark> del Consejo Europeo.</p><p><b>4.</b> El Consejo Europeo se pronunciará por <mark class=\"m-resp\">consenso</mark>, <u class=\"m-clave\">excepto</u> cuando los Tratados dispongan otra cosa.</p><p><b>5.</b> El Consejo Europeo elegirá a su Presidente por <mark class=\"m-resp\">mayoría cualificada</mark> para un mandato de <mark class=\"m-resp\">dos años y medio</mark>, que podrá <mark class=\"m-resp\">renovarse una sola vez</mark>. En caso de <mark class=\"m-destacable\">impedimento o falta grave</mark>, el Consejo Europeo podrá <mark class=\"m-resp\">poner fin a su mandato por el mismo procedimiento</mark>.</p><p><b>6.</b> El <mark class=\"m-autoridad\">PRESIDENTE DEL CONSEJO EUROPEO</mark>:</p><p><b>a)</b> <mark class=\"m-accion\">presidirá e impulsará</mark> los trabajos del Consejo Europeo;</p><p><b>b)</b> <mark class=\"m-accion\">velará</mark> por la preparación y continuidad de los trabajos del Consejo Europeo, en cooperación con el <mark class=\"m-autoridad\">Presidente de la Comisión</mark> y basándose en los trabajos del <mark class=\"m-resp\">Consejo de Asuntos Generales</mark>;</p><p><b>c)</b> se esforzará por facilitar la <mark class=\"m-destacable\">cohesión y el consenso</mark> en el seno del Consejo Europeo;</p><p><b>d)</b> al término de cada reunión del Consejo Europeo, presentará un informe <mark class=\"m-resp\">al Parlamento Europeo</mark>.</p><p>El <mark class=\"m-resp\">Presidente del Consejo Europeo</mark> asumirá, en su rango y condición, la <mark class=\"m-destacable\">representación exterior</mark> de la Unión en los asuntos de <mark class=\"m-destacable\">política exterior y de seguridad común</mark>, sin perjuicio de las atribuciones del Alto Representante (…). El Presidente del Consejo Europeo <mark class=\"m-resp\">no podrá ejercer mandato nacional alguno</mark>.</p>", true)
  + trampa("Trampa de examen", "Consejo Europeo → CONSENSO (no mayoría cualificada). El informe tras cada reunión va al PARLAMENTO EUROPEO, no a la Comisión.")
  + articuloResp("Artículo 16 — El Consejo · R7", ["legislativa y presupuestaria con el PE","definición de políticas y coordinación","un representante de cada EM, de rango ministerial","comprometer al Gobierno y ejercer el voto","mayoría cualificada salvo otra cosa","55 % – al menos 15 – 65 % población","minoría de bloqueo: 4 miembros","transitorio hasta 31-3-2017","Asuntos Generales prepara el Consejo Europeo","COREPER","en público al deliberar y votar actos legislativos","rotación igual"], "<p><b>1.</b> El <mark class=\"m-autoridad\">CONSEJO</mark> ejercerá conjuntamente con el Parlamento Europeo <mark class=\"m-resp\">la función legislativa y la función presupuestaria</mark>. Ejercerá <mark class=\"m-resp\">funciones de definición de políticas y de coordinación</mark>, en las condiciones establecidas en los Tratados.</p><p><b>2.</b> El Consejo estará compuesto por <mark class=\"m-resp\">un representante de cada Estado miembro, de rango ministerial</mark>, facultado para <mark class=\"m-resp\">comprometer al Gobierno del Estado miembro al que represente y para ejercer el derecho de voto</mark>.</p><p><b>3.</b> El Consejo se pronunciará por <mark class=\"m-resp\">mayoría cualificada, excepto cuando los Tratados dispongan otra cosa</mark>.</p><p><b>4.</b> A partir del <mark class=\"m-plazo\">1 de noviembre de 2014</mark>, la mayoría cualificada se definirá como <mark class=\"m-resp\">un mínimo del 55 % de los miembros del Consejo</mark> que incluya <u class=\"m-clave\">al menos</u> a <mark class=\"m-resp\">quince</mark> de ellos y represente a Estados miembros que reúnan como mínimo <mark class=\"m-resp\">el 65 % de la población de la Unión</mark>. Una <mark class=\"m-destacable\">minoría de bloqueo</mark> estará compuesta por al menos <mark class=\"m-resp\">cuatro miembros del Consejo</mark>, a falta de lo cual la mayoría cualificada se considerará alcanzada. (…)</p><p><b>5.</b> Las disposiciones transitorias relativas a la definición de la mayoría cualificada que serán de aplicación hasta el <mark class=\"m-plazo\">31 de octubre de 2014</mark>, así como las aplicables entre el <mark class=\"m-plazo\">1 de noviembre de 2014</mark> y el <mark class=\"m-resp\">31 de marzo de 2017</mark>, se establecerán en el Protocolo sobre las disposiciones transitorias.</p><p><b>6.</b> El Consejo se reunirá en diferentes formaciones (…). El <mark class=\"m-resp\">Consejo de Asuntos Generales</mark> velará por la coherencia de los trabajos de las diferentes formaciones del Consejo. <mark class=\"m-resp\">Preparará las reuniones del Consejo Europeo</mark> y garantizará su actuación subsiguiente, en contacto con el Presidente del Consejo Europeo y la Comisión. El <mark class=\"m-autoridad\">Consejo de Asuntos Exteriores</mark> elaborará la acción exterior de la Unión (…).</p><p><b>7.</b> Un <mark class=\"m-resp\">Comité de Representantes Permanentes</mark> de los Gobiernos de los Estados miembros (COREPER) se encargará de <mark class=\"m-accion\">preparar los trabajos del Consejo</mark>.</p><p><b>8.</b> El Consejo se reunirá <mark class=\"m-resp\">en público cuando delibere y vote sobre un proyecto de acto legislativo</mark>. Con este fin, cada sesión del Consejo se dividirá en <mark class=\"m-plazo\">dos partes</mark> (…).</p><p><b>9.</b> La presidencia de las formaciones del Consejo, <u class=\"m-clave\">con excepción</u> de la de Asuntos Exteriores, será desempeñada por <mark class=\"m-resp\">los representantes de los Estados miembros en el Consejo mediante un sistema de rotación igual</mark> (…).</p>", true)

  + articuloResp("Artículo 17 — La Comisión · R8", ["velará por que se apliquen los Tratados","representación exterior salvo PESC","actos legislativos a propuesta de la Comisión","mandato 5 años","no solicitarán ni aceptarán instrucciones","hasta 31-10-2014: un nacional por EM","desde 1-11-2014: dos tercios","rotación estrictamente igual por unanimidad del Consejo Europeo","el Presidente organiza, nombra Vicepresidentes y pide dimisiones","Consejo Europeo propone por mayoría cualificada","PE elige por mayoría de miembros","nuevo candidato en un mes","lista: Consejo de común acuerdo con el Presidente electo","nombramiento: Consejo Europeo por mayoría cualificada","responsabilidad colegiada ante el PE"], "<p><b>1.</b> La <mark class=\"m-autoridad\">COMISIÓN</mark> <mark class=\"m-accion\">promoverá</mark> el <mark class=\"m-destacable\">interés general de la Unión</mark> y tomará las iniciativas adecuadas con este fin. <mark class=\"m-resp\">Velará por que se apliquen los Tratados</mark> y las medidas adoptadas por las instituciones en virtud de éstos. <mark class=\"m-accion\">Supervisará</mark> la aplicación del Derecho de la Unión bajo el control del <mark class=\"m-autoridad\">Tribunal de Justicia</mark>. <mark class=\"m-accion\">Ejecutará</mark> el presupuesto y <mark class=\"m-accion\">gestionará</mark> los programas. Ejercerá asimismo funciones de coordinación, ejecución y gestión (…). <mark class=\"m-resp\">Con excepción de la política exterior y de seguridad común</mark> y de los demás casos previstos por los Tratados, asumirá la <mark class=\"m-destacable\">representación exterior</mark> de la Unión. (…)</p><p><b>2.</b> Los <mark class=\"m-destacable\">actos legislativos</mark> de la Unión <u class=\"m-clave\">sólo</u> podrán adoptarse <mark class=\"m-resp\">a propuesta de la Comisión</mark>, <u class=\"m-clave\">excepto</u> cuando los Tratados dispongan otra cosa. (…)</p><p><b>3.</b> El mandato de la Comisión será de <mark class=\"m-resp\">cinco años</mark>.</p><p>Los miembros de la Comisión serán elegidos en razón de su <mark class=\"m-personalizado\">competencia general y de su compromiso europeo</mark>, de entre personalidades que ofrezcan plenas garantías de independencia. La Comisión ejercerá sus responsabilidades con <mark class=\"m-destacable\">plena independencia</mark>. (…) los miembros de la Comisión <mark class=\"m-resp\">no solicitarán ni aceptarán instrucciones de ningún gobierno, institución, órgano u organismo</mark>. (…)</p><p><b>4.</b> La Comisión nombrada entre la fecha de entrada en vigor del Tratado de Lisboa y el <mark class=\"m-plazo\">31 de octubre de 2014</mark> estará compuesta por <mark class=\"m-resp\">un nacional de cada Estado miembro, incluidos su Presidente y el Alto Representante</mark> (…), que será uno de sus Vicepresidentes.</p><p><b>5.</b> A partir del <mark class=\"m-plazo\">1 de noviembre de 2014</mark>, la Comisión estará compuesta por un número de miembros correspondiente a <mark class=\"m-resp\">los dos tercios del número de Estados miembros</mark>, que incluirá a su Presidente y al Alto Representante (…), <u class=\"m-clave\">a menos que</u> el <mark class=\"m-autoridad\">Consejo Europeo</mark> decida por <mark class=\"m-plazo\">unanimidad</mark> modificar dicho número. Los miembros de la Comisión serán seleccionados de entre los nacionales de los Estados miembros mediante un <mark class=\"m-resp\">sistema de rotación estrictamente igual</mark> entre los Estados miembros que permita tener en cuenta la diversidad demográfica y geográfica (…). Este sistema será <mark class=\"m-resp\">establecido por unanimidad por el Consejo Europeo</mark> de conformidad con el artículo 244 TFUE.</p><p><b>6.</b> El <mark class=\"m-autoridad\">PRESIDENTE DE LA COMISIÓN</mark>:</p><p><b>a)</b> <mark class=\"m-accion\">definirá</mark> las orientaciones con arreglo a las cuales la Comisión desempeñará sus funciones;</p><p><b>b)</b> <mark class=\"m-resp\">determinará la organización interna de la Comisión velando por la coherencia, eficacia y colegialidad de su actuación</mark>;</p><p><b>c)</b> nombrará <mark class=\"m-resp\">Vicepresidentes, distintos del Alto Representante</mark> (…), <mark class=\"m-resp\">de entre los miembros de la Comisión</mark>.</p><p>Un miembro de la Comisión presentará su <mark class=\"m-destacable\">dimisión</mark> <mark class=\"m-resp\">si se lo pide el Presidente</mark>. (…)</p><p><b>7.</b> Teniendo en cuenta el resultado de las elecciones al Parlamento Europeo (…), el <mark class=\"m-resp\">Consejo Europeo propondrá</mark> al Parlamento Europeo, por <mark class=\"m-resp\">mayoría cualificada</mark>, un candidato al cargo de Presidente de la Comisión. El <mark class=\"m-resp\">Parlamento Europeo elegirá</mark> al candidato por <mark class=\"m-resp\">mayoría de los miembros que lo componen</mark>. Si el candidato no obtiene la mayoría necesaria, el Consejo Europeo propondrá <mark class=\"m-resp\">en el plazo de un mes, por mayoría cualificada</mark>, un nuevo candidato (…). El <mark class=\"m-resp\">Consejo, de común acuerdo con el Presidente electo</mark>, adoptará la lista de las demás personalidades que se proponga nombrar miembros de la Comisión. (…) El Presidente, el Alto Representante y los demás miembros de la Comisión se someterán colegiadamente al <mark class=\"m-accion\">voto de aprobación</mark> del Parlamento Europeo. Sobre la base de dicha aprobación, la Comisión será nombrada por el <mark class=\"m-resp\">Consejo Europeo, por mayoría cualificada</mark>.</p><p><b>8.</b> La Comisión tendrá una <mark class=\"m-destacable\">responsabilidad colegiada</mark> <mark class=\"m-resp\">ante el Parlamento Europeo</mark>. El Parlamento Europeo podrá votar una <mark class=\"m-destacable\">moción de censura</mark> contra la Comisión (art. 234 TFUE). Si se aprueba dicha moción, <mark class=\"m-resp\">los miembros de la Comisión deberán dimitir colectivamente</mark> de sus cargos y <mark class=\"m-resp\">el Alto Representante deberá dimitir del cargo que ejerce en la Comisión</mark>.</p>", true)

  + articuloResp("Artículo 18 — Alto Representante · R9", ["nombra: Consejo Europeo por mayoría cualificada, con aprobación del Presidente de la Comisión","preside el Consejo de Asuntos Exteriores","Vicepresidente de la Comisión"], "<p><b>1.</b> El <mark class=\"m-resp\">Consejo Europeo nombrará por mayoría cualificada, con la aprobación del Presidente de la Comisión</mark>, al <mark class=\"m-autoridad\">Alto Representante</mark> de la Unión para Asuntos Exteriores y Política de Seguridad. El Consejo Europeo podrá poner fin a su mandato por el mismo procedimiento.</p><p><b>2.</b> El Alto Representante estará al frente de la <mark class=\"m-destacable\">política exterior y de seguridad común</mark> de la Unión. Contribuirá con sus propuestas a elaborar dicha política y la <mark class=\"m-accion\">ejecutará como mandatario del Consejo</mark>. Actuará del mismo modo en relación con la política común de seguridad y defensa.</p><p><b>3.</b> El Alto Representante <mark class=\"m-resp\">presidirá el Consejo de Asuntos Exteriores</mark>.</p><p><b>4.</b> El Alto Representante será <mark class=\"m-resp\">uno de los Vicepresidentes de la Comisión</mark>. Velará por la coherencia de la acción exterior de la Unión. (…)</p>", true)

  + articuloResp("Artículo 19 — Tribunal de Justicia de la Unión Europea · R10", ["Tribunal de Justicia, Tribunal General y tribunales especializados","vías de recurso: los Estados miembros","TJ: un juez por EM","TG: al menos un juez por EM","nombrados de común acuerdo por los Gobiernos","seis años","pueden ser nombrados de nuevo","prejudicial a petición de órganos jurisdiccionales nacionales"], "<p><b>1.</b> El <mark class=\"m-autoridad\">TRIBUNAL DE JUSTICIA DE LA UNIÓN EUROPEA</mark> comprenderá: • <mark class=\"m-resp\">el Tribunal de Justicia</mark>, • <mark class=\"m-resp\">el Tribunal General</mark> y • <mark class=\"m-resp\">los tribunales especializados</mark>.</p><p>Garantizará el respeto del Derecho en la interpretación y aplicación de los Tratados.</p><p><mark class=\"m-resp\">Los Estados miembros</mark> establecerán las <mark class=\"m-destacable\">vías de recurso</mark> necesarias para garantizar la <mark class=\"m-destacable\">tutela judicial efectiva</mark> en los ámbitos cubiertos por el Derecho de la Unión.</p><p><b>2.</b> El <mark class=\"m-autoridad\">TRIBUNAL DE JUSTICIA</mark> estará compuesto por <mark class=\"m-resp\">un juez por Estado miembro</mark>. Estará asistido por <mark class=\"m-autoridad\">abogados generales</mark>. El <mark class=\"m-autoridad\">TRIBUNAL GENERAL</mark> dispondrá <mark class=\"m-resp\">al menos de un juez por Estado miembro</mark>. (…) Serán nombrados <mark class=\"m-resp\">de común acuerdo por los Gobiernos de los Estados miembros</mark> para un período de <mark class=\"m-resp\">seis años</mark>. Los jueces y abogados generales salientes <mark class=\"m-resp\">podrán ser nombrados de nuevo</mark>.</p><p><b>3.</b> El TJUE se pronunciará, de conformidad con los Tratados:</p><p><b>a)</b> sobre los recursos interpuestos por un Estado miembro, por una institución o por personas físicas o jurídicas;</p><p><b>b)</b> con carácter <mark class=\"m-destacable\">prejudicial</mark>, <mark class=\"m-resp\">a petición de los órganos jurisdiccionales nacionales, sobre la interpretación del Derecho de la Unión o sobre la validez de los actos adoptados por las instituciones</mark>;</p><p><b>c)</b> en los demás casos previstos por los Tratados.</p>", true)
  + bloqueTitulo("TÍTULO V. ACCIÓN EXTERIOR Y POLÍTICA EXTERIOR Y DE SEGURIDAD COMÚN (PESC)")
  + articuloResp("Artículo 21 — Principios y objetivos de la acción exterior", ["democracia, Estado de Derecho, derechos humanos, dignidad, igualdad y solidaridad, Carta de la ONU","Acta Final de Helsinki y Carta de París","obstáculos al comercio INTERNACIONAL"], "<p><b>1.</b> La acción de la Unión en la escena internacional se basará en los <mark class=\"m-destacable\">principios</mark> que han inspirado su creación, desarrollo y ampliación y que pretende fomentar en el resto del mundo: <mark class=\"m-resp\">la democracia, el Estado de Derecho, la universalidad e indivisibilidad de los derechos humanos y de las libertades fundamentales, el respeto de la dignidad humana, los principios de igualdad y solidaridad y el respeto de los principios de la Carta de las Naciones Unidas y del Derecho internacional</mark>. (…)</p><p><b>2.</b> La Unión definirá y ejecutará políticas comunes y acciones (…) con el fin de:</p><p><b>a)</b> defender sus valores, intereses fundamentales, seguridad, independencia e integridad;</p><p><b>b)</b> consolidar y respaldar la democracia, el Estado de Derecho, los derechos humanos y los principios del Derecho internacional;</p><p><b>c)</b> mantener la paz, prevenir los conflictos y fortalecer la seguridad internacional, conforme a los propósitos y principios de la Carta de las Naciones Unidas, así como a <mark class=\"m-resp\">los principios del Acta Final de Helsinki y a los objetivos de la Carta de París</mark>, incluidos los relacionados con las fronteras exteriores;</p><p><b>d)</b> apoyar el desarrollo sostenible (…) de los países en desarrollo, con el objetivo fundamental de <mark class=\"m-personalizado\">erradicar la pobreza</mark>;</p><p><b>e)</b> fomentar la integración de todos los países en la economía mundial, entre otras cosas mediante la supresión progresiva de los obstáculos al <mark class=\"m-resp\">comercio internacional</mark>;</p><p><b>f)</b> contribuir a elaborar medidas internacionales de protección y mejora de la calidad del medio ambiente (…);</p><p><b>g)</b> ayudar a las poblaciones, países y regiones que se enfrenten a catástrofes naturales o de origen humano; y</p><p><b>h)</b> promover un sistema internacional basado en una cooperación multilateral sólida y en una buena gobernanza mundial.</p>", true)

  + articuloResp("Artículo 22 — Intereses y objetivos estratégicos · R11", ["Consejo Europeo","por unanimidad, sobre recomendación del Consejo","propuestas conjuntas: Alto Representante (PESC) y Comisión (resto)"], "<p><b>1.</b> Basándose en los principios y objetivos enumerados en el artículo 21, el <mark class=\"m-resp\">Consejo Europeo</mark> determinará los <mark class=\"m-destacable\">intereses y objetivos estratégicos</mark> de la Unión. (…)</p><p>El Consejo Europeo se pronunciará <mark class=\"m-resp\">por unanimidad</mark>, basándose en una <mark class=\"m-destacable\">recomendación del Consejo</mark> adoptada por éste según las modalidades previstas para cada ámbito. (…)</p><p><b>2.</b> <mark class=\"m-resp\">El Alto Representante</mark> (…), <mark class=\"m-resp\">en el ámbito de la política exterior y de seguridad común, y la Comisión, en los demás ámbitos de la acción exterior</mark>, podrán presentar <mark class=\"m-accion\">propuestas conjuntas</mark> al Consejo.</p>", true)
  + articuloResp("Artículo 24 — Competencia en PESC", ["ejecutada por el Alto Representante y los Estados miembros","apoyo activo y sin reservas","el TJUE no es competente, salvo art. 40 TUE y art. 275 TFUE","solidaridad política mutua, interés general, convergencia"], "<p><b>1.</b> La competencia de la Unión en materia de <mark class=\"m-destacable\">política exterior y de seguridad común</mark> abarcará todos los ámbitos de la política exterior y todas las cuestiones relativas a la seguridad de la Unión, incluida la definición progresiva de una política común de defensa que <mark class=\"m-resp\">podrá conducir</mark> a una defensa común. (…) La definirán y aplicarán el <mark class=\"m-autoridad\">Consejo Europeo</mark> y el <mark class=\"m-autoridad\">Consejo</mark>, que deberán pronunciarse por <mark class=\"m-plazo\">unanimidad</mark> <u class=\"m-clave\">salvo</u> cuando los Tratados dispongan otra cosa. <u class=\"m-clave\">Queda excluida</u> la adopción de actos legislativos. La política exterior y de seguridad común será ejecutada por <mark class=\"m-resp\">el Alto Representante (…) y por los Estados miembros</mark>, de conformidad con los Tratados. (…) El <mark class=\"m-resp\">Tribunal de Justicia</mark> de la Unión Europea <mark class=\"m-resp\">no tendrá competencia</mark> respecto de estas disposiciones, <mark class=\"m-resp\">con la salvedad de su competencia para controlar el respeto del artículo 40 del presente Tratado y para controlar la legalidad de determinadas decisiones contempladas en el (…) artículo 275 del TFUE</mark>.</p><p><b>2.</b> (…) la Unión dirigirá, definirá y ejecutará una política exterior y de seguridad común basada en <mark class=\"m-resp\">el desarrollo de la solidaridad política mutua de los Estados miembros, en la identificación de los asuntos que presenten un interés general y en la consecución de una convergencia cada vez mayor</mark> de la actuación de los Estados miembros.</p><p><b>3.</b> <mark class=\"m-resp\">Los Estados miembros apoyarán activamente y sin reservas la política exterior y de seguridad de la Unión, con espíritu de lealtad y solidaridad mutua</mark> y respetarán la acción de la Unión en este ámbito. Los Estados miembros trabajarán conjuntamente para intensificar y desarrollar su <mark class=\"m-destacable\">solidaridad política mutua</mark>. Se <mark class=\"m-accion\">abstendrán</mark> de toda acción contraria a los intereses de la Unión (…). El <mark class=\"m-autoridad\">Consejo</mark> y el <mark class=\"m-autoridad\">Alto Representante</mark> velarán por que se respeten estos principios.</p>", true)

  + articuloResp("Artículo 26 — Consejo Europeo, Consejo y Alto Representante en la PESC", ["intereses estratégicos y orientaciones: Consejo Europeo","elabora la PESC y adopta decisiones: el Consejo","unidad, coherencia y eficacia: Consejo y Alto Representante"], "<p><b>1.</b> El <mark class=\"m-resp\">Consejo Europeo</mark> determinará los <mark class=\"m-destacable\">intereses estratégicos</mark> de la Unión, fijará los objetivos y definirá las <mark class=\"m-destacable\">orientaciones generales</mark> de la política exterior y de seguridad común, incluidos los asuntos que tengan repercusiones en el ámbito de la defensa. (…)</p><p><b>2.</b> Basándose en las orientaciones generales y en las líneas estratégicas definidas por el Consejo Europeo, <mark class=\"m-resp\">el Consejo elaborará la política exterior y de seguridad común y adoptará las decisiones necesarias</mark> para definir y aplicar dicha política. <mark class=\"m-resp\">El Consejo y el Alto Representante</mark> velarán por la <mark class=\"m-resp\">unidad, la coherencia y la eficacia</mark> de la acción de la Unión.</p><p><b>3.</b> La política exterior y de seguridad común será ejecutada por el <mark class=\"m-autoridad\">Alto Representante</mark> y por los <mark class=\"m-autoridad\">Estados miembros</mark>, utilizando los medios nacionales y los de la Unión.</p>", true)
  + articuloResp("Artículo 27 — El Alto Representante en la PESC", ["ejecuta las decisiones del Consejo Europeo y del Consejo","dirige el diálogo político","expresa la posición de la Unión","se apoya en un servicio europeo de acción exterior","decisión del Consejo, a propuesta del AR, previa consulta al PE y previa aprobación de la Comisión"], "<p><b>1.</b> El <mark class=\"m-autoridad\">Alto Representante</mark>, que presidirá el Consejo de Asuntos Exteriores, contribuirá con sus propuestas a elaborar la política exterior y de seguridad común y <mark class=\"m-resp\">se encargará de ejecutar las decisiones adoptadas por el Consejo Europeo y el Consejo</mark>.</p><p><b>2.</b> El Alto Representante representará a la Unión en las materias concernientes a la PESC. <mark class=\"m-resp\">Dirigirá el diálogo político con terceros</mark> en nombre de la Unión y <mark class=\"m-resp\">expresará la posición de la Unión en las organizaciones internacionales y en las conferencias internacionales</mark>.</p><p><b>3.</b> En el ejercicio de su mandato, el Alto Representante se apoyará en un <mark class=\"m-resp\">servicio europeo de acción exterior</mark>. Este servicio trabajará en colaboración con los servicios diplomáticos de los Estados miembros (…). La organización y el funcionamiento del servicio europeo de acción exterior se establecerán mediante <mark class=\"m-resp\">decisión del Consejo</mark>, que se pronunciará <mark class=\"m-resp\">a propuesta del Alto Representante, previa consulta al Parlamento Europeo y previa aprobación de la Comisión</mark>.</p>", true)
  + articuloResp("Artículo 28 — Acción operativa", ["objetivos, alcance, medios, condiciones de ejecución y, en caso necesario, duración","sin información previa en la mera transposición"], "<p><b>1.</b> Cuando una situación internacional exija una <mark class=\"m-destacable\">acción operativa</mark> de la Unión, el <mark class=\"m-autoridad\">Consejo</mark> adoptará las decisiones necesarias. Éstas fijarán <mark class=\"m-resp\">los objetivos, el alcance, los medios que haya que facilitar a la Unión, las condiciones de su ejecución y, en caso necesario, su duración</mark>. (…)</p><p><b>2.</b> Las decisiones contempladas en el apartado 1 serán <mark class=\"m-destacable\">vinculantes</mark> para los Estados miembros (…).</p><p><b>3.</b> Cuando exista cualquier plan para adoptar una posición nacional o emprender una acción nacional en aplicación de una de las decisiones contempladas en el apartado 1, el Estado miembro de que se trate <mark class=\"m-accion\">proporcionará información</mark> (…). La obligación de información previa <u class=\"m-clave\">no</u> se aplicará a <mark class=\"m-resp\">las medidas que constituyan una mera transposición al ámbito nacional de las decisiones del Consejo</mark>.</p>", false)
  + articuloResp("Artículo 29 — Enfoque de la Unión · R12", ["el Consejo","geográfico o temático"], "<p><mark class=\"m-resp\">El Consejo</mark> adoptará decisiones que definirán el <mark class=\"m-destacable\">enfoque de la Unión</mark> sobre un asunto concreto de carácter <mark class=\"m-resp\">geográfico o temático</mark>. Los Estados miembros velarán por la conformidad de sus políticas nacionales con las posiciones de la Unión.</p>", true)
  + articuloResp("Artículo 30 — Iniciativa y decisiones rápidas", ["48 horas o, en necesidad absoluta, plazo más breve"], "<p><b>2.</b> En los casos que requieran una <mark class=\"m-destacable\">decisión rápida</mark>, el <mark class=\"m-autoridad\">Alto Representante</mark> convocará, de oficio o a petición de un Estado miembro, una <mark class=\"m-destacable\">reunión extraordinaria del Consejo</mark>, en un plazo de <mark class=\"m-resp\">cuarenta y ocho horas o, en caso de necesidad absoluta, en un plazo más breve</mark>.</p>", false)
  + articuloResp("Artículo 31 — Votaciones en la PESC", ["unanimidad con abstención constructiva","no se adopta si 1/3 de EM con 1/3 de la población","motivos vitales: remisión al Consejo Europeo","procedimiento: mayoría de los miembros"], "<p><b>1.</b> El <mark class=\"m-autoridad\">Consejo Europeo</mark> y el <mark class=\"m-autoridad\">Consejo</mark> adoptarán <mark class=\"m-resp\">por unanimidad</mark> las decisiones de que trata el presente capítulo, <u class=\"m-clave\">salvo</u> en los casos en que el presente capítulo disponga otra cosa. Se excluye la adopción de actos legislativos. En caso de que un miembro del Consejo se <mark class=\"m-destacable\">abstuviera</mark> en una votación, podrá acompañar su abstención de una <mark class=\"m-resp\">declaración formal</mark>. En ese caso, no estará obligado a aplicar la decisión, pero admitirá que ésta sea vinculante para la Unión. (…) En caso de que el número de miembros del Consejo que acompañara su abstención de tal declaración representara al menos <mark class=\"m-resp\">un tercio de los Estados miembros que reúnen como mínimo un tercio de la población de la Unión</mark>, <u class=\"m-clave\">no</u> se adoptará la decisión.</p><p><b>2.</b> Como excepción a lo dispuesto en el apartado 1, el Consejo adoptará por <mark class=\"m-plazo\">mayoría cualificada</mark>: (…) la designación de un representante especial de conformidad con el artículo 33.</p><p>Si un miembro del Consejo declarase que, por <mark class=\"m-resp\">motivos vitales y explícitos de política nacional</mark>, tiene la intención de oponerse a la adopción de una decisión que se deba adoptar por mayoría cualificada, <mark class=\"m-resp\">no se procederá a la votación</mark>. El Alto Representante intentará hallar (…) una solución aceptable para éste. De no hallarse dicha solución, <mark class=\"m-resp\">el Consejo, por mayoría cualificada, podrá pedir que el asunto se remita al Consejo Europeo para que adopte al respecto una decisión por unanimidad</mark>.</p><p><b>4.</b> Los apartados 2 y 3 <u class=\"m-clave\">no</u> se aplicarán a las decisiones que tengan repercusiones en el ámbito <mark class=\"m-destacable\">militar o de la defensa</mark>.</p><p><b>5.</b> En lo que se refiere a <mark class=\"m-destacable\">cuestiones de procedimiento</mark>, el Consejo se pronunciará por <mark class=\"m-resp\">mayoría de los miembros que lo componen</mark>.</p>", false)
  + articuloResp("Artículo 32 — Consulta entre Estados miembros", ["en el seno del Consejo Europeo o del Consejo"], "<p>Los Estados miembros se consultarán en el seno del Consejo Europeo y del Consejo sobre cualquier cuestión de política exterior y de seguridad que revista un interés general, a fin de definir un <mark class=\"m-destacable\">enfoque común</mark>. <u class=\"m-clave\">Antes</u> de emprender cualquier actuación en la escena internacional o de asumir cualquier compromiso que pueda afectar a los intereses de la Unión, cada Estado miembro <mark class=\"m-resp\">consultará a los demás en el seno del Consejo Europeo o del Consejo</mark>. (…)</p>", true)
  + articuloResp("Artículo 33 — Representante especial · R13", ["a propuesta del Alto Representante","representante especial","bajo la autoridad del Alto Representante"], "<p><mark class=\"m-resp\">A propuesta del Alto Representante</mark> de la Unión para Asuntos Exteriores y Política de Seguridad, el <mark class=\"m-autoridad\">Consejo</mark> podrá designar <mark class=\"m-resp\">un representante especial</mark> provisto de un mandato en relación con <mark class=\"m-personalizado\">cuestiones políticas concretas</mark>. El representante especial ejercerá su mandato <mark class=\"m-resp\">bajo la autoridad del Alto Representante</mark>.</p>", true)
  + articuloResp("Artículo 34 — Coordinación en organizaciones internacionales", ["organiza la coordinación: el Alto Representante","Consejo de Seguridad ONU: piden que se invite al Alto Representante"], "<p><b>1.</b> Los Estados miembros <mark class=\"m-accion\">coordinarán su acción</mark> en las <mark class=\"m-destacable\">organizaciones internacionales</mark> y con ocasión de las conferencias internacionales. Los Estados miembros defenderán en esos foros las posiciones de la Unión. <mark class=\"m-resp\">El Alto Representante</mark> (…) <mark class=\"m-resp\">organizará dicha coordinación</mark>. (…)</p><p><b>2.</b> (…) Cuando la Unión haya definido una posición sobre un tema incluido en el orden del día del <mark class=\"m-autoridad\">Consejo de Seguridad de las Naciones Unidas</mark>, los Estados miembros que sean miembros de éste <mark class=\"m-resp\">pedirán que se invite al Alto Representante a presentar la posición de la Unión</mark>.</p>", true)
  + articuloResp("Artículo 35 — Misiones diplomáticas y consulares", ["misiones diplomáticas y consulares de los EM y delegaciones de la Unión"], "<p><mark class=\"m-resp\">Las misiones diplomáticas y consulares de los Estados miembros y las delegaciones de la Unión</mark> en los terceros países y en las conferencias internacionales, así como sus representaciones ante las organizaciones internacionales, <mark class=\"m-accion\">cooperarán</mark> para garantizar el respeto y la ejecución de las decisiones que establezcan posiciones o acciones de la Unión (…).</p>", false)
  + articuloResp("Artículo 36 — Parlamento Europeo y PESC", ["consulta periódicamente: el Alto Representante","debate dos veces al año"], "<p><mark class=\"m-resp\">El Alto Representante</mark> (…) <mark class=\"m-resp\">consultará periódicamente al Parlamento Europeo</mark> sobre los aspectos principales y las opciones fundamentales de la PESC y de la política común de seguridad y defensa y le informará de la evolución de dichas políticas. (…)</p><p>El Parlamento Europeo podrá dirigir <mark class=\"m-accion\">preguntas o formular recomendaciones</mark> al Consejo y al Alto Representante. <mark class=\"m-resp\">Dos veces al año</mark> procederá a un <mark class=\"m-destacable\">debate</mark> sobre los progresos realizados en el desarrollo de la política exterior y de seguridad común, incluida la política común de seguridad y defensa.</p>", true)
  + articuloResp("Artículo 37 — Acuerdos internacionales", ["en los ámbitos del capítulo de la PESC"], "<p>La Unión podrá celebrar <mark class=\"m-destacable\">acuerdos</mark> con uno o varios Estados u organizaciones internacionales <mark class=\"m-resp\">en los ámbitos comprendidos en el presente capítulo</mark> (PESC).</p>", false)
  + articuloResp("Artículo 38 — Comité Político y de Seguridad", ["Comité Político y de Seguridad","dictámenes dirigidos al Consejo","control político y dirección estratégica de la gestión de crisis"], "<p>(…) un <mark class=\"m-resp\">Comité Político y de Seguridad</mark> seguirá la situación internacional en los ámbitos concernientes a la política exterior y de seguridad común y contribuirá a definir la política mediante la <mark class=\"m-resp\">emisión de dictámenes dirigidos al Consejo</mark>, bien a instancia de éste, del Alto Representante o por propia iniciativa. (…) En el marco del presente capítulo, el Comité Político y de Seguridad ejercerá, bajo la responsabilidad del <mark class=\"m-autoridad\">Consejo</mark> y del <mark class=\"m-autoridad\">Alto Representante</mark>, el <mark class=\"m-resp\">control político y la dirección estratégica de las operaciones de gestión de crisis</mark> contempladas en el artículo 43. (…)</p>", true)
  + articuloResp("Artículo 39 — Protección de datos en la PESC", ["en el ámbito de la PESC","control de autoridades independientes"], "<p>(…) el <mark class=\"m-autoridad\">Consejo</mark> adoptará una decisión que fije las normas sobre <mark class=\"m-destacable\">protección de las personas físicas</mark> respecto del tratamiento de datos de carácter personal por los Estados miembros en el ejercicio de las actividades comprendidas en el ámbito de aplicación del presente capítulo (<mark class=\"m-resp\">PESC</mark>), y sobre la libre circulación de dichos datos. El respeto de dichas normas estará sometido al control de <mark class=\"m-autoridad\">autoridades independientes</mark>.</p>", false)
  + articuloResp("Artículo 40 — PESC y demás competencias", ["competencias de los arts. 3 a 6 TFUE"], "<p>La ejecución de la política exterior y de seguridad común <u class=\"m-clave\">no afectará</u> a la aplicación de los procedimientos y al alcance respectivo de las atribuciones de las instituciones establecidos en los Tratados <mark class=\"m-resp\">para el ejercicio de las competencias de la Unión mencionadas en los artículos 3 a 6 del TFUE</mark>. (…)</p>", false)
  + articuloResp("Artículo 41 — Financiación de la PESC", ["administrativos: presupuesto de la Unión","operativos: presupuesto, excepto militar/defensa o unanimidad","Estados: clave de PNB","declaración formal art. 31.1 → no contribuyen","fondo inicial: mayoría cualificada a propuesta del AR"], "<p><b>1.</b> Los <mark class=\"m-destacable\">gastos administrativos</mark> que la aplicación del presente capítulo ocasione a las instituciones correrán a cargo <mark class=\"m-resp\">del presupuesto de la Unión</mark>.</p><p><b>2.</b> Los <mark class=\"m-destacable\">gastos operativos</mark> (…) también correrán a cargo del presupuesto de la Unión, <mark class=\"m-resp\">excepto los relativos a las operaciones que tengan repercusiones en el ámbito militar o de la defensa y los casos en que el Consejo decida, por unanimidad, otra cosa</mark>. Cuando los gastos no corran a cargo del presupuesto de la Unión, correrán a cargo de los Estados miembros <mark class=\"m-resp\">con arreglo a una clave de reparto basada en el producto nacional bruto, a menos que el Consejo decida otra cosa por unanimidad</mark>. En cuanto a los gastos derivados de las operaciones que tengan repercusiones en el ámbito militar o de la defensa, <mark class=\"m-resp\">los Estados miembros cuyos representantes en el Consejo hayan efectuado una declaración formal</mark> con arreglo al (…) artículo 31.1 <mark class=\"m-resp\">no estarán obligados a contribuir a su financiación</mark>.</p><p><b>3.</b> (…) Los preparativos de las misiones (…) que no se imputen al presupuesto de la Unión se financiarán mediante un <mark class=\"m-destacable\">fondo inicial</mark> constituido por contribuciones de los Estados miembros. El <mark class=\"m-autoridad\">Consejo</mark> adoptará por <mark class=\"m-resp\">mayoría cualificada, a propuesta del Alto Representante</mark>, las decisiones que establezcan:</p><p><b>a)</b> <mark class=\"m-resp\">las modalidades de constitución y de financiación del fondo inicial, en particular los importes financieros asignados al mismo</mark>;</p><p><b>b)</b> <mark class=\"m-resp\">las modalidades de gestión del fondo inicial</mark>;</p><p><b>c)</b> <mark class=\"m-resp\">las modalidades de control financiero</mark>.</p>", true)
  + bloqueTitulo("SECCIÓN 2.ª POLÍTICA COMÚN DE SEGURIDAD Y DEFENSA (PCSD)")
  + articuloResp("Artículo 42 — Política común de seguridad y defensa", ["parte integrante de la PESC","medios civiles y militares","defensa común cuando el Consejo Europeo lo decida por unanimidad","capacidades civiles y militares para objetivos del Consejo","Consejo por unanimidad, a propuesta del AR o de un Estado","misión a un grupo de Estados: el Consejo","asistencia mutua (art. 51 Carta ONU)"], "<p><b>1.</b> La política común de seguridad y defensa forma <mark class=\"m-resp\">parte integrante de la política exterior y de seguridad común</mark>. Ofrecerá a la Unión una <mark class=\"m-destacable\">capacidad operativa</mark> basada en <mark class=\"m-resp\">medios civiles y militares</mark>. La Unión podrá recurrir a dichos medios en <mark class=\"m-destacable\">misiones fuera de la Unión</mark> que tengan por objetivo garantizar el mantenimiento de la paz, la prevención de conflictos y el fortalecimiento de la seguridad internacional (…).</p><p><b>2.</b> La política común de seguridad y defensa incluirá la definición progresiva de una política común de defensa de la Unión. Ésta conducirá a una <mark class=\"m-destacable\">defensa común</mark> una vez que <mark class=\"m-resp\">el Consejo Europeo lo haya decidido por unanimidad</mark>. (…)</p><p><b>3.</b> <mark class=\"m-resp\">Los Estados miembros pondrán a disposición de la Unión</mark>, a efectos de la aplicación de la política común de seguridad y defensa, <mark class=\"m-resp\">capacidades civiles y militares</mark> para contribuir a los objetivos definidos por <mark class=\"m-resp\">el Consejo</mark>. (…) La <mark class=\"m-autoridad\">Agencia Europea de Defensa</mark> <mark class=\"m-resp\">determinará las necesidades operativas, fomentará medidas para satisfacerlas</mark> (…).</p><p><b>4.</b> <mark class=\"m-resp\">El Consejo adoptará por unanimidad</mark>, <mark class=\"m-resp\">a propuesta del Alto Representante (…) o a iniciativa de un Estado miembro</mark>, las decisiones relativas a la política común de seguridad y defensa, incluidas las relativas al inicio de una misión (…).</p><p><b>5.</b> <mark class=\"m-resp\">El Consejo</mark> podrá <mark class=\"m-accion\">encomendar</mark> la realización de una misión, en el marco de la Unión, a un <mark class=\"m-destacable\">grupo de Estados miembros</mark> a fin de defender los valores y favorecer los intereses de la Unión. (…)</p><p><b>6.</b> Los Estados miembros que cumplan criterios más elevados de capacidades militares (…) establecerán una <mark class=\"m-destacable\">cooperación estructurada permanente</mark> (…) (art. 46).</p><p><b>7.</b> Si un Estado miembro es objeto de una <mark class=\"m-destacable\">agresión armada</mark> en su territorio, los demás Estados miembros le deberán <mark class=\"m-resp\">ayuda y asistencia con todos los medios a su alcance, de conformidad con el artículo 51 de la Carta de las Naciones Unidas</mark>. (…)</p>", true)
  + trampa("Trampa de examen", "Defensa común «una vez que el CONSEJO EUROPEO lo haya decidido por UNANIMIDAD». Decisiones PCSD → el CONSEJO por unanimidad.")
  + articuloResp("Artículo 43 — Misiones PCSD", ["desarme, humanitarias y de rescate, restablecimiento de la paz…","decide el Consejo","coordina el AR bajo la autoridad del Consejo y en contacto con el CPS"], "<p><b>1.</b> Las misiones contempladas en el apartado 1 del artículo 42 (…) abarcarán <mark class=\"m-resp\">las actuaciones conjuntas en materia de desarme, las misiones humanitarias y de rescate</mark>, las misiones de asesoramiento y asistencia en cuestiones militares, las misiones de prevención de conflictos y de mantenimiento de la paz, las misiones en las que intervengan fuerzas de combate para la gestión de crisis, <mark class=\"m-resp\">incluidas las misiones de restablecimiento de la paz</mark> y las operaciones de estabilización al término de los conflictos. (…)</p><p><b>2.</b> <mark class=\"m-resp\">El Consejo adoptará las decisiones relativas a las misiones</mark> contempladas en el apartado 1 (…). <mark class=\"m-resp\">El Alto Representante</mark> (…), <mark class=\"m-resp\">bajo la autoridad del Consejo y en contacto estrecho y permanente con el Comité Político y de Seguridad, se hará cargo de la coordinación de los aspectos civiles y militares</mark> de dichas misiones.</p>", true)
  + articuloResp("Artículo 44 — Misión a un grupo de Estados", ["en asociación con el Alto Representante"], "<p><b>1.</b> (…) el <mark class=\"m-autoridad\">Consejo</mark> podrá encomendar la realización de una misión a un grupo de Estados miembros que lo deseen y que dispongan de las capacidades necesarias para tal misión. La gestión de la misión se acordará entre dichos Estados miembros, <mark class=\"m-resp\">en asociación con el Alto Representante</mark> (…).</p>", false)
  + articuloResp("Artículo 45 — Agencia Europea de Defensa", ["bajo la autoridad del Consejo","define objetivos de capacidades militares","apoya la investigación sobre tecnología de defensa","estatuto, sede y funcionamiento: Consejo por mayoría cualificada"], "<p><b>1.</b> La <mark class=\"m-resp\">Agencia Europea de Defensa</mark> (…) estará <mark class=\"m-resp\">bajo la autoridad del Consejo</mark> y tendrá como misión:</p><p><b>a)</b> <mark class=\"m-resp\">contribuir a definir los objetivos de capacidades militares de los Estados miembros y a evaluar el respeto de los compromisos de capacidades</mark> contraídos por los Estados miembros;</p><p><b>b)</b> fomentar la armonización de las necesidades operativas y la adopción de métodos de adquisición eficaces y compatibles;</p><p><b>c)</b> proponer proyectos multilaterales para cumplir los objetivos de capacidades militares (…);</p><p><b>d)</b> <mark class=\"m-resp\">apoyar la investigación sobre tecnología de defensa y coordinar y planificar actividades de investigación conjuntas y estudios de soluciones técnicas que respondan a las futuras necesidades operativas</mark>;</p><p><b>e)</b> contribuir a definir y, en su caso, aplicar cualquier medida oportuna para reforzar la base industrial y tecnológica del sector de la defensa (…).</p><p><b>2.</b> Podrán participar en la Agencia Europea de Defensa <mark class=\"m-personalizado\">todos los Estados miembros que lo deseen</mark>. El Consejo adoptará por <mark class=\"m-resp\">mayoría cualificada</mark> una decisión en la que se determinará el <mark class=\"m-resp\">estatuto, la sede y la forma de funcionamiento</mark> de la Agencia. (…)</p>", true)
  + articuloResp("Artículo 46 — Cooperación estructurada permanente · R14", ["tres meses, mayoría cualificada","suspensión: mayoría cualificada sin el Estado afectado","abandono: notifica al Consejo, que toma nota"], "<p><b>2.</b> En un plazo de <mark class=\"m-resp\">tres meses</mark> a partir de la notificación (…), el <mark class=\"m-autoridad\">Consejo</mark> adoptará una decisión por la que se establezca la <mark class=\"m-destacable\">cooperación estructurada permanente</mark> y se fije la lista de los Estados miembros participantes. El Consejo, tras consultar al Alto Representante, se pronunciará por <mark class=\"m-resp\">mayoría cualificada</mark>.</p><p><b>4.</b> Si un Estado miembro participante ya no cumple los criterios (…), el Consejo podrá adoptar una decisión por la que se <mark class=\"m-accion\">suspenda</mark> la participación de dicho Estado. El Consejo se pronunciará <mark class=\"m-resp\">por mayoría cualificada. Únicamente participarán en la votación los miembros del Consejo que representen a los Estados miembros participantes, con excepción del Estado miembro de que se trate</mark>.</p><p><b>5.</b> Si un Estado miembro participante decide <mark class=\"m-accion\">abandonar</mark> la cooperación estructurada permanente, notificará su decisión <mark class=\"m-resp\">al Consejo, que tomará nota</mark> de que ha finalizado la participación de ese Estado miembro.</p>", false)
  + bloqueTitulo("3.2 — TRATADO DE FUNCIONAMIENTO DE LA UNIÓN EUROPEA · TERCERA PARTE, TÍTULO IV: LIBRE CIRCULACIÓN DE PERSONAS, SERVICIOS Y CAPITALES")
  + articuloResp("Artículo 45 TFUE — Trabajadores · R15", ["abolición de toda discriminación por nacionalidad: empleo, retribución y demás condiciones de trabajo","derechos a)-d)","reglamentos de la COMISIÓN","no aplicable a la administración pública"], "<p><b>1.</b> Quedará asegurada la <mark class=\"m-destacable\">libre circulación de los trabajadores</mark> dentro de la Unión.</p><p><b>2.</b> La libre circulación supondrá <mark class=\"m-resp\">la abolición de toda discriminación por razón de la nacionalidad</mark> entre los trabajadores de los Estados miembros, <mark class=\"m-resp\">con respecto al empleo, la retribución y las demás condiciones de trabajo</mark>.</p><p><b>3.</b> <u class=\"m-clave\">Sin perjuicio</u> de las limitaciones justificadas por razones de <mark class=\"m-personalizado\">orden público, seguridad y salud públicas</mark>, la libre circulación de los trabajadores implicará el derecho:</p><p><b>a)</b> de responder a ofertas efectivas de trabajo;</p><p><b>b)</b> de desplazarse libremente para este fin en el territorio de los Estados miembros;</p><p><b>c)</b> de residir en uno de los Estados miembros con objeto de ejercer en él un empleo (…);</p><p><b>d)</b> de permanecer en el territorio de un Estado miembro después de haber ejercido en él un empleo, en las condiciones previstas en los reglamentos establecidos <mark class=\"m-resp\">por la Comisión</mark>.</p><p><b>4.</b> Las disposiciones del presente artículo <u class=\"m-clave\">no</u> serán aplicables a los <mark class=\"m-resp\">empleos en la administración pública</mark>.</p>", true)
  + trampa("Trampa de examen", "Los reglamentos del 45.3.d) los establece la COMISIÓN (no el Consejo ni el Consejo Europeo).")
  + articuloResp("Artículo 46 TFUE — Medidas sobre trabajadores", ["PE y Consejo, procedimiento legislativo ordinario y previa consulta al CES","directivas o reglamentos"], "<p><mark class=\"m-resp\">El Parlamento Europeo y el Consejo, con arreglo al procedimiento legislativo ordinario y previa consulta al Comité Económico y Social</mark>, adoptarán, mediante <mark class=\"m-resp\">directivas o reglamentos</mark>, las medidas necesarias a fin de hacer efectiva la libre circulación de los trabajadores (…).</p>", true)
  + articuloResp("Artículo 47 TFUE — Trabajadores jóvenes", ["trabajadores jóvenes"], "<p>Los Estados miembros facilitarán, en el marco de un <mark class=\"m-destacable\">programa común</mark>, el intercambio de <mark class=\"m-resp\">trabajadores jóvenes</mark>.</p>", false)
  + articuloResp("Artículo 48 TFUE — Seguridad social de los trabajadores migrantes", ["PE y Consejo","freno: remisión al Consejo Europeo","cuatro meses","si no se pronuncia → no adoptado"], "<p><mark class=\"m-resp\">El Parlamento Europeo y el Consejo</mark>, con arreglo al procedimiento legislativo ordinario, adoptarán, en materia de <mark class=\"m-destacable\">seguridad social</mark>, las medidas necesarias para el establecimiento de la libre circulación de los trabajadores, creando, en especial, un sistema que permita garantizar a los trabajadores migrantes por cuenta ajena y por cuenta propia, así como a sus derechohabientes:</p><p><b>a)</b> la acumulación de todos los períodos tomados en consideración por las distintas legislaciones nacionales (…);</p><p><b>b)</b> el pago de las prestaciones a las personas que residan en los territorios de los Estados miembros.</p><p>Cuando un miembro del Consejo declare que un proyecto de acto legislativo (…) perjudica a aspectos importantes de su sistema de seguridad social (…), podrá solicitar que el asunto se remita <mark class=\"m-resp\">al Consejo Europeo</mark>, en cuyo caso quedará suspendido el procedimiento legislativo ordinario. Previa deliberación y en un plazo de <mark class=\"m-resp\">cuatro meses a partir de dicha suspensión</mark>, el Consejo Europeo:</p><p><b>a)</b> devolverá el proyecto al Consejo, poniendo fin con ello a la suspensión del procedimiento legislativo ordinario, o bien</p><p><b>b)</b> no se pronunciará o pedirá a la Comisión que presente una nueva propuesta. En tal caso, <mark class=\"m-resp\">el acto propuesto inicialmente se considerará no adoptado</mark>.</p>", true)
  + articuloResp("Artículo 49 TFUE — Derecho de establecimiento", ["agencias, sucursales o filiales","actividades no asalariadas","constitución y gestión de empresas y sociedades"], "<p>En el marco de las disposiciones siguientes, quedarán prohibidas las restricciones a la <mark class=\"m-destacable\">libertad de establecimiento</mark> de los nacionales de un Estado miembro en el territorio de otro Estado miembro. Dicha prohibición se extenderá igualmente a las restricciones relativas a <mark class=\"m-resp\">la apertura de agencias, sucursales o filiales</mark> por los nacionales de un Estado miembro establecidos en el territorio de otro Estado miembro. La libertad de establecimiento comprenderá el acceso a las <mark class=\"m-resp\">actividades no asalariadas</mark> y su ejercicio, así como <mark class=\"m-resp\">la constitución y gestión de empresas</mark> y, especialmente, de sociedades (…).</p>", true)
  + articuloResp("Artículo 50 TFUE — Medidas de establecimiento", ["PE y Consejo mediante directivas, ordinario y previa consulta al CES","eliminando procedimientos y prácticas administrativos"], "<p><b>1.</b> A efectos de alcanzar la libertad de establecimiento en una determinada actividad, <mark class=\"m-resp\">el Parlamento Europeo y el Consejo decidirán, mediante directivas, con arreglo al procedimiento legislativo ordinario y previa consulta al Comité Económico y Social</mark>.</p><p><b>2.</b> El Parlamento Europeo, el Consejo y la Comisión ejercerán las funciones que les atribuyen las disposiciones precedentes, en particular: (…)</p><p><b>c)</b> <mark class=\"m-resp\">eliminando aquellos procedimientos y prácticas administrativos que resulten de la legislación nacional o de acuerdos celebrados con anterioridad entre los Estados miembros, cuyo mantenimiento suponga un obstáculo para la libertad de establecimiento</mark>; (…)</p>", true)
  + articuloResp("Artículos 51 a 55 TFUE — Excepciones, títulos y sociedades", ["ejercicio del poder público","PE y Consejo pueden excluir actividades","orden público, seguridad y salud públicas","diplomas, certificados y otros títulos","médicas, paramédicas y farmacéuticas","equiparadas a personas físicas nacionales","salvo sin fin lucrativo","trato de nacional en la participación financiera"], "<p><b>51.</b> Las disposiciones del presente capítulo <u class=\"m-clave\">no</u> se aplicarán (…) a las actividades que, en dicho Estado, estén relacionadas, <u class=\"m-clave\">aunque sólo sea de manera ocasional</u>, con el <mark class=\"m-resp\">ejercicio del poder público</mark>. <mark class=\"m-resp\">El Parlamento Europeo y el Consejo, con arreglo al procedimiento legislativo ordinario</mark>, podrán <mark class=\"m-accion\">excluir</mark> determinadas actividades de la aplicación de las disposiciones del presente capítulo.</p><p><b>52.1.</b> Las disposiciones del presente capítulo (…) no prejuzgarán la aplicabilidad de las disposiciones (…) que prevean un <mark class=\"m-destacable\">régimen especial para los extranjeros</mark> y que estén justificadas por razones de <mark class=\"m-resp\">orden público, seguridad y salud públicas</mark>.</p><p><b>53.1.</b> A fin de facilitar el acceso a las actividades no asalariadas y su ejercicio, el Parlamento Europeo y el Consejo (…) adoptarán directivas para el <mark class=\"m-resp\">reconocimiento mutuo de diplomas, certificados y otros títulos</mark> (…).</p><p><b>53.2.</b> En cuanto a las profesiones <mark class=\"m-resp\">médicas, paramédicas y farmacéuticas</mark>, la progresiva supresión de las restricciones quedará subordinada a la <mark class=\"m-destacable\">coordinación de las condiciones</mark> exigidas para su ejercicio en los diferentes Estados miembros.</p><p><b>54.</b> Las sociedades constituidas de conformidad con la legislación de un Estado miembro y cuya <mark class=\"m-resp\">sede social, administración central o centro de actividad principal</mark> se encuentre dentro de la Unión quedarán equiparadas (…) a las <mark class=\"m-resp\">personas físicas nacionales de los Estados miembros</mark>. Por sociedades se entiende <mark class=\"m-resp\">las sociedades de Derecho civil o mercantil, incluso las sociedades cooperativas, y las demás personas jurídicas de Derecho público o privado</mark>, con excepción de <mark class=\"m-resp\">las que no persigan un fin lucrativo</mark>.</p><p><b>55.</b> Los Estados miembros aplicarán a los nacionales de los demás Estados miembros el <mark class=\"m-resp\">trato de nacional</mark> en lo que respecta a <mark class=\"m-resp\">su participación financiera en el capital de las sociedades</mark> definidas en el artículo 54 (…).</p>", false)
  + articuloResp("Artículos 56 a 62 TFUE — Servicios · R16", ["quedarán prohibidas las restricciones","extensión a nacionales de terceros Estados establecidos en la Unión","industrial, mercantil, artesanal, profesiones LIBERALES","mismas condiciones que a sus nacionales","transportes: su título","banca y seguros en armonía con los capitales","directivas","recomendaciones de la Comisión","arts. 51 a 54"], "<p><b>56.</b> En el marco de las disposiciones siguientes, <mark class=\"m-resp\">quedarán prohibidas las restricciones a</mark> la <mark class=\"m-destacable\">libre prestación de servicios</mark> dentro de la Unión para los nacionales de los Estados miembros <mark class=\"m-resp\">establecidos en un Estado miembro que no sea el del destinatario</mark> de la prestación. El Parlamento Europeo y el Consejo (…) podrán extender el beneficio de las disposiciones del presente capítulo a los prestadores de servicios que <mark class=\"m-resp\">sean nacionales de un tercer Estado y se hallen establecidos dentro de la Unión</mark>.</p><p><b>57.</b> (…) se considerarán como servicios las prestaciones realizadas normalmente <mark class=\"m-personalizado\">a cambio de una remuneración</mark> (…). Los servicios comprenderán, en particular: a) <mark class=\"m-resp\">actividades de carácter industrial</mark>; b) <mark class=\"m-resp\">actividades de carácter mercantil</mark>; c) <mark class=\"m-resp\">actividades artesanales</mark>; d) <mark class=\"m-resp\">actividades propias de las profesiones liberales</mark>.</p><p>(…) el prestador de un servicio podrá (…) ejercer <mark class=\"m-plazo\">temporalmente</mark> su actividad en el Estado miembro donde se lleve a cabo la prestación, <mark class=\"m-resp\">en las mismas condiciones que imponga ese Estado a sus propios nacionales</mark>.</p><p><b>58.1.</b> La libre prestación de servicios, en materia de transportes, se regirá por <mark class=\"m-resp\">las disposiciones del título relativo a los transportes</mark>.</p><p><b>58.2.</b> La liberalización de los servicios bancarios y de seguros vinculados a los movimientos de capitales se realizará <mark class=\"m-resp\">en armonía con la liberalización de la circulación de capitales</mark>.</p><p><b>59.1.</b> A efectos de alcanzar la liberalización de un servicio determinado, el Parlamento Europeo y el Consejo, con arreglo al procedimiento legislativo ordinario y previa consulta al Comité Económico y Social, decidirán <mark class=\"m-resp\">mediante directivas</mark>.</p><p><b>60.</b> Los Estados miembros <mark class=\"m-resp\">se esforzarán por proceder a una liberalización de los servicios más amplia que la exigida</mark> en virtud de las directivas (…), si su situación económica general y la del sector afectado se lo permiten. <mark class=\"m-resp\">La Comisión dirigirá, a este fin, recomendaciones</mark> a los Estados miembros interesados.</p><p><b>62.</b> Las disposiciones de los <mark class=\"m-resp\">artículos 51 a 54, ambos inclusive</mark>, serán aplicables a las materias reguladas por el presente capítulo.</p>", true)

  + articuloResp("Artículos 63 a 66 TFUE — Capitales y pagos", ["prohibidas restricciones a capitales y a pagos","31-12-1993","Bulgaria, Estonia y Hungría 31-12-1999","Croacia 31-12-2002","retroceso: Consejo, especial, unanimidad, consulta al PE","residencia o lugar de inversión","3 meses → Consejo por unanimidad","salvaguardia: Consejo, propuesta Comisión, consulta BCE, máx. 6 meses"], "<p><b>63.</b> 1. (…) quedan prohibidas todas las restricciones a los movimientos de capitales entre Estados miembros y entre Estados miembros y terceros países. 2. (…) quedan prohibidas cualesquiera <mark class=\"m-resp\">restricciones sobre los pagos entre Estados miembros y entre Estados miembros y terceros países</mark>.</p><p><b>64.1.</b> Lo dispuesto en el artículo 63 se entenderá sin perjuicio de la aplicación a terceros países de las restricciones que existan el <mark class=\"m-resp\">31 de diciembre de 1993</mark> (…). Respecto de las restricciones existentes (…) en Bulgaria, Estonia y Hungría, la fecha aplicable será el <mark class=\"m-plazo\">31 de diciembre de 1999</mark>. Respecto de las restricciones existentes en Croacia (…), la fecha aplicable será el <mark class=\"m-resp\">31 de diciembre de 2002</mark>.</p><p><b>64.3.</b> (…) <u class=\"m-clave\">sólo</u> el <mark class=\"m-resp\">Consejo, con arreglo a un procedimiento legislativo especial, por unanimidad y previa consulta al Parlamento Europeo</mark>, podrá establecer medidas que supongan un <mark class=\"m-destacable\">retroceso</mark> en el Derecho de la Unión respecto de la liberalización de los movimientos de capitales con destino a terceros países o procedentes de ellos.</p><p><b>65.1.a)</b> (…) aplicar las disposiciones pertinentes de su Derecho fiscal que distingan entre contribuyentes cuya situación difiera con respecto a <mark class=\"m-resp\">su lugar de residencia o con respecto a los lugares donde esté invertido su capital</mark>;</p><p><b>65.4.</b> (…) la Comisión o, a falta de una decisión de la Comisión dentro de un período de <mark class=\"m-resp\">tres meses</mark> a partir de la solicitud del Estado miembro interesado, el Consejo, podrá adoptar una decisión que declare que las medidas fiscales restrictivas (…) deben considerarse compatibles con los Tratados (…). El Consejo se pronunciará <mark class=\"m-resp\">por unanimidad</mark> a instancia de un Estado miembro.</p><p><b>66.</b> Cuando en <mark class=\"m-personalizado\">circunstancias excepcionales</mark> los movimientos de capitales con destino a terceros países o procedentes de ellos causen, o amenacen causar, dificultades graves para el funcionamiento de la unión económica y monetaria, <mark class=\"m-resp\">el Consejo, a propuesta de la Comisión y previa consulta al Banco Central Europeo</mark>, podrá adoptar respecto a terceros países, por un plazo que no sea superior a <mark class=\"m-resp\">seis meses</mark>, las <mark class=\"m-destacable\">medidas de salvaguardia</mark> estrictamente necesarias.</p>", true)

  + articuloResp("Artículos 67 a 70 TFUE — Disposiciones generales · R17", ["respeto de los derechos fundamentales y de los sistemas y tradiciones jurídicos","solidaridad entre EM y equitativa con nacionales de terceros países","apátridas = nacionales de terceros países","reconocimiento mutuo en materia CIVIL","orientaciones estratégicas: Consejo Europeo","subsidiariedad: Parlamentos nacionales","evaluación: se informa al PE y a los Parlamentos nacionales"], "<p><b>67.1.</b> La Unión constituye un <mark class=\"m-destacable\">espacio de libertad, seguridad y justicia</mark> <mark class=\"m-resp\">dentro del respeto de los derechos fundamentales y de los distintos sistemas y tradiciones jurídicos de los Estados miembros</mark>.</p><p><b>67.2.</b> Garantizará la ausencia de controles de las personas en las fronteras interiores y desarrollará una política común de asilo, inmigración y control de las fronteras exteriores que esté <mark class=\"m-resp\">basada en la solidaridad entre Estados miembros y sea equitativa respecto de los nacionales de terceros países</mark>. A efectos del presente título, los <mark class=\"m-destacable\">apátridas</mark> se asimilarán a <mark class=\"m-resp\">los nacionales de terceros países</mark>.</p><p><b>67.4.</b> La Unión facilitará la <mark class=\"m-destacable\">tutela judicial</mark>, garantizando en especial el principio de <mark class=\"m-resp\">reconocimiento mutuo de las resoluciones judiciales y extrajudiciales en materia civil</mark>.</p><p><b>68.</b> <mark class=\"m-resp\">El Consejo Europeo</mark> definirá las <mark class=\"m-destacable\">orientaciones estratégicas</mark> de la programación legislativa y operativa en el espacio de libertad, seguridad y justicia.</p><p><b>69.</b> En relación con las propuestas e iniciativas legislativas presentadas en el marco de los capítulos 4 y 5 (cooperación judicial penal y policial), <mark class=\"m-resp\">los Parlamentos nacionales</mark> velarán por que se respete el <mark class=\"m-destacable\">principio de subsidiariedad</mark> (…).</p><p><b>70.</b> (…) el Consejo podrá adoptar, a propuesta de la Comisión, medidas que establezcan los procedimientos que seguirán los Estados miembros para efectuar, en colaboración con la Comisión, una <mark class=\"m-destacable\">evaluación objetiva e imparcial</mark> de la aplicación, por las autoridades de los Estados miembros, de <mark class=\"m-resp\">las políticas de la Unión contempladas en el presente título</mark> (…). Se informará <mark class=\"m-resp\">al Parlamento Europeo y a los Parlamentos nacionales</mark> del contenido y los resultados de esta evaluación.</p>", true)

  + articuloResp("Artículos 71 a 76 TFUE — COSI, orden público y cooperación administrativa", ["comité permanente EN EL CONSEJO (COSI)","cooperación operativa en seguridad interior","orden público y seguridad interior","terrorismo: movimientos de capitales y pagos","art. 74: Consejo, propuesta Comisión, consulta PE","iniciativa: Comisión o la cuarta parte de los EM"], "<p><b>71.</b> Se creará un <mark class=\"m-resp\">comité permanente en el Consejo</mark> con objeto de garantizar dentro de la Unión el fomento y la intensificación de la <mark class=\"m-resp\">cooperación operativa en materia de seguridad interior</mark>. (…) Se mantendrá informados de dichos trabajos al Parlamento Europeo y a los Parlamentos nacionales.</p><p><b>72.</b> El presente título se entenderá sin perjuicio del ejercicio de las responsabilidades que incumben a los Estados miembros en cuanto al <mark class=\"m-resp\">mantenimiento del orden público y la salvaguardia de la seguridad interior</mark>.</p><p><b>74.</b> <mark class=\"m-resp\">El Consejo</mark> adoptará medidas para garantizar la <mark class=\"m-destacable\">cooperación administrativa</mark> entre los servicios competentes de los Estados miembros (…). Se pronunciará <mark class=\"m-resp\">a propuesta de la Comisión, sin perjuicio del artículo 76, y previa consulta al Parlamento Europeo</mark>.</p><p><b>75.</b> (…) en lo que se refiere a la prevención y lucha contra el <mark class=\"m-destacable\">terrorismo</mark> (…), el Parlamento Europeo y el Consejo definirán mediante reglamentos (…) un marco de medidas administrativas sobre <mark class=\"m-resp\">movimiento de capitales y pagos, tales como la inmovilización de fondos, activos financieros</mark> o beneficios económicos (…).</p><p><b>76.</b> Los actos contemplados en los capítulos 4 y 5 (…) se adoptarán: a) a propuesta de la Comisión, o b) por iniciativa de <mark class=\"m-resp\">la cuarta parte de los Estados miembros</mark>.</p>", true)
  + articuloResp("Artículo 77 TFUE — Controles en las fronteras", ["objetivos a), b) y c)","visados de corta duración: PE y Consejo","pasaportes: Consejo, especial, unanimidad, consulta al PE"], "<p><b>1.</b> La Unión desarrollará una política que tendrá por objetivo:</p><p><b>a)</b> <mark class=\"m-resp\">garantizar la ausencia total de controles de las personas, sea cual sea su nacionalidad, cuando crucen las fronteras interiores</mark>;</p><p><b>b)</b> <mark class=\"m-resp\">garantizar los controles de las personas y la vigilancia eficaz en el cruce de las fronteras exteriores</mark>;</p><p><b>c)</b> <mark class=\"m-resp\">instaurar progresivamente un sistema integrado de gestión de las fronteras exteriores</mark>.</p><p><b>2.</b> A efectos del apartado 1, <mark class=\"m-resp\">el Parlamento Europeo y el Consejo</mark> adoptarán, con arreglo al procedimiento legislativo ordinario, medidas relativas a: a) <mark class=\"m-resp\">la política común de visados y otros permisos de residencia de corta duración</mark>; (…)</p><p><b>3.</b> (…) <mark class=\"m-resp\">el Consejo</mark> podrá establecer, con arreglo a un <mark class=\"m-resp\">procedimiento legislativo especial</mark>, disposiciones relativas a los <mark class=\"m-destacable\">pasaportes, documentos de identidad, permisos de residencia</mark> o cualquier otro documento asimilado. El Consejo se pronunciará <mark class=\"m-resp\">por unanimidad, previa consulta al Parlamento Europeo</mark>.</p>", true)
  + articuloResp("Artículos 78 a 80 TFUE — Asilo e inmigración · R18", ["principio de no devolución","Ginebra 28-7-1951 y Protocolo de 31-1-1967","emergencia: Consejo, propuesta Comisión, medidas provisionales, consulta PE","flujos, trato equitativo, prevención inmigración ilegal y trata","mujeres y niños","acuerdos de readmisión","solidaridad y reparto equitativo, también financiero"], "<p><b>78.1.</b> La Unión desarrollará una política común en materia de <mark class=\"m-destacable\">asilo, protección subsidiaria y protección temporal</mark> destinada a ofrecer un estatuto apropiado a todo nacional de un tercer país que necesite protección internacional y a garantizar el respeto del <mark class=\"m-resp\">principio de no devolución</mark>. Esta política deberá ajustarse a la <mark class=\"m-personalizado\">Convención de Ginebra de 28 de julio de 1951</mark> y al <mark class=\"m-resp\">Protocolo de 31 de enero de 1967 sobre el Estatuto de los Refugiados</mark> (…).</p><p><b>78.3.</b> Si uno o varios Estados miembros se enfrentan a una situación de emergencia caracterizada por la <mark class=\"m-personalizado\">afluencia repentina</mark> de nacionales de terceros países, <mark class=\"m-resp\">el Consejo podrá adoptar, a propuesta de la Comisión, medidas provisionales</mark> en beneficio de los Estados miembros afectados. El Consejo se pronunciará <mark class=\"m-resp\">previa consulta al Parlamento Europeo</mark>.</p><p><b>79.1.</b> La Unión desarrollará una política común de inmigración destinada a garantizar, en todo momento, <mark class=\"m-resp\">una gestión eficaz de los flujos migratorios, un trato equitativo de los nacionales de terceros países que residan legalmente en los Estados miembros, así como una prevención de la inmigración ilegal y de la trata de seres humanos y una lucha reforzada contra ambas</mark>.</p><p><b>79.2.d)</b> la lucha contra la trata de seres humanos, en particular de <mark class=\"m-resp\">mujeres y niños</mark>.</p><p><b>79.3.</b> La Unión podrá <mark class=\"m-resp\">celebrar con terceros países acuerdos para la readmisión, en sus países de origen o de procedencia</mark>, de nacionales de terceros países que no cumplan o que hayan dejado de cumplir las condiciones de entrada, presencia o residencia (…).</p><p><b>80.</b> Las políticas de la Unión mencionadas en el presente capítulo y su ejecución se regirán por el <mark class=\"m-resp\">principio de solidaridad y de reparto equitativo de la responsabilidad entre los Estados miembros, también en el aspecto financiero</mark>. (…)</p>", true)
  + articuloResp("Artículo 81 TFUE — Cooperación judicial civil", ["reconocimiento mutuo de resoluciones judiciales y extrajudiciales","Derecho de familia: Consejo, especial, unanimidad, consulta PE","oposición de un Parlamento nacional en 6 meses"], "<p><b>1.</b> La Unión desarrollará una <mark class=\"m-destacable\">cooperación judicial en asuntos civiles</mark> con repercusión transfronteriza, basada en el principio de reconocimiento mutuo de <mark class=\"m-resp\">las resoluciones judiciales y extrajudiciales</mark>. (…)</p><p><b>3.</b> (…) las medidas relativas al <mark class=\"m-destacable\">Derecho de familia</mark> con repercusión transfronteriza se establecerán por el Consejo, con arreglo a un procedimiento legislativo especial. El Consejo se pronunciará <mark class=\"m-resp\">por unanimidad, previa consulta al Parlamento Europeo</mark>. (…) La propuesta (…) se comunicará a los <mark class=\"m-autoridad\">Parlamentos nacionales</mark>. En caso de que <mark class=\"m-resp\">un Parlamento nacional notifique su oposición en los seis meses posteriores a la comunicación</mark>, la decisión <u class=\"m-clave\">no</u> será adoptada. (…)</p>", true)
  + articuloResp("Artículos 82 y 83 TFUE — Cooperación judicial penal", ["medidas a)-d)","freno: remisión al Consejo Europeo","otros elementos: Consejo por unanimidad, previa aprobación del PE","nueve Estados → cooperación reforzada","eurodelitos (no el fraude fiscal)"], "<p><b>82.1.</b> La cooperación judicial en materia penal en la Unión se basará en el principio de <mark class=\"m-destacable\">reconocimiento mutuo</mark> de las sentencias y resoluciones judiciales (…). El Parlamento Europeo y el Consejo adoptarán, con arreglo al procedimiento legislativo ordinario, medidas tendentes a:</p><p><b>a)</b> establecer normas y procedimientos para garantizar el reconocimiento en toda la Unión de las sentencias y resoluciones judiciales en todas sus formas;</p><p><b>b)</b> <mark class=\"m-resp\">prevenir y resolver los conflictos de jurisdicción</mark> entre los Estados miembros;</p><p><b>c)</b> apoyar la formación de magistrados y del personal al servicio de la administración de justicia;</p><p><b>d)</b> facilitar la cooperación entre las autoridades judiciales o equivalentes de los Estados miembros en el marco del <mark class=\"m-resp\">procedimiento penal</mark> y de la ejecución de resoluciones.</p><p><b>82.2.</b> (…) Estas normas se referirán a: a) la admisibilidad mutua de pruebas (…); b) los derechos de las personas durante el procedimiento penal; c) los derechos de las víctimas de los delitos; d) otros elementos específicos del procedimiento penal, que el Consejo habrá determinado previamente mediante una decisión. Para la adopción de esta decisión, el Consejo se pronunciará <mark class=\"m-resp\">por unanimidad, previa aprobación del Parlamento Europeo</mark>.</p><p><b>82.3.</b> Cuando un miembro del Consejo considere que un proyecto de directiva (…) afecta a aspectos fundamentales de su sistema de justicia penal, podrá solicitar que el asunto se remita <mark class=\"m-resp\">al Consejo Europeo</mark> (…). Previa deliberación, y en caso de que se alcance un consenso, el Consejo Europeo, en el plazo de <mark class=\"m-plazo\">cuatro meses</mark> (…), devolverá el proyecto al Consejo (…). Si no hay acuerdo dentro de ese mismo plazo, y al menos <mark class=\"m-resp\">nueve Estados miembros</mark> quieren establecer una <mark class=\"m-destacable\">cooperación reforzada</mark> (…), la autorización (…) se considerará concedida (…).</p><p><b>83.1.</b> El Parlamento Europeo y el Consejo podrán establecer, mediante directivas (…), normas mínimas relativas a la definición de las infracciones penales y de las sanciones en ámbitos delictivos que sean de <mark class=\"m-personalizado\">especial gravedad</mark> y tengan una <mark class=\"m-personalizado\">dimensión transfronteriza</mark> (…). Estos ámbitos delictivos son los siguientes: • el terrorismo, • la trata de seres humanos y la explotación sexual de mujeres y niños, • el tráfico ilícito de drogas, • el tráfico ilícito de armas, • el blanqueo de capitales, • la corrupción, • la falsificación de medios de pago, • la delincuencia informática y • la delincuencia organizada.</p>", true)
