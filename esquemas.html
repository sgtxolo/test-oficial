  + articuloResp("Artículos 1 a 3 — Objeto, referencias y definiciones · R38", ["establece un procedimiento fronterizo de retorno","nacionales de terceros países y apátridas con solicitud denegada en el procedimiento fronterizo de asilo (arts. 43 a 54 del Reglamento 2024/1348)","modifica el Reglamento 2021/1148","medidas del capítulo III: estrictamente requeridas, temporales, limitadas y excepcionales","Estados no vinculados: disposiciones análogas nacionales","definiciones: «solicitud» y «solicitante»"], "<p><b>1.1.</b> El presente Reglamento establece <mark class=\"m-resp\">un procedimiento fronterizo de retorno</mark>. Se aplicará <mark class=\"m-resp\">a los nacionales de terceros países y los apátridas cuya solicitud haya sido denegada en el contexto del procedimiento fronterizo de asilo previsto en los artículos 43 a 54 del Reglamento (UE) 2024/1348</mark> (…). Establece asimismo normas temporales específicas sobre el procedimiento fronterizo de retorno en <mark class=\"m-destacable\">situaciones de crisis</mark> (…). El presente Reglamento también <mark class=\"m-resp\">modifica el Reglamento (UE) 2021/1148</mark> (…).</p><p><b>1.2.</b> Las medidas temporales adoptadas en virtud del capítulo III (…) cumplirán los requisitos de <mark class=\"m-personalizado\">necesidad y proporcionalidad</mark> (…).</p><p><b>1.3.</b> Las medidas del capítulo III del presente Reglamento solo se aplicarán <mark class=\"m-resp\">en la medida estrictamente requerida por las exigencias de la situación, de manera temporal y limitada y únicamente en circunstancias excepcionales</mark>. (…)</p><p><b>2.</b> En el caso de los Estados miembros no vinculados por el Reglamento (UE) 2024/1348, las referencias (…) se entenderán <mark class=\"m-resp\">hechas a las disposiciones análogas que puedan haber introducido en su Derecho nacional</mark>.</p><p><b>3.</b> A los efectos del presente Reglamento, se entenderá por: a) <mark class=\"m-resp\">«solicitud de protección internacional» o «solicitud»</mark> (…); b) <mark class=\"m-resp\">«solicitante»</mark> (…).</p>", false)
  + articuloResp("Artículo 4 — Procedimiento fronterizo de retorno", ["no autorizados a entrar","residencia máxima de doce semanas en la frontera, zonas de tránsito o proximidades","las 12 semanas cuentan desde que ya no hay derecho de permanencia","condiciones de los arts. 19 y 20 de la Directiva 2024/1346","se aplican arts. de la Directiva 2008/115/CE","si no se ejecuta: Directiva 2008/115/CE","salida voluntaria solo previa solicitud y máximo 15 días","excepciones: riesgo de fuga, manifiestamente infundada u orden público","entregar el documento de viaje","denegación de entrada sin aplicar la Directiva: trato conforme al art. 4.4 de la Directiva"], "<p><b>1.</b> Los nacionales de terceros países y los apátridas cuya solicitud haya sido denegada en el contexto del procedimiento fronterizo de asilo <mark class=\"m-resp\">no estarán autorizados a entrar en el territorio del Estado miembro de que se trate</mark>.</p><p><b>2.</b> Los Estados miembros exigirán a las personas a que se refiere el apartado 1 que residan durante un período máximo de <mark class=\"m-resp\">doce semanas</mark> en ubicaciones situadas en la frontera exterior o zonas de tránsito o en sus proximidades. (…) El período de doce semanas comenzará <mark class=\"m-resp\">a partir de la fecha en que el solicitante, nacional de un tercer país o apátrida ya no tenga derecho de permanencia ni autorización para permanecer</mark>. El requisito de residir en una ubicación determinada (…) <u class=\"m-clave\">no</u> se considerará una autorización para entrar o quedarse (…). Las condiciones en dichas ubicaciones cumplirán normas equivalentes a las de <mark class=\"m-resp\">las condiciones materiales de acogida y las de asistencia sanitaria de conformidad con los artículos 19 y 20 de la Directiva (UE) 2024/1346</mark> (…).</p><p><b>3.</b> A los efectos del presente artículo, se aplicarán el artículo 3, el artículo 4, apartado 1, el artículo 5, el artículo 6, apartados 1 a 5, el artículo 7, apartados 2 y 3, los artículos 8 a 11, (…) de <mark class=\"m-resp\">la Directiva 2008/115/CE</mark>.</p><p><b>4.</b> Cuando una decisión de retorno no pueda ejecutarse en el período máximo establecido en el apartado 2, <mark class=\"m-resp\">los Estados miembros proseguirán los procedimientos de retorno de conformidad con la Directiva 2008/115/CE</mark>.</p><p><b>5.</b> (…) se concederá a las personas a que se refiere el apartado 1 un plazo para la <mark class=\"m-destacable\">salida voluntaria</mark>, <u class=\"m-clave\">a menos que</u> <mark class=\"m-resp\">exista riesgo de fuga, o que su solicitud en el contexto del procedimiento fronterizo de asilo haya sido denegada por estar manifiestamente infundada, o que la persona interesada constituya un riesgo para el orden público, la seguridad pública o la seguridad nacional</mark> de los Estados miembros. El plazo de salida voluntaria se concederá <u class=\"m-clave\">únicamente previa solicitud</u> y no excederá de <mark class=\"m-resp\">quince días</mark> ni conferirá derecho a entrar en el territorio (…). A efectos del presente apartado, dichas personas deberán entregar a las autoridades competentes <mark class=\"m-resp\">todo documento de viaje válido que posean, durante el tiempo necesario para evitar su fuga</mark>.</p><p><b>6.</b> Los Estados miembros que (…) dicten una denegación de entrada de conformidad con el artículo 14 del Reglamento (UE) 2016/399 (…) y hayan decidido no aplicar la Directiva 2008/115/CE (…), garantizarán que el trato y el grado de protección (…) sean <mark class=\"m-resp\">conformes con el artículo 4, apartado 4, de la Directiva 2008/115/CE y equivalentes a los establecidos en el apartado 2 del presente artículo y en el artículo 5, apartado 4, del presente Reglamento</mark>.</p>", true)
  + articuloResp("Artículo 5 — Internamiento · R39", ["medida de último recurso, con evaluación individual","internados en el asilo: siguen para impedir la entrada, preparar el retorno o expulsar","no internados: riesgo de fuga, obstaculización u orden público","lo más corto posible y máximo el del art. 4.2","el internamiento consecutivo se incluye en el cómputo de la Directiva","directrices de la Agencia de Asilo antes del 12-12-2024"], "<p><b>1.</b> El internamiento solo podrá imponerse <mark class=\"m-resp\">como medida de último recurso</mark> si se demuestra necesario sobre la base de una <mark class=\"m-personalizado\">evaluación individual</mark> de cada caso y si no pueden aplicarse eficazmente otras medidas menos coercitivas.</p><p><b>2.</b> Las personas (…) que hayan sido internadas durante el procedimiento fronterizo de asilo y ya no tengan derecho de permanencia (…) podrán seguir internadas con el fin de <mark class=\"m-resp\">impedir su entrada en el territorio del Estado miembro de que se trate, de preparar su retorno o de proceder a su expulsión</mark>.</p><p><b>3.</b> Las personas (…) que no hayan sido internadas durante el procedimiento fronterizo de asilo (…) podrán ser internadas <mark class=\"m-resp\">si existe un riesgo de fuga en el sentido de la Directiva 2008/115/CE, si evitan u obstaculizan la preparación del retorno o el proceso de expulsión, o si constituyen un riesgo para el orden público, la seguridad pública o la seguridad nacional</mark>.</p><p><b>4.</b> El período de internamiento será lo más corto posible y se mantendrá únicamente mientras exista una perspectiva razonable de expulsión (…). El período de internamiento <u class=\"m-clave\">no excederá</u> del período a que se refiere el artículo 4, apartado 2 (doce semanas) y, en caso de que se dicte una orden de internamiento consecutivo inmediatamente después (…), dicho período de internamiento <mark class=\"m-resp\">se incluirá en el cómputo de los períodos máximos de internamiento establecidos en el artículo 15, apartados 5 y 6, de la Directiva 2008/115/CE</mark>.</p><p><b>5.</b> A más tardar el <mark class=\"m-resp\">12 de diciembre de 2024</mark>, la <mark class=\"m-autoridad\">Agencia de Asilo de la Unión Europea</mark> (…) elaborará directrices (…) sobre distintas prácticas alternativas al internamiento (…).</p>", true)
  + trampa("Trampa de examen", "El internamiento NO es obligatorio ni automático: es la última opción y exige evaluación individual.")
  + bloqueTitulo("CAPÍTULO III: EXCEPCIONES EN SITUACIONES DE CRISIS")
  + articuloResp("Artículos 6 a 8 — Medidas en situación de crisis", ["prolongar como máximo seis semanas más","también a quien fue denegado antes de la decisión de ejecución del Consejo","límites al acceso de asesores solo si son objetivamente necesarios sin impedirlo gravemente","procedimiento: arts. 2 a 6 y 17.3 y 17.4 del Reglamento 2024/1359","informar de las medidas y su duración en una lengua comprensible"], "<p><b>6.1.</b> En una situación de crisis (…), los Estados miembros podrán: a) como excepción a lo dispuesto en el artículo 4, apartado 2 (…), prolongar por un período adicional máximo de <mark class=\"m-resp\">seis semanas</mark> el plazo máximo durante el cual dichos nacionales de terceros países o apátridas deben mantenerse en las ubicaciones (…); b) (…) establecer que el período de internamiento no exceda del período a que se refiere la letra a) (…).</p><p><b>6.2.</b> El apartado 1 del presente artículo también se aplicará a <mark class=\"m-resp\">los solicitantes (…) cuya solicitud haya sido denegada antes de la adopción de la decisión de ejecución del Consejo a que se refiere el artículo 4, apartado 3, del Reglamento (UE) 2024/1359 y que no tengan derecho de permanencia ni autorización para permanecer una vez adoptada dicha decisión de ejecución</mark>.</p><p><b>6.3.</b> Las organizaciones y personas a las que (…) les esté permitido prestar asesoramiento y consejo tendrán acceso efectivo a los solicitantes que se encuentren en centros de internamiento o en pasos fronterizos. <mark class=\"m-resp\">Los Estados miembros podrán imponer limitaciones a esas actividades en los casos en que (…) dichas limitaciones sean necesarias objetivamente para la seguridad, el orden público o la gestión administrativa del centro de internamiento, siempre y cuando con ello no se limite gravemente ni se imposibilite dicho acceso</mark>.</p><p><b>7.</b> Cuando un Estado miembro considere que se encuentra en una situación de crisis (…), podrá presentar una solicitud para aplicar las excepciones previstas en el artículo 6 (…). Cuando un Estado miembro presente tal solicitud, se aplicarán <mark class=\"m-resp\">los artículos 2 a 6 y el artículo 17, apartados 3 y 4, del Reglamento (UE) 2024/1359</mark>, según proceda. (…)</p><p><b>8.</b> El Estado miembro que aplique la excepción prevista en el artículo 6 informará debidamente a los nacionales de terceros países o apátridas interesados <mark class=\"m-resp\">en una lengua que estos comprendan o cuya comprensión sea razonable suponer, sobre las medidas aplicadas y la duración de estas</mark>.</p>", true)
  + trampa("Trampa de examen", "Plazo normal: 12 semanas. En crisis: + 6 semanas como máximo. Salida voluntaria: 15 días.")
  + articuloResp("Artículos 9 a 14 — Modificación del Reglamento 2021/1148 y disposiciones finales", ["modifica el Reglamento 2021/1148","acciones de solidaridad hasta el 100 %","impugnación por las autoridades públicas según el Derecho nacional","el día del suceso no cuenta","semanas y meses: vencen el día de igual denominación o cifra","si vence en sábado, domingo o festivo: el siguiente día hábil","plan común: 12-9-2024","planes nacionales: 12-12-2024","ejecución: 1-7-2026","informe: 13-6-2028 y cada cinco años","información de los EM: 12-9-2027","vigor a los veinte días","aplicable desde el 12-6-2026"], "<p><b>9.</b> <mark class=\"m-resp\">El Reglamento (UE) 2021/1148</mark> se modifica como sigue: (…) 3. En el artículo 12, se inserta el apartado siguiente: «7 bis. La contribución del presupuesto de la Unión podrá incrementarse hasta <mark class=\"m-resp\">el 100 %</mark> del gasto total subvencionable en el caso de las <mark class=\"m-destacable\">acciones de solidaridad</mark>.»</p><p><b>10.</b> El presente Reglamento se entiende sin perjuicio de <mark class=\"m-resp\">la posibilidad de que las autoridades públicas impugnen resoluciones judiciales o administrativas, tal como lo regule el Derecho nacional</mark>.</p><p><b>11.</b> Todo plazo indicado en el presente Reglamento se calculará del modo siguiente: a) si un plazo (…) debe calcularse a partir del momento en que ocurra un suceso o se efectúe un acto, el día mismo en que ocurra dicho suceso (…) <u class=\"m-clave\">no</u> se incluirá en el plazo en cuestión; b) un plazo expresado en semanas o meses vencerá <mark class=\"m-resp\">al finalizar el día que, en la última semana o en el último mes, tenga la misma denominación o la misma cifra que el día del mes</mark> (…) en que ocurrió el suceso o se efectuó el acto (…); c) los plazos incluirán los sábados, los domingos y los días festivos oficiales (…); cuando un plazo venza un sábado, un domingo o un día festivo oficial, <mark class=\"m-resp\">se computará como último día del plazo el siguiente día hábil</mark>.</p><p><b>12.</b> A más tardar el <mark class=\"m-resp\">12 de septiembre de 2024</mark>, la Comisión (…) presentará al Consejo un <mark class=\"m-destacable\">plan común de ejecución</mark> (…). Sobre la base de ese plan común de ejecución, a más tardar el <mark class=\"m-resp\">12 de diciembre de 2024</mark>, cada Estado miembro establecerá (…) un <mark class=\"m-destacable\">plan nacional de ejecución</mark> (…). Cada Estado miembro completará la ejecución de su plan a más tardar el <mark class=\"m-resp\">1 de julio de 2026</mark>. (…)</p><p><b>13.</b> A más tardar el <mark class=\"m-plazo\">13 de junio de 2028</mark>, y posteriormente <mark class=\"m-resp\">cada cinco años</mark>, la Comisión informará al Parlamento Europeo y al Consejo sobre la aplicación del presente Reglamento (…). Los Estados miembros, a petición de la Comisión, remitirán la información necesaria para la elaboración de su informe a más tardar el <mark class=\"m-resp\">12 de septiembre de 2027</mark>.</p><p><b>14.1.</b> El presente Reglamento entrará en vigor <mark class=\"m-resp\">a los veinte días de su publicación</mark> en el Diario Oficial de la Unión Europea.</p><p><b>14.2.</b> El presente Reglamento será aplicable a partir del <mark class=\"m-resp\">12 de junio de 2026</mark>. (…)</p>", true)
  + bloqueTitulo("4.6 — REGLAMENTO DE EJECUCIÓN (UE) 2021/581 DE LA COMISIÓN, DE 9 DE ABRIL DE 2021: MAPAS DE SITUACIÓN DE EUROSUR (NUEVO, ACTUALIZACIÓN 2026)")
  + articuloResp("Artículos 1 y 2 — Objeto y ámbito de aplicación · R40", ["normas de notificación (tipo de información y plazos)","niveles de información de los mapas","mapas específicos","responsabilidades","seguridad y protección de datos","control de calidad (NO régimen disciplinario)","intercambio de información y cooperación a los fines de EUROSUR"], "<p><b>1.</b> El presente Reglamento establece: a) <mark class=\"m-resp\">las normas para la notificación de información en EUROSUR, incluido el tipo de información que debe facilitarse y los plazos para la notificación de la misma</mark>; b) los detalles de los niveles de información de los mapas de situación; c) las modalidades del establecimiento de mapas de situación específicos; d) las responsabilidades relacionadas con la notificación de información, la gestión de los mapas de situación y el funcionamiento y mantenimiento de los distintos sistemas y redes técnicos (…); e) las normas de seguridad y protección de datos de EUROSUR; f) <mark class=\"m-resp\">mecanismos para garantizar el control de calidad</mark>.</p><p><b>2.</b> El presente Reglamento se aplica <mark class=\"m-resp\">al intercambio de información y la cooperación a los fines de EUROSUR, incluido el conocimiento de la situación y el análisis de riesgos, y del apoyo a la planificación y realización de operaciones de control fronterizo</mark>.</p>", false)
  + trampa("Trampa de examen", "El «régimen disciplinario del personal de la Agencia» NO es objeto de este Reglamento.")
  + articuloResp("Artículo 3 — Definiciones", ["hecho","propietario","indicador e indicador técnico","Centro de Coordinación de Salvamento Marítimo","Centro de Coordinación Internacional","lista de alerta rápida","denegación de entrada","situación operativa (plenamente operativa, funciones operativas limitadas, no disponible)","subnivel"], "<p><b>1.</b> «<mark class=\"m-destacable\">hecho</mark>»: <mark class=\"m-resp\">situación que puede tener repercusiones en las fronteras exteriores, ya sea por lo que respecta a la migración, la delincuencia transfronteriza o la protección y salvamento de las vidas de los migrantes, incluidos los incidentes fronterizos, o que puede afectar al funcionamiento de EUROSUR</mark>, incluidos sus componentes técnicos;</p><p><b>3.</b> «<mark class=\"m-destacable\">propietario</mark>»: <mark class=\"m-resp\">la entidad, agencia u organismo que gestiona el mapa de situación y las notificaciones correspondientes</mark>;</p><p><b>5.</b> «<mark class=\"m-destacable\">indicador</mark>»: medida o valor referido a los hechos o tareas que <mark class=\"m-resp\">describen la situación en las fronteras exteriores</mark> que contribuye al conocimiento de la situación y al análisis de riesgos o que apoya las capacidades de reacción;</p><p><b>6.</b> «<mark class=\"m-destacable\">indicador técnico</mark>»: medida o valor referido a los hechos o tareas que contribuyen al conocimiento de la situación y al análisis de riesgos <mark class=\"m-resp\">relacionados con el funcionamiento de EUROSUR</mark> (…);</p><p><b>7.</b> «<mark class=\"m-destacable\">Centro de Coordinación de Salvamento Marítimo</mark>»: <mark class=\"m-resp\">unidad responsable de promover la organización eficiente de los servicios de búsqueda y salvamento y de coordinar la realización de operaciones de búsqueda y salvamento en una zona de búsqueda y salvamento</mark> (…);</p><p><b>8.</b> «<mark class=\"m-destacable\">vuelo exterior</mark>»: todo vuelo de una aeronave tripulada o no tripulada (…) con origen o destino en los territorios de los Estados miembros, que no sea un vuelo interior (…);</p><p><b>9.</b> «<mark class=\"m-destacable\">Centro de Coordinación Internacional</mark>»: <mark class=\"m-resp\">la estructura establecida para la coordinación de una operación conjunta o una intervención rápida en las fronteras exteriores</mark>;</p><p><b>10.</b> «<mark class=\"m-destacable\">lista de alerta rápida</mark>»: <mark class=\"m-resp\">lista de entidades, activos, comportamientos o perfiles sospechosos establecida sobre la base del análisis de riesgos</mark> con el fin de orientar las capacidades de detección y análisis de riesgos (…) y activar las capacidades de reacción adecuadas;</p><p><b>13.</b> «<mark class=\"m-destacable\">denegación de entrada</mark>»: <mark class=\"m-resp\">la denegación de entrada expedida a un nacional de un tercer país en las fronteras exteriores, de conformidad con el artículo 14 del Reglamento (UE) 2016/399</mark>, por no cumplir todas las condiciones de entrada (…), y al que se haya expedido un <mark class=\"m-resp\">formulario uniforme de denegación de conformidad con el anexo V del Código de Fronteras Schengen</mark>;</p><p><b>16.</b> «<mark class=\"m-destacable\">situación operativa</mark>»: la capacidad de un activo, unidad, sistema o centro para desempeñar su función o funciones operativas, caracterizada como <mark class=\"m-resp\">«plenamente operativa», «funciones operativas limitadas» o «no disponible»</mark>;</p><p><b>17.</b> «<mark class=\"m-destacable\">subnivel</mark>»: <mark class=\"m-resp\">un nivel de información situado debajo del nivel relativo a los hechos, el nivel operativo o el nivel de análisis de riesgos</mark> de un mapa de situación.</p>", false)
  + trampa("Trampa de examen", "INDICADOR = situación en las fronteras exteriores. INDICADOR TÉCNICO = funcionamiento de EUROSUR.")
  + articuloResp("Artículos 4 a 6 — Notificaciones, funciones y vinculaciones", ["finalidad: mapas de situación, análisis de riesgos y capacidad de reacción","datos y metadatos","ocho formas (indicadores, hecho único, activos propios, planes operativos, información medioambiental, análisis de riesgos, solicitudes de información y listas de alerta rápida)","originadores: centros nacionales de coordinación, Agencia y gestores de mapas específicos","propietario: destinatario y responsable del tratamiento","fuentes: arts. 25.2 y 26.2 del Reglamento 2019/1896 o la Agencia","vincular la notificación a los elementos pertinentes"], "<p><b>4.1.</b> Las notificaciones se transmitirán entre dos o más entidades, unidades, organismos o agencias con el fin de <mark class=\"m-resp\">contribuir al establecimiento de los diferentes mapas de situación y al análisis de riesgos o para apoyar las capacidades de reacción</mark>.</p><p><b>4.2.</b> Las notificaciones incluirán: a) <mark class=\"m-resp\">datos que contengan la información básica</mark>, b) <mark class=\"m-resp\">metadatos que contengan información adicional</mark> que contribuya a dar sentido al conjunto de los datos (…).</p><p><b>4.3.</b> Las notificaciones podrán adoptar la forma de: <mark class=\"m-resp\">a) los indicadores (…); b) las notificaciones de hecho único (…); c) las notificaciones de activos propios (…); d) las notificaciones de planes operativos (…); e) las notificaciones de información medioambiental (…); f) las notificaciones de análisis de riesgos (…); g) las solicitudes de información (…); h) las listas de alerta rápida</mark> (…).</p><p><b>5.1.</b> Los centros nacionales de coordinación, la Agencia (…) o las entidades que gestionan los mapas de situación específicos, en lo sucesivo los «<mark class=\"m-resp\">originadores de las notificaciones</mark>», transmitirán las notificaciones en EUROSUR.</p><p><b>5.2.</b> El propietario de los mapas de situación, en lo sucesivo el «propietario», será <mark class=\"m-resp\">el destinatario de la notificación y el responsable de su tratamiento</mark> de conformidad con las normas aplicables.</p><p><b>5.3.</b> Las notificaciones en EUROSUR podrán proceder <mark class=\"m-resp\">de las fuentes nacionales a que se refieren el artículo 25, apartado 2, y el artículo 26, apartado 2, del Reglamento (UE) 2019/1896 o de las fuentes propias de la Agencia</mark>.</p><p><b>6.1.</b> Cuando el originador de una notificación establezca una vinculación entre notificaciones o con otros elementos del mapa de situación (…), <mark class=\"m-resp\">vinculará dicha notificación a los elementos pertinentes</mark>.</p><p><b>6.2.</b> Los propietarios de un mapa de situación podrán añadir o modificar las vinculaciones relacionadas con el mapa de situación que gestionen.</p>", false)
  + articuloResp("Artículos 7 y 8 — Notificación de hechos e indicadores", ["vela cada centro nacional de coordinación","todos los hechos detectados (y movimientos secundarios no autorizados)","la Agencia y los centros internacionales también obligados","indicadores o hecho único (o ambos)","datos de estadísticas, bases de datos de la UE y sistemas de gran magnitud","notificación específica: cambio anómalo o modus operandi","la Agencia con medios propios: notifica e informa a los centros (no aplica el art. 7.1)"], "<p><b>7.1.</b> <mark class=\"m-resp\">Cada centro nacional de coordinación</mark> velará por que las autoridades nacionales (…) notifiquen, en el nivel relativo a los hechos de los mapas de situación pertinentes, <mark class=\"m-resp\">todos los hechos detectados durante la realización de las actividades de control fronterizo, conocimiento de la situación y análisis de riesgos, así como los hechos relacionados con movimientos secundarios no autorizados, cuando estén disponibles</mark>.</p><p><b>7.2.</b> Cuando lleven a cabo tareas de control fronterizo, <mark class=\"m-resp\">la Agencia y, en su caso, los centros de coordinación internacionales</mark> estarán sujetos a la obligación a que se refiere el apartado 1.</p><p><b>7.3.</b> Los hechos en EUROSUR se notificarán en forma de indicadores o mediante notificaciones de hecho único, o de ambas maneras.</p><p><b>8.2.</b> Los datos correspondientes a los indicadores podrán derivarse <mark class=\"m-resp\">de la información y las estadísticas de que dispongan las autoridades nacionales, así como de las búsquedas en las bases de datos pertinentes de la Unión y en sistemas de información de gran magnitud</mark> (…).</p><p><b>8.3.</b> Los indicadores relativos a la circulación transfronteriza ilícita de mercancías (…) se obtendrán <mark class=\"m-resp\">en cooperación con las autoridades nacionales competentes</mark> (…).</p><p><b>8.4.</b> Además de la obligación de notificación (…), el originador de una notificación podrá enviar una notificación específica: a) <mark class=\"m-resp\">para alertar de un cambio anómalo de los valores observados</mark>; b) <mark class=\"m-resp\">para informar sobre el modus operandi o patrón específico que se haya detectado</mark>; c) en caso de que se produzcan las situaciones contempladas en la letra b), la notificación podrá <mark class=\"m-resp\">vincularse a un análisis de riesgos específico</mark>.</p><p><b>8.5.</b> Cuando la Agencia obtenga cualquiera de los indicadores (…) mediante sus propios activos de vigilancia o mediante la cooperación (…), <mark class=\"m-resp\">notificará los indicadores en el mapa de situación europeo e informará de ello a los centros nacionales de coordinación</mark>. En este caso, y por lo que respecta a estos indicadores, <mark class=\"m-resp\">no se aplicará la obligación de notificación de información establecida en el artículo 7, apartado 1</mark>.</p>", false)
  + articuloResp("Artículo 9 — Notificaciones de hecho único", ["reacción oportuna, impacto elevado o muy elevado, o anexo 2","primera notificación en 24 horas","adicionales vinculadas a la NHU y al hecho","descripción de la respuesta de las autoridades","fines de la información adicional","archivo: no tuvo lugar, impacto insuficiente o ya no existe","se almacena y sigue accesible","la Agencia con medios propios: lo notifica en el mapa europeo e informa a los centros"], "<p><b>2.</b> Los hechos únicos se notificarán en EUROSUR siempre que: <mark class=\"m-resp\">a) sea necesaria una reacción oportuna al hecho único de que se trate; b) el hecho único tenga un impacto en las fronteras exteriores elevado o muy elevado; o c) el hecho figure en la lista del anexo 2</mark>.</p><p><b>3.</b> Salvo que se especifique lo contrario en el anexo 2, el originador de la notificación enviará la primera notificación del hecho <mark class=\"m-resp\">a más tardar 24 horas después de que la autoridad competente tenga conocimiento de que el hecho se ha producido o es probable que se produzca</mark>.</p><p><b>4.</b> El originador de la notificación presentará notificaciones adicionales (…) para complementar o actualizar la notificación de hecho único. Estas notificaciones deberán vincularse <mark class=\"m-resp\">a la notificación de hecho único y al hecho notificado en el mapa de situación</mark>.</p><p><b>5.</b> Las notificaciones elaboradas en virtud del presente artículo incluirán <mark class=\"m-resp\">una descripción de la respuesta de las autoridades a los hechos notificados, incluidas las medidas adoptadas o previstas</mark>.</p><p><b>6.</b> Sin perjuicio de la primera respuesta operativa, el propietario de la notificación y su originador podrán solicitar información y análisis de riesgos adicionales (…), con el fin de: <mark class=\"m-resp\">a) completar la información correspondiente al hecho; b) aumentar el nivel de confianza (…); c) actualizar el nivel de impacto atribuido; d) actualizar la situación relacionada con el hecho</mark>.</p><p><b>7.</b> Sobre la base de las notificaciones recibidas, el propietario del mapa de situación podrá <mark class=\"m-accion\">archivar</mark> el hecho cuando se considere que: <mark class=\"m-resp\">a) el supuesto hecho no tuvo lugar; b) el impacto estimado del hecho no justifica la notificación; c) la situación descrita en el hecho ya no existe</mark>. Cuando archive un hecho, el hecho y las diversas notificaciones relacionadas con el mismo <mark class=\"m-resp\">se almacenarán y permanecerán accesibles en el mapa de situación a efectos de análisis de riesgos</mark>.</p><p><b>8.</b> Cuando la Agencia obtenga suficiente información sobre hechos únicos mediante sus propios medios de vigilancia (…), <mark class=\"m-resp\">notificará dicha información en el mapa de situación europeo e informará de ello a los centros nacionales de coordinación</mark>. En este caso, no se aplicará la obligación de notificación establecida en el artículo 7, apartado 1.</p>", false)
  + trampa("Trampa de examen", "Primera notificación de un hecho único: 24 HORAS (no 72).")
  + articuloResp("Artículos 10 a 12 — Activos propios, planes operativos e información medioambiental", ["activos propios: situación operativa de los centros, centros de mando y control, áreas de responsabilidad y unidades","cambio significativo del centro nacional: en tiempo real","planes operativos en el mapa europeo si el impacto es elevado o crítico o hay operaciones conjuntas o intervenciones rápidas","contenido a)-i)","información medioambiental: imágenes en tiempo real, meteorología, oceanografía, productos geoespaciales"], "<p><b>10.2.</b> Las notificaciones de activos propios en EUROSUR incluirán: <mark class=\"m-resp\">a) la situación operativa de los centros nacionales de coordinación (…). Todo cambio significativo en la situación operativa del centro nacional de coordinación se notificará a la Agencia en tiempo real; b) la posición y situación operativa de los centros de mando y control utilizados para las operaciones de control fronterizo; c) las áreas de responsabilidad para la vigilancia de fronteras y las inspecciones en los pasos fronterizos; d) el tipo y distribución de las unidades de control fronterizo y su situación</mark>.</p><p><b>11.2.</b> Los centros nacionales de coordinación y, cuando proceda, los centros de coordinación internacionales, notificarán los planes operativos en el mapa de situación europeo <mark class=\"m-resp\">cuando los niveles de impacto en las secciones fronterizas sean elevados o críticos, o cuando se lleven a cabo operaciones fronterizas conjuntas o intervenciones rápidas en las fronteras</mark>.</p><p><b>11.3.</b> Las notificaciones de planes operativos incluirán: a) una descripción de la situación; b) el objetivo operativo y la duración prevista de la operación; c) la zona geográfica (…); d) una descripción de las tareas, responsabilidades e instrucciones especiales para los equipos y unidades participantes que incluya el modus operandi y los objetivos del despliegue; e) la composición del personal desplegado, incluido el número de miembros del personal desplegados y sus perfiles; f) los planes de mando y control, incluida la situación operativa de los centros de mando y control (…); g) <mark class=\"m-resp\">el equipo técnico que vaya a desplegarse, incluidos los requisitos específicos como las condiciones de uso, la tripulación requerida, el transporte y otros aspectos logísticos</mark>; h) el calendario de las patrullas de vigilancia de fronteras, incluida la zona de patrulla y el número de activos empleados; i) <mark class=\"m-resp\">procedimientos detallados sobre la notificación de hechos</mark>.</p><p><b>12.2.</b> La notificación de información medioambiental en EUROSUR puede incluir: a) imágenes en tiempo real proporcionadas por cámaras de vídeo, sistemas de radar y otros dispositivos de detección; b) observaciones y pronósticos meteorológicos; c) servicios de información oceanográfica y modelos de deriva; d) productos geoespaciales; e) otras imágenes operativas (…).</p>", false)
  + articuloResp("Artículos 13 a 15 — Análisis de riesgos, solicitudes de información y listas de alerta rápida · R41", ["análisis de riesgos: centros nacionales, Agencia y centros internacionales","fines a)-c)","solicitudes: centros nacionales, Agencia o gestores de mapas específicos","pueden estar clasificadas o restringidas","respuesta vinculada a la solicitud original","principio del consentimiento de los originadores","listas de alerta rápida: las establece y mantiene la Agencia","elementos sospechosos y sugerencia de reacción","buques, aeronaves, aeropuertos, puertos y operadores sospechosos"], "<p><b>13.1.</b> <mark class=\"m-resp\">Los centros nacionales de coordinación, la Agencia y, en su caso, los centros internacionales de coordinación</mark> garantizarán la provisión de análisis de riesgos con vistas a actualizar los niveles de análisis de los mapas de situación.</p><p><b>13.2.</b> Las notificaciones de análisis de riesgos incluirán uno o varios de los elementos siguientes: productos analíticos como notas informativas, informes analíticos, análisis de terceros países y perfiles de riesgo, e informes específicos de observación de la Tierra (…).</p><p><b>13.3.</b> Las notificaciones de análisis de riesgos se utilizarán para: <mark class=\"m-resp\">a) facilitar la comprensión de los hechos e incidentes en las fronteras exteriores y, en su caso, su relación con los movimientos secundarios no autorizados (…); b) facilitar la planificación y ejecución específicas de operaciones de control fronterizo; c) el análisis estratégico de riesgos</mark>.</p><p><b>14.1.</b> Cuando sea necesario obtener más notificaciones sobre un hecho específico o actualizar el mapa de situación, <mark class=\"m-resp\">los centros nacionales de coordinación, la Agencia o las entidades que gestionan los mapas de situación específicos</mark> podrán enviar una <mark class=\"m-destacable\">solicitud de información</mark> (…).</p><p><b>14.2.</b> Las solicitudes de información (…) podrán estar sujetas <mark class=\"m-resp\">a un nivel de clasificación o a otras restricciones específicas en materia de política de datos</mark>.</p><p><b>14.3.</b> Las notificaciones de análisis de riesgos en respuesta a una solicitud de información estarán vinculadas a la solicitud de información original.</p><p><b>14.4.</b> <mark class=\"m-resp\">El principio del consentimiento de los originadores</mark> se aplicará tanto a las solicitudes de información como a las notificaciones elaboradas en respuesta a las mismas.</p><p><b>15.1.</b> <mark class=\"m-resp\">La Agencia</mark> establecerá y mantendrá <mark class=\"m-destacable\">listas de alerta rápida</mark> con el fin de mejorar las capacidades de detección y análisis de riesgos de la Guardia Europea de Fronteras y Costas y activar las capacidades de reacción adecuadas.</p><p><b>15.2.</b> Las listas de alerta rápida estarán compuestas por: <mark class=\"m-resp\">a) las entidades, activos, comportamientos o perfiles que, en función del análisis de riesgos, se sospeche que están relacionados con la inmigración ilegal y la delincuencia transfronteriza, o que pueden poner en peligro la seguridad de la vida de los migrantes; b) la sugerencia de una reacción en caso de detección, incluidas las restricciones de la política de datos aplicables a las notificaciones</mark>.</p><p><b>15.3.</b> Las listas de alerta rápida pueden incluir: <mark class=\"m-resp\">a) buques sospechosos; b) aeronaves sospechosas; c) aeropuertos de origen sospechosos (…); d) puertos de origen sospechosos, fondeaderos, atracaderos de espera (…); e) operadores sospechosos</mark>.</p>", false)
  + articuloResp("Artículos 16 y 17 — Niveles de confianza y niveles de impacto", ["el originador evalúa la confianza en los metadatos","criterios: credibilidad, fiabilidad de la fuente y estado de validación","impacto sobre inmigración ilegal, delincuencia transfronteriza y vidas de migrantes","vincular al hecho ya notificado","los propietarios atribuyen o modifican el impacto"], "<p><b>16.1.</b> <mark class=\"m-resp\">El originador de una notificación</mark> de un hecho o de una notificación de análisis de riesgos evaluará el <mark class=\"m-destacable\">nivel de confianza</mark> de la información notificada <mark class=\"m-resp\">como parte de los metadatos</mark> que forman parte de la notificación.</p><p><b>16.2.</b> El nivel de confianza se evaluará sobre la base de los siguientes criterios: <mark class=\"m-resp\">a) la credibilidad de la información notificada; b) la fiabilidad de la fuente; c) el estado de validación de la notificación</mark>.</p><p><b>17.2.</b> El <mark class=\"m-destacable\">nivel de impacto</mark> reflejará el impacto global de la información notificada sobre: <mark class=\"m-resp\">a) la detección y prevención de la inmigración ilegal y la lucha contra la misma; b) la detección y prevención de la delincuencia transfronteriza y la lucha contra la misma; c) la protección y el salvamento de las vidas de los migrantes</mark>.</p><p><b>17.4.</b> Cuando una notificación se refiera a un hecho ya notificado en el mapa de situación, el originador <mark class=\"m-resp\">vinculará la notificación a dicho hecho</mark>.</p><p><b>17.5.</b> <mark class=\"m-resp\">Los propietarios</mark> atribuirán un nivel de impacto a los hechos o los modificarán <mark class=\"m-resp\">sobre la base de las notificaciones recibidas y de su propio análisis de riesgos</mark>.</p>", false)
  + articuloResp("Artículos 18 a 21 — Movimientos secundarios, fronteras marítimas, salvamento y fronteras aéreas", ["movimientos secundarios: subnivel del mapa nacional compartido con la Agencia, hechos únicos e indicadores","buques y vuelos: elusión de controles, contrabando, vidas en peligro o listas de alerta rápida (con restricciones de política de datos)","al centro nacional y, en operación conjunta, al centro internacional","salvamento: al Centro de Coordinación de Salvamento Marítimo e informar al centro nacional","puede no informar si no afecta a migrantes ni a delincuencia","fin de la operación: 24 horas"], "<p><b>18.</b> Cuando se disponga de esta información, los Estados miembros deberán: <mark class=\"m-resp\">a) mostrar el análisis relacionado con movimientos secundarios no autorizados en su territorio en un subnivel específico del mapa de situación nacional que se compartirá con la Agencia; b) notificar hechos únicos relacionados con movimientos secundarios no autorizados (…); c) notificar indicadores específicos relativos a movimientos secundarios no autorizados</mark>.</p><p><b>19.1.</b> Los centros nacionales de coordinación velarán por que las unidades participantes en la vigilancia de las fronteras marítimas notifiquen información sobre buques: <mark class=\"m-resp\">a) que se sospeche que transportan a personas que eluden o pretenden eludir los controles en los pasos fronterizos (…); b) que se sospeche que han sido utilizados para actividades de contrabando por mar (…); c) en los casos en que la vida de los migrantes pueda estar en peligro; d) que figuren en las listas de alerta rápida o que sean objeto de solicitudes de información</mark>. En el caso de las notificaciones relativas a la letra d), la notificación tendrá en cuenta <mark class=\"m-resp\">las restricciones de la política de datos previstas en el artículo 14, apartado 2, y en el artículo 15, apartado 2, letra b)</mark>.</p><p><b>19.2.</b> La unidad participante transmitirá la información <mark class=\"m-resp\">a su propio centro nacional de coordinación y, en el caso de una operación conjunta o una intervención rápida en las fronteras, al centro de coordinación internacional correspondiente</mark> (…).</p><p><b>20.1.</b> (…) las autoridades de los Estados miembros que presten asistencia a cualquier buque o persona que se halle en peligro en el mar (…) transmitirán [la información] <mark class=\"m-resp\">al Centro de Coordinación de Salvamento Marítimo competente e informarán a su centro nacional de coordinación</mark> (…).</p><p><b>20.2.</b> Si las autoridades de los Estados miembros establecen claramente que el incidente de búsqueda y salvamento no está relacionado con la protección y salvamento de la vida de los migrantes o con la delincuencia transfronteriza, <mark class=\"m-resp\">podrán decidir no informar al centro nacional de coordinación</mark>.</p><p><b>20.3.</b> Al llevar a cabo operaciones de vigilancia de las fronteras marítimas y de conformidad con el <mark class=\"m-resp\">Reglamento (UE) nº 656/2014</mark>, la Agencia estará sujeta a la misma obligación a que se refiere el apartado 1.</p><p><b>20.5.</b> Los mapas de situación se actualizarán periódicamente: <mark class=\"m-resp\">a) para apoyar la planificación y realización de la siguiente fase operativa (…); b) para evaluar los niveles de impacto atribuidos (…); c) para actualizar los indicadores pertinentes</mark> (…).</p><p><b>20.6.</b> El centro nacional de coordinación competente informará a la Agencia sobre la finalización de una operación de búsqueda y salvamento <mark class=\"m-resp\">a más tardar en las 24 horas siguientes al término de la operación</mark>.</p><p><b>21.1.</b> Cada centro nacional de coordinación velará por que las agencias y órganos nacionales participantes en la vigilancia de las fronteras aéreas notifiquen los <mark class=\"m-resp\">vuelos externos</mark>: <mark class=\"m-resp\">a) que se sospeche que transportan a personas que eluden o pretenden eludir los controles (…); b) que se sospeche que se utilizan para actividades de contrabando aéreo u otros delitos transfronterizos; c) cuando la vida de migrantes pueda estar en peligro; d) que figuren en las listas de alerta rápida o que sean objeto de solicitudes de información</mark>. (…)</p><p><b>21.3.</b> <mark class=\"m-resp\">El centro nacional de coordinación o el centro internacional de coordinación</mark> actualizarán sus respectivos mapas de situación y notificarán esta información a la Agencia (…).</p>", false)
  + articuloResp("Artículos 22 y 23 — Calidad de los datos y del servicio · R42", ["indicadores de calidad de los datos: los establece y mantiene la Agencia","número y frecuencia, puntualidad, exhaustividad y coherencia","calidad del servicio: art. 23 del Reglamento 2019/1896","indicadores técnicos y requisitos de hecho único","usos: situación en tiempo real, incidentes y fallos, seguridad de los datos","se notifica todo incidente único que afecte a los componentes técnicos o a la seguridad"], "<p><b>22.</b> Para supervisar la calidad de los datos en EUROSUR, <mark class=\"m-resp\">la Agencia</mark> establecerá y mantendrá los siguientes indicadores: <mark class=\"m-resp\">a) el número y la frecuencia de las notificaciones recibidas por sección de frontera y por paso fronterizo, b) la puntualidad de las notificaciones, c) la exhaustividad y coherencia de las notificaciones</mark>.</p><p><b>23.1.</b> Para controlar el funcionamiento técnico y operativo de EUROSUR de conformidad con <mark class=\"m-resp\">el artículo 23</mark> del Reglamento (UE) 2019/1896, la Agencia, en estrecha cooperación con las autoridades nacionales competentes, podrá establecer <mark class=\"m-resp\">indicadores técnicos y requisitos para la notificación de hechos únicos</mark> (…).</p><p><b>23.2.</b> Los indicadores se utilizarán: <mark class=\"m-resp\">a) para supervisar la situación de los diversos componentes técnicos de EUROSUR en tiempo real; b) para apoyar la identificación y respuesta a incidentes y fallos detectados en el funcionamiento de EUROSUR; c) para garantizar la seguridad de los datos de EUROSUR</mark>.</p><p><b>23.3.</b> Los Estados miembros y la Agencia notificarán cualquier incidente único que afecte a los componentes técnicos de EUROSUR o a la seguridad de los datos de EUROSUR.</p>", false)
  + bloqueTitulo("CAPÍTULO II: MAPAS DE SITUACIÓN")
  + articuloResp("Artículos 24 a 26 — Estructura, gestión y mapas de situación específicos", ["subnivel de movimientos secundarios: obligatorio en el mapa europeo y, si hay información, en el nacional y el específico","subniveles técnicos del nivel operativo a)-e)","otros subniveles para facilitar la visualización","documento con niveles, subniveles y política de datos","obligaciones del propietario a)-h)","armonización y contenido de los mapas específicos"], "<p><b>24.1.</b> El nivel relativo a los hechos y el nivel analítico del mapa de situación europeo contendrán <mark class=\"m-resp\">un subnivel sobre movimientos secundarios no autorizados</mark>. <mark class=\"m-resp\">Cuando se disponga de ellos</mark>, el nivel relativo a los hechos y el nivel analítico del mapa de situación nacional y del mapa de situación específico contendrán también subniveles sobre movimientos secundarios no autorizados (…).</p><p><b>24.2.</b> El nivel operativo del mapa de situación europeo contendrá subniveles sobre el funcionamiento técnico de EUROSUR. En dichos subniveles se describirán: <mark class=\"m-resp\">a) la situación operativa de los centros nacionales de coordinación y de los centros internacionales de coordinación; b) los principales elementos técnicos que contribuyen al funcionamiento de EUROSUR y la situación en la que se encuentran; c) la calidad de los datos y la calidad del servicio en EUROSUR; d) los incidentes y los hechos que afecten al funcionamiento técnico de EUROSUR; e) los incidentes relacionados con la seguridad de los datos</mark>.</p><p><b>24.3.</b> El mapa de situación incluirá <mark class=\"m-resp\">otros subniveles específicos de información para facilitar a los usuarios la visualización de la información</mark>.</p><p><b>24.4.</b> Todos los mapas de situación se establecerán en un documento en el que se especifiquen <mark class=\"m-resp\">el nivel y subniveles y la política de datos aplicable</mark>.</p><p><b>25.</b> El propietario del mapa de situación deberá: a) <mark class=\"m-resp\">realizar el tratamiento de las notificaciones recibidas</mark>; b) establecer y mantener el nivel relativo a los hechos (…) y atribuir los niveles de impacto y de confianza correspondientes; c) establecer y mantener el nivel operativo (…) sobre la base de las notificaciones de activos propios y las notificaciones de planes operativos; d) establecer y mantener el nivel analítico (…) sobre la base de las notificaciones de análisis de riesgos (…); e) establecer y mantener los vínculos entre los distintos elementos del mapa de situación (…); f) gestionar el acceso de los usuarios al mapa de situación y contribuir a la seguridad de los datos de EUROSUR; g) <mark class=\"m-resp\">transmitir las notificaciones pertinentes y la información necesaria a los propietarios de otros mapas de situación</mark>, de conformidad con el capítulo 1; h) archivar y suprimir la información pertinente de conformidad con la política de datos aplicable.</p><p><b>26.1.</b> Al establecer un <mark class=\"m-destacable\">mapa de situación específico</mark> (…), los Estados miembros y la Agencia garantizarán la armonización con: a) los principios relativos a la notificación de información establecidos en el capítulo I; b) los requisitos relativos a la estructura y la gestión de los mapas de situación (…); c) los principios (…) establecidos en el capítulo III.</p><p><b>26.2.</b> Las normas para establecer y compartir un mapa de situación específico deberán incluir: a) el contenido y el alcance del mapa de situación específico (…); b) (…) i) el propietario; ii) los órganos, organismos y agencias que pueden originar las notificaciones (…); c) las normas para el intercambio de información con los demás usuarios de EUROSUR (…).</p>", false)
  + trampa("Trampa de examen", "El propietario NO fija sanciones penales. En el mapa EUROPEO el subnivel de movimientos secundarios es obligatorio; en el nacional y el específico, solo «cuando se disponga» de la información.")
  + bloqueTitulo("CAPÍTULO III: COMPONENTES TÉCNICOS, SEGURIDAD Y PROTECCIÓN DE DATOS")
  + articuloResp("Artículos 27 a 30 — Componentes técnicos y responsabilidades", ["componentes nacionales y un componente europeo","nacional: sistemas y redes de los EM e interconexiones","europeo: complementa, interconexión, red de comunicación y sistemas de la Agencia","la Agencia gestiona el componente europeo (normas técnicas, certificación, servicios, notificación, seguridad)","cada EM gestiona su componente nacional","centro nacional: coordinación, control de calidad e información operativa","componente externo: intercambia datos o apoya un mapa específico","su interconexión se especifica en las normas del mapa específico"], "<p><b>27.1.</b> Los componentes técnicos de EUROSUR incluirán <mark class=\"m-resp\">componentes nacionales y un componente europeo</mark>.</p><p><b>27.2.</b> Cada componente nacional estará formado por <mark class=\"m-resp\">los sistemas y redes nacionales utilizados por los Estados miembros para el establecimiento de los mapas de situación, la notificación de información, el conocimiento de la situación y el análisis de riesgos</mark> (…), incluidos la infraestructura, la organización, el personal y los recursos de información necesarios para apoyarlas. <mark class=\"m-resp\">Las interconexiones entre los componentes dentro de un Estado miembro, así como entre Estados miembros, formarán parte de los componentes nacionales</mark>.</p><p><b>27.3.</b> <mark class=\"m-resp\">El componente europeo complementará los componentes nacionales. Incluirá la interconexión con los componentes nacionales. Comprenderá la red de comunicación y los sistemas y redes utilizados por la Agencia</mark> (…).</p><p><b>28.</b> <mark class=\"m-resp\">La Agencia</mark> será responsable de la gestión del componente europeo, que incluirá: a) <mark class=\"m-resp\">la definición de normas técnicas para la interconexión de las redes, sistemas, aplicaciones y equipos de los componentes nacionales y externos con los del componente europeo</mark>; b) el proceso de certificación de las redes, sistemas, aplicaciones y equipos (…); c) la gestión de los servicios de los sistemas y redes utilizados por la Agencia (…); d) <mark class=\"m-resp\">la notificación de los aspectos relativos al funcionamiento, el servicio de calidad y la gestión del servicio</mark> de los sistemas y redes (…), según lo dispuesto en el artículo 23; e) la seguridad de los datos del componente europeo.</p><p><b>29.1.</b> Cada Estado miembro será responsable de: a) <mark class=\"m-resp\">gestionar su componente nacional, incluida la gestión del servicio</mark> (…); b) <mark class=\"m-resp\">notificar los aspectos relativos al funcionamiento, la calidad del servicio y la gestión del servicio</mark> (…); c) <mark class=\"m-resp\">cumplir las normas técnicas establecidas por la Agencia</mark>; d) <mark class=\"m-resp\">garantizar la seguridad de los datos del componente nacional</mark>.</p><p><b>29.2.</b> El centro nacional de coordinación deberá: <mark class=\"m-resp\">a) apoyar la coordinación, planificación y ejecución del componente nacional; b) contribuir al control periódico de la calidad del servicio y de los datos, e informar de ello a la Agencia; c) garantizar la notificación de información operativa relativa a los sistemas y redes del componente europeo</mark>.</p><p><b>30.1.</b> Un <mark class=\"m-destacable\">componente externo</mark> de EUROSUR estará compuesto por <mark class=\"m-resp\">los sistemas y redes (…) que no formen parte de EUROSUR y que: a) intercambien datos e información con EUROSUR; b) apoyen el establecimiento de un mapa de situación específico</mark>.</p><p><b>30.2.</b> La interconexión de un componente externo con EUROSUR pertenece al componente externo. Se especificará <mark class=\"m-resp\">en las normas por las que se establezca el mapa de situación específico pertinente</mark>.</p>", false)
  + articuloResp("Artículos 31 a 33 — Seguridad de los datos de EUROSUR", ["incluye garantía de la información, seguridad física, personal e industrial","contenido a)-h)","seguridad general: la Agencia","componente europeo: la Agencia","componente nacional: cada EM","armonización horizontal sobre gestión de riesgos","componente externo: acuerdos y planes del mapa específico","normas de requisitos funcionales y de garantía: la Agencia","incidentes de seguridad: se notifican como calidad de datos y servicio","riesgo para la seguridad: el director ejecutivo puede desconectar sistemas","protección al menos equivalente a las Decisiones 2015/444 y 2015/443","terceros países solo con normas equivalentes, reconocibles por acuerdo"], "<p><b>31.1.</b> La seguridad de los datos de EUROSUR abarcará la gestión y las actividades técnicas necesarias para lograr un nivel adecuado de protección (…). La seguridad de los datos de EUROSUR incluirá <mark class=\"m-resp\">la garantía de la información, la seguridad física, la seguridad personal y la seguridad industrial</mark>.</p><p><b>31.2.</b> La seguridad de los datos de EUROSUR comprenderá: <mark class=\"m-resp\">a) la gestión de riesgos para la seguridad (…); b) la continuidad de la actividad y la recuperación en caso de catástrofe (…); c) la respuesta a incidentes de seguridad (…); d) la acreditación de seguridad; e) el control del acceso de los usuarios</mark>; f) (…) la planificación de las operaciones fronterizas (…); g) los aspectos de seguridad de las interconexiones de los componentes; h) el tratamiento de información clasificada a efectos de EUROSUR.</p><p><b>32.1.</b> <mark class=\"m-resp\">La Agencia</mark> garantizará la seguridad general de EUROSUR (…).</p><p><b>32.2.</b> La Agencia será responsable de <mark class=\"m-resp\">la seguridad de los datos del componente europeo</mark>.</p><p><b>32.3.</b> Cada Estado miembro será responsable de <mark class=\"m-resp\">la seguridad de los datos de su componente nacional</mark>.</p><p><b>32.4.</b> La Agencia y los Estados miembros garantizarán <mark class=\"m-resp\">la armonización de los controles, los procesos y los planes, de modo que la seguridad de los datos de EUROSUR quede garantizada horizontal y eficazmente, sobre la base de un proceso global de gestión de riesgos para la seguridad</mark>.</p><p><b>32.5.</b> Las responsabilidades en materia de seguridad de los datos del componente externo se fijarán <mark class=\"m-resp\">en los acuerdos, disposiciones y planes operativos que establezca el mapa de situación específico</mark>, de conformidad con lo dispuesto en el artículo 26.</p><p><b>32.6.</b> La Agencia adoptará <mark class=\"m-resp\">normas que establezcan los requisitos funcionales de seguridad y los requisitos de garantía de la seguridad para controlar el acceso a las tecnologías que proporcionan seguridad a EUROSUR y el manejo de las mismas</mark>.</p><p><b>32.8.</b> Cada uno de los Estados miembros y la Agencia notificarán en EUROSUR <mark class=\"m-resp\">cualquier incidente de seguridad que afecte a la seguridad de los datos de EUROSUR como parte de la notificación de información relativa a la calidad de los datos y la calidad del servicio</mark>.</p><p><b>32.9.</b> Cuando la seguridad de la Unión o de sus Estados miembros pueda verse afectada por el funcionamiento de EUROSUR: a) la Agencia informará inmediatamente a los centros nacionales de coordinación pertinentes, b) el <mark class=\"m-autoridad\">director ejecutivo</mark> de la Agencia podrá decidir adoptar <mark class=\"m-resp\">cualquier medida adecuada para remediar la situación, en estrecha coordinación con los Estados miembros afectados, incluida la desconexión de determinados sistemas y redes del componente europeo</mark> de EUROSUR.</p><p><b>33.1.</b> (…) los Estados miembros y la Agencia velarán por que existan controles, procesos y planes de seguridad que garanticen un grado de protección al menos equivalente al garantizado por las normas de seguridad de la Comisión establecidas en <mark class=\"m-resp\">la Decisión (UE, Euratom) 2015/444 (…) y en la Decisión (UE, Euratom) 2015/443</mark>.</p><p><b>33.2.</b> Los Estados miembros informarán <mark class=\"m-plazo\">inmediatamente</mark> a la Comisión y a la Agencia de la adopción de las normas de seguridad nacionales pertinentes para EUROSUR (…).</p><p><b>33.3.</b> Las personas físicas residentes en terceros países y las entidades jurídicas establecidas en terceros países podrán tratar los datos de EUROSUR <mark class=\"m-resp\">únicamente cuando estén sujetas, en dichos países, a normas de seguridad que garanticen un grado de protección al menos equivalente</mark> al garantizado por las normas equivalentes en materia de seguridad de la Comisión.</p><p><b>33.4.</b> La equivalencia de las normas de seguridad aplicadas en un tercer país podrá reconocerse <mark class=\"m-resp\">en un acuerdo celebrado con ese país</mark>.</p>", false)
  + articuloResp("Artículos 34 a 37 — Acreditación de seguridad y Consejo de Acreditación · R43", ["responsabilidad colectiva y decisiones consensuadas","normas de seguridad y especialistas cualificados con habilitación","decisiones independientes de la Agencia y de los responsables nacionales","Consejo de Acreditación de Seguridad de EUROSUR dentro de la Agencia","define y aprueba la estrategia de acreditación","riesgo residual","calendario de acreditación","independencia","un representante por EM y dos de la Comisión","secretario: el responsable de seguridad de la Agencia","sin consenso: mayoría","subgrupos","informa al consejo de administración, al director ejecutivo y a la Comisión","obligaciones de los EM y del director ejecutivo"], "<p><b>34.</b> Las actividades de acreditación de seguridad se llevarán a cabo de conformidad con los siguientes principios: a) <mark class=\"m-resp\">las actividades y las decisiones en materia de acreditación de seguridad se llevarán a cabo en un contexto de responsabilidad colectiva respecto de la seguridad de la Unión y de sus Estados miembros</mark>; b) <mark class=\"m-resp\">se procurará alcanzar decisiones consensuadas</mark> (…); c) <mark class=\"m-resp\">las tareas se llevarán a cabo acatando las normas de seguridad y acreditación pertinentes</mark> (…); (…) f) <mark class=\"m-resp\">las actividades técnicas de acreditación de seguridad se encomendarán a especialistas con la debida cualificación</mark> para la acreditación de sistemas complejos, <mark class=\"m-resp\">que dispongan de una habilitación de seguridad del nivel adecuado y actúen de manera objetiva</mark>; g) las decisiones de acreditación de seguridad se adoptarán <mark class=\"m-resp\">con independencia de la Agencia y de las entidades responsables de la aplicación de los componentes nacionales de EUROSUR</mark>; la autoridad de acreditación de seguridad (…) será un organismo autónomo dentro de la Agencia (…); (…)</p><p><b>35.1.</b> Se crea un <mark class=\"m-resp\">Consejo de Acreditación de Seguridad de EUROSUR</mark> (el Consejo de Acreditación) <mark class=\"m-personalizado\">dentro de la Agencia</mark>.</p><p><b>35.2.</b> Como autoridad de acreditación de seguridad de EUROSUR, el Consejo de Acreditación será responsable de: a) <mark class=\"m-resp\">definir y aprobar una estrategia de acreditación de seguridad para EUROSUR, incluido el componente europeo</mark>; (…) k) sobre la base de las notificaciones de riesgos para la seguridad, <mark class=\"m-resp\">informar a la Agencia de su evaluación de riesgos y asesorarla sobre las opciones de tratamiento del riesgo de seguridad residual</mark> para una determinada decisión de acreditación de seguridad; (…)</p><p><b>35.3.</b> En la estrategia de acreditación de seguridad (…), el Consejo de Acreditación establecerá lo siguiente: (…) d) <mark class=\"m-resp\">un calendario de acreditación que cumpla con el despliegue de las normas de EUROSUR, en particular por lo que se refiere a despliegue de la infraestructura, prestación de servicios y evolución</mark>; (…)</p><p><b>35.4.</b> El Consejo de Acreditación desempeñará sus funciones <mark class=\"m-resp\">con independencia a la hora de tratar los expedientes, realizar auditorías de seguridad del sistema, preparar decisiones y organizar sus reuniones</mark>.</p><p><b>36.1.</b> El Consejo de Acreditación estará compuesto por <mark class=\"m-resp\">un representante de cada Estado miembro y dos representantes de la Comisión</mark>.</p><p><b>36.2.</b> <mark class=\"m-resp\">El responsable de seguridad de la Agencia</mark> será un secretario designado del Consejo de Acreditación.</p><p><b>36.3.</b> El Consejo de Acreditación establecerá su reglamento interno y nombrará a su presidente.</p><p><b>36.4.</b> Si no hay consenso, el Consejo de Acreditación <mark class=\"m-resp\">recurrirá al voto por mayoría</mark>.</p><p><b>36.5.</b> El Consejo de Acreditación podrá crear <mark class=\"m-resp\">subgrupos</mark> para investigar cuestiones técnicas.</p><p><b>36.6.</b> El Consejo de Acreditación mantendrá informados de sus decisiones <mark class=\"m-resp\">al Consejo de Administración de la Agencia, al director ejecutivo de la Agencia y a la Comisión</mark>.</p><p><b>37.</b> Los Estados miembros y el director ejecutivo de la Agencia: <mark class=\"m-resp\">a) transmitirán al Consejo de Acreditación toda la información que consideren pertinente a efectos de la acreditación de seguridad; b) permitirán el acceso de personas debidamente autorizadas (…) a cualquier información clasificada y a cualquier área o lugar relacionado con la seguridad de sistemas sujetos a su jurisdicción (…); c) serán responsables de la acreditación de sus componentes de EUROSUR</mark> y, a tal fin, informarán al Consejo de Acreditación.</p>", false)
  + articuloResp("Artículos 38 a 41 — Acceso de usuarios, componentes externos, protección de datos y entrada en vigor", ["acceso: la entidad responsable del componente","personal nacional en sistemas de la Agencia: coordina la Agencia con el centro nacional","personal de la Agencia en sistemas nacionales: coordina el EM con el director ejecutivo","componentes externos solo con seguridad equivalente","interconexión: aprobación previa del Consejo de Acreditación","no se identifica a personas","otros datos personales (no buques y aeronaves): supresión al cumplirse el fin","vigor a los veinte días"], "<p><b>38.1.</b> (…) <mark class=\"m-resp\">la entidad responsable de un componente de EUROSUR</mark> gestionará el acceso de los usuarios a las redes y aplicaciones de sus sistemas.</p><p><b>38.2.</b> Cuando un miembro del personal nacional tenga acceso directo a un sistema o aplicación de la Agencia (…), <mark class=\"m-resp\">la Agencia coordinará los derechos de acceso con el centro nacional de coordinación pertinente</mark>.</p><p><b>38.3.</b> Cuando un miembro del personal de la Agencia tenga acceso directo a un sistema o aplicación nacional (…), <mark class=\"m-resp\">el Estado miembro responsable</mark> coordinará los derechos de acceso con el director ejecutivo de la Agencia.</p><p><b>39.1.</b> Los componentes externos solo podrán conectarse a EUROSUR <mark class=\"m-resp\">si su seguridad de los datos es equivalente a la seguridad de los datos de EUROSUR</mark>.</p><p><b>39.2.</b> Las normas para establecer y compartir un mapa de situación específico (…) incluirán disposiciones sobre la seguridad de los datos, especificando el tipo de información que puede intercambiarse y el nivel de clasificación.</p><p><b>39.3.</b> Toda interconexión de un componente externo con EUROSUR estará sujeta a <mark class=\"m-resp\">la aprobación previa del Consejo de Acreditación</mark>.</p><p><b>40.1.</b> Aunque los datos tratados por EUROSUR pueden contener excepcionalmente información relativa a personas físicas indirectamente identificables, <mark class=\"m-resp\">tales datos no se tratarán en el marco de EUROSUR para identificar a dichas personas físicas</mark>.</p><p><b>40.2.</b> Cuando el tratamiento de información en EUROSUR requiera excepcionalmente el tratamiento de datos personales distintos de los números de identificación de buques y aeronaves, tales datos personales se suprimirán <mark class=\"m-resp\">tan pronto como se haya cumplido el propósito para el que se hayan recopilado</mark>.</p><p><b>41.</b> El presente Reglamento entrará en vigor <mark class=\"m-resp\">a los veinte días de su publicación</mark> en el Diario Oficial de la Unión Europea. (…) Hecho en Bruselas, el 9 de abril de 2021.</p>", false)
  + bloqueTitulo("AMPLIACIONES DEL TEMA 4 (APARTADOS QUE TAMBIÉN PREGUNTAN LOS TESTS)")
  + articuloResp("CFS arts. 13.5, 17.3, 30 y 34 — Normas mínimas de vigilancia, cooperación operativa, criterios del art. 29 e información al público", ["normas mínimas: tipo de fronteras y niveles de impacto del art. 34 del Reglamento 2019/1896","cooperación de carácter operativo si complementa la actividad de la Agencia","la Comisión puede pedir información y hacer visitas in situ","la Comisión y el EM informan al público de manera coordinada"], "<p><b>13.5.</b> La Comisión estará facultada para adoptar actos delegados (…) en lo referente a medidas adicionales que regulen la vigilancia, incluido el desarrollo de normas mínimas comunes para la vigilancia de las fronteras. Dichas normas mínimas comunes tendrán en cuenta <mark class=\"m-resp\">el tipo de fronteras, es decir terrestres, marítimas o aéreas, los niveles de impacto atribuidos a cada sección de la frontera exterior de conformidad con el artículo 34 del Reglamento (UE) 2019/1896</mark> (…) y otros factores pertinentes, como las particularidades geográficas.</p><p><b>17.3.</b> Sin perjuicio de las competencias de la Agencia, los ESTADOS MIEMBROS podrán mantener en las fronteras exteriores, tanto entre sí como con terceros países, <mark class=\"m-resp\">cooperación de carácter operativo</mark>, incluido el intercambio de funcionarios de enlace, si dicha cooperación <mark class=\"m-resp\">complementa la actividad de la Agencia</mark>. Los Estados miembros se abstendrán de toda actividad que pueda comprometer el funcionamiento o la realización de los objetivos de la Agencia. Los Estados miembros informarán a la Agencia sobre la cooperación operativa (…).</p><p><b>30.2.</b> Antes de adoptar una propuesta de recomendación del Consejo con arreglo a lo dispuesto en el artículo 29, apartado 2, la Comisión podrá: a) solicitar información adicional a los Estados miembros, a la Agencia, a Europol o a otros organismos (…); b) <mark class=\"m-resp\">efectuar visitas in situ, con el apoyo de expertos de los Estados miembros y de la Agencia, de Europol</mark> o de cualquier otro organismo, oficina o agencia pertinentes de la Unión (…).</p><p><b>34.</b> <mark class=\"m-resp\">La Comisión y el Estado miembro interesado informarán al público de manera coordinada</mark> sobre toda decisión de restablecer los controles fronterizos en las fronteras interiores, e indicarán en particular la fecha del comienzo y del fin de dicha medida, <u class=\"m-clave\">salvo</u> que existan razones esenciales de seguridad que lo desaconsejen.</p>", true)

  + articuloResp("Artículo 6 — Carta de Derechos Fundamentales y CEDH", ["Carta de 7-12-2000 adaptada 12-12-2007 en Estrasburgo","mismo valor jurídico que los Tratados","no amplía competencias","la Unión se adherirá al CEDH","CEDH y tradiciones = principios generales"], "<p><b>1.</b> La Unión <mark class=\"m-accion\">reconoce</mark> los derechos, libertades y principios enunciados en la <mark class=\"m-destacable\">Carta de los Derechos Fundamentales</mark> de la Unión Europea <mark class=\"m-resp\">de 7 de diciembre de 2000, tal como fue adaptada el 12 de diciembre de 2007 en Estrasburgo</mark>, la cual tendrá el <mark class=\"m-resp\">mismo valor jurídico que los Tratados</mark>. Las disposiciones de la Carta <mark class=\"m-resp\">no ampliarán en modo alguno las competencias de la Unión</mark> tal como se definen en los Tratados. (…)</p><p><b>2.</b> La Unión <mark class=\"m-resp\">se adherirá al Convenio Europeo</mark> para la Protección de los Derechos Humanos y de las Libertades Fundamentales. Esta adhesión <u class=\"m-clave\">no modificará</u> las competencias de la Unión que se definen en los Tratados.</p><p><b>3.</b> Los derechos fundamentales que garantiza el <mark class=\"m-destacable\">Convenio Europeo</mark> (…) y los que son fruto de las <mark class=\"m-personalizado\">tradiciones constitucionales comunes</mark> a los Estados miembros formarán parte del Derecho de la Unión como <mark class=\"m-resp\">principios generales</mark>.</p>", true)
  + articuloResp("Artículo 7 — Riesgo y violación de los valores del art. 2", ["riesgo claro: Consejo, 4/5, propuesta 1/3 EM, PE o Comisión, previa aprobación PE","violación grave y persistente: Consejo Europeo por unanimidad","suspensión de derechos: Consejo por mayoría cualificada","obligaciones siguen vinculando","votos: art. 354 TFUE"], "<p><b>1.</b> A propuesta motivada de <mark class=\"m-resp\">un tercio de los Estados miembros, del Parlamento Europeo o de la Comisión</mark>, el <mark class=\"m-autoridad\">Consejo</mark>, por mayoría de <mark class=\"m-resp\">cuatro quintos</mark> de sus miembros y <u class=\"m-clave\">previa</u> <mark class=\"m-accion\">aprobación</mark> del <mark class=\"m-autoridad\">Parlamento Europeo</mark>, podrá <mark class=\"m-accion\">constatar</mark> la existencia de un <mark class=\"m-destacable\">riesgo claro de violación grave</mark> por parte de un Estado miembro de los valores contemplados en el artículo 2. Antes de proceder a esta constatación, el Consejo <mark class=\"m-resp\">oirá al Estado miembro</mark> de que se trate y por el mismo procedimiento <mark class=\"m-resp\">podrá dirigirle recomendaciones</mark>.</p><p>El Consejo <mark class=\"m-accion\">comprobará</mark> de manera <mark class=\"m-plazo\">periódica</mark> si los motivos que han llevado a tal constatación siguen siendo válidos.</p><p><b>2.</b> El <mark class=\"m-resp\">Consejo Europeo, por unanimidad</mark> y a propuesta de <mark class=\"m-plazo\">un tercio</mark> de los Estados miembros o de la <mark class=\"m-autoridad\">Comisión</mark> y <u class=\"m-clave\">previa</u> aprobación del <mark class=\"m-autoridad\">Parlamento Europeo</mark>, podrá <mark class=\"m-accion\">constatar</mark> la existencia de una <mark class=\"m-destacable\">violación grave y persistente</mark> por parte de un Estado miembro de los valores contemplados en el artículo 2 tras <mark class=\"m-accion\">invitar</mark> al Estado miembro de que se trate a que presente sus <mark class=\"m-personalizado\">observaciones</mark>.</p><p><b>3.</b> Cuando se haya efectuado la constatación contemplada en el apartado 2, el <mark class=\"m-autoridad\">Consejo</mark> podrá decidir, por <mark class=\"m-resp\">mayoría cualificada</mark>, que se <mark class=\"m-accion\">suspendan</mark> determinados derechos derivados de la aplicación de los Tratados al Estado miembro de que se trate, <mark class=\"m-personalizado\">incluidos los derechos de voto</mark> del representante del Gobierno de dicho Estado miembro en el Consejo. (…) Las <mark class=\"m-resp\">obligaciones del Estado miembro</mark> de que se trate derivadas de los Tratados <mark class=\"m-resp\">continuarán, en cualquier caso, siendo vinculantes</mark> para dicho Estado.</p><p><b>4.</b> El <mark class=\"m-resp\">Consejo</mark> podrá decidir posteriormente, por <mark class=\"m-resp\">mayoría cualificada</mark>, la <mark class=\"m-accion\">modificación o revocación</mark> de las medidas adoptadas de conformidad con el apartado 3 (…).</p><p><b>5.</b> Las <mark class=\"m-destacable\">modalidades de voto</mark> que, a los efectos del presente artículo, serán de aplicación para el Parlamento Europeo, el Consejo Europeo y el Consejo se establecen en el <mark class=\"m-resp\">artículo 354 del Tratado de Funcionamiento</mark> de la Unión Europea.</p>", true)

  + articuloResp("Artículo 8 — Relaciones preferentes con los países vecinos", ["relaciones preferentes","espacio de prosperidad y buena vecindad","derechos y obligaciones recíprocos y acciones en común","concertación PERIÓDICA"], "<p><b>1.</b> La Unión <mark class=\"m-accion\">desarrollará</mark> con los <mark class=\"m-autoridad\">países vecinos</mark> <mark class=\"m-resp\">relaciones preferentes</mark>, con el objetivo de establecer un <mark class=\"m-resp\">espacio de prosperidad y de buena vecindad</mark> basado en los valores de la Unión y caracterizado por unas relaciones <mark class=\"m-personalizado\">estrechas y pacíficas</mark> fundadas en la <mark class=\"m-destacable\">cooperación</mark>.</p><p><b>2.</b> (…) la Unión podrá <mark class=\"m-accion\">celebrar</mark> <mark class=\"m-destacable\">acuerdos específicos</mark> con dichos países. Estos acuerdos podrán incluir <mark class=\"m-resp\">derechos y obligaciones recíprocos, así como la posibilidad de realizar acciones en común</mark>. Su aplicación será objeto de una <mark class=\"m-resp\">concertación periódica</mark>.</p>", true)

  + articuloResp("Artículo 9 — Igualdad y ciudadanía de la Unión", ["atención de sus instituciones, órganos y organismos","ciudadano: quien tenga la nacionalidad de un Estado miembro","se añade a la nacional sin sustituirla"], "<p>La Unión <mark class=\"m-accion\">respetará</mark> en todas sus actividades el <mark class=\"m-destacable\">principio de la igualdad</mark> de sus ciudadanos, que se beneficiarán por igual de la atención de <mark class=\"m-resp\">sus instituciones, órganos y organismos</mark>. Será <mark class=\"m-destacable\">ciudadano de la Unión</mark> toda persona que <mark class=\"m-resp\">tenga la nacionalidad de un Estado miembro</mark>. La ciudadanía de la Unión <mark class=\"m-resp\">se añade a la ciudadanía nacional sin sustituirla</mark>.</p>", true)

  + articuloResp("Artículo 10 — Democracia representativa · R5", ["democracia representativa","ciudadanos → Parlamento Europeo","Consejo Europeo → Jefe de Estado o de Gobierno","Consejo → Gobiernos","partidos políticos a escala europea"], "<p><b>1.</b> El funcionamiento de la Unión se basa en la <mark class=\"m-resp\">democracia representativa</mark>.</p><p><b>2.</b> Los ciudadanos estarán <mark class=\"m-personalizado\">directamente representados</mark> en la Unión a través del <mark class=\"m-resp\">Parlamento Europeo</mark>.</p><p>Los Estados miembros estarán representados en el <mark class=\"m-autoridad\">Consejo Europeo</mark> por su <mark class=\"m-resp\">Jefe de Estado o de Gobierno</mark> y en el <mark class=\"m-resp\">Consejo</mark> por sus <mark class=\"m-autoridad\">Gobiernos</mark>, que serán democráticamente responsables, bien ante sus <mark class=\"m-autoridad\">Parlamentos nacionales</mark>, bien ante sus ciudadanos.</p><p><b>3.</b> Todo ciudadano tiene derecho a participar en la vida democrática de la Unión. Las decisiones serán tomadas de la forma más <mark class=\"m-personalizado\">abierta y próxima</mark> posible a los ciudadanos.</p><p><b>4.</b> Los <mark class=\"m-resp\">partidos políticos a escala europea</mark> <mark class=\"m-accion\">contribuirán</mark> a formar la <mark class=\"m-destacable\">conciencia política europea</mark> y a expresar la voluntad de los ciudadanos de la Unión.</p>", true)
  + articuloResp("Artículo 11 — Participación e iniciativa ciudadana", ["las instituciones","diálogo abierto, transparente y regular","Comisión: coherencia y transparencia","al menos UN MILLÓN de ciudadanos"], "<p><b>1.</b> <mark class=\"m-resp\">Las instituciones</mark> <mark class=\"m-accion\">darán</mark> a los ciudadanos y a las asociaciones representativas, por los cauces apropiados, la posibilidad de <mark class=\"m-accion\">expresar e intercambiar públicamente</mark> sus opiniones en todos los ámbitos de actuación de la Unión.</p><p><b>2.</b> Las instituciones mantendrán un <mark class=\"m-destacable\">diálogo</mark> <mark class=\"m-resp\">abierto, transparente y regular</mark> con las asociaciones representativas y la sociedad civil.</p><p><b>3.</b> Con objeto de garantizar la <mark class=\"m-resp\">coherencia y la transparencia</mark> de las acciones de la Unión, la <mark class=\"m-autoridad\">Comisión Europea</mark> mantendrá <mark class=\"m-accion\">amplias consultas</mark> con las partes interesadas.</p><p><b>4.</b> Un grupo de <u class=\"m-clave\">al menos</u> <mark class=\"m-resp\">un millón de ciudadanos</mark> de la Unión, que sean nacionales de un <mark class=\"m-personalizado\">número significativo de Estados miembros</mark>, podrá tomar la <mark class=\"m-destacable\">iniciativa</mark> de <mark class=\"m-accion\">invitar</mark> a la <mark class=\"m-autoridad\">Comisión Europea</mark>, en el marco de sus atribuciones, a que presente una propuesta adecuada sobre cuestiones que estos ciudadanos estimen que requieren un acto jurídico de la Unión (…).</p>", true)
  + trampa("Trampa de examen", "Diálogo: abierto, transparente y regular — NO «directo» ni «conciso». Iniciativa: UN MILLÓN, no quinientos mil.")
  + articuloResp("Artículo 12 — Parlamentos nacionales", ["velarán por la SUBSIDIARIEDAD","control político de Europol y evaluación de Eurojust","informados de las solicitudes de adhesión"], "<p>Los <mark class=\"m-autoridad\">Parlamentos nacionales</mark> <mark class=\"m-accion\">contribuirán activamente</mark> al buen funcionamiento de la Unión, para lo cual:</p><p><b>a)</b> serán <mark class=\"m-accion\">informados</mark> por las instituciones de la Unión y recibirán notificación de los proyectos de actos legislativos (…);</p><p><b>b)</b> <mark class=\"m-resp\">velarán por que se respete el principio de subsidiariedad</mark> de conformidad con los procedimientos establecidos en el Protocolo sobre la aplicación de los principios de subsidiariedad y proporcionalidad;</p><p><b>c)</b> participarán, en el marco del <mark class=\"m-destacable\">espacio de libertad, seguridad y justicia</mark>, en los mecanismos de evaluación (…) de conformidad con el artículo 70 del TFUE, y estarán asociados al <mark class=\"m-resp\">control político de Europol y a la evaluación de las actividades de Eurojust</mark> (…);</p><p><b>d)</b> participarán en los procedimientos de <mark class=\"m-destacable\">revisión de los Tratados</mark> (art. 48);</p><p><b>e)</b> <mark class=\"m-resp\">serán informados de las solicitudes de adhesión</mark> a la Unión, de conformidad con el artículo 49;</p><p><b>f)</b> participarán en la <mark class=\"m-destacable\">cooperación interparlamentaria</mark> entre los Parlamentos nacionales y con el Parlamento Europeo.</p>", true)
