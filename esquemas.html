<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Esquemas de Estudio</title>
<meta name="theme-color" content="#1c4d3c">
<style>
:root{
  --fondo:#f5f4ee;
  --panel:#ffffff;
  --panel-alt:#eeece3;
  --texto:#1f2a24;
  --texto-gris:#767a70;
  --borde:#e2e0d5;
  --verde-osc:#163f30;
  --verde:#1c4d3c;
  --verde-med:#2f6b52;
  --verde-suave:#e7efe8;
  --examen-bg:#fff4d6;
  --examen-borde:#e0a800;
  --examen-txt:#7a5b00;
  --radio:18px;
  --radio-sm:12px;
  font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
[data-theme="dark"]{
  --fondo:#141917;
  --panel:#1e2523;
  --panel-alt:#262f2b;
  --texto:#eef1ee;
  --texto-gris:#9aa39c;
  --borde:#333d37;
  --verde-osc:#7fd9ac;
  --verde:#3f8a68;
  --verde-med:#57a683;
  --verde-suave:#16332a;
  --examen-bg:#3a2f12;
  --examen-borde:#e0a800;
  --examen-txt:#f0c95a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body,html{margin:0;padding:0;background:var(--fondo);color:var(--texto)}
#app{max-width:820px;margin:0 auto;min-height:100vh;padding:18px 18px 60px}
h1,h2,h3{margin:0;color:var(--verde-osc);font-family:Georgia,'Times New Roman',serif}
p{margin:0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;position:sticky;top:0;background:var(--fondo);padding:10px 0;z-index:10}
.topbar h1{font-size:22px}
.theme-toggle{display:flex;background:var(--panel-alt);border-radius:20px;padding:4px;gap:2px}
.theme-btn{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--texto-gris);cursor:pointer;font-family:inherit}
.theme-btn.active{background:var(--panel);color:var(--verde-osc)}

.layout{display:flex;gap:20px;align-items:flex-start}
.sidebar{width:220px;flex:none;background:var(--panel);border-radius:var(--radio);padding:14px;position:sticky;top:78px}
.sidebar h3{font-size:12px;letter-spacing:1px;color:var(--texto-gris);text-transform:uppercase;margin-bottom:10px}
.tema-nav-item{display:block;padding:10px 12px;border-radius:var(--radio-sm);font-size:14px;font-weight:600;color:var(--texto);cursor:pointer;margin-bottom:4px}
.tema-nav-item:hover{background:var(--panel-alt)}
.tema-nav-item.active{background:var(--verde-suave);color:var(--verde-osc)}

.content{flex:1;min-width:0}
.esquema{background:var(--panel);border-radius:var(--radio);padding:24px;margin-bottom:18px;display:none}
.esquema.active{display:block}
.esquema-head{margin-bottom:16px;border-bottom:1px solid var(--borde);padding-bottom:14px}
.esquema-head .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--texto-gris);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.esquema-head h2{font-size:24px}

.bloque{margin-bottom:18px}
.bloque h3{font-size:16px;color:var(--verde-med);margin-bottom:8px}
.bloque ul{margin:0;padding-left:20px}
.bloque li{font-size:14.5px;line-height:1.6;color:var(--texto);margin-bottom:6px}

.placeholder{text-align:center;color:var(--texto-gris);padding:60px 20px;font-size:14.5px}

/* ---- Método Prefortia: leyenda de colores ---- */
.leyenda{display:flex;flex-wrap:wrap;gap:14px;background:var(--panel-alt);border-radius:var(--radio-sm);padding:10px 14px;margin-bottom:18px}
.leyenda span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--texto)}
.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.leyenda i.lc-destacable{background:#f7c9a8}
.leyenda i.lc-autoridad{background:#bfe3c4}
.leyenda i.lc-plazo{background:#a9d3ea}
.leyenda i.lc-accion{background:#c9b7e0}
.leyenda i.lc-personalizado{background:#f7e79a}
.leyenda i.lc-clave{background:none;border-bottom:3px solid #d1332a;border-radius:0;width:16px}

/* ---- Marcado inline por categorías (subrayados de color) ---- */
mark.m-destacable{background:#f7c9a8;color:#3a2213;padding:1px 3px;border-radius:3px}
mark.m-autoridad{background:#bfe3c4;color:#173a1e;padding:1px 3px;border-radius:3px}
mark.m-plazo{background:#a9d3ea;color:#0f2c3d;padding:1px 3px;border-radius:3px}
mark.m-accion{background:#c9b7e0;color:#2c1c40;padding:1px 3px;border-radius:3px}
mark.m-personalizado{background:#f7e79a;color:#463a04;padding:1px 3px;border-radius:3px}
u.m-clave{text-decoration:underline;text-decoration-color:#d1332a;text-decoration-thickness:2px;text-underline-offset:2px}
[data-theme="dark"] mark.m-destacable{background:#6b3d1f;color:#ffd9b8}
[data-theme="dark"] mark.m-autoridad{background:#265331;color:#c9f0cf}
[data-theme="dark"] mark.m-plazo{background:#1f4a63;color:#c8e9fb}
[data-theme="dark"] mark.m-accion{background:#4a3768;color:#e6d9fa}
[data-theme="dark"] mark.m-personalizado{background:#5a4a12;color:#fff0b0}

/* ---- Título de artículo ---- */
.articulo{margin-bottom:16px;border:1px solid var(--borde);border-radius:var(--radio-sm);overflow:hidden}
.articulo-head{background:var(--panel-alt);padding:8px 14px;font-weight:800;font-size:14px;color:var(--verde-osc)}
.articulo-body{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.articulo-body .txt{flex:1;font-size:14px;line-height:1.7}
.articulo-body .txt p{margin-bottom:6px}
.sello-examen{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid #d1332a;color:#d1332a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;transform:rotate(-8deg)}
.margen-nota{font-size:11px;color:var(--verde-med);font-weight:700;line-height:1.4;text-align:right;max-width:150px;border-left:2px dashed var(--borde);padding-left:8px;flex:none}

.bloque-titulo{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:#555;color:#fff;padding:6px 12px;border-radius:8px;margin:22px 0 12px}
[data-theme="dark"] .bloque-titulo{background:#3a4640}

.trampa{background:var(--examen-bg);border:1.5px dashed var(--examen-borde);border-radius:var(--radio-sm);padding:12px 16px;margin:14px 0}
.trampa b{color:var(--examen-txt);display:block;margin-bottom:4px;font-size:13.5px}
.trampa p{font-size:13.5px;line-height:1.5;color:var(--examen-txt)}

.recuerda{background:var(--verde-suave);border:1.5px solid var(--verde-med);border-radius:var(--radio-sm);padding:14px 18px;margin-top:20px}
.recuerda b.titulo-recuerda{display:block;color:var(--verde-osc);font-size:15px;margin-bottom:8px}
.recuerda ul{margin:0;padding-left:18px}
.recuerda li{font-size:13.5px;line-height:1.6;color:var(--texto);margin-bottom:5px}

.btn-pdf{display:flex;align-items:center;gap:6px;border:1.5px solid var(--verde-med);background:transparent;color:var(--verde-med);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-pdf:hover{background:var(--verde-suave)}

@media (max-width:720px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}
  .sidebar h3{width:100%}
  .tema-nav-item{margin-bottom:0}
  .topbar{flex-wrap:wrap}
}

@media print{
  body,html{background:#fff}
  .topbar,.sidebar,.btn-pdf{display:none!important}
  .layout{display:block}
  .content{width:100%}
  .esquema{display:none!important;box-shadow:none;border-radius:0;padding:0}
  .esquema.active{display:block!important}
  .examen{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>📚 Esquemas de Estudio</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-pdf" id="btn-exportar-pdf">⬇️ PDF</button>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme-btn="light">Claro</button>
        <button class="theme-btn" data-theme-btn="dark">Oscuro</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="nav-temas">
      <h3>Temas</h3>
      <!-- Los temas se listan aquí automáticamente -->
    </div>

    <div class="content" id="lista-esquemas">
      <!-- Los esquemas se insertan aquí -->
    </div>
  </div>
</div>

<script>
// ---- ESQUEMAS ----
// Cada esquema es un objeto: { id, tema, titulo, bloques: [{ titulo, puntos: [{texto, examen:true/false}] }] }
// Los 27 temas del programa (Materias Profesionales) están precargados como pendientes.
// Se van rellenando uno a uno con los artículos/puntos que se vayan indicando.
const temasPrograma = [
  "TEMA 1.- DERECHOS HUMANOS",
  "TEMA 2.- TERRORISMO Y DELINCUENCIA TRANSNACIONAL",
  "TEMA 3.- TRATADOS DE LA UNIÓN EUROPEA",
  "TEMA 4.- LA GESTIÓN DE LAS FRONTERAS DE LA UNIÓN EUROPEA",
  "TEMA 5.- BASES DE DATOS EUROPEAS",
  "TEMA 6.- ENTRADA Y PERMANENCIA DE EXTRANJEROS EN ESPAÑA",
  "TEMA 7.- DERECHOS Y DEBERES FUNDAMENTALES EN LA CE Y SU PROTECCIÓN",
  "TEMA 8.- PODER JUDICIAL",
  "TEMA 9.- DEFENSA NACIONAL",
  "TEMA 10.- DERECHO CIVIL",
  "TEMA 11.- DERECHO ADMINISTRATIVO",
  "TEMA 12.- GOBIERNO Y ADMINISTRACIÓN",
  "TEMA 13.- JURISDICCIÓN CONTENCIOSO-ADMINISTRATIVA",
  "TEMA 14.- EL DEFENSOR DEL PUEBLO",
  "TEMA 15.- PROTECCIÓN INTEGRAL CONTRA LA VIOLENCIA DE GÉNERO",
  "TEMA 16.- IGUALDAD EFECTIVA Y ACOSO SEXUAL/POR RAZÓN DE SEXO",
  "TEMA 17.- RESPONSABILIDAD PENAL DE LOS MENORES",
  "TEMA 18.- DERECHO PENAL. PARTE GENERAL",
  "TEMA 19.- DERECHO PENAL. PARTE ESPECIAL",
  "TEMA 20.- DERECHO PROCESAL PENAL (I)",
  "TEMA 21.- DERECHO PROCESAL PENAL (II) - NORMAS COMPLEMENTARIAS",
  "TEMA 22.- SEGURIDAD CIUDADANA",
  "TEMA 23.- SEGURIDAD PRIVADA",
  "TEMA 24.- ESTRUCTURAS ORGÁNICAS BÁSICAS",
  "TEMA 25.- COORDINACIÓN Y COOPERACIÓN POLICIAL",
  "TEMA 26.- ESTATUTO DEL PERSONAL DE LA GUARDIA CIVIL",
  "TEMA 27.- DEONTOLOGÍA PROFESIONAL"
];

// Helpers para construir el HTML de un esquema con el estilo Método Prefortia
function leyenda(){
  return `<div class="leyenda">
    <span><i class="lc-destacable"></i>Palabras destacables</span>
    <span><i class="lc-autoridad"></i>Autoridades y cargos públicos</span>
    <span><i class="lc-plazo"></i>Plazos</span>
    <span><i class="lc-accion"></i>Acciones</span>
    <span><i class="lc-personalizado"></i>Personalizado</span>
    <span><i class="lc-clave"></i>Palabras clave</span>
  </div>`;
}
function bloqueTitulo(t){ return `<div class="bloque-titulo">${t}</div>`; }
function articulo(cab, html, examen){
  return `<div class="articulo">
    <div class="articulo-head">${cab}</div>
    <div class="articulo-body">
      <div class="txt">${html}</div>
      ${examen ? '<div class="sello-examen">EX</div>' : ''}
    </div>
  </div>`;
}
function trampa(titulo, html){
  return `<div class="trampa"><b>⚠ ${titulo || 'Trampa de examen'}</b><p>${html}</p></div>`;
}
function recuerda(items){
  return `<div class="recuerda"><b class="titulo-recuerda">✔ RECUERDA — Resumen conceptual y puntos clave de examen</b>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
  </div>`;
}

// Datos base: cada esquema tiene un campo `html` con el contenido ya maquetado.
const esquemas = temasPrograma.map((tema, i) => ({
  id: "tema-" + (i + 1),
  tema: tema,
  titulo: "Pendiente de rellenar",
  html: leyenda() + `<div class="placeholder">Dicta los artículos y puntos de este tema para generar el esquema rápido en el estilo Método Prefortia.</div>`
}));

// ---- TEMA 7 (relleno completo, estilo Método Prefortia) ----
(function(){
  const t7 = esquemas[6];
  t7.titulo = "7.1 y 7.2 — Resumen esquemático";
  t7.html = leyenda()

    + bloqueTitulo("TÍTULO PRIMERO. DEL TRIBUNAL CONSTITUCIONAL — CAPÍTULO I: Organización y atribuciones")

    + articulo("Artículo 2 — Competencias del Tribunal Constitucional", `
      <p><b>1.</b> <mark class="m-accion">El TC conocerá</mark>: recurso y cuestión de <mark class="m-destacable">inconstitucionalidad</mark>; recurso de <mark class="m-destacable">amparo</mark> por violación de derechos del art. 53.2 CE; <mark class="m-destacable">conflictos de competencia</mark> Estado/CC.AA. o entre CC.AA.; <mark class="m-destacable">conflictos entre órganos constitucionales</mark> del Estado; conflictos en defensa de la autonomía local; declaración sobre <mark class="m-destacable">constitucionalidad de Tratados Internacionales</mark>; control previo de inconstitucionalidad (art. 79); impugnaciones del art. 161.2 CE; <u class="m-clave">verificación de nombramientos</u> de <mark class="m-autoridad">Magistrados del TC</mark>; demás materias atribuidas por la Constitución y LLOO.</p>
      <p><b>2.</b> El TC <mark class="m-accion">podrá dictar</mark> <mark class="m-destacable">reglamentos</mark> sobre su propio funcionamiento, organización y personal, aprobados en <mark class="m-autoridad">Pleno</mark> y publicados en el BOE autorizados por su <mark class="m-autoridad">Presidente</mark>.</p>
    `)

    + articulo("Artículo 3 — Competencia sobre cuestiones prejudiciales", `
      <p><mark class="m-destacable">La competencia</mark> del <mark class="m-autoridad">TC</mark> se extiende al <mark class="m-accion">conocimiento y decisión</mark> de cuestiones prejudiciales e incidentales <u class="m-clave">no</u> pertenecientes al orden constitucional, directamente relacionadas con la materia que conoce, a los solos efectos del <mark class="m-personalizado">enjuiciamiento constitucional</mark> de ésta.</p>
    `)

    + articulo("Artículo 4.1 y 4.2 — Delimitación de jurisdicción", `
      <p><b>1.</b> <u class="m-clave">No</u> cabe promover cuestión de jurisdicción o competencia al TC. El propio TC <mark class="m-accion">delimita</mark> el ámbito de su jurisdicción, adoptando medidas necesarias para preservarla (incluida la nulidad de actos que la menoscaben), y puede apreciar de oficio o a instancia de parte su competencia o incompetencia.</p>
      <p><b>2.</b> Las resoluciones del TC no podrán ser <mark class="m-accion">enjuiciadas</mark> por ningún órgano jurisdiccional del Estado.</p>
    `)

    + articulo("Artículo 5 — Composición del Tribunal", `
      <p>El Tribunal Constitucional <mark class="m-accion">está integrado</mark> por <mark class="m-plazo">doce</mark> miembros, con el título de <mark class="m-autoridad">Magistrados del Tribunal Constitucional</mark>.</p>
    `, true)

    + articulo("Artículo 6 — El Pleno", `
      <p><b>1.</b> El TC <mark class="m-accion">actúa</mark> en <u class="m-clave">Pleno</u>, en <u class="m-clave">Sala</u> o en <u class="m-clave">Sección</u>.</p>
      <p><b>2.</b> El <mark class="m-autoridad">PLENO</mark> <mark class="m-accion">está integrado</mark> por todos los Magistrados. Lo preside el <mark class="m-autoridad">Presidente</mark> del Tribunal; en su defecto, el <mark class="m-autoridad">Vicepresidente</mark>; a falta de ambos, el Magistrado más antiguo en el cargo y, en caso de igual antigüedad, el de mayor edad.</p>
    `)

    + articulo("Artículo 7 — Las Salas", `
      <p><b>1.</b> El TC consta de <mark class="m-plazo">dos Salas</mark>. Cada Sala está compuesta por <mark class="m-plazo">seis Magistrados</mark> nombrados por el Tribunal en Pleno.</p>
      <p><b>2.</b> El <mark class="m-autoridad">Presidente</mark> del Tribunal lo es también de la <mark class="m-destacable">Sala Primera</mark>, que presidirá; en su defecto, el Magistrado más antiguo (a igual antigüedad, el de mayor edad).</p>
      <p><b>3.</b> El <mark class="m-autoridad">Vicepresidente</mark> del Tribunal presidirá la <mark class="m-destacable">Sala Segunda</mark>, con la misma regla de suplencia.</p>
    `)

    + trampa("Trampa de examen", "Presidente → preside Pleno y Sala Primera. Vicepresidente → preside Sala Segunda. No confundir quién preside cada Sala.")

    + articulo("Artículo 9 — Elección de Presidente y Vicepresidente", `
      <p><b>1.</b> El <mark class="m-autoridad">Tribunal en Pleno</mark> <mark class="m-accion">elige</mark> de entre sus miembros, por <mark class="m-destacable">votación secreta</mark>, a su Presidente y propone al Rey su nombramiento.</p>
      <p><b>2.</b> En primera votación se requiere <mark class="m-destacable">mayoría absoluta</mark>. Si no se alcanza, segunda votación: elegido quien obtenga mayor número de votos. En caso de empate, última votación; si se repite, se propone al de mayor antigüedad en el cargo y, en igualdad, al de mayor edad.</p>
      <p><b>3.</b> El nombre del elegido se eleva al <mark class="m-autoridad">Rey</mark> para su nombramiento por un período de <mark class="m-plazo">tres años</mark>, pudiendo ser reelegido <u class="m-clave">una sola vez</u>.</p>
      <p><b>4.</b> El <mark class="m-autoridad">Pleno</mark> elige entre sus miembros, por el mismo procedimiento y por el mismo período de <mark class="m-plazo">tres años</mark>, un <mark class="m-autoridad">Vicepresidente</mark>, que sustituye al Presidente (vacante, ausencia u otro motivo legal) y preside la Sala Segunda.</p>
    `)

    + articulo("Artículo 10 — Competencias del Pleno", `
      <p><b>1.</b> El <mark class="m-autoridad">Pleno</mark> <mark class="m-accion">conoce</mark>, entre otros: constitucionalidad de tratados internacionales; recursos de inconstitucionalidad (salvo mera aplicación de doctrina, atribuibles a Salas); cuestiones de inconstitucionalidad que reserve para sí; conflictos de competencia Estado/CC.AA.; recursos previos de inconstitucionalidad contra Estatutos de Autonomía; impugnaciones del art. 161.2 CE; conflictos en defensa de la autonomía local; conflictos entre órganos constitucionales; anulaciones en defensa de la jurisdicción (art. 4.3); verificación de requisitos para nombramiento de Magistrados; nombramiento de Magistrados de cada Sala; recusación de Magistrados; cese de Magistrados (art. 23); aprobación y modificación de reglamentos del Tribunal.</p>
      <p><b>2.</b> En los casos d), e) y f) del apartado anterior, en el trámite de admisión la decisión de fondo puede atribuirse a la Sala correspondiente según turno objetivo, comunicándose a las partes.</p>
      <p><b>3.</b> El <mark class="m-autoridad">Pleno</mark>, en ejercicio de su autonomía como órgano constitucional, <mark class="m-accion">elabora</mark> su <mark class="m-destacable">presupuesto</mark>, integrado como sección independiente de los Presupuestos Generales del Estado.</p>
    `)

    + articulo("Artículo 12 — Distribución de asuntos entre Salas", `
      <p>La <mark class="m-destacable">distribución de asuntos</mark> entre las Salas del Tribunal <mark class="m-accion">se efectuará</mark> según un <u class="m-clave">turno establecido por el Pleno</u> a propuesta de su Presidente.</p>
    `)

    + articulo("Artículo 14 — Quórum de acuerdos", `
      <p>El Pleno adopta acuerdos con la presencia de, al menos, <mark class="m-plazo">dos tercios</mark> de sus miembros. Las Salas requieren igualmente la presencia de <mark class="m-plazo">dos tercios</mark> de sus miembros. En las Secciones se requiere la presencia de <mark class="m-plazo">dos miembros</mark>, salvo discrepancia, en cuyo caso se requieren los <mark class="m-plazo">tres miembros</mark>.</p>
    `, true)

    + articulo("Artículo 15 — Funciones del Presidente", `
      <p>El <mark class="m-autoridad">Presidente del Tribunal Constitucional</mark>: ejerce la <mark class="m-destacable">representación</mark> del Tribunal; convoca y preside el Pleno y convoca las Salas; adopta las medidas precisas para el funcionamiento del Tribunal, Salas y Secciones; comunica a las Cámaras, al Gobierno o al CGPJ las vacantes; nombra a los letrados; convoca los concursos de personal; ejerce potestades administrativas sobre el personal del Tribunal.</p>
    `)

    + bloqueTitulo("TÍTULO II. DE LOS PROCEDIMIENTOS DE DECLARACIÓN DE INCONSTITUCIONALIDAD — CAPÍTULO II: El recurso de inconstitucionalidad")

    + articulo("Artículo 31 — Momento de interposición", `
      <p>El <mark class="m-destacable">recurso de inconstitucionalidad</mark> contra Leyes, disposiciones normativas o actos con fuerza de Ley <mark class="m-accion">podrá promoverse</mark> a partir de su publicación oficial.</p>
    `)

    + articulo("Artículo 32 — Legitimación activa", `
      <p><b>1.</b> Legitimados: <mark class="m-autoridad">Presidente del Gobierno</mark>, <mark class="m-autoridad">Defensor del Pueblo</mark>, <mark class="m-plazo">50 Diputados</mark>, <mark class="m-plazo">50 Senadores</mark> — frente a Estatutos de Autonomía, LLOO y demás Leyes del Estado, disposiciones y actos con fuerza de Ley, Tratados Internacionales y Reglamentos de las Cámaras.</p>
      <p><b>2.</b> Contra Leyes/disposiciones/actos con fuerza de Ley del Estado que <mark class="m-destacable">afecten a su propio ámbito de autonomía</mark>, también están <mark class="m-accion">legitimados</mark> los órganos colegiados ejecutivos y las Asambleas de las CC.AA., previo acuerdo.</p>
    `)

    + trampa("Trampa de examen", "Legitimación genérica (art. 32.1): Presidente del Gobierno, Defensor del Pueblo, 50 Diputados, 50 Senadores. No confundir con la legitimación específica de CC.AA. (art. 32.2), limitada a su propio ámbito de autonomía.")

    + articulo("Artículo 33.1 y 33.2 — Plazos del recurso de inconstitucionalidad", `
      <p><b>1.</b> Plazo general: <mark class="m-plazo">tres meses</mark> a partir de la publicación de la Ley, disposición o acto con fuerza de Ley impugnado, mediante demanda ante el TC.</p>
      <p><b>2.</b> Plazo ampliado: <mark class="m-plazo">nueve meses</mark> para el Presidente del Gobierno y los órganos colegiados ejecutivos de CC.AA., si concurren: a) reunión de la Comisión Bilateral de Cooperación; b) acuerdo de iniciación de negociaciones dentro de dicha Comisión; c) comunicación del acuerdo al TC dentro de los <mark class="m-plazo">tres meses</mark> siguientes a la publicación e inserción en el BOE y el Diario Oficial de la CC.AA.</p>
    `, true)

    + trampa("Trampa de examen", "Plazo ordinario: 3 meses. Plazo especial (con Comisión Bilateral): 9 meses, pero el acuerdo debe comunicarse al TC dentro de esos mismos 3 meses iniciales. No confundir ambos plazos de «tres meses».")

    + articulo("Artículo 34.1 y 34.2 — Traslado y plazos de alegación", `
      <p><b>1.</b> Admitida a trámite la demanda, el TC dará traslado al Congreso y al Senado (por sus Presidentes), al Gobierno (por el Ministerio de Justicia) y, si procede, a los órganos legislativo y ejecutivo de la CC.AA., para personarse y formular alegaciones.</p>
      <p><b>2.</b> Personación y alegaciones: <mark class="m-plazo">quince días</mark>. Después, el Tribunal dicta sentencia en <mark class="m-plazo">diez días</mark>, salvo resolución motivada que amplíe el plazo, que en ningún caso excederá de <mark class="m-plazo">treinta días</mark>.</p>
    `)

    + bloqueTitulo("CAPÍTULO III. La cuestión de inconstitucionalidad promovida por Jueces o Tribunales")

    + articulo("Artículo 35.1 y 35.2 — Planteamiento de la cuestión", `
      <p><b>1.</b> Cuando un <mark class="m-autoridad">Juez o Tribunal</mark>, de oficio o a instancia de parte, considere que una norma con rango de Ley aplicable al caso pueda ser contraria a la Constitución, <mark class="m-accion">planteará</mark> la cuestión al TC.</p>
      <p><b>2.</b> Solo puede plantearla una vez concluso el procedimiento y dentro del plazo para dictar sentencia. Debe concretar la norma, el precepto infringido y justificar la dependencia del fallo. Antes de resolver, oirá a las partes y al Ministerio Fiscal en plazo común e improrrogable de <mark class="m-plazo">10 días</mark>; después, el juez resuelve en <mark class="m-plazo">tres días</mark> mediante auto no susceptible de recurso.</p>
    `)

    + articulo("Artículo 37.1, 37.2 y 37.3 — Admisión y tramitación de la cuestión", `
      <p><b>1.</b> El Tribunal puede rechazar en trámite de admisión, mediante auto motivado y con audiencia solo del <mark class="m-autoridad">Fiscal General del Estado</mark>, la cuestión cuando falten condiciones procesales o sea notoriamente infundada.</p>
      <p><b>2.</b> Publicada la admisión en el BOE, quienes sean parte pueden personarse ante el TC en <mark class="m-plazo">15 días</mark> siguientes, para alegar en otros <mark class="m-plazo">15 días</mark>.</p>
      <p><b>3.</b> El TC da traslado al Congreso, Senado, Fiscal General del Estado, Gobierno y, en su caso, órganos de la CC.AA., que pueden personarse y alegar en plazo común improrrogable de <mark class="m-plazo">15 días</mark>. Concluido éste, sentencia en <mark class="m-plazo">15 días</mark>, ampliable motivadamente hasta un máximo de <mark class="m-plazo">30 días</mark>.</p>
    `)

    + bloqueTitulo("CAPÍTULO IV. De la sentencia en procedimientos de inconstitucionalidad y de sus efectos")

    + articulo("Artículo 38.1, 38.2 y 38.3 — Efectos de la sentencia", `
      <p><b>1.</b> Las sentencias en procedimientos de inconstitucionalidad tienen valor de <u class="m-clave">cosa juzgada</u>, vinculan a todos los Poderes Públicos y producen efectos generales desde su <mark class="m-destacable">publicación en el BOE</mark>.</p>
      <p><b>2.</b> Las sentencias desestimatorias en recursos de inconstitucionalidad y conflictos en defensa de la autonomía local impiden un planteamiento ulterior por cualquiera de ambas vías, fundado en la misma infracción de idéntico precepto.</p>
      <p><b>3.</b> En cuestiones de inconstitucionalidad, el TC lo comunica de inmediato al órgano judicial competente, que notifica a las partes. El Juez queda vinculado desde que conoce la sentencia; las partes, desde que son notificadas.</p>
    `)

    + articulo("Artículo 39 — Alcance de la declaración de inconstitucionalidad", `
      <p><b>1.</b> Cuando declare la inconstitucionalidad, declarará igualmente la <mark class="m-destacable">nulidad</mark> de los preceptos impugnados, y de aquellos otros de la misma Ley a los que deba extenderse por <u class="m-clave">conexión o consecuencia</u>.</p>
      <p><b>2.</b> El TC puede fundar la declaración de inconstitucionalidad en la infracción de cualquier precepto constitucional, haya sido o no invocado en el proceso.</p>
    `)

    + bloqueTitulo("TÍTULO III. DEL RECURSO DE AMPARO CONSTITUCIONAL — CAPÍTULO I: Procedencia e interposición")

    + articulo("Artículo 42 — Amparo frente a actos de las Cortes/Asambleas", `
      <p>Las decisiones o actos sin valor de Ley de las Cortes, sus órganos, o de las Asambleas legislativas de las CC.AA. y sus órganos, que <mark class="m-destacable">violen derechos y libertades</mark> susceptibles de amparo, podrán ser recurridos dentro del plazo de <mark class="m-plazo">tres meses</mark> desde que, con arreglo a las normas internas de las Cámaras o Asambleas, sean firmes.</p>
    `)

    + articulo("Artículo 43.1, 43.2 y 43.3 — Amparo frente al Gobierno y ejecutivos autonómicos", `
      <p><b>1.</b> Las violaciones originadas por el <mark class="m-autoridad">Gobierno</mark> o sus autoridades/funcionarios, o los órganos ejecutivos colegiados de las CC.AA. o sus autoridades/funcionarios/agentes, dan lugar al amparo una vez agotada la vía judicial procedente.</p>
      <p><b>2.</b> Plazo: <mark class="m-plazo">veinte días</mark> siguientes a la notificación de la resolución recaída en el previo proceso judicial.</p>
      <p><b>3.</b> El recurso solo puede fundarse en la infracción, por una resolución firme, de los preceptos constitucionales que reconocen los derechos o libertades susceptibles de amparo.</p>
    `, true)

    + articulo("Artículo 44.1 (párrafo) y 44.2 — Amparo frente a actos judiciales", `
      <p><b>1.</b> Las violaciones de derechos y libertades susceptibles de amparo que tengan su origen inmediato y directo en un acto u omisión de un <mark class="m-autoridad">órgano judicial</mark> podrán dar lugar a este recurso siempre que se cumplan los requisitos que fija la ley.</p>
      <p><b>2.</b> Plazo: <mark class="m-plazo">30 días</mark>, a partir de la notificación de la resolución recaída en el proceso judicial.</p>
    `)

    + trampa("Trampa de examen — plazos del recurso de amparo (arts. 42/43/44)", "Art. 42 (actos de Cortes/Asambleas): 3 meses. Art. 43 (Gobierno/ejecutivos autonómicos): 20 días. Art. 44 (órgano judicial): 30 días. Es la trampa clásica de la oposición: memorizar «3 meses / 20 días / 30 días» en ese orden.")

    + articulo("Artículo 46.1 — Legitimación activa en el amparo", `
      <p><b>1.</b> Están legitimados: a) en los casos de los arts. 42 y 45, la persona directamente afectada, el <mark class="m-autoridad">Defensor del Pueblo</mark> y el <mark class="m-autoridad">Ministerio Fiscal</mark>; b) en los casos de los arts. 43 y 44, quienes hayan sido parte en el proceso judicial correspondiente, el Defensor del Pueblo y el Ministerio Fiscal.</p>
    `)

    + bloqueTitulo("CAPÍTULO II. De la tramitación de los recursos de amparo")

    + articulo("Artículo 48 — Órgano competente", `
      <p>El conocimiento de los recursos de amparo corresponde a las <mark class="m-autoridad">Salas</mark> del Tribunal Constitucional y, en su caso, a las <mark class="m-autoridad">Secciones</mark>.</p>
    `)

    + articulo("Artículo 49.1, 49.3 y 49.4 — Iniciación de la demanda de amparo", `
      <p><b>1.</b> El recurso se inicia mediante demanda en la que se exponen los hechos, se citan los preceptos infringidos y se fija con precisión el amparo solicitado. La demanda debe justificar la <mark class="m-destacable">especial trascendencia constitucional</mark> del recurso.</p>
      <p><b>3.</b> Se acompañan tantas copias literales de la demanda y documentos como partes hubiere en el previo proceso, y una más para el Ministerio Fiscal.</p>
      <p><b>4.</b> Si se incumple algún requisito, las Secretarías de Justicia lo pondrán de manifiesto al interesado en <mark class="m-plazo">10 días</mark>, con apercibimiento de inadmisión si no se subsana.</p>
    `)

    + articulo("Artículo 50 — Decisión de admisión a trámite", `
      <p><b>1.</b> El recurso solamente se admite cuando concurran todos los requisitos: a) que la demanda cumpla lo dispuesto en los arts. 41, 46 y 49; b) que el contenido justifique una decisión sobre el fondo por su <mark class="m-destacable">especial trascendencia constitucional</mark>.</p>
      <p><b>3.</b> Las providencias de inadmisión se notifican al demandante y al Ministerio Fiscal; solo pueden recurrirse en súplica por el Ministerio Fiscal en <mark class="m-plazo">tres días</mark>, resolviéndose por auto no susceptible de impugnación.</p>
    `)

    + articulo("Artículo 51.1 — Requerimiento de actuaciones", `
      <p>Admitida la demanda, la Sala requerirá con carácter urgente al órgano, autoridad, Juez o Tribunal que conoció del procedimiento precedente para que, en plazo no superior a <mark class="m-plazo">diez días</mark>, remita las actuaciones o testimonio de ellas.</p>
    `)

    + articulo("Artículo 52 — Vista y alegaciones", `
      <p><b>1.</b> Recibidas las actuaciones, la Sala da vista a quien promovió el amparo, a los personados, al Abogado del Estado y al Ministerio Fiscal, por plazo común no superior a <mark class="m-plazo">veinte días</mark>, para presentar alegaciones.</p>
    `)

    + bloqueTitulo("CAPÍTULO III. De la resolución de los recursos de amparo y sus efectos")

    + articulo("Artículo 53 — Fallo de la sentencia de amparo", `
      <p>La Sala o Sección, al conocer del fondo, pronunciará alguno de estos fallos: a) <u class="m-clave">otorgamiento de amparo</u>; b) <u class="m-clave">denegación de amparo</u>.</p>
    `)

    + articulo("Artículo 56.1, 56.4 y 56.6 — Suspensión y medidas cautelares", `
      <p><b>1.</b> La interposición del recurso de amparo <u class="m-clave">no suspende</u> los efectos del acto o sentencia impugnados.</p>
      <p><b>4.</b> La suspensión u otra medida cautelar puede pedirse en cualquier momento antes de la sentencia, con audiencia de las partes y del Ministerio Fiscal, por plazo común no superior a <mark class="m-plazo">tres días</mark>.</p>
      <p><b>6.</b> En supuestos de urgencia excepcional, puede impugnarse en <mark class="m-plazo">cinco días</mark> desde su notificación; se resuelve por auto no susceptible de recurso.</p>
    `)

    + articulo("Artículo 57 — Modificación de la suspensión", `
      <p>La suspensión o su denegación puede ser <mark class="m-accion">modificada</mark> durante el juicio de amparo, de oficio o a instancia de parte, por circunstancias sobrevenidas o no conocidas al tiempo de sustanciarse el incidente de suspensión.</p>
    `)

    + articulo("Artículo 58 — Indemnización por la suspensión", `
      <p><b>1.</b> Son competentes para resolver sobre las peticiones de indemnización los <mark class="m-autoridad">Jueces o Tribunales</mark>, a cuya disposición se ponen las fianzas constituidas.</p>
      <p><b>2.</b> Las peticiones se sustancian por el trámite de los incidentes y deben presentarse dentro del plazo de <mark class="m-plazo">un año</mark> a partir de la publicación de la sentencia del TC.</p>
    `)

    + bloqueTitulo("7.2 — LEY ORGÁNICA 1/1982, DE PROTECCIÓN CIVIL DEL DERECHO AL HONOR, INTIMIDAD Y PROPIA IMAGEN — CAPÍTULO I: Disposiciones generales")

    + articulo("Artículo 1 — Objeto y naturaleza del derecho", `
      <p><b>1.</b> El derecho fundamental al <mark class="m-destacable">honor</mark>, a la <mark class="m-destacable">intimidad personal y familiar</mark> y a la <mark class="m-destacable">propia imagen</mark>, garantizado en el art. 18 CE, será protegido civilmente frente a todo género de intromisiones ilegítimas.</p>
      <p><b>3.</b> Este derecho es <u class="m-clave">irrenunciable, inalienable e imprescriptible</u>. La renuncia a la protección será nula, salvo los supuestos de autorización o consentimiento del art. 2.</p>
    `, true)

    + articulo("Artículo 2.2 y 2.3 — Autorización y consentimiento", `
      <p><b>2.</b> No hay intromisión ilegítima cuando esté expresamente <mark class="m-destacable">autorizada por Ley</mark> o cuando el titular haya dado su <mark class="m-destacable">consentimiento expreso</mark>; tampoco cuando, por el art. 71 CE, se trate de opiniones de Diputados o Senadores en el ejercicio de sus funciones.</p>
      <p><b>3.</b> El consentimiento es <mark class="m-accion">revocable</mark> en cualquier momento, pero deben indemnizarse los daños y perjuicios causados, incluidas las expectativas justificadas.</p>
    `)

    + articulo("Artículo 3 — Consentimiento de menores e incapaces", `
      <p><b>1.</b> El consentimiento de los menores e incapaces debe prestarse por ellos mismos si sus <mark class="m-destacable">condiciones de madurez</mark> lo permiten, según la legislación civil.</p>
      <p><b>2.</b> En los demás casos, el consentimiento se otorga por escrito por el <mark class="m-autoridad">representante legal</mark>, que debe ponerlo en conocimiento previo del <mark class="m-autoridad">Ministerio Fiscal</mark>. Si en <mark class="m-plazo">8 días</mark> el Fiscal se opone, resuelve el juez.</p>
    `)

    + articulo("Artículo 4.1 y 4.3 — Legitimación tras el fallecimiento", `
      <p><b>1.</b> El ejercicio de las acciones de protección civil del honor, intimidad o imagen de una persona fallecida corresponde a quien ésta haya designado en su testamento (puede ser persona jurídica).</p>
      <p><b>3.</b> A falta de designación o representante, corresponde al <mark class="m-autoridad">Ministerio Fiscal</mark>, de oficio o a instancia de interesado, siempre que no hayan transcurrido más de <mark class="m-plazo">ochenta años</mark> desde el fallecimiento.</p>
    `)

    + trampa("Trampa de examen — orden de legitimación tras el fallecimiento", "Orden: 1º persona designada en testamento (art. 4.1) → 2º cónyuge, descendientes, ascendientes y hermanos vivos (art. 4.2) → 3º Ministerio Fiscal, límite de 80 años desde el fallecimiento (art. 4.3). No confundir con el plazo de caducidad general de acciones del art. 9.5 (4 años).")

    + bloqueTitulo("CAPÍTULO II. De la protección civil del honor, de la intimidad y de la propia imagen")

    + articulo("Artículo 7 — Intromisiones ilegítimas", `
      <p>Tienen la consideración de intromisiones ilegítimas en el ámbito del art. 2:</p>
      <p>1. Emplazar aparatos de escucha, filmación o dispositivos ópticos aptos para grabar la vida íntima. 2. Utilizar dichos aparatos para conocer la vida íntima, manifestaciones o cartas privadas. 3. <mark class="m-accion">Divulgar</mark> hechos de la vida privada que afecten a la <mark class="m-destacable">reputación</mark>. 4. Revelar datos privados conocidos por actividad profesional u oficial. 5. Captar, reproducir o publicar la imagen de una persona en su vida privada. 6. <mark class="m-accion">Utilizar</mark> el nombre, voz o imagen con fines <mark class="m-destacable">publicitarios o comerciales</mark>. 7. Imputar hechos o juicios de valor que lesionen la dignidad. 8. Utilizar el delito por el condenado para notoriedad o provecho económico.</p>
    `)

    + articulo("Artículo 8 — Excepciones: intromisiones no ilegítimas", `
      <p><b>1.</b> No son intromisiones ilegítimas las actuaciones autorizadas por <mark class="m-autoridad">Autoridad competente</mark>, ni cuando predomine un <mark class="m-destacable">interés histórico, científico o cultural</mark> relevante.</p>
      <p><b>2.</b> El derecho a la propia imagen no impide: a) captación de personas con <mark class="m-destacable">cargo público o proyección pública</mark> en acto público; b) la utilización de la caricatura; c) información gráfica de un suceso público con aparición meramente accesoria. Las excepciones a) y b) no se aplican a quienes requieran el <u class="m-clave">anonimato</u>.</p>
    `)

    + articulo("Artículo 9.1, 9.2, 9.3 y 9.5 — Tutela judicial e indemnización", `
      <p><b>1.</b> La tutela judicial frente a intromisiones ilegítimas se recaba por las vías procesales ordinarias o por el procedimiento del art. 53.2 CE; también cabe el <mark class="m-destacable">recurso de amparo</mark> ante el TC.</p>
      <p><b>3.</b> La existencia de perjuicio <mark class="m-accion">se presume</mark> siempre que se acredite la intromisión ilegítima. La indemnización se extiende al <mark class="m-destacable">daño moral</mark>.</p>
      <p><b>5.</b> Las acciones de protección frente a intromisiones ilegítimas <mark class="m-accion">caducan</mark> transcurridos <mark class="m-plazo">cuatro años</mark> desde que el legitimado pudo ejercitarlas.</p>
    `, true)

    + trampa("Trampa de examen", "No confundir plazos de la LO 1/1982: 8 días (oposición del Fiscal al consentimiento de menores, art. 3.2), 80 años (legitimación del Fiscal tras el fallecimiento, art. 4.3) y 4 años (caducidad de las acciones de protección, art. 9.5).")

    + recuerda([
      "LOTC: En ningún caso se podrá promover cuestión de jurisdicción o competencia al Tribunal Constitucional.",
      "LOTC: El TC está integrado por doce Magistrados.",
      "LOTC: El TC actúa en Pleno, Sala o Sección.",
      "LOTC: La distribución de asuntos entre Salas se hace según un turno establecido por el Pleno a propuesta de su Presidente.",
      "LOTC: Plazo del recurso de amparo del art. 43: veinte días siguientes a la notificación de la resolución judicial.",
      "LOTC: El conocimiento del amparo corresponde a las Salas y, en su caso, a las Secciones.",
      "LOTC: La sentencia de amparo pronuncia otorgamiento o denegación de amparo.",
      "LOTC: La interposición del amparo no suspende los efectos del acto o sentencia impugnados.",
      "LOTC: Las peticiones de indemnización se presentan dentro del plazo de un año a partir de la publicación de la sentencia del TC.",
      "LO 1/1982: El derecho al honor, intimidad y propia imagen es irrenunciable, inalienable e imprescriptible.",
      "LO 1/1982: El consentimiento de menores e incapaces se presta por ellos mismos si sus condiciones de madurez lo permiten.",
      "LO 1/1982: No son intromisiones ilegítimas las actuaciones autorizadas por Autoridad competente, ni cuando predomine un interés histórico, científico o cultural relevante.",
      "LO 1/1982: Se presume siempre la existencia de perjuicio cuando se acredita la intromisión ilegítima."
    ]);
})();

function render(){
  const nav = document.getElementById('nav-temas');
  const lista = document.getElementById('lista-esquemas');
  nav.innerHTML = '<h3>Temas</h3>';
  lista.innerHTML = '';

  if(!esquemas.length){
    lista.innerHTML = '<div class="placeholder">Todavía no hay esquemas. Dime el tema, los artículos o puntos y los voy añadiendo aquí.</div>';
    return;
  }

  esquemas.forEach((es, i) => {
    const navItem = document.createElement('div');
    navItem.className = 'tema-nav-item' + (i===0 ? ' active' : '');
    navItem.textContent = es.tema;
    navItem.onclick = () => mostrar(es.id);
    navItem.dataset.target = es.id;
    nav.appendChild(navItem);

    const div = document.createElement('div');
    div.className = 'esquema' + (i===0 ? ' active' : '');
    div.id = es.id;
    div.innerHTML = `
      <div class="esquema-head">
        <div class="eyebrow">${es.tema}</div>
        <h2>${es.titulo}</h2>
      </div>
      ${es.html}
    `;
    lista.appendChild(div);
  });
}

function mostrar(id){
  document.querySelectorAll('.esquema').forEach(e => e.classList.toggle('active', e.id === id));
  document.querySelectorAll('.tema-nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === id));
}

// ---- TEMA CLARO / OSCURO ----
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeBtn === t));
  try{ localStorage.setItem('esquemas-theme', t); }catch(e){}
}
document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));

let saved = 'light';
try{ saved = localStorage.getItem('esquemas-theme') || 'light'; }catch(e){}
setTheme(saved);

// ---- EXPORTAR A PDF ----
// Usa el diálogo de impresión del navegador (elegir "Guardar como PDF") solo sobre el esquema activo.
document.getElementById('btn-exportar-pdf').addEventListener('click', () => {
  window.print();
});

render();
</script>
