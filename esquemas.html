 exija la situación (…). 2. La disposición precedente <u class=\"m-clave\">no autoriza</u> ninguna derogación al <mark class=\"m-resp\">artículo 2</mark>, <u class=\"m-clave\">salvo</u> para el caso de muertes resultantes de <mark class=\"m-personalizado\">actos lícitos de guerra</mark>, y a los <mark class=\"m-resp\">artículos 3, 4 (párrafo 1) y 7</mark> (tortura, esclavitud o servidumbre y principio de legalidad). 3. (…) tendrá plenamente informado al <mark class=\"m-autoridad\">Secretario general del Consejo de Europa</mark> de las medidas tomadas y de los motivos (…).</p><p><b>Art. 16.</b> Ninguna de las disposiciones de los <mark class=\"m-resp\">artículos 10, 11 y 14</mark> (expresión, reunión y asociación, no discriminación) podrá ser interpuesta en el sentido de que prohíbe a las Altas Partes Contratantes imponer <mark class=\"m-destacable\">restricciones a la actividad política de los extranjeros</mark>.</p>")
  + trampa("Trampa de examen", "SÍ es derogable en caso de guerra el art. 8 (vida privada y familiar). NO lo son el 2 (salvo actos lícitos de guerra), el 3, el 4.1 y el 7.")
  + bloqueTitulo("TÍTULO II. TRIBUNAL EUROPEO DE DERECHOS HUMANOS")
  + articuloResp("Artículos 19 a 23 — Institución, jueces, elección y mandato · R17", ["funciona de manera PERMANENTE","nº de Jueces = nº de Altas Partes","candidatos MENORES DE 65 AÑOS","elegidos por la ASAMBLEA PARLAMENTARIA, por mayoría absoluta, de una lista de TRES","NUEVE AÑOS, NO reelegibles","relevo: los demás jueces por DOS TERCIOS"], "<p><b>Art. 19.</b> Con el fin de asegurar el respeto de los compromisos (…), se instituye un <mark class=\"m-autoridad\">Tribunal Europeo de Derechos Humanos</mark> (…). Funcionará <mark class=\"m-resp\">de manera permanente</mark>.</p><p><b>Art. 20.</b> El Tribunal se compondrá de un número de Jueces <mark class=\"m-resp\">igual al de las Altas Partes Contratantes</mark>.</p><p><b>Art. 21.</b> 1. Los Jueces <u class=\"m-clave\">deberán</u> gozar de la más alta consideración moral (…). 2. Los candidatos <u class=\"m-clave\">deberán</u> ser <mark class=\"m-resp\">menores de 65 años</mark> en la fecha en que la <mark class=\"m-autoridad\">Asamblea Parlamentaria</mark> reciba la lista de tres candidatos (…). 3. Los Jueces formarán parte del tribunal <mark class=\"m-personalizado\">a título individual</mark>. (…)</p><p><b>Art. 22.</b> Los Jueces serán elegidos <mark class=\"m-resp\">por la Asamblea Parlamentaria</mark> en razón de cada Alta Parte Contratante, <mark class=\"m-resp\">por mayoría absoluta de votos</mark>, <mark class=\"m-resp\">de una lista de tres candidatos</mark> presentada por esa Alta Parte Contratante.</p><p><b>Art. 23.</b> 1. Los jueces serán elegidos por un periodo de <mark class=\"m-resp\">nueve años</mark>. <u class=\"m-clave\">No</u> serán <mark class=\"m-resp\">reelegibles</mark>. 2. Los jueces permanecerán en sus funciones hasta su <mark class=\"m-destacable\">sustitución</mark>. <u class=\"m-clave\">No obstante</u>, continuarán conociendo de los asuntos que tengan ya asignados. 3. Un juez <u class=\"m-clave\">sólo</u> podrá ser <mark class=\"m-accion\">relevado</mark> de sus funciones si <mark class=\"m-resp\">los demás jueces deciden, por mayoría de dos tercios</mark>, que dicho juez ha dejado de reunir las condiciones requeridas para serlo.</p>", true)
  + articuloResp("Artículos 25 y 26 — Pleno, juez único, Comités, Salas y Gran Sala", ["Presidente: TRES AÑOS, reelegible","Comités de TRES, Salas de SIETE, Gran Sala de DIECISIETE","reducir Salas a CINCO: Comité de Ministros, por UNANIMIDAD, a solicitud del Pleno","juez único: nunca contra su propio Estado","en la Gran Sala por remisión (art. 43): solo el Presidente de la Sala y el juez nacional"], "<p><b>Art. 25.</b> El Tribunal, reunido en <mark class=\"m-autoridad\">pleno</mark>: a) <mark class=\"m-accion\">Elegirá</mark>, <mark class=\"m-resp\">por un período de tres años</mark>, a su <mark class=\"m-autoridad\">Presidente</mark> y a uno o dos <mark class=\"m-autoridad\">Vicepresidentes</mark>, que serán <mark class=\"m-resp\">reelegibles</mark>; b) constituirá <mark class=\"m-destacable\">Salas</mark> por un período determinado; c) elegirá a los Presidentes de las Salas (…), que serán reelegibles; d) aprobará su reglamento; e) elegirá al <mark class=\"m-autoridad\">Secretario</mark> y a uno o varios Secretarios adjuntos; f) formulará cualquier solicitud con arreglo al párrafo 2 del artículo 26 (reducir a cinco los jueces de Sala).</p><p><b>Art. 26.</b> 1. (…) el Tribunal actuará en formación de: <mark class=\"m-destacable\">juez único</mark>, en <mark class=\"m-resp\">Comités compuestos por tres jueces</mark>, en <mark class=\"m-destacable\">Salas de siete jueces</mark> y en una <mark class=\"m-resp\">Gran Sala de diecisiete jueces</mark>. Las Salas del Tribunal constituirán los Comités por un periodo determinado (el Pleno constituye las Salas y las Salas constituyen los Comités).</p><p><b>2.</b> <u class=\"m-clave\">Cuando</u> el <mark class=\"m-autoridad\">Pleno del Tribunal</mark> así lo solicite, <mark class=\"m-resp\">el Comité de Ministros podrá, por decisión unánime y por un periodo determinado, reducir a cinco el número de jueces de las Salas</mark>.</p><p><b>3.</b> Cuando actúe en formación de juez único, <mark class=\"m-resp\">ningún juez podrá examinar una solicitud contra la Alta Parte Contratante en cuya representación fue elegido</mark> dicho juez.</p><p><b>4.</b> El juez elegido en representación de una Alta Parte Contratante en el litigio será <mark class=\"m-personalizado\">miembro de pleno derecho</mark> de la Sala y de la Gran Sala. (…)</p><p><b>5.</b> Formarán también parte de la Gran Sala: el Presidente del Tribunal, los Vicepresidentes, los Presidentes de las Salas y demás jueces designados (…). Cuando el asunto sea deferido a la Gran Sala en virtud del artículo 43, <u class=\"m-clave\">ningún</u> juez de la Sala que haya dictado la sentencia podrá actuar en la misma, con excepción: <mark class=\"m-resp\">del Presidente de la Sala</mark> (no del Tribunal) <mark class=\"m-resp\">y del Juez que haya intervenido en representación de la Alta Parte Contratante interesada</mark>.</p>")
  + articuloResp("Artículos 27 y 28 — Competencias del juez único y de los Comités", ["juez único: inadmisión o eliminación del registro sin examen complementario","su resolución será DEFINITIVA","Comité por UNANIMIDAD: admitir y dictar sentencia de fondo si hay JURISPRUDENCIA BIEN ESTABLECIDA"], "<p><b>Art. 27.</b> 1. El <mark class=\"m-autoridad\">juez único</mark> <u class=\"m-clave\">podrá</u> declarar <mark class=\"m-personalizado\">inadmisible</mark> o eliminar del registro de asuntos del Tribunal una demanda presentada en virtud del artículo 34 (demandas individuales), <u class=\"m-clave\">cuando</u> pueda adoptarse tal resolución <u class=\"m-clave\">sin</u> tener que proceder a un examen complementario. 2. La resolución <mark class=\"m-resp\">será definitiva</mark>. 3. <u class=\"m-clave\">Si</u> el juez único no declara inadmisible una demanda ni la elimina del registro, (…) remitirá la misma a un Comité o a una Sala para su examen complementario.</p><p><b>Art. 28.</b> 1. Respecto de una demanda presentada en virtud del artículo 34, un <mark class=\"m-autoridad\">Comité</mark> <u class=\"m-clave\">podrá</u>, <mark class=\"m-resp\">por unanimidad</mark>: a) declarar la misma inadmisible o eliminarla del registro de asuntos (…); o b) <mark class=\"m-resp\">declararla admisible y dictar al mismo tiempo sentencia sobre el fondo, si la cuestión subyacente al caso (…) ya ha dado lugar a jurisprudencia bien establecida del Tribunal</mark>. 2. Las resoluciones y sentencias dictadas en virtud del párrafo 1 serán <mark class=\"m-personalizado\">definitivas</mark>.</p><p><i>Recuerda (temario): demandas individuales → juez único o Comité; demandas de Estados → Salas; cuestiones del Comité de Ministros → Gran Sala.</i></p>")
  + articuloResp("Artículos 35 y 36 — Admisibilidad e intervención de terceros", ["agotar las vías internas y CUATRO MESES desde la resolución interna definitiva","sin perjuicio importante → inadmisible, SALVO que el respeto de los derechos humanos exija examinar el fondo","el COMISARIO DE DERECHOS HUMANOS puede presentar observaciones y participar en la vista"], "<p><b>Art. 35.</b> 1. Al Tribunal <u class=\"m-clave\">no</u> podrá recurrirse <u class=\"m-clave\">sino después</u> de agotar las <mark class=\"m-destacable\">vías de recursos internas</mark> (…) y en el <mark class=\"m-resp\">plazo de cuatro meses a partir de la fecha de la resolución interna definitiva</mark>.</p><p><b>2.</b> El Tribunal <u class=\"m-clave\">no</u> admitirá ninguna demanda individual (…) <u class=\"m-clave\">cuando</u>: a) sea <mark class=\"m-personalizado\">anónima</mark>, o b) sea esencialmente la misma que una demanda examinada anteriormente por el Tribunal o ya sometida a otra instancia internacional (…) y no contenga hechos nuevos.</p><p><b>3.</b> El Tribunal declarará <mark class=\"m-personalizado\">inadmisible</mark> cualquier demanda individual (…) si considera que: a) la demanda es incompatible con las disposiciones del Convenio (…), manifiestamente mal fundada o abusiva; o b) el demandante no ha sufrido un <mark class=\"m-destacable\">perjuicio importante</mark>, <mark class=\"m-resp\">a menos que el respeto de los derechos humanos garantizados por el Convenio y por sus Protocolos exija un examen del fondo de la demanda</mark>.</p><p><b>4.</b> El Tribunal rechazará cualquier demanda que considere inadmisible (…). <u class=\"m-clave\">Podrá</u> decidirlo así <mark class=\"m-personalizado\">en cualquier fase del procedimiento</mark>.</p><p><b>Art. 36.</b> 1. En cualquier asunto que se suscite ante una Sala o ante la Gran Sala, la Alta Parte Contratante cuyo nacional sea demandante tendrá derecho a presentar observaciones por escrito y a participar en la vista. (…) 3. En cualquier asunto que se suscite ante una Sala o ante la Gran Sala, <mark class=\"m-resp\">el Comisario de Derechos Humanos del Consejo de Europa</mark> <u class=\"m-clave\">podrá</u> presentar observaciones por escrito y participar en la vista.</p>")
  + trampa("Trampa de examen", "El plazo para acudir al TEDH es hoy de CUATRO meses (antes eran seis).")
  + articuloResp("Artículos 43, 45 y 46 — Remisión a la Gran Sala, opiniones separadas y ejecución de sentencias · R18", ["remisión a la Gran Sala: TRES MESES desde la sentencia de la Sala, en casos excepcionales","acepta: un COLEGIO DE CINCO JUECES de la Gran Sala","sin unanimidad: cualquier Juez puede unir su OPINIÓN POR SEPARADO","ejecución: vela el COMITÉ DE MINISTROS"], "<p><b>Art. 43.</b> 1. En el <mark class=\"m-resp\">plazo de tres meses a partir de la fecha de la sentencia de una Sala</mark>, cualquier parte en el asunto <u class=\"m-clave\">podrá</u> solicitar, <mark class=\"m-personalizado\">en casos excepcionales</mark>, la remisión del asunto ante la <mark class=\"m-autoridad\">Gran Sala</mark>. 2. <mark class=\"m-resp\">Un colegio de cinco Jueces de la Gran Sala</mark> <mark class=\"m-accion\">aceptará</mark> la demanda si el asunto plantea una <mark class=\"m-personalizado\">cuestión grave</mark> relativa a la interpretación o a la aplicación del Convenio (…) o una cuestión grave de carácter general. 3. Si el colegio acepta la demanda, la Gran Sala se pronunciará acerca del asunto mediante <mark class=\"m-destacable\">sentencia</mark>.</p><p><b>Art. 44.</b> 1. La sentencia de la Gran Sala será <mark class=\"m-personalizado\">definitiva</mark>. 2. La sentencia de una Sala será definitiva cuando: a) las partes declaren que no solicitarán la remisión (…), o b) no haya sido solicitada la remisión (…) <mark class=\"m-plazo\">tres meses</mark> después de la fecha de la sentencia, o c) el colegio de la Gran Sala (5 jueces) rechace la demanda de remisión (…). 3. La sentencia definitiva será hecha <mark class=\"m-personalizado\">pública</mark>.</p><p><b>Art. 45.</b> 1. Las sentencias, así como las resoluciones por las que las demandas se declaren admisibles o no admisibles, serán <mark class=\"m-personalizado\">motivadas</mark>. 2. <u class=\"m-clave\">Si</u> la sentencia no expresa en todo o en parte la <mark class=\"m-destacable\">opinión unánime</mark> de los Jueces, cualquier Juez tendrá derecho a <mark class=\"m-resp\">unir a ella su opinión por separado</mark>.</p><p><b>Art. 46.</b> 1. Las Altas Partes Contratantes se comprometen a <mark class=\"m-accion\">acatar</mark> las sentencias definitivas del Tribunal (…). 2. La sentencia definitiva del Tribunal será transmitida al <mark class=\"m-resp\">Comité de Ministros, que velará por su ejecución</mark>. 3. (…) La decisión de remisión al Tribunal (por un problema de interpretación) se tomará por <mark class=\"m-plazo\">mayoría de dos tercios</mark> de los votos de los representantes que tengan derecho a formar parte del Comité. (…)</p>", true)
  + articuloResp("Artículos 47 y 50 — Opiniones consultivas y gastos del Tribunal", ["solicitud de opinión: VOTO MAYORITARIO de los representantes con derecho a intervenir en el Comité","gastos del Tribunal: a cargo del CONSEJO DE EUROPA"], "<p><b>Art. 47.</b> 1. El Tribunal <u class=\"m-clave\">podrá</u> emitir <mark class=\"m-destacable\">opiniones consultivas</mark>, a solicitud del <mark class=\"m-autoridad\">Comité de Ministros</mark>, acerca de cuestiones jurídicas relativas a la interpretación del Convenio y de sus Protocolos. 2. Estas opiniones <u class=\"m-clave\">no</u> podrán referirse ni a las cuestiones que guarden relación con el contenido o la extensión de los derechos y libertades definidos en el Título I (…). 3. La resolución del Comité de Ministros de solicitar una opinión al Tribunal, será adoptada por <mark class=\"m-resp\">voto mayoritario de los representantes que tengan el derecho de intervenir en el Comité</mark>.</p><p><b>Art. 50.</b> Los <mark class=\"m-destacable\">gastos de funcionamiento</mark> del Tribunal correrán a cargo del <mark class=\"m-resp\">Consejo de Europa</mark>.</p><p><b>Art. 51.</b> Los Jueces gozarán (…) de los privilegios e inmunidades previstos en el artículo 40 del Estatuto del Consejo de Europa (…).</p>")
  + bloqueTitulo("TÍTULO III. DISPOSICIONES DIVERSAS")
  + articuloResp("Artículos 56, 58 y 59 — Aplicación territorial, denuncia, firma y ratificación", ["territorios: a partir del TRIGÉSIMO DÍA siguiente a la recepción de la notificación por el Secretario General","denuncia: tras CINCO AÑOS y con PREAVISO DE SEIS MESES","puede adherirse la UNIÓN EUROPEA (no el Comité de Ministros)","vigor: DIEZ instrumentos de ratificación","hecho en Roma el 4 de noviembre de 1950"], "<p><b>Art. 56.</b> 1. Cualquier Estado puede (…) declarar, en notificación dirigida al <mark class=\"m-autoridad\">Secretario general del Consejo de Europa</mark>, que el presente Convenio se aplicará (…) a todos los territorios o a alguno de los territorios de cuyas relaciones internacionales es responsable. 2. El Convenio se aplicará al territorio o territorios designados en la notificación <mark class=\"m-resp\">a partir del trigésimo día siguiente a la fecha en la que el Secretario general del Consejo de Europa haya recibido esta notificación</mark>.</p><p><b>Art. 58.</b> 1. Una Alta Parte Contratante <u class=\"m-clave\">sólo</u> podrá <mark class=\"m-accion\">denunciar</mark> el presente Convenio, <mark class=\"m-resp\">al término de un plazo de cinco años a partir de la fecha de entrada en vigor del Convenio para dicha Parte, y mediante un preaviso de seis meses</mark> dado en una notificación dirigida al Secretario general del Consejo de Europa (…). 3. (…) dejará de ser parte en el presente Convenio toda Alta Parte Contratante que deje de ser miembro del Consejo de Europa.</p><p><b>Art. 59.</b> 1. El presente Convenio está abierto a la firma de los <mark class=\"m-autoridad\">Miembros del Consejo de Europa</mark>. Será ratificado. Las ratificaciones serán depositadas ante el Secretariado general del Consejo de Europa. 2. <mark class=\"m-resp\">La Unión Europea podrá adherirse al presente Convenio</mark>. 3. El presente Convenio entrará en vigor después del depósito de <mark class=\"m-plazo\">diez instrumentos de ratificación</mark>. (…)</p><p>Hecho en <mark class=\"m-resp\">Roma el 4 de noviembre de 1950</mark>, en francés e inglés (…).</p>", true)
  + trampa("Trampa de examen", "Pregunta oficial (art. 59): la INCORRECTA es «El Comité de Ministros podrá adherirse al presente Convenio». Quien puede adherirse es la Unión Europea.")
  + bloqueTitulo("PROTOCOLOS AL CEDH")
  + articuloResp("Protocolo Adicional (París, 20-3-1952) y Protocolo n.º 4 (Estrasburgo, 16-9-1963)", ["elecciones libres a INTERVALOS RAZONABLES con ESCRUTINIO SECRETO","P4: no prisión por la única razón de no poder ejecutar una OBLIGACIÓN CONTRACTUAL","P4 en vigor tras CINCO instrumentos de ratificación"], "<p><b>P. Adicional, art. 3.</b> Las Altas Partes Contratantes se comprometen a organizar, <mark class=\"m-resp\">a intervalos razonables</mark>, <mark class=\"m-destacable\">elecciones libres</mark> <mark class=\"m-resp\">con escrutinio secreto</mark>, en condiciones que garanticen la libre expresión de la opinión del pueblo en la elección del cuerpo legislativo.</p><p><b>P. 4, art. 1.</b> Nadie puede ser privado de su libertad por la <u class=\"m-clave\">única</u> razón de <mark class=\"m-resp\">no poder ejecutar una obligación contractual</mark> (prohibición de prisión por deudas).</p><p><b>P. 4, art. 7.1.</b> (…) Entrará en vigor después del depósito de <mark class=\"m-resp\">cinco instrumentos de ratificación</mark>. (…)</p>")
  + articuloResp("Protocolo n.º 6 (Estrasburgo, 28-4-1983) — Abolición de la pena de muerte", ["P6: abolida la pena de muerte pero NO excluye la de tiempo de guerra o peligro inminente de guerra","el Secretario General notifica: firma, depósito de instrumentos, fechas de entrada en vigor y cualquier otro acto (TODAS)"], "<p><b>Art. 1.</b> Queda abolida la <mark class=\"m-destacable\">pena de muerte</mark>. Nadie podrá ser condenado a tal pena ni ejecutado.</p><p><b>Art. 2.</b> Un Estado <u class=\"m-clave\">podrá</u> prever en su legislación la pena de muerte por actos cometidos <mark class=\"m-resp\">en tiempo de guerra o de peligro inminente de guerra</mark> (…). Dicho Estado comunicará al Secretario General del Consejo de Europa las correspondientes disposiciones (…).</p><p><b>Art. 8.</b> 1. El presente Protocolo entrará en vigor el día primero del mes siguiente a la fecha en que <mark class=\"m-plazo\">cinco Estados</mark> miembros del Consejo de Europa hayan manifestado su consentimiento (…).</p><p><b>Art. 9.</b> El <mark class=\"m-autoridad\">Secretario General del Consejo de Europa</mark> <mark class=\"m-accion\">notificará</mark> a los Estados miembros del Consejo: a) <mark class=\"m-resp\">Cualquier firma</mark>. b) <mark class=\"m-resp\">El depósito de cualquier instrumento de ratificación, aceptación o aprobación</mark>. c) <mark class=\"m-resp\">Cualquier fecha de entrada en vigor</mark> del presente Protocolo (…). d) <mark class=\"m-resp\">Cualquier otro acto, notificación o comunicación</mark> referente al presente Protocolo.</p>", true)
  + articuloResp("Protocolo n.º 7 (Estrasburgo, 22-11-1984) — Expulsión de extranjeros y doble instancia penal", ["extranjero residente legal: expulsión solo por resolución conforme a la ley y podrá hacer valer razones, que se examine su caso y hacerse representar (TODAS)","excepciones a la doble instancia: infracciones de menor gravedad, juzgado por el más alto órgano, o condenado tras recurso contra su absolución"], "<p><b>Art. 1.</b> 1. El <mark class=\"m-autoridad\">extranjero</mark> que <mark class=\"m-personalizado\">resida legalmente</mark> en el territorio de un Estado <u class=\"m-clave\">solamente</u> podrá ser <mark class=\"m-accion\">expulsado</mark> en ejecución de una <mark class=\"m-destacable\">resolución adoptada conforme a la ley</mark>, y <u class=\"m-clave\">deberá</u> poder: a) <mark class=\"m-resp\">hacer valer las razones que se opongan a su expulsión</mark>; b) <mark class=\"m-resp\">hacer que se examine su caso</mark>, y c) <mark class=\"m-resp\">hacerse representar</mark> en esas acciones ante la autoridad competente (…). 2. El extranjero <u class=\"m-clave\">podrá</u> ser expulsado <u class=\"m-clave\">antes</u> de hacer valer estos derechos <u class=\"m-clave\">cuando</u> su expulsión sea necesaria en interés del <mark class=\"m-destacable\">orden público</mark> o se base en motivos de <mark class=\"m-destacable\">seguridad nacional</mark>.</p><p><b>Art. 2.</b> 1. Toda persona declarada culpable de una infracción penal por un tribunal tendrá derecho a hacer que la declaración de culpabilidad o la condena sea examinada por un <mark class=\"m-destacable\">órgano jurisdiccional superior</mark>. (…) 2. Este derecho <u class=\"m-clave\">podrá</u> ser objeto de <mark class=\"m-destacable\">excepciones</mark> para <mark class=\"m-resp\">infracciones penales de menor gravedad</mark> según las define la ley, o <u class=\"m-clave\">cuando</u> el interesado <mark class=\"m-resp\">haya sido juzgado en primera instancia por el más alto órgano jurisdiccional</mark> o <mark class=\"m-resp\">haya sido declarado culpable y condenado a resultas de un recurso contra su absolución</mark>.</p>", true)
  + trampa("Trampa de examen", "NO es excepción a la doble instancia que la pena sea privativa de libertad superior a cinco años (eso no figura en el art. 2.2).")
  + articuloResp("Protocolo n.º 13 (Vilna, 3-5-2002) — Abolición de la pena de muerte en todas las circunstancias", ["entrada en vigor: primer día del mes siguiente a un período de TRES MESES desde que DIEZ Estados consientan"], "<p><b>Art. 1.</b> Queda abolida la <mark class=\"m-destacable\">pena de muerte</mark>. Nadie podrá ser condenado a dicha pena ni ejecutado. <b>Art. 2.</b> <u class=\"m-clave\">No</u> se autoriza <mark class=\"m-destacable\">excepción alguna</mark> (…) en virtud del artículo 15 del Convenio. <b>Art. 3.</b> <u class=\"m-clave\">No</u> se admitirá <mark class=\"m-destacable\">reserva alguna</mark> (…) en virtud del artículo 57 del Convenio.</p><p><b>Art. 7.</b> 1. El presente Protocolo entrará en vigor el primer día del mes siguiente a la expiración de un período de <mark class=\"m-resp\">tres meses</mark> después de la fecha en que <mark class=\"m-plazo\">diez Estados miembros</mark> del Consejo de Europa hayan expresado su consentimiento en quedar vinculados (…).</p>", true)
  + trampa("Trampa de examen", "Pena de muerte: el Protocolo 6 NO la excluye en tiempo de guerra; el Protocolo 13 la abole «en todas las circunstancias». Vigor: P4 = 5 ratificaciones; P6 = 5 Estados (día 1 del mes siguiente); P13 = 10 Estados + 3 meses; CEDH = 10 ratificaciones.");
/* T1_ROMA */ T1.roma = bloqueTitulo("1.5 — ESTATUTO DE ROMA DE LA CORTE PENAL INTERNACIONAL, HECHO EN ROMA EL 17 DE JULIO DE 1998 (en el temario: Partes II, V y IX)")
  + bloqueTitulo("PARTE II. DE LA COMPETENCIA, LA ADMISIBILIDAD Y EL DERECHO APLICABLE")
  + articuloResp("Artículos 5 y 6 — Crímenes de la competencia de la Corte y genocidio · R19", ["genocidio, lesa humanidad, guerra y agresión (NO terrorismo)","genocidio: grupo NACIONAL, ÉTNICO, RACIAL O RELIGIOSO (no político)"], "<p><b>Art. 5.</b> 1. La competencia de la Corte se limitará a los <mark class=\"m-personalizado\">crímenes más graves</mark> de trascendencia para la comunidad internacional en su conjunto. La Corte tendrá competencia (…) respecto de los siguientes crímenes: a) <mark class=\"m-resp\">El crimen de genocidio</mark>; b) <mark class=\"m-resp\">Los crímenes de lesa humanidad</mark>; c) <mark class=\"m-resp\">Los crímenes de guerra</mark>; d) <mark class=\"m-resp\">El crimen de agresión</mark>.</p><p><b>Art. 6.</b> (…) se entenderá por <mark class=\"m-destacable\">«genocidio»</mark> cualquiera de los actos mencionados a continuación, perpetrados con la <mark class=\"m-personalizado\">intención de destruir total o parcialmente</mark> a un <mark class=\"m-resp\">grupo nacional, étnico, racial o religioso</mark> como tal: a) matanza de miembros del grupo; b) lesión grave a la integridad física o mental (…); c) sometimiento intencional del grupo a condiciones de existencia que hayan de acarrear su destrucción física (…); d) medidas destinadas a impedir nacimientos (…); e) traslado por la fuerza de niños del grupo a otro grupo.</p>", true)
  + trampa("Trampa de examen", "El terrorismo NO es crimen de la competencia de la Corte. Y el grupo «político» NO figura en el genocidio.")
  + articuloResp("Artículos 7 y 8 — Lesa humanidad y crímenes de guerra", ["lesa humanidad: ataque GENERALIZADO O SISTEMÁTICO contra una población civil y CON CONOCIMIENTO","«género»: los dos sexos, masculino y femenino, en el contexto de la sociedad","guerra: en particular como parte de un PLAN O POLÍTICA o en gran escala","reclutar niños MENORES DE QUINCE AÑOS"], "<p><b>Art. 7.</b> 1. (…) se entenderá por <mark class=\"m-destacable\">«crimen de lesa humanidad»</mark> cualquiera de los actos siguientes cuando se cometa como parte de un <mark class=\"m-resp\">ataque generalizado o sistemático contra una población civil y con conocimiento de dicho ataque</mark>: a) asesinato; b) exterminio; c) esclavitud; d) deportación o traslado forzoso de población; (…) f) tortura; (…)</p><p><b>3.</b> (…) se entenderá que el término <mark class=\"m-destacable\">«género»</mark> se refiere a <mark class=\"m-resp\">los dos sexos, masculino y femenino, en el contexto de la sociedad</mark>. El término «género» <u class=\"m-clave\">no</u> tendrá más acepción que la que antecede.</p><p><b>Art. 8.</b> 1. La Corte tendrá competencia respecto de los <mark class=\"m-destacable\">crímenes de guerra</mark>, <u class=\"m-clave\">en particular</u>, cuando se cometan como parte de un <mark class=\"m-personalizado\">plan o política</mark> o como parte de la comisión en <mark class=\"m-personalizado\">gran escala</mark> de tales crímenes. 2. (…) b) xxvi) <mark class=\"m-resp\">Reclutar o alistar a niños menores de quince años en las fuerzas armadas nacionales</mark> o utilizarlos para participar activamente en las hostilidades; (…)</p>")
  + articuloResp("Artículo 8 bis y artículo 9 — Crimen de agresión y Elementos de los crímenes", ["actos de agresión según la resolución 3314 (XXIX) de la AG de la ONU, de 14-12-1974","Elementos y sus enmiendas: DOS TERCIOS de los miembros de la Asamblea de los Estados Partes","proponen: cualquier Estado Parte, los magistrados por MAYORÍA ABSOLUTA y el fiscal"], "<p><b>Art. 8 bis.</b> 1. (…) una persona comete un <mark class=\"m-destacable\">«crimen de agresión»</mark> cuando, estando en condiciones de controlar o dirigir efectivamente la acción política o militar de un Estado, <mark class=\"m-accion\">planifica, prepara, inicia o realiza</mark> un <mark class=\"m-destacable\">acto de agresión</mark> que (…) constituya una <mark class=\"m-personalizado\">violación manifiesta</mark> de la Carta de las Naciones Unidas. 2. (…) De conformidad con la <mark class=\"m-resp\">resolución 3314 (XXIX) de la Asamblea General de las Naciones Unidas, de 14 de diciembre de 1974</mark>, cualquiera de los actos siguientes, independientemente de que haya o no declaración de guerra, se caracterizará como acto de agresión: a) la invasión o el ataque (…); b) el bombardeo (…); c) el bloqueo de los puertos o de las costas (…); (…) g) el envío (…) de bandas armadas, grupos irregulares o mercenarios (…).</p><p><b>Art. 9.</b> 1. Los <mark class=\"m-destacable\">Elementos de los Crímenes</mark> ayudarán a la Corte a interpretar y aplicar los artículos 6, 7, 8 y 8 bis (…), serán aprobados por una <mark class=\"m-plazo\">mayoría de dos tercios</mark> de los miembros de la <mark class=\"m-autoridad\">Asamblea de los Estados Partes</mark>. 2. Podrán proponer enmiendas a los Elementos de los crímenes: a) <mark class=\"m-autoridad\">Cualquier Estado Parte</mark>; b) <mark class=\"m-autoridad\">Los magistrados</mark>, por <mark class=\"m-resp\">mayoría absoluta</mark>; c) <mark class=\"m-autoridad\">El fiscal</mark>. Las enmiendas serán aprobadas por una <mark class=\"m-resp\">mayoría de dos tercios</mark> de los miembros de la Asamblea de los Estados Partes.</p>", true)
  + articuloResp("Artículos 11, 12 y 13 — Competencia temporal, condiciones previas y ejercicio de la competencia · R20", ["ÚNICAMENTE crímenes cometidos DESPUÉS de la entrada en vigor del Estatuto","buque o aeronave: Estado de MATRÍCULA","Consejo de Seguridad: con arreglo al CAPÍTULO VII de la Carta de la ONU"], "<p><b>Art. 11.</b> 1. La Corte tendrá competencia <mark class=\"m-resp\">únicamente respecto de crímenes cometidos después de la entrada en vigor del presente Estatuto</mark>. 2. <u class=\"m-clave\">Si</u> un Estado se hace Parte (…) después de su entrada en vigor, la Corte <u class=\"m-clave\">podrá</u> ejercer su competencia <u class=\"m-clave\">únicamente</u> con respecto a los crímenes cometidos después de la entrada en vigor del presente Estatuto respecto de ese Estado, <u class=\"m-clave\">a menos que</u> éste haya hecho una declaración (…) del artículo 12.3.</p><p><b>Art. 12.</b> 1. El Estado que pase a ser Parte (…) acepta por ello la competencia de la Corte (…). 2. En el caso de los apartados a) o c) del artículo 13, la Corte <u class=\"m-clave\">podrá</u> ejercer su competencia si uno o varios de los Estados siguientes son Partes (…): a) El Estado en cuyo territorio haya tenido lugar la conducta (…), o si el crimen se hubiere cometido a bordo de un buque o de una aeronave, <mark class=\"m-resp\">el Estado de matrícula del buque o la aeronave</mark>; b) El Estado del que sea nacional el acusado del crimen.</p><p><b>Art. 13.</b> La Corte <u class=\"m-clave\">podrá</u> ejercer su competencia (…) si: a) un <mark class=\"m-autoridad\">Estado Parte</mark> remite al fiscal (…) una situación (…); b) el <mark class=\"m-autoridad\">Consejo de Seguridad</mark>, actuando con arreglo a lo dispuesto en el <mark class=\"m-resp\">Capítulo VII de la Carta de las Naciones Unidas</mark>, remite al fiscal una situación (…); o c) el <mark class=\"m-autoridad\">fiscal</mark> ha iniciado una investigación (…) de conformidad con el artículo 15.</p>", true)
  + articuloResp("Artículos 15 y 15 bis — El fiscal y el crimen de agresión · R21 R22", ["el fiscal podrá iniciar DE OFICIO una investigación","autorización: SALA DE CUESTIONES PRELIMINARES","agresión: un año después de la ratificación por TREINTA Estados Partes","Estado no Parte: NO competencia sobre agresión de sus nacionales o en su territorio","sin determinación del Consejo en SEIS MESES, el fiscal puede iniciar"], "<p><b>Art. 15.</b> 1. El <mark class=\"m-autoridad\">fiscal</mark> <u class=\"m-clave\">podrá</u> <mark class=\"m-resp\">iniciar de oficio una investigación sobre la base de información acerca de un crimen de la competencia de la Corte</mark>. (…) 3. El fiscal, <u class=\"m-clave\">si</u> llegare a la conclusión de que existe <mark class=\"m-personalizado\">fundamento suficiente</mark> para abrir una investigación, <mark class=\"m-accion\">presentará</mark> a la <mark class=\"m-resp\">Sala de Cuestiones Preliminares</mark> una <mark class=\"m-destacable\">petición de autorización</mark> para ello (…). Las <mark class=\"m-autoridad\">víctimas</mark> <u class=\"m-clave\">podrán</u> presentar observaciones (…). 5. La negativa de la Sala (…) <u class=\"m-clave\">no</u> impedirá que el fiscal presente ulteriormente otra petición basada en nuevos hechos o pruebas (…).</p><p><b>Art. 15 bis.</b> 2. La Corte <u class=\"m-clave\">únicamente</u> podrá ejercer su competencia respecto de <mark class=\"m-destacable\">crímenes de agresión</mark> cometidos <mark class=\"m-resp\">un año después de la ratificación o aceptación de las enmiendas por treinta Estados Partes</mark>. 3. (…) a condición de que se adopte una decisión después del <mark class=\"m-plazo\">1 de enero de 2017</mark> por la misma mayoría (…) que se requiere para la aprobación de una enmienda al Estatuto (mayoría de 2/3). 4. (…) La retirada de esa declaración (…) será considerada por el Estado Parte en un plazo de <mark class=\"m-plazo\">tres años</mark>.</p><p><b>5.</b> Respecto de un <mark class=\"m-autoridad\">Estado no Parte</mark> en el presente Estatuto, la Corte <mark class=\"m-resp\">no ejercerá su competencia respecto del crimen de agresión cuando éste sea cometido por los nacionales de ese Estado o en el territorio del mismo</mark>.</p><p><b>6.</b> El Fiscal (…) verificará en primer lugar si el <mark class=\"m-autoridad\">Consejo de Seguridad</mark> ha determinado la existencia de un acto de agresión (…). 8. <u class=\"m-clave\">Cuando no</u> se realice dicha determinación en el plazo de <mark class=\"m-resp\">seis meses</mark> desde la fecha de notificación, el Fiscal <u class=\"m-clave\">podrá</u> iniciar los procedimientos de investigación respecto de un crimen de agresión, <u class=\"m-clave\">siempre y cuando</u> la Sección de Cuestiones Preliminares (…) haya autorizado el inicio de la investigación (…), y el Consejo de Seguridad no haya decidido lo contrario de conformidad con el artículo 16.</p>")
  + articuloResp("Artículos 16 y 17 — Suspensión por el Consejo de Seguridad y cuestiones de admisibilidad", ["suspensión: DOCE MESES, renovable en las mismas condiciones","incapacidad: colapso total o sustancial de su administración de justicia → no puede hacer comparecer al acusado, no dispone de pruebas o no puede llevar a cabo el juicio"], "<p><b>Art. 16.</b> En caso de que el <mark class=\"m-autoridad\">Consejo de Seguridad</mark>, de conformidad con una resolución aprobada con arreglo a lo dispuesto en el Capítulo VII de la Carta de las Naciones Unidas, pida a la Corte que no inicie o que suspenda <mark class=\"m-resp\">por un plazo de doce meses</mark> la investigación o el enjuiciamiento que haya iniciado, la Corte procederá a esa suspensión; la petición <mark class=\"m-resp\">podrá ser renovada por el Consejo de Seguridad en las mismas condiciones</mark>.</p><p><b>Art. 17.</b> 1. La Corte (…) resolverá la <mark class=\"m-destacable\">inadmisibilidad</mark> de un asunto cuando: a) el asunto sea objeto de una investigación o enjuiciamiento por un Estado que tenga jurisdicción sobre él, <u class=\"m-clave\">salvo</u> que éste no esté dispuesto a llevar a cabo la investigación o el enjuiciamiento o no pueda realmente hacerlo; b) (…); c) la persona de que se trate haya sido ya enjuiciada por la conducta a que se refiere la denuncia (…); d) el asunto no sea de <mark class=\"m-personalizado\">gravedad suficiente</mark> (…).</p><p><b>3.</b> A fin de determinar la <mark class=\"m-destacable\">incapacidad</mark> para investigar o enjuiciar (…), la Corte examinará si el Estado, debido al <mark class=\"m-personalizado\">colapso total o sustancial</mark> de su administración nacional de justicia o al hecho de que carece de ella, <mark class=\"m-resp\">no puede hacer comparecer al acusado, no dispone de las pruebas y los testimonios necesarios o no está por otras razones en condiciones de llevar a cabo el juicio</mark>.</p>")
  + articuloResp("Artículo 18 — Decisiones preliminares relativas a la admisibilidad · R23", ["el Estado informa que investiga dentro del MES SIGUIENTE a la notificación","el fiscal se inhibe a petición del Estado salvo autorización de la Sala","reexamen: al cabo de SEIS MESES o por cambio significativo de circunstancias"], "<p><b>1.</b> (…) el fiscal lo <mark class=\"m-accion\">notificará</mark> a todos los Estados Partes y a aquellos Estados que (…) ejercerían normalmente la jurisdicción sobre los crímenes de que se trate. (…)</p><p><b>2.</b> <mark class=\"m-resp\">Dentro del mes siguiente</mark> a la recepción de dicha notificación, el Estado <u class=\"m-clave\">podrá</u> informar a la Corte que está llevando o ha llevado a cabo una investigación en relación con sus nacionales u otras personas bajo su jurisdicción (…). A petición de dicho Estado, el fiscal se <mark class=\"m-accion\">inhibirá</mark> de su competencia en favor del Estado (…), <u class=\"m-clave\">a menos que</u> la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> decida, a petición del fiscal, autorizar la investigación.</p><p><b>3.</b> El fiscal <u class=\"m-clave\">podrá</u> volver a examinar la cuestión de la inhibición de su competencia <mark class=\"m-resp\">al cabo de seis meses a partir de la fecha de la inhibición o cuando se haya producido un cambio significativo de circunstancias</mark> en vista de que el Estado no está dispuesto a llevar a cabo la investigación o no puede realmente hacerlo.</p><p><b>4.</b> El Estado de que se trate o el fiscal <u class=\"m-clave\">podrán</u> apelar ante la <mark class=\"m-autoridad\">Sala de Apelaciones</mark> de la decisión de la Sala de Cuestiones Preliminares (…). La apelación podrá sustanciarse en forma sumaria.</p>")
  + articuloResp("Artículo 19 — Impugnación de la competencia de la Corte o de la admisibilidad de la causa · R24 R25", ["una sola vez, antes del juicio o a su inicio","al inicio o después: SOLO por el art. 17.1.c) (ya enjuiciado)","antes de confirmar cargos → Sala de Cuestiones Preliminares; después → Sala de Primera Instancia","recurso ante la SALA DE APELACIONES (art. 82)","impugna un Estado (b o c): el fiscal SUSPENDE la investigación"], "<p><b>2.</b> <u class=\"m-clave\">Podrán</u> impugnar la admisibilidad de la causa (…) o impugnar la competencia de la Corte: a) el <mark class=\"m-autoridad\">acusado</mark> o la persona contra la cual se haya dictado una orden de detención o de comparecencia (…); b) un <mark class=\"m-autoridad\">Estado</mark> que tenga jurisdicción en la causa porque está investigándola o enjuiciándola o lo ha hecho antes; o c) un Estado cuya aceptación se requiera de conformidad con el artículo 12.</p><p><b>4.</b> La admisibilidad de una causa o la competencia de la Corte <u class=\"m-clave\">sólo</u> podrán ser impugnadas <mark class=\"m-plazo\">una sola vez</mark> (…). La impugnación se hará <u class=\"m-clave\">antes</u> del juicio o a su inicio. En circunstancias excepcionales, la Corte podrá autorizar que la impugnación se haga más de una vez o en una fase ulterior del juicio. Las impugnaciones (…) hechas al inicio del juicio, o posteriormente con la autorización de la Corte, <mark class=\"m-resp\">sólo podrán fundarse en el párrafo 1.c) del artículo 17</mark> (la persona ya ha sido enjuiciada por la misma conducta).</p><p><b>5.</b> El Estado a que se hace referencia en los apartados b) y c) del párrafo 2 hará la impugnación <mark class=\"m-plazo\">lo antes posible</mark>.</p><p><b>6.</b> <u class=\"m-clave\">Antes</u> de la confirmación de los cargos, la impugnación (…) será asignada a la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark>; <u class=\"m-clave\">después</u> de confirmados los cargos, a la <mark class=\"m-autoridad\">Sala de Primera Instancia</mark>. Las decisiones relativas a la competencia o la admisibilidad podrán ser recurridas ante la <mark class=\"m-resp\">Sala de Apelaciones</mark> de conformidad con el artículo 82.</p><p><b>7.</b> <u class=\"m-clave\">Si</u> la impugnación es hecha por el Estado a que se hace referencia en los apartados b) o c) del párrafo 2, <mark class=\"m-resp\">el fiscal suspenderá la investigación hasta que la Corte resuelva de conformidad con el artículo 17</mark>.</p><p><b>9.</b> La impugnación <u class=\"m-clave\">no</u> afectará a la validez de ningún acto realizado por el fiscal, ni de ninguna orden o mandamiento dictado por la Corte, <u class=\"m-clave\">antes</u> de ella.</p>", true)
  + articuloResp("Artículos 20 y 21 — Cosa juzgada y derecho aplicable", ["no procesa al ya procesado por otro tribunal SALVO que fuera para sustraerle de su responsabilidad o no fuera independiente o imparcial","EN PRIMER LUGAR: el Estatuto, los Elementos de los crímenes y las Reglas de Procedimiento y Prueba"], "<p><b>Art. 20.</b> 1. (…) nadie será procesado por la Corte en razón de conductas constitutivas de crímenes por los cuales ya hubiere sido condenado o absuelto por la Corte. 2. Nadie será procesado por otro tribunal en razón de uno de los crímenes mencionados en el artículo 5 por el cual la Corte ya le hubiere condenado o absuelto. 3. La Corte <u class=\"m-clave\">no</u> procesará a nadie que haya sido procesado por otro tribunal en razón de hechos también prohibidos en virtud de los artículos 6, 7, 8 u 8 bis <u class=\"m-clave\">a menos que</u> el proceso en el otro tribunal: a) <mark class=\"m-resp\">Obedeciera al propósito de sustraer al acusado de su responsabilidad penal</mark> por crímenes de la competencia de la Corte; o b) <mark class=\"m-resp\">No hubiere sido instruido en forma independiente o imparcial</mark> de conformidad con las debidas garantías procesales (…).</p><p><b>Art. 21.</b> 1. La Corte aplicará: a) <u class=\"m-clave\">EN PRIMER LUGAR</u>, <mark class=\"m-resp\">el presente Estatuto, los Elementos de los crímenes y sus Reglas de Procedimiento y Prueba</mark>; b) <u class=\"m-clave\">EN SEGUNDO LUGAR</u>, cuando proceda, los <mark class=\"m-destacable\">tratados aplicables</mark>, los principios y normas del derecho internacional (…); c) <u class=\"m-clave\">EN SU DEFECTO</u>, los <mark class=\"m-destacable\">principios generales del derecho</mark> que derive la Corte del derecho interno de los sistemas jurídicos del mundo (…).</p>")
  + bloqueTitulo("PARTE V. DE LA INVESTIGACIÓN Y EL ENJUICIAMIENTO")
  + articuloResp("Artículos 53 y 54 — Inicio de la investigación y atribuciones del fiscal", ["revisión de oficio por la Sala: SOLO si la decisión se basa ÚNICAMENTE en el «interés de la justicia»","entonces solo surte efecto si la Sala la confirma","el fiscal CONCIERTA (no «solicita») acuerdos para facilitar la cooperación"], "<p><b>Art. 53.</b> 1. El <mark class=\"m-autoridad\">fiscal</mark>, después de evaluar la información de que disponga, <mark class=\"m-accion\">iniciará</mark> una investigación, <u class=\"m-clave\">a menos que</u> determine que no existe <mark class=\"m-personalizado\">fundamento razonable</mark> para proceder a ella (…). Al decidir (…) tendrá en cuenta si: a) (…) fundamento razonable para creer que se ha cometido o se está cometiendo un crimen de la competencia de la Corte; b) la causa es o sería admisible (…); c) existen razones sustanciales para creer que (…) una investigación no redundaría en <mark class=\"m-destacable\">interés de la justicia</mark>. (…)</p><p><b>3.</b> a) A petición del Estado que haya remitido el asunto (…) o del Consejo de Seguridad (…), la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> <u class=\"m-clave\">podrá</u> examinar la decisión del fiscal de no proceder a la investigación (…) y pedir al fiscal que <mark class=\"m-accion\">reconsidere</mark> esa decisión. b) Además, la Sala de Cuestiones Preliminares <u class=\"m-clave\">podrá</u>, <mark class=\"m-resp\">de oficio</mark>, revisar una decisión del fiscal de no proceder a la investigación <mark class=\"m-resp\">si dicha decisión se basare únicamente en el párrafo 1.c), o el párrafo 2.c)</mark> (interés de la justicia). En ese caso, la decisión del fiscal <mark class=\"m-resp\">únicamente surtirá efecto si es confirmada por la Sala de Cuestiones Preliminares</mark>.</p><p><b>4.</b> El fiscal <u class=\"m-clave\">podrá</u> reconsiderar <mark class=\"m-plazo\">en cualquier momento</mark> su decisión de iniciar una investigación o enjuiciamiento sobre la base de nuevos hechos o nuevas informaciones.</p><p><b>Art. 54.</b> 3. El fiscal <u class=\"m-clave\">podrá</u>: a) <mark class=\"m-accion\">Reunir y examinar</mark> pruebas; b) <mark class=\"m-accion\">Hacer comparecer e interrogar</mark> a las personas objeto de investigación, las víctimas y los testigos; c) <mark class=\"m-accion\">Solicitar</mark> la cooperación de un Estado u organización o acuerdo intergubernamental (…); d) <mark class=\"m-resp\">Concertar</mark> las disposiciones o los acuerdos compatibles con el presente Estatuto que sean necesarios para facilitar la cooperación de un Estado, una organización intergubernamental o una persona; e) <mark class=\"m-accion\">Convenir</mark> en que no divulgará (…) los documentos o la información que obtenga a condición de preservar su carácter confidencial (…); f) <mark class=\"m-accion\">Adoptar o pedir</mark> que se adopten las medidas necesarias para asegurar el carácter confidencial de la información (…).</p>", true)
  + trampa("Trampa de examen", "Pregunta oficial (art. 54.3): la INCORRECTA es «SOLICITAR las disposiciones o los acuerdos…». El texto dice CONCERTAR (solicitar es para la cooperación de un Estado, letra c).")
  + articuloResp("Artículos 55 y 57 — Derechos durante la investigación y Sala de Cuestiones Preliminares", ["nadie obligado a declarar contra sí mismo ni a declararse culpable","providencias de los arts. 15, 18, 19, 54.2, 61.7 y 72: MAYORÍA de los magistrados de la Sala"], "<p><b>Art. 55.</b> 1. En las investigaciones (…): a) <mark class=\"m-resp\">Nadie será obligado a declarar contra sí mismo ni a declararse culpable</mark>; b) nadie será sometido a forma alguna de coacción, intimidación o amenaza, a torturas (…); c) quien haya de ser interrogado en un idioma que no sea el que comprende y habla perfectamente contará, <mark class=\"m-personalizado\">sin cargo alguno</mark>, con los servicios de un <mark class=\"m-destacable\">intérprete competente</mark> (…); d) nadie será sometido a arresto o detención arbitrarios (…). 2. (…) b) a <mark class=\"m-destacable\">guardar silencio</mark>, sin que ello pueda tenerse en cuenta a los efectos de determinar su culpabilidad o inocencia; (…) d) a ser interrogada en presencia de su abogado (…).</p><p><b>Art. 57.</b> 2. a) Las providencias u órdenes que la Sala de Cuestiones Preliminares dicte en virtud de los artículos 15, 18 o 19, el párrafo 2 del artículo 54, el párrafo 7 del artículo 61 o el artículo 72, <u class=\"m-clave\">deberán</u> ser aprobadas por <mark class=\"m-resp\">la mayoría de los magistrados que la componen</mark>. b) En todos los demás casos, <mark class=\"m-plazo\">un magistrado</mark> de la Sala de Cuestiones Preliminares <u class=\"m-clave\">podrá</u> ejercer las funciones (…).</p>")
  + articuloResp("Artículos 58 y 59 — Orden de detención o de comparecencia y procedimiento en el Estado de detención · R26", ["la orden de detención sigue en vigor MIENTRAS la Corte no disponga lo contrario","notificación de la orden de comparecencia: PERSONAL","el Estado de detención NO puede examinar si la orden se dictó conforme a derecho (58.1 a y b)","la solicitud de libertad provisional se notifica a la SALA DE CUESTIONES PRELIMINARES"], "<p><b>Art. 58.</b> 1. En cualquier momento después de iniciada la investigación, la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> dictará, a solicitud del fiscal, una <mark class=\"m-destacable\">orden de detención</mark> (…) si (…) estuviere convencida de que: a) hay <mark class=\"m-personalizado\">motivo razonable</mark> para creer que ha cometido un crimen de la competencia de la Corte, y b) la detención parece necesaria para: i) asegurar que la persona comparezca en juicio; ii) asegurar que no obstruya ni ponga en peligro la investigación (…), o iii) (…) impedir que la persona siga cometiendo ese crimen (…).</p><p><b>4.</b> La orden de detención <mark class=\"m-resp\">seguirá en vigor mientras la Corte no disponga lo contrario</mark>.</p><p><b>7.</b> El fiscal <u class=\"m-clave\">podrá</u> pedir a la Sala de Cuestiones Preliminares que, en lugar de una orden de detención, dicte una <mark class=\"m-destacable\">orden de comparecencia</mark>. (…) La notificación de la orden será <mark class=\"m-resp\">personal</mark>.</p><p><b>Art. 59.</b> 1. El Estado Parte que haya recibido una solicitud de detención provisional o de detención y entrega tomará <mark class=\"m-plazo\">inmediatamente</mark> las medidas necesarias para la detención (…). 2. El detenido será llevado <mark class=\"m-plazo\">sin demora</mark> ante la <mark class=\"m-autoridad\">autoridad judicial competente del Estado de detención</mark> (…). 3. El detenido tendrá derecho a solicitar (…) la <mark class=\"m-destacable\">libertad provisional</mark> antes de su entrega.</p><p><b>4.</b> Al decidir la solicitud, la autoridad competente del Estado de detención examinará si, dada la gravedad de los presuntos crímenes, hay <mark class=\"m-personalizado\">circunstancias urgentes y excepcionales</mark> que justifiquen la libertad provisional y si existen las salvaguardias necesarias (…). Esa autoridad <mark class=\"m-resp\">no podrá examinar si la orden de detención fue dictada conforme a derecho con arreglo a los apartados a) y b) del párrafo 1 del artículo 58</mark>.</p><p><b>5.</b> La solicitud de libertad provisional será notificada a la <mark class=\"m-resp\">Sala de Cuestiones Preliminares</mark>, que hará <mark class=\"m-destacable\">recomendaciones</mark> a la autoridad competente del Estado de detención. (…)</p>", true)
  + articuloResp("Artículos 60 y 61 — Primeras diligencias en la Corte y confirmación de los cargos", ["de ser necesario: ORDEN DE DETENCIÓN para hacer comparecer a quien haya sido puesto en libertad","audiencia en presencia del FISCAL, el IMPUTADO y su DEFENSOR","en ausencia: si renunció a estar presente, huyó o no se le encuentra","el imputado puede impugnar cargos y pruebas y presentar pruebas","tras confirmar: el fiscal puede MODIFICAR los cargos con autorización de la Sala","la PRESIDENCIA constituye la Sala de Primera Instancia"], "<p><b>Art. 60.</b> 1. Una vez que el imputado haya sido entregado a la Corte o haya comparecido (…), la Sala de Cuestiones Preliminares se asegurará de que ha sido informado de los crímenes que le son imputados y de los derechos (…), incluido el de pedir la libertad provisional. (…) 4. La Sala (…) se asegurará de que la detención en espera de juicio no se prolongue excesivamente a causa de una demora inexcusable del fiscal. (…)</p><p><b>5.</b> De ser necesario, la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> <u class=\"m-clave\">podrá</u> dictar <mark class=\"m-resp\">una orden de detención para hacer comparecer a una persona que haya sido puesta en libertad</mark>.</p><p><b>Art. 61.</b> 1. (…) dentro de un <mark class=\"m-plazo\">plazo razonable</mark> tras la entrega de la persona a la Corte o su comparecencia voluntaria ante ésta, la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> celebrará una <mark class=\"m-destacable\">audiencia para confirmar los cargos</mark> (…). La audiencia se celebrará <mark class=\"m-resp\">en presencia del fiscal y del imputado, así como de su defensor</mark>.</p><p><b>2.</b> La Sala (…), a solicitud del fiscal o de oficio, <u class=\"m-clave\">podrá</u> celebrar una audiencia <mark class=\"m-personalizado\">en ausencia del acusado</mark> (…) cuando el imputado: a) <mark class=\"m-resp\">haya renunciado a su derecho a estar presente</mark>, o b) <mark class=\"m-resp\">haya huido o no sea posible encontrarlo</mark> y se hayan tomado todas las medidas razonables para asegurar su comparecencia (…).</p><p><b>6.</b> En la audiencia, el imputado <u class=\"m-clave\">podrá</u>: a) <mark class=\"m-accion\">Impugnar</mark> los cargos; b) <mark class=\"m-accion\">Impugnar</mark> las pruebas presentadas por el fiscal, y c) <mark class=\"m-accion\">Presentar</mark> pruebas.</p><p><b>9.</b> Una vez confirmados los cargos y antes de comenzar el juicio, el fiscal, con autorización de la Sala de Cuestiones Preliminares y previa notificación al acusado, <u class=\"m-clave\">podrá</u> <mark class=\"m-resp\">modificar los cargos</mark>. El fiscal, si se propusiera presentar nuevos cargos o sustituirlos por otros más graves, <u class=\"m-clave\">deberá</u> pedir una audiencia (…) para confirmarlos. Una vez comenzado el juicio, el fiscal, con autorización de la Sala de Primera Instancia, podrá <mark class=\"m-accion\">retirar</mark> los cargos.</p><p><b>11.</b> Una vez confirmados los cargos (…), la <mark class=\"m-resp\">Presidencia</mark> constituirá una <mark class=\"m-autoridad\">Sala de Primera Instancia</mark> que (…) se encargará de la siguiente fase del procedimiento (…).</p>", true)
  + trampa("Trampa de examen", "En la audiencia el imputado puede impugnar cargos, impugnar pruebas y presentar pruebas, pero NO «retrasar el juicio». Y el art. 60.5 habla de ORDEN DE DETENCIÓN, no de «arresto domiciliario».")
  + bloqueTitulo("PARTE IX. DE LA COOPERACIÓN INTERNACIONAL Y LA ASISTENCIA JUDICIAL")
  + articuloResp("Artículos 86 y 87 — Obligación general de cooperar y solicitudes de cooperación", ["cooperarán PLENAMENTE","vía diplomática o conducto designado; cuando proceda, también INTERPOL u organización regional","el Estado requerido preserva el carácter CONFIDENCIAL, salvo que su divulgación sea necesaria para tramitarla"], "<p><b>Art. 86.</b> Los Estados Partes (…) cooperarán <mark class=\"m-resp\">plenamente</mark> con la Corte en relación con la investigación y el enjuiciamiento de crímenes de su competencia.</p><p><b>Art. 87.</b> 1. a) La Corte estará facultada para formular <mark class=\"m-destacable\">solicitudes de cooperación</mark> a los Estados Partes. Éstas se transmitirán por <mark class=\"m-destacable\">vía diplomática</mark> o por cualquier otro conducto adecuado que haya designado cada Estado Parte (…). b) Cuando proceda, y <u class=\"m-clave\">sin perjuicio</u> de lo dispuesto en el apartado a), las solicitudes <u class=\"m-clave\">podrán</u> transmitirse también por conducto de la <mark class=\"m-resp\">Organización Internacional de Policía Criminal o de cualquier organización regional competente</mark>.</p><p><b>2.</b> Las solicitudes (…) estarán redactadas en un idioma oficial del Estado requerido, o acompañados de una traducción a ese idioma, o a uno de los idiomas de trabajo de la Corte (…).</p><p><b>3.</b> El Estado requerido <mark class=\"m-resp\">preservará el carácter confidencial de toda solicitud de cooperación y de los documentos que las justifiquen, salvo en la medida en que su divulgación sea necesaria para tramitarla</mark>.</p>", true)
  + articuloResp("Artículo 89 — Entrega de personas a la Corte y tránsito", ["cosa juzgada: consultas INMEDIATAS con la Corte","vía aérea SIN aterrizaje previsto: NO se requiere autorización de tránsito","aterrizaje imprevisto: detención máxima de 96 HORAS si no llega la solicitud"], "<p><b>2.</b> <u class=\"m-clave\">Cuando</u> la persona cuya entrega se pida la impugne ante un tribunal nacional oponiendo la <mark class=\"m-destacable\">excepción de cosa juzgada</mark> (…), el Estado requerido celebrará <mark class=\"m-plazo\">de inmediato</mark> consultas con la Corte (…). Si la causa es admisible, el Estado requerido cumplirá la solicitud. Si está pendiente la decisión sobre la admisibilidad, el Estado requerido <u class=\"m-clave\">podrá</u> aplazar la ejecución de la solicitud de entrega (…).</p><p><b>3.</b> a) El Estado Parte autorizará (…) el <mark class=\"m-destacable\">tránsito</mark> por su territorio de una persona que otro Estado entregue a la Corte, <u class=\"m-clave\">salvo</u> cuando el tránsito por ese Estado obstaculice o demore la entrega; (…) c) la persona transportada permanecerá detenida durante el tránsito; d) <u class=\"m-clave\">No</u> se requerirá autorización alguna <mark class=\"m-resp\">cuando la persona sea transportada por vía aérea y no se prevea aterrizar en el territorio del Estado de tránsito</mark>; e) En caso de <mark class=\"m-personalizado\">aterrizaje imprevisto</mark> (…), el Estado de tránsito detendrá a la persona transportada mientras se recibe la solicitud de la Corte (…); sin embargo, la detención <u class=\"m-clave\">no</u> podrá prolongarse más de <mark class=\"m-resp\">96 horas</mark> contadas desde el aterrizaje imprevisto si la solicitud no es recibida dentro de ese plazo.</p>")
  + articuloResp("Artículo 90 — Solicitudes concurrentes", ["Estado requirente PARTE: prioridad a la Corte si declaró admisible la causa","requirente NO PARTE y sin obligación de extraditar: prioridad a la Corte si la causa era admisible","inadmisible y luego se deniega la extradición: el requerido NOTIFICA SU DECISIÓN A LA CORTE"], "<p><b>1.</b> El Estado Parte que haya recibido una solicitud de la Corte relativa a la entrega de una persona (…), y reciba además una solicitud de cualquier otro Estado relativa a la <mark class=\"m-destacable\">extradición</mark> de la misma persona por la misma conducta (…), <mark class=\"m-accion\">notificará</mark> a la Corte y al Estado requirente ese hecho.</p><p><b>2.</b> Si el <mark class=\"m-personalizado\">Estado requirente es un Estado Parte</mark>, el Estado requerido <mark class=\"m-accion\">dará prioridad</mark> a la solicitud de la Corte cuando ésta: a) haya determinado (…) que la causa (…) es admisible (…); o b) adopte la decisión a que se refiere el apartado a) como consecuencia de la notificación (…).</p><p><b>4.</b> <u class=\"m-clave\">Si</u> el <mark class=\"m-personalizado\">Estado requirente no es parte</mark> en el presente Estatuto, el Estado requerido, en caso de que <mark class=\"m-resp\">no esté obligado por alguna norma internacional a conceder la extradición</mark> al Estado requirente, <mark class=\"m-resp\">dará prioridad a la solicitud de entrega que le haya hecho la Corte si ésta ha determinado que la causa era admisible</mark>.</p><p><b>8.</b> <u class=\"m-clave\">Cuando</u>, como consecuencia de una notificación efectuada con arreglo al presente artículo, la Corte haya determinado la <mark class=\"m-personalizado\">inadmisibilidad</mark> de una causa y posteriormente se deniegue la extradición al Estado requirente, <mark class=\"m-resp\">el Estado requerido notificará su decisión a la Corte</mark>.</p>", true)
  + trampa("Trampa de examen", "Ojo al «no»: en el art. 90.4 la Corte tiene prioridad cuando el requerido NO está obligado a extraditar. Y la notificación del 90.8 es a la Corte, no al Parlamento.")
  + articuloResp("Artículos 91 y 92 — Solicitud de detención y entrega y detención provisional · R27", ["detención y entrega: por escrito (en urgencia, por cualquier medio con constancia escrita)","detención provisional: identificación y paradero, exposición concisa de crímenes y hechos INCLUSIVE, de ser posible, FECHA Y LUGAR, declaración de que existe orden de detención o condena y de que se presentará solicitud de entrega"], "<p><b>Art. 91.</b> 1. La solicitud de detención y entrega <u class=\"m-clave\">deberá</u> formularse <mark class=\"m-personalizado\">por escrito</mark>. En caso de urgencia, se <u class=\"m-clave\">podrá</u> hacer por cualquier otro medio que permita dejar constancia escrita, a condición de que la solicitud sea confirmada (…). 2. (…) deberá contener (…): a) información suficiente para la identificación de la persona buscada y datos sobre su probable paradero; b) una copia de la orden de detención; y c) los documentos, las declaraciones o la información que sean necesarios para cumplir los requisitos de procedimiento del Estado requerido (…); sin embargo, esos requisitos <u class=\"m-clave\">no</u> podrán ser más onerosos que los aplicables a las solicitudes de extradición (…).</p><p><b>Art. 92.</b> 1. En caso de <mark class=\"m-personalizado\">urgencia</mark>, la Corte <u class=\"m-clave\">podrá</u> solicitar la <mark class=\"m-destacable\">detención provisional</mark> de la persona buscada hasta que se presente la solicitud de entrega (…). 2. La solicitud de detención provisional deberá hacerse por cualquier medio que permita dejar constancia escrita y contendrá: a) información suficiente para identificar a la persona buscada y datos sobre su probable paradero; b) una exposición concisa de los crímenes por los que se pida la detención y de los hechos que presuntamente serían constitutivos de esos crímenes, <mark class=\"m-resp\">inclusive, de ser posible, la indicación de la fecha y el lugar en que se cometieron</mark>; c) una declaración de que existe una orden de detención o una decisión final condenatoria (…), y d) una declaración de que se presentará una solicitud de entrega (…).</p>", true)
  + trampa("Trampa de examen", "Pregunta oficial (art. 92.2): la INCORRECTA es la que dice «SALVO la indicación de la fecha y el lugar». El texto dice «INCLUSIVE, de ser posible».")
  + articuloResp("Artículo 93 — Otras formas de cooperación", ["podrá no dar lugar (art. 72) ÚNICAMENTE si afecta a su SEGURIDAD NACIONAL","si no se da lugar: comunicar SIN DEMORA los MOTIVOS a la Corte o al fiscal","información bajo control de un tercer Estado u organización (93.9.b): la Corte se dirige a ellos","art. 93.10: la Corte puede ayudar a un Estado Parte que investiga"], "<p><b>4.</b> El Estado Parte <u class=\"m-clave\">podrá no</u> dar lugar a una solicitud de asistencia, en su totalidad o en parte, de conformidad con el artículo 72 y <mark class=\"m-resp\">únicamente si la solicitud se refiere a la presentación de documentos o la divulgación de pruebas que afecten a su seguridad nacional</mark>.</p><p><b>5.</b> <u class=\"m-clave\">Antes</u> de denegar una solicitud de asistencia (…), el Estado requerido considerará si se puede prestar la asistencia con sujeción a ciertas condiciones, o si es posible hacerlo en una fecha posterior o de otra manera. (…)</p><p><b>6.</b> <u class=\"m-clave\">Si no</u> se da lugar a una solicitud de asistencia, el Estado Parte requerido <u class=\"m-clave\">deberá</u> comunicar <mark class=\"m-plazo\">sin demora</mark> <mark class=\"m-resp\">los motivos a la Corte o al fiscal</mark>.</p><p><b>7.</b> a) La Corte <u class=\"m-clave\">podrá</u> solicitar el <mark class=\"m-destacable\">traslado provisional</mark> de un detenido (…) siempre que: i) el detenido dé, libremente y con conocimiento de causa, su consentimiento, y ii) el Estado requerido lo acepte (…).</p><p><b>9.</b> b) (…) cuando la solicitud de la Corte se refiera a información, bienes o personas que estén sometidos al control de un <mark class=\"m-personalizado\">tercer Estado o de una organización internacional</mark> en virtud de un acuerdo internacional, el Estado requerido lo comunicará a la Corte y la Corte dirigirá su solicitud al tercer Estado o a la organización internacional.</p><p><b>10.</b> a) A solicitud de un Estado Parte que lleve a cabo una investigación o sustancie un juicio por una conducta que constituya un crimen de la competencia de la Corte o (…) un crimen grave con arreglo al derecho interno del Estado requirente, la Corte <u class=\"m-clave\">podrá</u> cooperar con él y prestarle asistencia (es la «cooperación activa» del art. 3 LO 18/2003).</p>", true)
  + articuloResp("Artículos 100, 101 y 102 — Gastos, principio de la especialidad y términos empleados", ["gastos ORDINARIOS en su territorio: a cargo del Estado requerido (salvo los que asume la Corte)","especialidad: no procesado por conducta ANTERIOR a la entrega salvo que sea la base del delito","«entrega» = de un Estado A LA CORTE; «extradición» = de un Estado a otro Estado"], "<p><b>Art. 100.</b> 1. <mark class=\"m-resp\">Los gastos ordinarios que se deriven del cumplimiento de las solicitudes en el territorio del Estado requerido correrán a cargo de éste</mark>, con excepción de los siguientes, que correrán a cargo de la Corte: a) gastos relacionados con el viaje y la seguridad de los testigos y peritos, o el traslado (…) de personas detenidas; b) gastos de traducción, interpretación y transcripción; c) gastos de viaje y dietas de los magistrados, el fiscal (…); d) costo de los informes o dictámenes periciales solicitados por la Corte; e) gastos relacionados con el transporte de la persona que entregue a la Corte un Estado de detención, y f) previa consulta, todos los gastos extraordinarios (…).</p><p><b>Art. 101.</b> 1. Quien haya sido entregado a la Corte (…) <mark class=\"m-resp\">no será procesado, castigado o detenido por una conducta anterior a su entrega, a menos que ésta constituya la base del delito por el cual haya sido entregado</mark>. 2. La Corte <u class=\"m-clave\">podrá</u> pedir al Estado que hizo la entrega que la <mark class=\"m-accion\">dispense</mark> del cumplimiento de los requisitos establecidos en el párrafo 1 (…). Los Estados Partes estarán facultados para dar esa dispensa a la Corte y procurarán hacerlo.</p><p><b>Art. 102.</b> A los efectos del presente Estatuto: a) por <mark class=\"m-destacable\">«entrega»</mark> se entenderá <mark class=\"m-resp\">la entrega de una persona por un Estado a la Corte de conformidad con lo dispuesto en el presente Estatuto</mark>. b) por <mark class=\"m-destacable\">«extradición»</mark> se entenderá la entrega de una persona por un Estado a otro Estado de conformidad con lo dispuesto en un tratado o convención o en el derecho interno.</p>", true);
/* T1_ACUERDO */ T1.acuerdo = bloqueTitulo("1.6 — ACUERDO SOBRE PRIVILEGIOS E INMUNIDADES DE LA CORTE PENAL INTERNACIONAL, HECHO EN NUEVA YORK EL 9 DE SEPTIEMBRE DE 2002")
  + articuloResp("Artículos 1, 2, 4, 5, 6 y 7 — Términos, personalidad, locales, pabellón, inmunidad y archivos · R30", ["Presidencia: Presidente y Vicepresidentes PRIMERO Y SEGUNDO","personalidad jurídica INTERNACIONAL","locales INVIOLABLES","pabellón en sus locales y vehículos oficiales","la renuncia a la inmunidad NO se extiende a ninguna medida de ejecución","archivos INVIOLABLES"], "<p><b>Art. 1.</b> g) Por <mark class=\"m-destacable\">«la Presidencia»</mark> se entenderá el órgano integrado por <mark class=\"m-resp\">el Presidente y los Vicepresidentes primero y segundo de la Corte</mark>; (…) j) por «el Secretario» se entenderá el Secretario elegido por la Corte (…); l) por «abogados» se entenderán los abogados defensores y los representantes legales de las víctimas; m) por «Secretario General» se entenderá el Secretario General de las Naciones Unidas (…).</p><p><b>Art. 2.</b> La Corte tendrá <mark class=\"m-resp\">personalidad jurídica internacional y tendrá también la capacidad jurídica que sea necesaria para el desempeño de sus funciones</mark> y el cumplimiento de sus propósitos. (…) celebrar contratos, adquirir bienes muebles e inmuebles y disponer de ellos y participar en procedimientos judiciales.</p><p><b>Art. 4.</b> Los <mark class=\"m-destacable\">locales de la Corte</mark> serán <mark class=\"m-resp\">inviolables</mark>.</p><p><b>Art. 5.</b> La Corte tendrá derecho a enarbolar su <mark class=\"m-destacable\">pabellón</mark> y a exhibir su <mark class=\"m-destacable\">emblema</mark> y sus señales <mark class=\"m-resp\">en sus locales y en los vehículos y otros medios de transporte que utilice con fines oficiales</mark>.</p><p><b>Art. 6.</b> 1. La Corte y sus bienes, haberes y fondos (…) gozarán de <mark class=\"m-destacable\">inmunidad de jurisdicción</mark> en todas sus formas, <u class=\"m-clave\">salvo</u> en la medida en que la Corte <mark class=\"m-accion\">renuncie expresamente</mark> a ella en un caso determinado. Se entenderá, sin embargo, que la renuncia <mark class=\"m-resp\">no será extensible a ninguna medida de ejecución</mark>. 2. (…) gozarán de inmunidad de allanamiento, incautación, requisa, decomiso y expropiación (…).</p><p><b>Art. 7.</b> Los <mark class=\"m-destacable\">archivos</mark> de la Corte y, en general, todos los papeles y documentos, cualquiera sea su forma (…), dondequiera y en poder de quienquiera que se hallen, serán <mark class=\"m-resp\">inviolables</mark>. (…)</p>", true)
  + trampa("Trampa de examen", "Las preguntas citan a veces otra numeración (p. ej. «art. 6» para los locales). En el temario: locales = art. 4; inmunidad = art. 6; archivos = art. 7.")
  + articuloResp("Artículos 8 y 10 — Impuestos y fondos (disposiciones monetarias) · R31", ["no puede reclamar la exención de los gravámenes que sean REMUNERACIÓN DE SERVICIOS PÚBLICOS a tarifa fija","sin controles financieros","tipo de cambio: trato NO MENOS favorable que a cualquier organización intergubernamental o misión diplomática"], "<p><b>Art. 8.</b> 1. La Corte (…) estarán exentos de todos los <mark class=\"m-destacable\">impuestos directos</mark> (…). Se entenderá, sin embargo, que la Corte <u class=\"m-clave\">no</u> podrá reclamar la exención del pago de los gravámenes que constituyan de hecho <mark class=\"m-resp\">la remuneración de servicios públicos prestados a una tarifa fija</mark> según la cantidad de servicios prestados (…). 2. La Corte estará exenta de <mark class=\"m-destacable\">derechos de aduana</mark> (…) respecto de los artículos que importe o exporte para su uso oficial y respecto de sus publicaciones.</p><p><b>Art. 10.</b> 1. La Corte <u class=\"m-clave\">no</u> quedará sometida a <mark class=\"m-destacable\">controles financieros</mark>, reglamentos o moratorias financieros de índole alguna en el desempeño de sus funciones y <u class=\"m-clave\">podrá</u>: a) tener fondos, moneda de cualquier tipo u oro y operar cuentas en cualquier moneda; b) transferir libremente sus fondos, oro o moneda de un país a otro o dentro de un país y convertir a cualesquiera otras las monedas que tenga en su poder; c) recibir, tener, negociar, transferir o convertir bonos u otros títulos financieros o realizar cualquier transacción con ellos; d) las transacciones financieras de la Corte gozarán, en cuanto al tipo de cambio, de un <mark class=\"m-resp\">trato no menos favorable</mark> que el que otorgue el Estado Parte de que se trate a cualquier organización intergubernamental o misión diplomática.</p>", true)

  + articuloResp("Artículo 32 — Arreglo de diferencias sobre la interpretación o aplicación del Acuerdo", ["primero: CONSULTAS, NEGOCIACIÓN u otro medio convenido","sin solución en TRES MESES: TRIBUNAL ARBITRAL (arbitraje)","3 árbitros","si una parte no nombra en DOS MESES: lo nombra el PRESIDENTE DE LA CORTE INTERNACIONAL DE JUSTICIA"], "<p><b>1.</b> Todas las diferencias que surjan de la interpretación o aplicación del presente Acuerdo entre dos o más Estados Partes o entre la Corte y un Estado Parte serán resueltas <mark class=\"m-resp\">mediante consultas, negociación u otro medio convenido de arreglo</mark>.</p><p><b>2.</b> La diferencia, de no ser resuelta (…) dentro de los <mark class=\"m-plazo\">tres meses</mark> siguientes a la presentación de una solicitud por escrito (…), será, a petición de cualquiera de las partes, sometida a un <mark class=\"m-resp\">tribunal arbitral</mark> (…).</p><p><b>3.</b> El tribunal arbitral estará compuesto de <mark class=\"m-plazo\">tres árbitros</mark>: uno será elegido por cada parte en la diferencia y el tercero, que actuará como presidente del tribunal, será elegido por los otros dos. <u class=\"m-clave\">Si</u> una de las partes no hubiere nombrado a un árbitro (…) dentro de los <mark class=\"m-plazo\">dos meses</mark> siguientes al nombramiento de un árbitro por la otra parte, ésta <u class=\"m-clave\">podrá</u> pedir al <mark class=\"m-resp\">Presidente de la Corte Internacional de Justicia</mark> que efectúe dicho nombramiento. (…)</p><p><b>5.</b> El tribunal arbitral (…) adoptará sus decisiones por <mark class=\"m-plazo\">mayoría de votos</mark> (…). El laudo del tribunal arbitral será <mark class=\"m-personalizado\">definitivo y obligatorio</mark> para las partes en la diferencia.</p>", true)

  + articuloResp("Antecedentes y declaraciones históricas", ["primer antecedente: CILINDRO DE CIRO","primer documento moderno: CARTA MAGNA (1215)","primera manifestación moderna: Declaración de Independencia de EE. UU. (1776)","Declaración de Derechos del Hombre y del Ciudadano: FRANCIA, 1789 (Revolución francesa)"], "<p><b>Primer antecedente directo</b> del concepto moderno de derechos humanos: el <mark class=\"m-resp\">Cilindro de Ciro</mark>. <b>Primer documento moderno</b> de defensa de los derechos humanos: la <mark class=\"m-resp\">Carta Magna de 1215</mark>. El concepto de «derechos humanos» surge en el <mark class=\"m-resp\">siglo XIX</mark>.</p><p><b>Primera manifestación moderna</b>: la <mark class=\"m-resp\">Declaración de Independencia de los EE. UU.</mark>, aprobada en <mark class=\"m-plazo\">1776</mark>.</p><p><b>Declaración de los Derechos del Hombre y del Ciudadano</b>: <mark class=\"m-resp\">Francia, 1789</mark>, documento fundamental de la <mark class=\"m-resp\">Revolución francesa</mark>; la que más influyó en la independencia latinoamericana y en Europa. La ley es la expresión de <mark class=\"m-resp\">la voluntad general</mark> (art. 6) y solo puede prohibir las acciones nocivas para <mark class=\"m-resp\">la sociedad</mark> (art. 5).</p>")
  + articuloResp("Sociedad de Naciones y Naciones Unidas", ["precursor de la ONU: SOCIEDAD DE NACIONES","Italia bombardeó con gases a ETIOPÍA en 1935","Carta de la ONU: 26 DE JUNIO DE 1945 (San Francisco)","art. 13: la Asamblea General promueve la cooperación","el Consejo Económico y Social supervisaba la Comisión de DH (hoy CONSEJO DE DERECHOS HUMANOS, 2006)"], "<p>Precursor de las Naciones Unidas: la <mark class=\"m-resp\">Sociedad de Naciones (SDN)</mark>. Con el pretexto de evitar la guerra, la SDN consintió que Italia bombardease con gases tóxicos a <mark class=\"m-resp\">Etiopía en 1935</mark>, pese a la prohibición del Protocolo de Ginebra de <mark class=\"m-resp\">1925</mark> (las preguntas también lo fechan en 1928).</p><p>La <mark class=\"m-destacable\">Carta de las Naciones Unidas</mark> se firmó el <mark class=\"m-resp\">26 de junio de 1945</mark> (la ONU se crea en <mark class=\"m-plazo\">1945</mark>); la Conferencia de San Francisco tuvo por finalidad <mark class=\"m-resp\">preparar una organización internacional cuyo objetivo principal fuese mantener la paz y la seguridad internacional</mark>. Es el <mark class=\"m-resp\">primer instrumento internacional de derechos humanos</mark>. Su <mark class=\"m-resp\">artículo 13</mark> faculta a la Asamblea General para hacer recomendaciones (…) y contribuir a hacer efectivos los derechos humanos.</p><p>La antigua Comisión de Derechos Humanos dependía del Consejo Económico y Social; en 2006 la sustituyó el <mark class=\"m-resp\">Consejo de Derechos Humanos</mark>.</p>")
  + articuloResp("Declaración Universal de Derechos Humanos (DUDH)", ["proclamada el 10 DE DICIEMBRE DE 1948","resolución 217 A (III)","primera redacción: Comité de 18 miembros","NO jurídicamente vinculante","Carta Internacional de DH: DUDH + los dos Pactos de 1966 + Protocolos facultativos"], "<p>Adoptada y proclamada por la <mark class=\"m-autoridad\">Asamblea General</mark> en su resolución <mark class=\"m-resp\">217 A (III)</mark> el <mark class=\"m-resp\">10 de diciembre de 1948</mark> (por eso el 10 de diciembre es el Día de los Derechos Humanos). Su primera redacción se encomendó a <mark class=\"m-resp\">un Comité de 18 miembros</mark>. <u class=\"m-clave\">No</u> es un instrumento jurídicamente vinculante, sino una <mark class=\"m-resp\">declaración</mark> (soft law).</p><p>Art. 1: todos los seres humanos nacen libres e iguales en dignidad y derechos (…) y deben comportarse <mark class=\"m-resp\">fraternalmente los unos con los otros</mark>. Art. 2: sin distinción de raza, color, sexo, idioma, religión… Art. 12: protección contra los ataques a su <mark class=\"m-resp\">vida privada, su familia, su domicilio, su honra y su reputación</mark>. Art. 13.1: circular libremente y elegir <mark class=\"m-resp\">su residencia en el territorio de un Estado</mark>. Art. 14: en caso de persecución, <mark class=\"m-resp\">buscar asilo y disfrutar de él en cualquier país</mark>. Art. 16: a partir de la edad núbil, <mark class=\"m-resp\">casarse y fundar una familia</mark>; matrimonio <mark class=\"m-resp\">solo mediante libre y pleno consentimiento de los futuros esposos</mark>. Art. 17: <mark class=\"m-resp\">propiedad</mark>. Art. 21.1: participar en el gobierno <mark class=\"m-resp\">directamente o por medio de representantes libremente elegidos</mark>. Art. 22: <mark class=\"m-resp\">Seguridad Social</mark>. Art. 23.2: <mark class=\"m-resp\">igual salario por trabajo igual</mark>. Art. 24: descanso, limitación de la jornada y <mark class=\"m-resp\">vacaciones periódicas pagadas</mark>. Art. 25.1: nivel de vida adecuado (salud, alimentación, vestido, vivienda, asistencia médica…). Art. 26: derecho a la <mark class=\"m-resp\">educación</mark>; la instrucción elemental será <mark class=\"m-resp\">obligatoria y gratuita</mark>; su objeto: el pleno desarrollo de la personalidad y el respeto a <mark class=\"m-resp\">los derechos humanos y las libertades fundamentales</mark>. Art. 27: tomar parte en <mark class=\"m-resp\">la vida cultural de la comunidad</mark>. Art. 28: un orden social e internacional en el que <mark class=\"m-resp\">los derechos y libertades de la Declaración se hagan plenamente efectivos</mark>. Art. 29.1: deberes respecto a <mark class=\"m-resp\">la comunidad</mark> (en la app: «la sociedad»).</p><p><b>Carta Internacional de Derechos Humanos</b> = <mark class=\"m-resp\">DUDH + Pacto Internacional de Derechos Civiles y Políticos + Pacto Internacional de Derechos Económicos, Sociales y Culturales + Protocolos facultativos</mark>. Los dos Pactos se aprobaron en <mark class=\"m-resp\">1966</mark> y entraron en vigor en <mark class=\"m-resp\">1976</mark>; NO son soft law (el PIDCP es vinculante). El preámbulo del PIDCP: el ideal del ser humano libre exige gozar de los derechos civiles y políticos, a la par que de <mark class=\"m-resp\">sus derechos económicos, sociales y culturales</mark>. La universalidad se concreta en <mark class=\"m-resp\">los Pactos Internacionales de 1966</mark>.</p>")
  + articuloResp("Generaciones y características de los derechos humanos", ["doctrina de las generaciones: KAREL VASAK","1.ª civiles y políticos (el hombre frente al Estado)","2.ª económicos, sociales y culturales (educación, trabajo, derechos colectivos)","3.ª paz, solidaridad, medio ambiente (no vinculantes)","los derechos humanos NO son absolutos"], "<p>La doctrina de las tres generaciones fue acuñada por <mark class=\"m-resp\">Karel Vasak</mark>. <b>Primera generación</b>: <mark class=\"m-resp\">derechos civiles y políticos</mark> = <mark class=\"m-resp\">el derecho del hombre frente al Estado</mark>. <b>Segunda generación</b>: <mark class=\"m-resp\">derechos económicos, sociales y culturales</mark> y <mark class=\"m-resp\">derechos colectivos y del hombre en la sociedad</mark> (p. ej. <mark class=\"m-resp\">educación</mark>, trabajo). <b>Tercera generación</b>: <mark class=\"m-resp\">paz, solidaridad, medio ambiente sano</mark>; es la que <mark class=\"m-resp\">no tiene carácter vinculante</mark>. El derecho al trabajo NO es de tercera generación.</p><p>Derecho humano: facultades <mark class=\"m-resp\">inherentes a la condición humana, por el mero hecho de ser persona</mark>. Características: <mark class=\"m-resp\">universalidad</mark> (para todos y en todos los lugares), <mark class=\"m-resp\">inalienabilidad</mark> (no se puede disponer de ellos, ni total ni parcialmente), <mark class=\"m-resp\">irrenunciabilidad</mark> (nadie puede desprenderse de ellos, ni por su propia voluntad), <mark class=\"m-resp\">inviolabilidad</mark> (no pueden ser lesionados en su goce), <mark class=\"m-resp\">progresividad</mark> (no pueden ser disminuidos). <u class=\"m-clave\">No</u> son absolutos.</p>");
