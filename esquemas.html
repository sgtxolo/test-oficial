<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Esquemas de Estudio</title>
<meta name="theme-color" content="#1c4d3c"><link rel="manifest" href="manifest-esquemas.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Esquemas"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --fondo:#f5f4ee;
  --panel:#ffffff;
  --panel-alt:#eeece3;
  --texto:#1f2a24;
  --texto-gris:#767a70;
  --borde:#e2e0d5;
  --verde-osc:#163f30;
  --verde:#1c4d3c;
  --verde-med:#2f6b52;
  --verde-suave:#e7efe8;
  --examen-bg:#fff4d6;
  --examen-borde:#e0a800;
  --examen-txt:#7a5b00;
  --radio:18px;
  --radio-sm:12px;
  font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
[data-theme="dark"]{
  --fondo:#141917;
  --panel:#1e2523;
  --panel-alt:#262f2b;
  --texto:#eef1ee;
  --texto-gris:#9aa39c;
  --borde:#333d37;
  --verde-osc:#7fd9ac;
  --verde:#3f8a68;
  --verde-med:#57a683;
  --verde-suave:#16332a;
  --examen-bg:#3a2f12;
  --examen-borde:#e0a800;
  --examen-txt:#f0c95a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body,html{margin:0;padding:0;background:var(--fondo);color:var(--texto)}
#app{max-width:none;width:100%;margin:0 auto;min-height:100vh;padding:18px 28px 60px}
.btn-volver{display:none}
h1,h2,h3{margin:0;color:var(--verde-osc);font-family:Georgia,'Times New Roman',serif}
p{margin:0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;position:sticky;top:0;background:var(--fondo);padding:10px 0;z-index:10}
.topbar h1{font-size:22px}
.theme-toggle{display:flex;background:var(--panel-alt);border-radius:20px;padding:4px;gap:2px}
.theme-btn{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--texto-gris);cursor:pointer;font-family:inherit}
.theme-btn.active{background:var(--panel);color:var(--verde-osc)}

.layout{display:flex;gap:20px;align-items:flex-start}
.sidebar{width:220px;flex:none;background:var(--panel);border-radius:var(--radio);padding:14px;position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-y:auto}
.sidebar h3{font-size:12px;letter-spacing:1px;color:var(--texto-gris);text-transform:uppercase;margin-bottom:10px}
.tema-nav-item{display:block;padding:10px 12px;border-radius:var(--radio-sm);font-size:14px;font-weight:600;color:var(--texto);cursor:pointer;margin-bottom:4px}
.tema-nav-item:hover{background:var(--panel-alt)}
.tema-nav-item.active{background:var(--verde-suave);color:var(--verde-osc)}

.content{flex:1;min-width:0}
.esquema{background:var(--panel);border-radius:var(--radio);padding:24px;margin-bottom:18px;display:none}
.esquema.active{display:block}
.esquema-head{margin-bottom:16px;border-bottom:1px solid var(--borde);padding-bottom:14px}
.esquema-head .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--texto-gris);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.esquema-head h2{font-size:24px}

.bloque{margin-bottom:18px}
.bloque h3{font-size:16px;color:var(--verde-med);margin-bottom:8px}
.bloque ul{margin:0;padding-left:20px}
.bloque li{font-size:14.5px;line-height:1.6;color:var(--texto);margin-bottom:6px}

.placeholder{text-align:center;color:var(--texto-gris);padding:60px 20px;font-size:14.5px}

/* ---- Método Prefortia: leyenda de colores ---- */
.leyenda{display:flex;flex-wrap:wrap;gap:14px;background:var(--panel-alt);border-radius:var(--radio-sm);padding:10px 14px;margin-bottom:18px}
.leyenda span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--texto)}
.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.leyenda i.lc-destacable{background:#f7c9a8}
.leyenda i.lc-autoridad{background:#bfe3c4}
.leyenda i.lc-plazo{background:#a9d3ea}
.leyenda i.lc-accion{background:#c9b7e0}
.leyenda i.lc-personalizado{background:#f7e79a}
.leyenda i.lc-clave{background:none;border-bottom:3px solid #d1332a;border-radius:0;width:16px}

/* ---- Marcado inline por categorías (subrayados de color) ---- */
mark.m-destacable{background:#f7c9a8;color:#3a2213;padding:1px 3px;border-radius:3px}
mark.m-autoridad{background:#bfe3c4;color:#173a1e;padding:1px 3px;border-radius:3px}
mark.m-plazo{background:#a9d3ea;color:#0f2c3d;padding:1px 3px;border-radius:3px}
mark.m-accion{background:#c9b7e0;color:#2c1c40;padding:1px 3px;border-radius:3px}
mark.m-personalizado{background:#f7e79a;color:#463a04;padding:1px 3px;border-radius:3px}
mark.m-resp{background:#fff3cf;color:#b3001b;font-weight:800;padding:0 3px;border-radius:4px;box-shadow:inset 0 0 0 1.5px #d4a017}
[data-theme="dark"] mark.m-resp{background:#3d2a05;color:#ff8a80;box-shadow:inset 0 0 0 1.5px #e0b030}
.leyenda i.lc-resp{background:#fff3cf;border:2px solid #d4a017}
.resp-strip{background:#fff8e6;border-bottom:1px dashed #d4a017;padding:8px 14px;font-size:12.5px;line-height:1.8;color:#5a4300}
.resp-strip b{color:#b3001b;margin-right:4px}
.resp-strip span{display:inline-block;background:#fff;border:1px solid #e6c46a;border-radius:10px;padding:0 8px;margin:2px 4px 2px 0;color:#7a1010;font-weight:700}
[data-theme="dark"] .resp-strip{background:#2e2610;color:#f0d890}
[data-theme="dark"] .resp-strip span{background:#3d2a05;border-color:#806020;color:#ffb4a8}
u.m-clave{text-decoration:underline;text-decoration-color:#d1332a;text-decoration-thickness:2px;text-underline-offset:2px}
[data-theme="dark"] mark.m-destacable{background:#6b3d1f;color:#ffd9b8}
[data-theme="dark"] mark.m-autoridad{background:#265331;color:#c9f0cf}
[data-theme="dark"] mark.m-plazo{background:#1f4a63;color:#c8e9fb}
[data-theme="dark"] mark.m-accion{background:#4a3768;color:#e6d9fa}
[data-theme="dark"] mark.m-personalizado{background:#5a4a12;color:#fff0b0}

/* ---- Título de artículo ---- */
.articulo{margin-bottom:16px;border:1px solid var(--borde);border-radius:var(--radio-sm);overflow:hidden}
.articulo-head{background:var(--panel-alt);padding:8px 14px;font-weight:800;font-size:14px;color:var(--verde-osc)}
.articulo-body{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.articulo-body .txt{flex:1;font-size:14px;line-height:1.7}
.articulo-body .txt p{margin-bottom:6px}
.sello-examen{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid #d1332a;color:#d1332a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;transform:rotate(-8deg)}
.margen-nota{font-size:11px;color:var(--verde-med);font-weight:700;line-height:1.4;text-align:right;max-width:150px;border-left:2px dashed var(--borde);padding-left:8px;flex:none}

.bloque-titulo{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:#555;color:#fff;padding:6px 12px;border-radius:8px;margin:22px 0 12px}
[data-theme="dark"] .bloque-titulo{background:#3a4640}

.trampa{background:var(--examen-bg);border:1.5px dashed var(--examen-borde);border-radius:var(--radio-sm);padding:12px 16px;margin:14px 0}
.trampa b{color:var(--examen-txt);display:block;margin-bottom:4px;font-size:13.5px}
.trampa p{font-size:13.5px;line-height:1.5;color:var(--examen-txt)}

.recuerda{background:var(--verde-suave);border:1.5px solid var(--verde-med);border-radius:var(--radio-sm);padding:14px 18px;margin-top:20px}
.recuerda b.titulo-recuerda{display:block;color:var(--verde-osc);font-size:15px;margin-bottom:8px}
.recuerda ul{margin:0;padding-left:18px}
.recuerda li{font-size:13.5px;line-height:1.6;color:var(--texto);margin-bottom:5px}

.btn-pdf{display:flex;align-items:center;gap:6px;border:1.5px solid var(--verde-med);background:transparent;color:var(--verde-med);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-pdf:hover{background:var(--verde-suave)}

@media (max-width:720px){
  #app{max-width:820px;padding:18px 18px 60px}
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;max-height:none}
  .sidebar h3{width:100%}
  .topbar{flex-wrap:wrap}
  .content{width:100%;display:none}
  body.ver-esquema .content{display:block}
  body.ver-esquema .sidebar{display:none}
  .btn-volver{display:block;position:sticky;top:64px;z-index:9;margin:0 0 12px;border:none;background:var(--verde);color:#fff;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
}

/* iPhone/móvil en horizontal: misma vista a pantalla completa que en vertical */
@media (orientation:landscape) and (max-height:540px){
  #app{max-width:none;padding:6px 16px 40px}
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;max-height:none}
  .topbar{position:static;flex-wrap:wrap;margin-bottom:8px;padding:4px 0}
  .content{width:100%;display:none}
  body.ver-esquema .content{display:block}
  body.ver-esquema .sidebar{display:none}
  body.ver-esquema .topbar{display:none}
  .btn-volver{display:block;position:sticky;top:6px;z-index:9;margin:0 0 10px;border:none;background:var(--verde);color:#fff;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
}

@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  body,html{background:#fff}
  .topbar,.sidebar,.btn-pdf,.btn-volver{display:none!important}
  .content{display:block!important}
  .layout{display:block}
  .content{width:100%}
  .esquema{display:none!important;box-shadow:none;border-radius:0;padding:0}
  .esquema.active{display:block!important}
  .articulo{break-inside:avoid}
  .trampa,.recuerda{break-inside:avoid}
}
/* ---- LECTOR DE VOZ ---- */
.voz-bar{display:none}
body.ver-esquema .voz-bar{display:flex}
.voz-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1.5px solid var(--borde);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.voz-bar button{border:none;background:var(--verde);color:#fff;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;font-family:inherit}
.voz-bar button.sec{background:var(--verde-suave);color:var(--verde-osc);width:42px;height:42px;font-size:17px}
.voz-bar select{border:1.5px solid var(--borde);background:var(--panel-alt);color:var(--texto);border-radius:12px;padding:8px;font-size:13px;font-family:inherit;max-width:44vw}
.voz-info{width:100%;text-align:center;font-size:12px;color:var(--texto-gris);margin-top:-2px}
body.ver-esquema #app{padding-bottom:130px}
.leyendo{outline:3px solid var(--examen-borde);outline-offset:3px;border-radius:6px;background:var(--examen-bg)}
@media print{.voz-bar{display:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>📚 Esquemas de Estudio</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-pdf" id="btn-exportar-pdf">⬇️ PDF</button>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme-btn="light">Claro</button>
        <button class="theme-btn" data-theme-btn="dark">Oscuro</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="nav-temas">
      <h3>Temas</h3>
      <!-- Los temas se listan aquí automáticamente -->
    </div>

    <div class="content">
      <button class="btn-volver" id="btn-volver">← Temas</button>
      <div id="lista-esquemas">
        <!-- Los esquemas se insertan aquí -->
      </div>
    </div>
  </div>
</div>

<div class="voz-bar" id="voz-bar">
  <button class="sec" id="voz-ant" title="Anterior">⏮</button>
  <button id="voz-play" title="Escuchar / pausar">▶</button>
  <button class="sec" id="voz-sig" title="Siguiente">⏭</button>
  <button class="sec" id="voz-stop" title="Parar">⏹</button>
  <select id="voz-modo" title="Qué leer"><option value="todo">Todo el esquema</option><option value="resumen">Solo respuestas y resumen</option></select>
  <select id="voz-vel" title="Velocidad"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option></select>
  <select id="voz-voz" title="Voz"></select>
  <div class="voz-info" id="voz-info"></div>
</div>
<script>
// ---- ESQUEMAS ----
// Cada esquema es un objeto: { id, tema, titulo, bloques: [{ titulo, puntos: [{texto, examen:true/false}] }] }
// Los 27 temas del programa (Materias Profesionales) están precargados como pendientes.
// Se van rellenando uno a uno con los artículos/puntos que se vayan indicando.
const temasPrograma = [
  "TEMA 1.- DERECHOS HUMANOS",
  "TEMA 2.- TERRORISMO Y DELINCUENCIA TRANSNACIONAL",
  "TEMA 3.- TRATADOS DE LA UNIÓN EUROPEA",
  "TEMA 4.- LA GESTIÓN DE LAS FRONTERAS DE LA UNIÓN EUROPEA",
  "TEMA 5.- BASES DE DATOS EUROPEAS",
  "TEMA 6.- ENTRADA Y PERMANENCIA DE EXTRANJEROS EN ESPAÑA",
  "TEMA 7.- DERECHOS Y DEBERES FUNDAMENTALES EN LA CE Y SU PROTECCIÓN",
  "TEMA 8.- PODER JUDICIAL",
  "TEMA 9.- DEFENSA NACIONAL",
  "TEMA 10.- DERECHO CIVIL",
  "TEMA 11.- DERECHO ADMINISTRATIVO",
  "TEMA 12.- GOBIERNO Y ADMINISTRACIÓN",
  "TEMA 13.- JURISDICCIÓN CONTENCIOSO-ADMINISTRATIVA",
  "TEMA 14.- EL DEFENSOR DEL PUEBLO",
  "TEMA 15.- PROTECCIÓN INTEGRAL CONTRA LA VIOLENCIA DE GÉNERO",
  "TEMA 16.- IGUALDAD EFECTIVA Y ACOSO SEXUAL/POR RAZÓN DE SEXO",
  "TEMA 17.- RESPONSABILIDAD PENAL DE LOS MENORES",
  "TEMA 18.- DERECHO PENAL. PARTE GENERAL",
  "TEMA 19.- DERECHO PENAL. PARTE ESPECIAL",
  "TEMA 20.- DERECHO PROCESAL PENAL (I)",
  "TEMA 21.- DERECHO PROCESAL PENAL (II) - NORMAS COMPLEMENTARIAS",
  "TEMA 22.- SEGURIDAD CIUDADANA",
  "TEMA 23.- SEGURIDAD PRIVADA",
  "TEMA 24.- ESTRUCTURAS ORGÁNICAS BÁSICAS",
  "TEMA 25.- COORDINACIÓN Y COOPERACIÓN POLICIAL",
  "TEMA 26.- ESTATUTO DEL PERSONAL DE LA GUARDIA CIVIL",
  "TEMA 27.- DEONTOLOGÍA PROFESIONAL"
];

// Helpers para construir el HTML de un esquema con el estilo Método Prefortia
function leyenda(){
  return `<div class="leyenda">
    <span><i class="lc-destacable"></i>Palabras destacables</span>
    <span><i class="lc-autoridad"></i>Autoridades y cargos públicos</span>
    <span><i class="lc-plazo"></i>Plazos</span>
    <span><i class="lc-accion"></i>Acciones</span>
    <span><i class="lc-personalizado"></i>Personalizado</span>
    <span><i class="lc-clave"></i>Palabras clave</span>
    <span><i class="lc-resp"></i>Respuesta del test</span>
  </div>`;
}
function bloqueTitulo(t){ return `<div class="bloque-titulo">${t}</div>`; }
function articulo(cab, html, examen){
  return `<div class="articulo">
    <div class="articulo-head">${cab}</div>
    <div class="articulo-body">
      <div class="txt">${html}</div>
      ${examen ? '<div class="sello-examen">EX</div>' : ''}
    </div>
  </div>`;
}
function articuloResp(cab, resps, html, examen){
  return `<div class="articulo">
    <div class="articulo-head">${cab}</div>
    ${resps && resps.length ? `<div class="resp-strip"><b>🎯 Respuestas:</b>${resps.map(r => `<span>${r}</span>`).join("")}</div>` : ""}
    <div class="articulo-body">
      <div class="txt">${html}</div>
      ${examen ? "<div class=\"sello-examen\">EX</div>" : ""}
    </div>
  </div>`;
}
function trampa(titulo, html){
  return `<div class="trampa"><b>⚠ ${titulo || 'Trampa de examen'}</b><p>${html}</p></div>`;
}
function recuerda(items){
  return `<div class="recuerda"><b class="titulo-recuerda">✔ RECUERDA — Resumen conceptual y puntos clave de examen</b>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
  </div>`;
}

// Datos base: cada esquema tiene un campo `html` con el contenido ya maquetado.
const esquemas = temasPrograma.map((tema, i) => ({
  id: "tema-" + (i + 1),
  tema: tema,
  titulo: "Pendiente de rellenar",
  html: leyenda() + `<div class="placeholder">Dicta los artículos y puntos de este tema para generar el esquema rápido en el estilo Método Prefortia.</div>`
}));

// ---- TEMA 7 (relleno con los artículos y puntos dictados, texto legal real) ----
(function(){
  const t7 = esquemas[6];
  t7.titulo = "7.1 y 7.2 — Resumen esquemático";
  t7.html = leyenda()

    + bloqueTitulo("LEY ORGÁNICA 2/1979, DEL TRIBUNAL CONSTITUCIONAL — TÍTULO I, CAPÍTULO I: Organización y atribuciones")

    + articulo("Artículo 2 — Competencias del Tribunal Constitucional", `
      <p><b>1.</b> <mark class="m-accion">El Tribunal Constitucional conocerá</mark> en los <mark class="m-destacable">casos y en la forma</mark> que esta Ley determina:</p>
      <p>a) Del <mark class="m-destacable">recurso y de la cuestión de inconstitucionalidad</mark> contra <mark class="m-personalizado">Leyes, disposiciones normativas o actos con fuerza de Ley</mark>.</p>
      <p><mark class="m-personalizado">b) Del recurso de amparo</mark> por <mark class="m-accion">violación</mark> de los <mark class="m-destacable">derechos y libertades públicos</mark> relacionados en el art. 53.2 CE (protección de los derechos y libertades fundamentales).</p>
      <p>c) De los <mark class="m-destacable">conflictos constitucionales de competencia</mark> entre el <mark class="m-autoridad">Estado</mark> y las <mark class="m-autoridad">CC.AA.</mark> o de los de éstas entre sí.</p>
      <p>d) De los <mark class="m-destacable">conflictos entre los órganos constitucionales</mark> del Estado. d bis) De los <mark class="m-destacable">conflictos en defensa de la autonomía local</mark>.</p>
      <p>e) De la <mark class="m-destacable">declaración sobre la constitucionalidad de los tratados internacionales</mark>. e bis) Del <mark class="m-destacable">control previo de inconstitucionalidad</mark> del art. 79 LOTC (control previo de Tratados internacionales).</p>
      <p>f) De las <mark class="m-destacable">impugnaciones</mark> previstas en el art. 161.2 CE (suspensión de disposiciones y resoluciones de las CC.AA. impugnadas por el Gobierno).</p>
      <p><mark class="m-personalizado">g) De la verificación de los nombramientos</mark> de los <mark class="m-autoridad">Magistrados del Tribunal Constitucional</mark>, para <mark class="m-accion">juzgar</mark> si reúnen los <mark class="m-destacable">requisitos</mark> exigidos por la Constitución y esta Ley.</p>
      <p>h) De las <mark class="m-destacable">demás materias</mark> que le atribuyen la <mark class="m-autoridad">Constitución</mark> y las <mark class="m-autoridad">Leyes orgánicas</mark>.</p>
      <p><b>2.</b> El <mark class="m-autoridad">TC</mark> <mark class="m-accion">podrá dictar</mark> <mark class="m-destacable">reglamentos</mark> sobre su propio funcionamiento y organización, <u class="m-clave">así como</u> sobre el <mark class="m-destacable">régimen de su personal y servicios</mark>. Estos reglamentos deberán ser <mark class="m-accion">aprobados</mark> por el Tribunal en <mark class="m-autoridad">Pleno</mark> y se <mark class="m-accion">publicarán</mark> en el <mark class="m-destacable">BOE</mark>, autorizados por su <mark class="m-autoridad">Presidente</mark>.</p>
    `)

    + articulo("Artículo 3 — Competencia sobre cuestiones prejudiciales", `
      <p><mark class="m-destacable">La competencia</mark> del <mark class="m-autoridad">Tribunal Constitucional</mark> <mark class="m-accion">se extiende</mark> al <mark class="m-accion">conocimiento y decisión</mark> de las <mark class="m-destacable">cuestiones prejudiciales e incidentales</mark> <u class="m-clave">no</u> pertenecientes al <mark class="m-destacable">orden constitucional</mark>, <mark class="m-personalizado">directamente relacionadas</mark> con la materia de que conoce, a los <mark class="m-personalizado">solos efectos</mark> del <mark class="m-personalizado">enjuiciamiento constitucional</mark> de ésta.</p>
    `)

function render(){
  const nav = document.getElementById('nav-temas');
  const lista = document.getElementById('lista-esquemas');
  nav.innerHTML = '<h3>Temas</h3>';
  lista.innerHTML = '';

  if(!esquemas.length){
    lista.innerHTML = '<div class="placeholder">Todavía no hay esquemas. Dime el tema, los artículos o puntos y los voy añadiendo aquí.</div>';
    return;
  }

  esquemas.forEach((es, i) => {
    const navItem = document.createElement('div');
    navItem.className = 'tema-nav-item' + (i===0 ? ' active' : '');
    navItem.textContent = es.tema;
    navItem.onclick = () => mostrar(es.id);
    navItem.dataset.target = es.id;
    nav.appendChild(navItem);

    const div = document.createElement('div');
    div.className = 'esquema' + (i===0 ? ' active' : '');
    div.id = es.id;
    div.innerHTML = `
      <div class="esquema-head">
        <div class="eyebrow">${es.tema}</div>
        <h2>${es.titulo}</h2>
      </div>
      ${es.html}
    `;
    lista.appendChild(div);
  });
}

function mostrar(id){
  document.querySelectorAll('.esquema').forEach(e => e.classList.toggle('active', e.id === id));
  document.querySelectorAll('.tema-nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === id));
  document.body.classList.add('ver-esquema');
  window.scrollTo(0,0);
}
document.getElementById('btn-volver').onclick = () => { document.body.classList.remove('ver-esquema'); window.scrollTo(0,0); };

os del derecho a la libre circulación</mark>»: los ciudadanos de la Unión (art. 20.1 TFUE); los nacionales de terceros países miembros de la familia de un ciudadano de la Unión (…) (Directiva 2004/38/CE); los nacionales de terceros países y los miembros de su familia (…) que en virtud de acuerdos (…) gocen de derechos en materia de libre circulación equivalentes a los de los ciudadanos de la Unión;</p><p>6) «<mark class=\"m-destacable\">nacional de un tercer país</mark>»: <mark class=\"m-resp\">toda persona que no sea ciudadano de la Unión en el sentido del artículo 20, apartado 1 del TFUE y que no esté cubierta por el punto 5</mark>;</p><p>7) «<mark class=\"m-destacable\">persona inscrita como no admisible</mark>»: todo nacional de un tercer país inscrito <mark class=\"m-resp\">en el SIS de acuerdo con lo dispuesto en los artículos 24 y 26 del Reglamento (CE) n.º 1987/2006</mark>;</p><p>8) «<mark class=\"m-destacable\">paso fronterizo</mark>»: <mark class=\"m-resp\">todo paso habilitado por las autoridades competentes para cruzar las fronteras exteriores</mark>;</p><p>9) «<mark class=\"m-destacable\">paso fronterizo conjunto</mark>»: un paso fronterizo, situado bien en el territorio de un Estado miembro bien en el territorio de un tercer Estado, en el que <mark class=\"m-resp\">los agentes de la guardia de fronteras de un Estado miembro y de un tercer Estado realizan inspecciones sucesivas de entrada y salida</mark>, de acuerdo con su derecho interno y <mark class=\"m-resp\">al amparo de un acuerdo bilateral</mark>;</p><p>10) «<mark class=\"m-destacable\">control fronterizo</mark>»: la actividad realizada en las fronteras (…) que (…) obedezca a la intención de cruzar la frontera o en el propio acto de cruzarla y que consista en la realización de <mark class=\"m-personalizado\">inspecciones fronterizas</mark> y de <mark class=\"m-personalizado\">actividades de vigilancia de fronteras</mark>;</p><p>11) «<mark class=\"m-destacable\">inspecciones fronterizas</mark>»: <   + articuloResp("Artículo 5 — Cruce de las fronteras exteriores · R2", ["por los pasos fronterizos y durante las horas de apertura","horas indicadas si no abre 24 h","exención con autorizaciones y sin conflicto con orden público","sanciones efectivas, proporcionadas y disuasorias","instrumentalización: cerrar temporalmente pasos"], "<p><b>1.</b> Las fronteras exteriores <u class=\"m-clave\">solo</u> podrán cruzarse <mark class=\"m-resp\">por los pasos fronterizos y durante las horas de apertura establecidas</mark>. Las horas de apertura estarán indicadas claramente en todo paso fronterizo <mark class=\"m-resp\">que no esté abierto las 24 horas del día</mark>. (…)</p><p><b>2.</b> (…) podrá eximirse de la obligación de cruzar las fronteras exteriores únicamente por los pasos fronterizos y durante las horas de apertura establecidas a: a) personas o grupos de personas, en el supuesto de que exista alguna <mark class=\"m-personalizado\">necesidad especial</mark> para el cruce ocasional (…), siempre que <mark class=\"m-resp\">estén en posesión de las autorizaciones requeridas por el Derecho interno y no haya conflicto con intereses de orden público o seguridad interior</mark> de los Estados miembros. (…) b) personas o grupos de personas, en el supuesto de que se dé alguna <mark class=\"m-personalizado\">situación imprevista de emergencia</mark>; (…)</p><p><b>3.</b> (…) los Estados miembros fijarán <mark class=\"m-destacable\">sanciones</mark>, de conformidad con su Derecho interno, en el caso de cruce no autorizado de las fronteras exteriores (…). Las sanciones serán: <mark class=\"m-resp\">efectivas, proporcionadas y disuasorias</mark>.</p><p><b>4.</b> En una situación de <mark class=\"m-destacable\">instrumentalización de los migrantes</mark> (…) los Estados miembros podrán, en particular, <mark class=\"m-resp\">cerrar temporalmente pasos fronterizos específicos</mark> notificados (…) cuando las circunstancias así lo exijan. (…)</p>", true)

 seguridad interior, la salud pública o las relaciones internacionales de ninguno de los Estados miembros (…);</p><p><b>f)</b> facilitar los <mark class=\"m-destacable\">datos biométricos</mark>, de ser necesario para: i) <mark class=\"m-resp\">la creación del expediente individual en el SES</mark> (…), ii) <mark class=\"m-resp\">la realización de inspecciones fronterizas</mark> (…).</p><p><b>6.2.</b> (…) la <mark class=\"m-resp\">fecha de entrada se considerará como primer día de estancia</mark> en el territorio de los Estados miembros, y la <mark class=\"m-resp\">fecha de salida como último día</mark> de estancia (…). <u class=\"m-clave\">No</u> se tendrán en cuenta para el cálculo de la duración de la estancia (…) <mark class=\"m-resp\">los períodos de estancia autorizados por medio de un visado nacional de larga duración o de un permiso de residencia</mark>.</p><p><b>6.4.</b> El criterio para calcular los medios de subsistencia estará en función de la duración y del motivo de la estancia y se usarán como referencia los precios medios en el Estado o Estados miembros de que se trate del alojamiento y de la alimentación, <mark class=\"m-resp\">en hospedaje económico multiplicado por el número de días de estancia</mark>. (…) La comprobación de los medios de subsistencia suficientes podrá basarse en <mark class=\"m-resp\">el dinero efectivo, los cheques de viaje y las tarjetas de crédito</mark> que obren en poder del nacional de un tercer país. (…)</p><p><b>6.5.b)</b> (…) En caso de que no fuera posible colocar el visado en el documento, se adherirá la etiqueta, <mark class=\"m-resp\">con carácter excepcional, en una hoja suelta</mark> que se incorporará al documento. En tal caso, se utilizará obligatoriamente el modelo uniforme de impreso (…) establecido por el <mark class=\"m-resp\">Reglamento (CE) n.º 333/2002</mark> del Consejo;</p><p><b>6.5.c)</b> por motivos <mark class=\"m-personalizado\">humanitarios, de interés nacional o por obligaciones internacionales</mark>, todo Estado miembro podrá autorizar la entrada en su territorio a nacionales de terceros países que no cumplan alguna de las condiciones (…). En tales casos, cuando un nacional de un tercer país esté inscrito como no admisible (…), el Estado miembro que le autorice la entrada en su territorio <mark class=\"m-resp\">informará de ello a los demás Estados miembros</mark>.</p><p><b>6 bis.3.</b> <u class=\"m-clave\">No</u> se introducirán en el SES datos sobre las siguientes categorías de personas: (…) f) <mark class=\"m-resp\">nacionales de Andorra, Mónaco y San Marino y titulares de un pasaporte expedido por el Estado de la Ciudad del Vaticano</mark>; (…)</p>", true)
  + articuloResp("Artículo 7 — Realización de inspecciones fronterizas · R3", ["dignidad humana, en particular personas vulnerables","proporcionada","no discriminará"], "<p><b>1.</b> En el desempeño de sus funciones, la <mark class=\"m-autoridad\">guardia de fronteras</mark> velará por el pleno respeto de la <mark class=\"m-destacable\">dignidad humana</mark>, en particular en los casos relativos a <mark class=\"m-resp\">personas vulnerables</mark>.</p><p>Toda medida que adopte en el desempeño de sus obligaciones será <mark class=\"m-destacable\">proporcionada</mark> a los objetivos perseguidos por dichas medidas.</p><p><b>2.</b> En la realización de inspecciones fronterizas, la guardia de fronteras <u class=\"m-clave\">no discriminará</u> a las personas por motivos de sexo, origen racial o étnico, religión o convicciones, discapacidad, edad u orientación sexual.</p>", true)
  + articuloResp("Artículo 8 — Inspecciones fronterizas de personas", ["SIS, Interpol SLTD y bases nacionales","chip: totalidad de la cadena de certificado válido","prórroga aeropuertos: hasta 18 meses (autoriza la Comisión)","visado de una o dos entradas: número máximo de entradas","espacio privado si hay instalaciones y lo solicita","segunda línea: nombre y número de servicio, paso y fecha"], "<p><b>2.</b> Tanto en el momento de entrada como de salida, los <mark class=\"m-destacable\">beneficiarios del derecho a la libre circulación</mark> (…) estarán sujetos a las inspecciones siguientes: a) La comprobación de la identidad y la nacionalidad de la persona y de la autenticidad y validez del documento de viaje (…), incluso mediante la consulta de las bases de datos pertinentes, especialmente las siguientes: <mark class=\"m-resp\">(1) el SIS; (2) la base de datos de Interpol sobre documentos de viaje robados y extraviados («SLTD»); (3) bases de datos nacionales que contengan información sobre documentos de viaje robados, sustraídos, extraviados e invalidados</mark>. Si el documento de viaje contiene un medio de almacenamiento electrónico (<mark class=\"m-destacable\">chip</mark>), la autenticidad e integridad de los datos del chip se determinará <mark class=\"m-resp\">utilizando la totalidad de la cadena de certificado válido</mark>, <u class=\"m-clave\">a menos que</u> resulte imposible técnicamente o, en el caso de un documento de viaje expedido por un tercer país, sea imposible por no disponerse de certificados válidos. (…)</p><p><b>2 quinquies.</b> Respecto a las fronteras aéreas, los apartados 2 bis y 2 ter se aplicarán durante un período transitorio máximo de <mark class=\"m-plazo\">6 meses</mark> después del 7 de abril de 2017. En casos excepcionales (…) el período de transición de seis meses (…) podrá prorrogarse, para ese aeropuerto, durante un período máximo de <mark class=\"m-resp\">dieciocho meses</mark> (…). (…) la <mark class=\"m-resp\">Comisión</mark>,   + articuloResp("Artículos 8 bis a 8 quinquies — Autoservicio, puertas automáticas y programas de facilitación · R4", ["chip con cadena de certificado válido e imagen facial accesible","remitida a la guardia si no hay puertas automáticas","menores de 12 años","primer acceso: máximo un año","prolongación hasta 5 años más","no se examinan iv) y v)","condiciones mínimas a)-g)","evaluación al final del tercer año"], "<p><b>8 bis.1.</b> Las personas cuyo cruce de fronteras esté sujeto a un registro en el SES (…) podrán utilizar <mark class=\"m-destacable\">sistemas de autoservicio</mark> para el prerregistro en el SES (…), siempre que se cumplan todas las condiciones siguientes: a) <mark class=\"m-resp\">el documento de viaje contiene un medio de almacenamiento electrónico (chip) y la autenticidad e integridad de los datos del chip se determina utilizando la totalidad de la cadena de certificado válido</mark>; b) <mark class=\"m-resp\">el documento de viaje contiene una imagen facial almacenada en un medio de almacenamiento electrónico (chip) a la que puede acceder técnicamente el sistema de autoservicio</mark> (…).</p><p><b>8 ter.4.</b> La persona en cuestión será <mark class=\"m-accion\">remitida a la guardia de fronteras</mark> (…) en cualquiera de las situaciones siguientes: a) cuando no se cumpla alguna de las condiciones enumeradas en el apartado 1; b) cuando las inspecciones (…) pongan de manifiesto que no se cumplen una o varias de las condiciones de entrada o de salida; c) cuando los resultados (…) pongan en duda la identidad de la persona o (…) revelen que la persona representa una amenaza (…); d) en caso de duda; e) <mark class=\"m-resp\">cuando no se disponga de puertas automáticas</mark>.</p><p><b>8 quater.</b> Los <mark class=\"m-destacable\">sistemas automatizados de control fronterizo</mark> se diseñarán, en la medida de lo posible, de forma que puedan ser utilizados por cualquier persona, <u class=\"m-clave\">excepto</u> <mark class=\"m-resp\">los menores de 12 años</mark>. Se diseñarán asimismo de modo que se respete plenamente la dignidad humana, en particular en los casos relativos a personas vulnerables. (…)</p><p><b>8 quinquies.2.</b> (…) a los que se conceda acceso al <mark class=\"m-destacable\">programa nacional de facilitación</mark>, la inspección minuciosa a la entrada <u class=\"m-clave\">no podrá incluir</u> un examen de los aspectos mencionados en el artículo 8, apartado 3, letra a), incisos <mark class=\"m-resp\">iv) (puntos de partida y destino y objeto de la estancia) y v) (medios de subsistencia)</mark> (…).</p><p><b>8 quinquies.4.</b> Las autoridades (…) solo concederán acceso al programa nacional de facilitación cuando se cumplan las siguientes <mark class=\"m-destacable\">condiciones mínimas</mark>: a) el solicitante cumple las condiciones de entrada (…); b) el documento de viaje (…) y, si procede, el visado (…) son válidos y no son falsos (…); c) el solicitante demuestra la necesidad de viajar frecuente o regularmente (…); d) el solicitante demuestra su integridad y fiabilidad (…); e) el solicitante justifica el propósito y las condiciones de las estancias previstas; f) el solicitante posee medios de subsistencia suficientes (…); g) se ha consultado el SIS.</p><p><b>8 quinquies.5.</b> El <mark class=\"m-resp\">primer acceso al programa nacional de facilitación se concederá por un período máximo de un año</mark>. Podrá prolongarse el acceso <mark class=\"m-resp\">por un máximo de cinco años más o hasta el fin del período de vigencia del documento de viaje</mark> o de cualquier visado (…) o permiso de residencia (…), cuyo plazo de vigencia sea más corto. En caso de prolongación, el Estado miembro volverá a evaluar <mark class=\"m-resp\">cada año</mark> la situación (…).</p><p><b>8 quinquies.11.</b> <mark class=\"m-resp\">Al final del tercer año</mark> de aplicación del presente artículo, como plazo máximo, la Comisión transmitirá al Parlamento Europeo y al Consejo <mark class=\"m-resp\">una evaluación de su aplicación</mark>. Sobre la base de esta evaluación, tanto el Parlamento Europeo como el Consejo podrán solicitar a la Comisión que proponga el establecimiento de un <mark class=\"m-resp\">programa de la Unión de viajeros frecuentes</mark>, previamente escrutados, nacionales de terceros países.</p>", true)

  + articuloResp("Artículo 9 — Flexibilización de las inspecciones · R5", ["circunstancias excepcionales e imprevistas","prioridad la entrada","decide el responsable de la guardia de fronteras del paso","temporal, adaptada y gradual","datos en el SES manualmente","sello si todo falla","informe ANUAL al PE y a la Comisión"], "<p><b>1.</b> Podrán flexibilizarse las inspecciones en las fronteras exteriores cuando concurran <mark class=\"m-resp\">circunstancias excepcionales e imprevistas</mark>. Se considerará que concurren (…) cuando, por acontecimientos imprevisibles, la intensidad del tráfico sea tal que el tiempo de espera en el paso fronterizo resulte excesivo, a pesar de haberse agotado todos los medios humanos, materiales y de organización para evitarlo.</p><p><b>2.</b> En caso de flexibilización de las inspecciones (…), las inspecciones fronterizas del <mark class=\"m-resp\">tráfico de entrada tendrán prioridad</mark>, en principio, sobre las inspecciones fronterizas del tráfico de salida.</p><p>La decisión de flexibilizar las inspecciones será adoptada por <mark class=\"m-resp\">el responsable de la guardia de fronteras del paso fronterizo</mark>.</p><p>La flexibilización de las inspecciones será <mark class=\"m-resp\">temporal, se adaptará a las circunstancias que la motiven y se aplicará de modo gradual</mark>.</p><p><b>3.</b> Aún en caso de flexibilización de las inspecciones, la guardia de fronteras introducirá los datos en el SES (…). En caso de que los datos no puedan ser introducidos por medios electrónicos, <mark class=\"m-resp\">se introducirán manualmente</mark>.</p><p><b>3 bis.</b> (…) en el supuesto excepcional de que sea técnicamente imposible introducir los datos en el sistema central del SES y en la interfaz nacional uniforme, y sea técnicamente imposible almacenar temporalmente los datos de modo local en un formato electrónico, la guardia de fronteras <mark class=\"m-resp\">almacenará manualmente los datos de entrada y salida</mark> (…), <mark class=\"m-resp\">con excepción de los datos biométricos, y estampará un sello de entrada o de salida</mark> en el documento de viaje (…).</p><p><b>4.</b> Cada Estado miembro transmitirá <mark class=\"m-resp\">anualmente</mark> al Parlamento Europeo y a la Comisión un informe sobre la aplicación del presente artículo.</p>", true)
  + articuloResp("Artículo 10 — Separación de filas y señalización", ["filas separadas OBLIGATORIAS en fronteras AÉREAS","libre circulación: «UE, EEE, CH»","residentes y visado de larga duración: B1 y B2","la fila B1 («sin obligación de visado») NO es obligatoria"], "<p><b>1.</b> Los Estados miembros <mark class=\"m-accion\">DISPONDRÁN</mark> filas separadas, en particular, en los pasos de sus <mark class=\"m-resp\">fronteras aéreas, para proceder a las inspecciones de las personas de conformidad con el artículo 8</mark>. (…) Los Estados miembros <mark class=\"m-accion\">PODRÁN DISPONER</mark> filas separadas en los pasos de sus fronteras marítimas y terrestres (…).</p><p><b>2.</b> Los beneficiarios del derecho a la libre circulación (…) podrán utilizar las filas marcadas con la señal que figura en el anexo III, parte A (<mark class=\"m-resp\">«UE, EEE, CH»</mark>). También podrán utilizar las filas marcadas con la señal (…) B1 («sin obligación de visado») y B2 («todos los pasaportes»). Los nacionales de terceros países que no estén obligados a poseer un visado (…) y los <mark class=\"m-resp\">nacionales de terceros países titulares de un permiso de residencia válido o de un visado de larga duración podrán utilizar las filas marcadas con la señal (…) B1 («sin obligación de visado»)</mark> (…). <mark class=\"m-resp\">También podrán utilizar las filas marcadas con la señal (…) B2 («todos los pasaportes»)</mark>. Todas las demás personas utilizarán las filas marcadas con la señal (…) B2 («todos los pasaportes»). (…) La disposición de filas separadas marcadas con la señal que figura en el anexo III, parte <mark class=\"m-resp\">B1 («sin obligación de visado»), no es obligatoria</mark>. (…)</p><p><b>4.</b> En caso de desequilibrio temporal del flujo de tráfico en un paso fronterizo determinado, las autoridades competentes podrán <mark class=\"m-accion\">suspender</mark> las normas de utilización de las distintas filas durante el tiempo necesario para eliminar el desequilibrio.</p>", true)
  + trampa("Trampa de examen", "La fila NO obligatoria es la B1 «SIN OBLIGACIÓN DE VISADO» (no la de «todos los pasaportes»).")
  + articuloResp("Artículos 11, 12 y 12 bis — Sellado, presunción y período transitorio del SES", ["tránsito ferroviario facilitado: sello a la entrada y a la salida","libre circulación: solo Directiva 2004/38/CE","prevalece la fecha del sello de entrada"], "<p><b>11.2.</b> El documento de viaje de un nacional de un tercer país que sea titular de un <mark class=\"m-destacable\">documento de tránsito ferroviario facilitado</mark> expedido con arreglo al Reglamento (CE) n.º 693/2003 será sellado <mark class=\"m-resp\">a la entrada y a la salida</mark>. (…)</p><p><b>12.4.</b> De no refutarse la presunción (…), los nacionales de un tercer país que se encuentren en el territorio de un Estado miembro podrán ser retornados de conformidad con la Directiva 2008/115/CE. Los nacionales de terceros países que gocen del derecho de libre circulación con arreglo al Derecho de la Unión <mark class=\"m-resp\">únicamente podrán ser retornados de conformidad con la Directiva 2004/38/CE</mark>.</p><p><b>12 bis.1.</b> Durante un período de <mark class=\"m-plazo\">180 días</mark> desde la fecha en que el SES haya entrado en funcionamiento (…), la guardia de fronteras tendrá en cuenta las estancias (…) mediante la comprobación de los sellos de los documentos de viaje, además de los datos de entrada y salida registrados en el SES.</p><p><b>12 bis.2.</b> Cuando una persona haya entrado en el territorio de los Estados miembros antes de que el SES haya entrado en funcionamiento y salga de él después (…), se creará a la salida un expediente individual en el SES (…). En caso de discrepancia entre la fecha del sello de entrada y los datos registrados en el SES, <mark class=\"m-resp\">prevalecerá la fecha del sello de entrada</mark>.</p>", true)

  + articuloResp("Artículo 13 — Vigilancia de fronteras", ["objeto: impedir o detectar el cruce no autorizado, conocimiento de la situación, delincuencia transfronteriza, medidas contra quien cruzó ilegalmente","efectivos y métodos adaptados a los riesgos y amenazas"], "<p><b>1.</b> La vigilancia de las fronteras tendrá por <mark class=\"m-destacable\">objeto principal</mark> <mark class=\"m-resp\">impedir o detectar el cruce no autorizado de la frontera, contribuir a un mayor conocimiento de la situación, atajar la delincuencia transfronteriza y adoptar medidas contra las personas que hayan cruzado la frontera ilegalmente</mark>. También implicará la realización de <mark class=\"m-personalizado\">análisis de riesgos</mark>. (…)</p><p><b>2.</b> La guardia de fronteras efectuará la vigilancia de fronteras utilizando todos los recursos necesarios, incluidas las <mark class=\"m-personalizado\">unidades fijas o móviles</mark>. (…)</p><p><b>3.</b> <mark class=\"m-resp\">La guardia de fronteras realizará la vigilancia entre los pasos fronterizos con efectivos y métodos adaptados a los riesgos y amenazas existentes o previstos</mark>. Hará uso de <mark class=\"m-destacable\">mapas de situación</mark> para mejorar su capacidad de reducir el número de migrantes que pierden la vida (…). Implicará <mark class=\"m-personalizado\">cambios frecuentes y repentinos</mark> de los períodos de vigilancia (…).</p>", true)
  + articuloResp("Artículo 14 — Denegación de entrada", ["resolución motivada con los motivos exactos","surte efecto INMEDIATAMENTE","recurso según el Derecho interno","sin efecto suspensivo","estadísticas cada año a la Comisión (Eurostat)"], "<p><b>1.</b> Se <mark class=\"m-accion\">negará la entrada</mark> en el territorio de los Estados miembros a los nacionales de terceros países que no cumplan todas las condiciones de entrada, tal como se definen en el artículo 6, apartado 1 (…).</p><p><b>2.</b> Solo podrá denegarse la entrada mediante <mark class=\"m-resp\">una resolución motivada en la que se indiquen los motivos exactos de dicha denegación</mark>. La resolución será adoptada por la autoridad habilitada en virtud del Derecho interno y <mark class=\"m-resp\">surtirá efecto inmediatamente</mark>. (…) se entregará mediante un <mark class=\"m-personalizado\">impreso normalizado</mark>, como el que figura en el anexo V, parte B (…).</p><p><b>3.</b> Las personas a las que se deniegue la entrada tendrán derecho a <mark class=\"m-accion\">recurrir</mark> dicha resolución. Los recursos se regirán por <mark class=\"m-resp\">el Derecho interno</mark>. (…) La incoación del recurso <mark class=\"m-resp\">no tendrá efecto suspensivo</mark> sobre la resolución de denegación de entrada. (…)</p><p><b>4.</b> La guardia de fronteras velará por que el nacional de un tercer país al que se ha denegado la entrada no entre en el territorio del Estado miembro en cuestión.</p><p><b>5.</b> Los Estados miembros realizarán <mark class=\"m-destacable\">estadísticas</mark> sobre el número de personas a las que se denegó la entrada, los motivos de la denegación, la nacionalidad (…) y el tipo de frontera (terrestre, aérea, marítima) (…) y las presentarán <mark class=\"m-resp\">cada año a la Comisión</mark> (Eurostat) (…).</p>", true)

  + articuloResp("Artículos 15 a 18 — Personal, ejecución del control, cooperación y controles conjuntos · R6", ["nivel elevado, uniforme y efectivo","incumbe a la guardia de fronteras","lista de servicios nacionales a la Comisión","formación: personas vulnerables (menores no acompañados, víctimas de trata)","cooperación estrecha y permanente","la Agencia coordina","control conjunto: una sola vez"], "<p><b>15.</b> Los Estados miembros dispondrán de personal y medios adecuados y en número suficiente para ejercer el control de las fronteras exteriores (…) con el fin de garantizar un nivel <mark class=\"m-resp\">elevado, uniforme y efectivo</mark> de control en sus fronteras exteriores.</p><p><b>16.1.</b> La ejecución del control fronterizo, de acuerdo con los artículos 7 a 14, incumbirá <mark class=\"m-resp\">a la guardia de fronteras</mark> de conformidad con lo dispuesto en el presente Reglamento y con el Derecho interno. (…) Los Estados miembros garantizarán que la guardia de fronteras esté constituida por <mark class=\"m-personalizado\">profesionales especializados con la debida formación</mark> (…). Los programas de formación incluirán una formación especializada que les permitan detectar y afrontar situaciones que planteen riesgos para <mark class=\"m-resp\">personas vulnerables, como los menores no acompañados y las víctimas de la trata de seres humanos</mark>. (…)</p><p><b>16.2.</b> De conformidad con el artículo 39, los Estados miembros notificarán a la Comisión <mark class=\"m-resp\">la lista de servicios nacionales responsables del control fronterizo</mark> en virtud de su Derecho interno.</p><p><b>16.3.</b> Para efectuar de forma eficaz el control fronterizo, todo Estado miembro garantizará una <mark class=\"m-destacable\">cooperación estrecha y permanente</mark> entre sus servicios nacionales responsables del control de las fronteras.</p><p><b>17.1.</b> Los Estados miembros se prestarán asistencia y garantizarán una cooperación <mark class=\"m-resp\">estrecha y permanente</mark> para efectuar de forma eficaz el control fronterizo (…).</p><p><b>17.2.</b> La <mark class=\"m-autoridad\">AGENCIA</mark> coordinará la cooperación operativa entre los Estados miembros en el ámbito de la gestión de las fronteras exteriores.</p><p><b>18.1.</b> Los Estados miembros que no apliquen el artículo 22 en sus fronteras comunes terrestres podrán (…) efectuar un <mark class=\"m-destacable\">control conjunto</mark> de estas fronteras comunes, en cuyo caso podrá detenerse a una persona <mark class=\"m-resp\">una sola vez a efectos de las inspecciones de entrada y salida</mark> (…).</p>", true)
  + articuloResp("Artículo 20 — Normas específicas para determinadas categorías de personas", ["categorías a)-h) (NO deportistas)","tarjetas de diplomáticos notificadas a la Comisión"], "<p><b>1.</b> Las normas específicas de inspección que figuran en el anexo VII se aplicarán en las inspecciones de las siguientes categorías de personas: <mark class=\"m-resp\">a) jefes de Estado, jefes de Gobierno y miembros del Gobierno nacional (…); b) pilotos de aeronaves y otros miembros de la tripulación; c) marinos; d) titulares de pasaportes diplomáticos, oficiales o de servicio y miembros de organizaciones internacionales; e) trabajadores transfronterizos; f) menores; g) servicios de salvamento, policía, cuerpos de bomberos y guardias de fronteras; h) trabajadores offshore</mark>.</p><p>Dichas normas específicas podrán incluir excepciones a lo dispuesto en los artículos 5, 6 y 8 a 14.</p>", true)

  + articuloResp("Artículos 21 y 21 bis — Graves deficiencias y restricciones temporales a los viajes", ["equipos europeos de Guardia de Fronteras","plan de acción en tres meses","procedimiento del art. 29","restricciones: el Consejo a propuesta de la Comisión","exentos: beneficiarios de libre circulación","viajes esenciales: de manera excepcional y por período estrictamente limitado"], "<p><b>21.1.</b> Cuando en el informe de evaluación (…) se observen <mark class=\"m-destacable\">graves deficiencias</mark> en los controles de las fronteras exteriores (…), la <mark class=\"m-autoridad\">Comisión</mark> podrá recomendar, mediante un <mark class=\"m-personalizado\">acto de ejecución</mark>, al Estado miembro evaluado, que adopte ciertas medidas específicas (…): a) <mark class=\"m-resp\">iniciar el despliegue de los equipos europeos de Guardia de Fronteras</mark> (…); b) enviar a la Agencia, para que emita un dictamen, sus planes estratégicos (…).</p><p><b>21.3.</b> Cuando en el informe de evaluación (…) se llegue a la conclusión de que el Estado miembro evaluado está incumpliendo gravemente sus obligaciones y que, por consiguiente, debe informar sobre la ejecución del plan de acción pertinente <mark class=\"m-resp\">en el plazo de tres meses</mark> (…) y en caso de que, transcurrido dicho plazo de tres meses, la Comisión considere que la situación persiste, podrá iniciar la aplicación del procedimiento previsto en <mark class=\"m-resp\">el artículo 29</mark> (…).</p><p><b>21 bis.2.</b> <mark class=\"m-resp\">El Consejo, sobre la base de una propuesta de la Comisión</mark>, podrá adoptar un reglamento de ejecución por el que se establezcan <mark class=\"m-destacable\">restricciones temporales a los viajes</mark> a los Estados miembros de aplicación en las fronteras exteriores. (…)</p><p><b>21 bis.3.</b> Las siguientes categorías de personas estarán <mark class=\"m-destacable\">exentas</mark> de las restricciones de entrada, independientemente del objeto de su viaje: a) <mark class=\"m-resp\">los beneficiarios del derecho a la libre circulación con arreglo al Derecho de la UE</mark>; b) los nacionales de terceros países residentes de larga duración (…).</p><p><b>21 bis.7.</b> Únicamente se impondrán restricciones a la entrada en los Estados miembros a las personas que realicen <mark class=\"m-destacable\">viajes esenciales</mark> <mark class=\"m-resp\">de manera excepcional, por un período estrictamente limitado</mark> (…).</p>", true)

  + articuloResp("Artículos 22 a 24 — Cruce de fronteras interiores e inspecciones en el territorio · R7", ["en cualquier lugar sin inspección","competencias policiales sin efecto equivalente","no tengan como objetivo el control de fronteras","obligación de declarar la presencia","traslado: no a solicitantes ni beneficiarios de protección internacional","recurso sin efecto suspensivo","obstáculos al tráfico en las fronteras interiores"], "<p><b>22.</b> Las fronteras interiores podrán cruzarse <mark class=\"m-resp\">en cualquier lugar sin que se realice inspección fronteriza alguna de las personas, cualquiera que sea su nacionalidad</mark>.</p><p><b>23.</b> La ausencia de controles fronterizos en las fronteras interiores <u class=\"m-clave\">no afectará</u>: a) al ejercicio de las <mark class=\"m-destacable\">competencias policiales</mark> u otros poderes públicos por las autoridades competentes de los Estados miembros en su territorio, incluidas sus zonas fronterizas interiores, (…) <mark class=\"m-resp\">en la medida en que su ejercicio no tenga un efecto equivalente a las inspecciones fronterizas</mark>. (…) no se considerará, en particular, equivalente al ejercicio de inspecciones fronterizas cuando las medidas cumplan cada una de las condiciones siguientes: i) <mark class=\"m-resp\">no tengan como objetivo el control de fronteras</mark>; ii) estén basadas en información policial general (…); iii) estén concebidas y se ejecuten de un modo claramente diferenciado de las <mark class=\"m-personalizado\">inspecciones sistemáticas</mark> de personas en las fronteras exteriores (…), y siempre que estén basadas en una evaluación de riesgos;</p><p><b>b)</b> a la posibilidad de que las autoridades competentes de un Estado miembro o los transportistas realicen <mark class=\"m-destacable\">inspecciones de seguridad</mark> a las personas en los centros de transporte (…), siempre que esas inspecciones se efectúen también sobre las personas que viajen dentro de un Estado miembro;</p><p><b>c)</b> a la posibilidad de que un Estado miembro establezca por ley la <mark class=\"m-resp\">obligación de poseer o llevar consigo documentos</mark>;</p><p><b>d)</b> a la posibilidad de que un Estado miembro imponga por ley <mark class=\"m-resp\">la obligación a los nacionales de terceros países de declarar su presencia en su territorio</mark> (…).</p><p><b>23 bis.1.</b> (…) El procedimiento [de traslado de personas aprehendidas en zonas fronterizas interiores] <u class=\"m-clave\">no</u> se aplicará a <mark class=\"m-resp\">solicitantes (…) ni a beneficiarios de protección internacional</mark> (…).</p><p><b>23 bis.3.</b> Los nacionales de un tercer país aprehendidos en zonas fronterizas y trasladados (…) tendrán derecho a recurrir. (…) La interposición del recurso <mark class=\"m-resp\">no tendrá efecto suspensivo</mark>.</p><p><b>24.</b> Los Estados miembros eliminarán todos los obstáculos al tráfico fluido a través de pasos fronterizos de carretera situados <mark class=\"m-resp\">en las fronteras interiores</mark>, en particular, los límites de velocidad que no estén basados exclusivamente en consideraciones de seguridad vial (…).</p>", true)

  + articuloResp("Artículos 25 y 25 bis — Restablecimiento temporal de controles · R8", ["amenaza grave para el orden público o la seguridad interior","a)-d) (incluidas emergencias de salud pública)","último recurso","imprevisible: inmediato, máx. 1 mes, prórrogas hasta 3 meses","previsible: notificación 4 semanas antes","hasta 6 meses, renovables","máximo 2 años","prórroga extra de 6 meses (aviso 4 semanas antes)","nuevo dictamen de la Comisión en 3 meses","prórroga definitiva: recomendación de la Comisión sin demora"], "<p><b>25.1.</b> Cuando, en el espacio sin controles en las fronteras interiores, exista una <mark class=\"m-resp\">amenaza grave para el orden público o la seguridad interior</mark> de un Estado miembro, dicho Estado miembro podrá restablecer <mark class=\"m-personalizado\">excepcionalmente</mark> los controles fronterizos en partes específicas o en la totalidad de sus fronteras interiores. Podrá considerarse, en particular, que una amenaza grave (…) se deriva de: a) actos o amenazas terroristas, y amenazas que plantea la delincuencia organizada grave; b) <mark class=\"m-resp\">emergencias de salud pública a gran escala</mark>; c) una situación excepcional caracterizada por movimientos repentinos a gran escala no autorizados de nacionales de un tercer país entre los Estados miembros (…); d) acontecimientos internacionales de gran magnitud o de gran relevancia.</p><p><b>25.2.</b> En todos los casos, los controles fronterizos en las fronteras interiores se restablecerán únicamente <mark class=\"m-resp\">como medida de último recurso</mark>. El alcance y la duración (…) no excederán de lo que sea estrictamente necesario (…).</p><p><b>25 bis.1.</b> Cuando la amenaza (…) sea <mark class=\"m-destacable\">imprevisible</mark> y exija una actuación inmediata, el Estado miembro podrá, con carácter excepcional, restablecer <mark class=\"m-plazo\">inmediatamente</mark> los controles fronterizos (…).</p><p><b>25 bis.2.</b> El Estado miembro, en el momento preciso en que restablezca los controles fronterizos (…), notificará al Parlamento Europeo, al Consejo, a la Comisión y a los demás Estados miembros (…).</p><p><b>25 bis.3.</b> (…) los controles fronterizos podrán mantenerse por un máximo de <mark class=\"m-resp\">un mes</mark>. Si la amenaza grave (…) persiste más allá de ese período, el Estado miembro podrá prorrogar los controles (…) durante períodos adicionales, hasta una duración máxima que no supere <mark class=\"m-resp\">los tres meses</mark>.</p><p><b>25 bis.4.</b> Cuando en un Estado miembro sea <mark class=\"m-destacable\">previsible</mark> una amenaza grave (…), este se lo notificará al Parlamento Europeo, al Consejo, a la Comisión y a los demás Estados miembros (…) <mark class=\"m-resp\">con al menos cuatro semanas de antelación</mark> con respecto al restablecimiento previsto de los controles fronterizos, o lo antes posible si (…) adquiere conocimiento de las circunstancias (…) en un plazo inferior a cuatro semanas (…).</p><p><b>25 bis.5.</b> (…) los controles fronterizos en las fronteras interiores podrán restablecerse durante un período de hasta <mark class=\"m-resp\">seis meses</mark>. Cuando la amenaza grave (…) persista más allá de ese período, el Estado miembro podrá prorrogar los controles (…) durante <mark class=\"m-resp\">períodos renovables de hasta seis meses</mark>. (…) la duración máxima de los controles fronterizos en las fronteras interiores <u class=\"m-clave\">no podrá ser superior</u> a <mark class=\"m-resp\">dos años</mark>.</p><p><b>25 bis.6.</b> Cuando un Estado miembro considere que existe una <mark class=\"m-personalizado\">situación excepcional importante</mark> en relación con una amenaza grave persistente (…), notificará (…) su intención de prorrogar sus controles (…) durante un <mark class=\"m-resp\">período adicional de hasta seis meses</mark>. Tal notificación se efectuará <mark class=\"m-resp\">al menos cuatro semanas antes de la prórroga prevista</mark> (…). En un <mark class=\"m-resp\">plazo de tres meses a partir de la notificación</mark> (…), la Comisión emitirá un nuevo dictamen sobre la necesidad y proporcionalidad de la prórroga (…). (…) un Estado miembro podrá decidir prorrogar los controles fronterizos en las fronteras interiores por un <mark class=\"m-resp\">período adicional definitivo de hasta seis meses</mark> (…). (…) La Comisión <mark class=\"m-resp\">adoptará sin demora una recomendación sobre la compatibilidad de dicha prórroga definitiva con los Tratados</mark> (…).</p>", true)

do por los controles fronterizos</mark> en las fronteras interiores, establecer un <mark class=\"m-destacable\">proceso de consulta</mark> (…).</p><p><b>27 bis.3.</b> (…) una prórroga (…) que implique la continuación de los controles fronterizos en las fronteras interiores durante un total de <mark class=\"m-resp\">doce meses</mark>, la Comisión emitirá un <mark class=\"m-destacable\">dictamen</mark> sobre la necesidad y proporcionalidad de dichos controles (…).</p><p><b>28.1.</b> Cuando la <mark class=\"m-autoridad\">Comisión</mark> determine que existe una <mark class=\"m-destacable\">emergencia de salud pública a gran escala</mark> que afecta a varios Estados miembros (…), podrá presentar una propuesta al <mark class=\"m-autoridad\">Consejo</mark> para que este adopte una decisión de ejecución por la que se autorice el restablecimiento de los controles fronterizos (…).</p><p><b>28.2.</b> La decisión de ejecución del Consejo (…) abarcará un período de hasta <mark class=\"m-resp\">seis meses</mark> y podrá renovarse, a propuesta de la Comisión, durante períodos adicionales de hasta seis meses mientras persista la emergencia (…).</p><p><b>28.5.</b> Los Estados miembros notificarán <mark class=\"m-plazo\">inmediatamente</mark> al Parlamento Europeo, al Consejo, a la Comisión y a los demás Estados miembros un restablecimiento de los controles fronterizos (…).</p>", true)

  + articuloResp("Artículo 29 — Circunstancias excepcionales que ponen en riesgo el espacio sin controles", ["no más de seis meses","prolongable en tres ocasiones como máximo, por nuevos períodos de hasta seis meses","recomendación del Consejo basada en propuesta de la Comisión","si no la aplica: informa por escrito a la Comisión sin demora","urgencia (menos de 10 días): propuesta en 14 días"], "<p><b>1.</b> En <mark class=\"m-destacable\">circunstancias excepcionales</mark> que pongan en riesgo el funcionamiento general del espacio sin controles en las fronteras interiores como consecuencia de <mark class=\"m-personalizado\">deficiencias graves persistentes</mark> en los controles de las fronteras exteriores (…), los Estados miembros podrán restablecer los controles fronterizos en las fronteras interiores (…) <mark class=\"m-resp\">por un período que no supere los seis meses</mark>. Ese período podrá prolongarse <mark class=\"m-resp\">en tres ocasiones como máximo, por un nuevo período de hasta seis meses</mark>, en caso de que persistan las circunstancias excepcionales.</p><p><b>2.</b> Como último recurso (…), el <mark class=\"m-resp\">Consejo</mark> podrá <mark class=\"m-accion\">recomendar</mark> que uno o más Estados miembros decidan restablecer los controles fronterizos en todas sus fronteras interiores o en partes concretas de ellas. La recomendación del Consejo se basará en <mark class=\"m-resp\">una propuesta de la Comisión</mark>. (…)</p><p><b>3.</b> En el caso en que un Estado miembro no aplique la recomendación (…), dicho Estado miembro <mark class=\"m-resp\">informará por escrito de sus motivos a la Comisión sin demora</mark>. (…)</p><p><b>4.</b> Por razones de urgencia (…) conocidas menos de <mark class=\"m-plazo\">10 días</mark> antes del final del período de restablecimiento precedente, la Comisión podrá adoptar todas las recomendaciones necesarias mediante actos de ejecución de aplicación inmediata (…). En el plazo de <mark class=\"m-resp\">14 días   + articuloResp("Artículos 32 a 35 — Disposiciones aplicables, informe y confidencialidad", ["mutatis mutandis el título II","informe en 4 semanas desde la supresión al PE, Consejo y Comisión","informe sobre el estado de Schengen al menos una vez al año","confidencialidad a petición del EM"], "<p><b>32.</b> Cuando se restablezcan los controles en las fronteras interiores se aplicarán, <mark class=\"m-resp\">mutatis mutandis</mark>, las disposiciones pertinentes del título II.</p><p><b>33.1.</b> En el plazo de <mark class=\"m-resp\">cuatro semanas desde la supresión</mark> de los controles fronterizos en las fronteras interiores, los Estados miembros que hayan realizado controles fronterizos (…) presentarán un informe <mark class=\"m-resp\">al Parlamento Europeo, al Consejo y a la Comisión</mark> sobre el restablecimiento y, si procede, la prórroga (…).</p><p><b>33.2.</b> (…) cuando los controles fronterizos se prorroguen (…), el Estado miembro de que se trate presentará un informe al expirar los <mark class=\"m-plazo\">doce meses</mark> y, posteriormente, a los doce meses (…).</p><p><b>33.6.</b> <mark class=\"m-resp\">Al menos una vez al año</mark>, la Comisión informará de manera conjunta al Parlamento Europeo y al Consejo sobre el funcionamiento del espacio sin controles en las fronteras interiores («<mark class=\"m-destacable\">informe sobre el estado de Schengen</mark>»). (…)</p><p><b>35.</b> <mark class=\"m-resp\">A petición del Estado miembro de que se trate, los demás Estados miembros, el Parlamento Europeo y la Comisión respetarán el carácter confidencial de la información</mark> proporcionada en el marco del restablecimiento y de la prolongación de los controles, así como del informe elaborado de conformidad con el artículo 33.</p>", true)

  + articuloResp("Artículos 36 a 38 — Anexos, delegación y comité · R10", ["modificación de los anexos III, IV y VIII: la Comisión (actos delegados)","delegación por tiempo indefinido","revocable por el PE o el Consejo","notificación simultánea al PE y al Consejo","dos meses sin objeciones, prorrogables dos meses"], "<p><b>36.1.</b> <mark class=\"m-resp\">La Comisión</mark> estará facultada para adoptar <mark class=\"m-destacable\">actos delegados</mark> con arreglo al artículo 37 en lo referente a las modificaciones de los <mark class=\"m-resp\">anexos III, IV y VIII</mark>.</p><p><b>37.2.</b> Los poderes para adoptar actos delegados mencionados en el artículo 13, apartado 5, y en el artículo 36 se otorgan a la Comisión <mark class=\"m-resp\">por un período de tiempo indefinido</mark>.</p><p><b>37.3.</b> La delegación de poderes (…) podrá ser revocada en cualquier momento por el <mark class=\"m-autoridad\">Parlamento Europeo</mark> o por el <mark class=\"m-autoridad\">Consejo</mark>. (…) La decisión surtirá efecto al día siguiente de su publicación en el Diario Oficial de la Unión Europea o en una fecha posterior indicada en la misma. (…)</p><p><b>37.4.</b> <mark class=\"m-resp\">Tan pronto como la Comisión adopte un acto delegado, lo notificará simultáneamente al Parlamento Europeo y al Consejo</mark>.</p><p><b>37.5.</b> Los actos delegados (…) entrarán en vigor únicamente si, en un plazo de <mark class=\"m-plazo\">dos meses</mark> desde su notificación al Parlamento Europeo y al Consejo, ninguna de estas instituciones formula objeciones (…). El plazo <mark class=\"m-resp\">se prorrogará dos meses a iniciativa del Parlamento Europeo o del Consejo</mark>.</p><p><b>38.1.</b> La Comisión estará asistida por un <mark class=\"m-destacable\">comité</mark>. Dicho comité será un comité en el sentido del Reglamento (UE) n.º 182/2011.</p>", true)
  + articuloResp("Artículos 40 a 45 — Tráfico menor, Ceuta y Melilla, sellado transitorio, evaluación, derogación y vigor · R11", ["no afecta al tráfico fronterizo menor ni a los acuerdos bilaterales","Ceuta y Melilla","modificaciones en 5 días hábiles","sello sistemático a la entrada y a la salida","evaluación cada cinco años como mínimo","deroga el Reglamento 562/2006","en vigor a los veinte días"], "<p><b>40.</b> El presente Reglamento <u class=\"m-clave\">no afectará</u> a <mark class=\"m-resp\">las normas de la Unión sobre tráfico fronterizo menor ni a los acuerdos bilaterales vigentes en esta materia</mark>.</p><p><b>41.</b> Las disposiciones del presente Reglamento no afectarán al <mark class=\"m-destacable\">régimen especial</mark> aplicable a <mark class=\"m-resp\">las ciudades de Ceuta y Melilla</mark>, tal como se define en la Declaración del Reino de España (…).</p><p><b>42.</b> Los Estados miembros comunicarán a la Comisión las disposiciones nacionales relativas al artículo 23, letras c) y d), las sanciones a que se refiere el artículo 5, apartado 3, y los acuerdos bilaterales autorizados por el presente Reglamento. Las modificaciones ulteriores de estas disposiciones se comunicarán en un plazo de <mark class=\"m-resp\">cinco días hábiles</mark>. (…)</p><p><b>42 bis.1.</b> Los documentos de viaje de los nacionales de terceros países que crucen las fronteras de los Estados miembros (que aún no utilicen el SES) (…) se sellarán sistemáticamente <mark class=\"m-resp\">a la entrada y a la salida</mark>. (…)</p><p><b>43.2.</b> (…) cada Estado miembro será sometido a una evaluación <mark class=\"m-resp\">cada cinco años como mínimo por parte de un pequeño equipo integrado por representantes de la Comisión y expertos designados por los Estados miembros</mark>. (…)</p><p><b>44.</b> Queda derogado el <mark class=\"m-resp\">Reglamento (CE) n.º 562/2006</mark>. (…)</p><p><b>45.</b> El presente Reglamento entrará en vigor <mark class=\"m-resp\">a los veinte días de   + articuloResp("Anexo VI — Fronteras terrestres, ferroviarias, aéreas y marítimas", ["ferrocarril: primera/última estación en un EM, a bordo, o última/primera estación en un tercer país","alta velocidad: estación del tercer país donde suben, estación de desembarque o a bordo","aeronaves ligeras: Derecho interno y acuerdos bilaterales","listas del capitán 24 h antes","polizones","a bordo: NO inspecciones sistemáticas (registro solo si lo justifica el análisis de riesgo)","pesca de bajura 36 h","transbordadores: peatones aparte, turismos en el vehículo, autocar = peatones"], "<p><b>1.2.1.</b> Se inspeccionará tanto a los pasajeros de los trenes como a los empleados de los ferrocarriles de los trenes que crucen las fronteras exteriores, incluso en trenes de mercancías o en trenes vacíos. (…) Las inspecciones podrán efectuarse de cualquiera de las formas siguientes: <mark class=\"m-resp\">• bien en la primera estación de llegada o la última estación de salida en el territorio de un Estado miembro, • bien a bordo del tren, durante el trayecto entre la última estación de salida en un tercer país y la primera estación de llegada en el territorio de un Estado miembro, o viceversa, • bien en la última estación de salida o la primera estación de llegada en el territorio de un tercer país</mark>.</p><p><b>1.2.2.</b> Asimismo, con el fin de facilitar el tráfico ferroviario de <mark class=\"m-destacable\">alta velocidad</mark> (…), los Estados miembros (…) podrán también decidir (…) efectuar las inspecciones de entrada de los pasajeros de trenes procedentes de terceros países de cualquiera de las formas siguientes: <mark class=\"m-resp\">• bien en las estaciones situadas en el tercer país en las que suban los pasajeros al tren, • bien en las estaciones en las que desembarquen los pasajeros en el territorio de los Estados miembros, • bien a bordo del tren en el trayecto entre las estaciones situadas en el territorio de un tercer país y las estaciones situadas en el territorio de los Estados miembros, siempre y cuando los pasajeros permanezcan en el tren</mark>.</p><p><b>2.3.4.</b> El régimen de entrada y salida de planeadores, aviones ultraligeros, <mark class=\"m-resp\">helicópteros y aviones de fabricación artesanal</mark>, con los que solo puedan cubrirse distancias cortas, así como aeróstatos, se fijará con arreglo <mark class=\"m-resp\">al Derecho interno y, en su caso, con arreglo a los acuerdos bilaterales</mark>.</p><p><b>3.1.1.</b> Las inspecciones de los buques tendrán lugar en el <mark class=\"m-personalizado\">puerto de llegada o de salida</mark>, o en una zona destinada a tal fin situada en las inmediaciones del buque, o a bordo del propio buque en las aguas territoriales (…).</p><p><b>3.1.2.</b> El <mark class=\"m-autoridad\">capitán</mark> (…) elaborará una <mark class=\"m-destacable\">lista de tripulantes y de pasajeros</mark> (…): • a más tardar <mark class=\"m-resp\">veinticuatro horas</mark> antes de la llegada al puerto, o • a más tardar en el momento en que el buque salga del puerto anterior, si la duración del viaje es inferior a veinticuatro horas (…).</p><p><b>3.1.4.</b> (…) el capitán comunicará inmediatamente a las autoridades competentes, dentro del plazo establecido en el punto 3.1.2, la presencia de <mark class=\"m-destacable\">polizones</mark> a bordo. No obstante, estos permanecerán bajo la responsabilidad del capitán. <mark class=\"m-resp\">Sin perjuicio de lo dispuesto en los artículos 5 y 8, no serán objeto de inspecciones fronterizas sistemáticas las personas que permanezcan a bordo</mark>. No obstante, los agentes de la guardia de fronteras efectuarán un registro del buque e inspecciones de las personas que permanezcan a bordo, <mark class=\"m-resp\">solo cuando resulte justificado partiendo de un análisis del riesgo</mark> vinculado a la seguridad interior y a la inmigración ilegal.</p><p><b>3.2.7.</b> (…) <mark class=\"m-resp\">no se efectuarán inspecciones sistemáticas de la tripulación de los buques   + articuloResp("Anexo VII — Normas específicas para determinadas categorías de personas", ["pilotos: embarcar/desembarcar, ir al municipio del aeropuerto y desplazarse a otro aeropuerto","menores: mismos controles que los adultos"], "<p><b>2.1.</b> (…) los titulares de una <mark class=\"m-destacable\">licencia de piloto</mark> o de una tarjeta de miembro de tripulación (…) podrán, en el ejercicio de sus funciones y sobre la base de dichos documentos: <mark class=\"m-resp\">a) embarcar y desembarcar en el aeropuerto de escala o destino situado en el territorio de un Estado miembro; b) dirigirse al territorio del municipio del que dependa el aeropuerto de escala o de destino (…); c) desplazarse, por cualquier medio de transporte, a un aeropuerto situado en el territorio de un Estado miembro con el fin de embarcar en un avión con salida de este mismo aeropuerto</mark>.</p><p><b>2.2.</b> (…) La tripulación de aeronaves será, en la medida de lo posible, inspeccionada con <mark class=\"m-personalizado\">prioridad</mark>. (…)</p><p><b>6.1.</b> Los guardias de fronteras prestarán una atención especial a los <mark class=\"m-destacable\">menores</mark>, vayan o no acompañados. Los menores que crucen la frontera exterior <mark class=\"m-resp\">estarán sometidos a los mismos controles de entrada y salida que los adultos</mark>, de acuerdo con lo dispuesto en el presente Reglamento.</p><p><b>6.6.</b> (…) Si está presente uno de los padres o un tutor legal, deberá acompañar al menor cuando se verifiquen o empleen los datos biométricos (…). <u class=\"m-clave\">No</u> se recurrirá al uso de la fuerza. (…)</p>", true)

  + articuloResp("Artículos 1 y 2 — Objeto y definiciones", ["gestión europea integrada de las fronteras exteriores, derechos fundamentales y eficiencia del retorno","conocimiento de la situación","capacidad de reacción","zona prefronteriza","incidente","miembro de los equipos","Estado miembro de origen","punto crítico a petición del EM de acogida","retornado"], "<p><b>1.</b> El presente Reglamento crea una <mark class=\"m-destacable\">Guardia Europea de Fronteras y Costas</mark> con el objetivo de <mark class=\"m-resp\">garantizar una gestión europea integrada de las fronteras exteriores</mark>, con miras a gestionar esas fronteras eficientemente <mark class=\"m-resp\">respetando plenamente los derechos fundamentales, y aumentar la eficiencia de la política de retorno</mark> de la Unión. (…)</p><p>2.7) «<mark class=\"m-destacable\">conocimiento de la situación</mark>»: <mark class=\"m-resp\">capacidad de controlar, detectar, identificar, rastrear y entender las actividades transfronterizas ilegales con el fin de encontrar argumentos razonados para las medidas de respuesta</mark> (…);</p><p>2.8) «<mark class=\"m-destacable\">capacidad de reacción</mark>»: <mark class=\"m-resp\">capacidad de llevar a cabo acciones dirigidas a combatir las actividades transfronterizas ilegales en las fronteras exteriores, o en sus proximidades, incluidos el tiempo y los medios requeridos para reaccionar adecuadamente</mark>;</p><p>2.9) «<mark class=\"m-destacable\">EUROSUR</mark>»: el marco para el intercambio de información y la cooperación entre los Estados miembros y la Agencia (…);</p><p>2.10) «<mark class=\"m-destacable\">mapa de situación</mark>»: una agregación de datos e información georreferenciados en <mark class=\"m-plazo\">tiempo cuasirreal</mark> (…);</p><p>2.12) «<mark class=\"m-destacable\">delincuencia transfronteriza</mark>»: cualquier delito grave con una dimensión transfronteriza que se haya cometido o intentado cometer en las fronteras exteriores o en sus proximidades;</p><p>2.13) «<mark class=\"m-destacable\">zona prefronteriza</mark>»: <mark class=\"m-resp\">zona geográfica más allá de las fronteras exteriores, relevante para la gestión de las fronteras exteriores mediante análisis de riesgos y conocimiento de la situación</mark>;</p><p>2.14) «<mark class=\"m-destacable\">incidente</mark>»: <mark class=\"m-resp\">una situación relacionada con la inmigración ilegal, la delincuencia transfronteriza o con un riesgo para las vidas de inmigrantes en las fronteras exteriores o en sus proximidades</mark>;</p><p>2.16) «<mark class=\"m-destacable\">personal operativo</mark>»: guardias de fronteras, escoltas para retornos, especialistas en retorno y otros agentes pertinentes que constituyen el «cuerpo permanente» (…) de acuerdo con las <mark class=\"m-plazo\">cuatro categorías</mark> establecidas en el artículo 54, apartado 1 (…);</p><p>2.17) «<mark class=\"m-resp\">miembro de los equipos</mark>»: miembro del cuerpo permanente de la Guardia Europea de Fronteras y Costas desplegado a través de los equipos de gestión de fronteras, los equipos de apoyo a la gestión de la migración y los equipos de retorno;</p><p>2.18) «<mark class=\"m-destacable\">equipos de gestión de fronteras</mark>»: equipos formados a partir del cuerpo permanente (…) que se desplegarán durante las operaciones conjuntas en las fronteras exteriores y las intervenciones fronterizas rápidas (…);</p><p>2.21) «<mark class=\"m-resp\">Estado miembro de origen</mark>»: el Estado miembro a partir del cual se despliega a un miembro del personal o se le destina en comisión de servicios al cuerpo permanente de la Guardia Europea de Fronteras y Costas;</p><p>2.23) «<mark class=\"m-destacable\">punto crítico</mark>»: una zona establecida <mark class=\"m-resp\">a petición del Estado miembro de acogida en la que el Estado miembro de acogida, la Comisión, los organismos de la Unión competentes y los Estados miembros participantes cooperan con el objeto de gestionar un reto migratorio desproporcionado</mark>, existente o potencial (…);</p><p>2.26) «<mark class=\"m-destacable\">retornado</mark>»: <mark class=\"m-resp\">un nacional de un tercer país en situación irregular que es objeto de una decisión de retorno ejecutiva</mark>;</p><p>2.28) «<mark class=\"m-destacable\">intervención de retorno</mark>»: una actividad de la Agencia (…) que proporciona a los Estados miembros una asistencia técnica y operativa reforzada consistente en el despliegue de equipos de retorno y en la organización de operaciones de retorno;</p>", true)
  + articuloResp("Artículo 3 — Gestión europea integrada de las fronteras", ["elementos a)-l)","análisis de riesgos para la seguridad INTERIOR y amenazas a las fronteras exteriores","NO la gestión de las fronteras interiores ni precios del transporte","elementos generales: derechos fundamentales, educación y formación, investigación e innovación"], "<p><b>1.</b> La <mark class=\"m-destacable\">gestión europea integrada de las fronteras</mark> constará de los siguientes elementos:</p><p><b>a)</b> control fronterizo, incluidas medidas para facilitar el cruce legítimo de fronteras y (…) medidas relacionadas con la prevención y la detección de la delincuencia transfronteriza en las fronteras exteriores (…);</p><p><b>b)</b> operaciones de búsqueda y salvamento de personas en peligro en el mar (…);</p><p><b>c)</b> <mark class=\"m-resp\">análisis de los riesgos para la seguridad interior y análisis de las amenazas que pueden afectar al funcionamiento o a la seguridad de las fronteras exteriores</mark>;</p><p><b>d)</b> intercambio de información y cooperación entre los Estados miembros (…) y la Agencia (…);</p><p><b>e)</b> cooperación interorgánica entre las autoridades nacionales de cada Estado miembro (…);</p><p><b>f)</b> cooperación entre las instituciones, órganos y organismos de la Unión (…);</p><p><b>g)</b> cooperación con terceros países (…);</p><p><b>h)</b> medidas técnicas y operativas en el interior del espacio Schengen relacionadas con el control fronterizo (…);</p><p>i) retorno de nacionales de terceros países que sean objeto de una decisión de retorno emitida por un Estado miembro;</p><p>j) empleo de tecnología punta, incluidos sistemas de información a gran escala;</p><p>k) un mecanismo de control de calidad, en particular el mecanismo de evaluación de Schengen, la evaluación de la vulnerabilidad y posibles mecanismos nacionales (…);</p><p>l) mecanismos de solidaridad, en particular los instrumentos de financiación de la Unión.</p><p><b>2.</b> <mark class=\"m-
