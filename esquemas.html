<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Esquemas de Estudio</title>
<meta name="theme-color" content="#1c4d3c">
<style>
:root{
  --fondo:#f5f4ee;
  --panel:#ffffff;
  --panel-alt:#eeece3;
  --texto:#1f2a24;
  --texto-gris:#767a70;
  --borde:#e2e0d5;
  --verde-osc:#163f30;
  --verde:#1c4d3c;
  --verde-med:#2f6b52;
  --verde-suave:#e7efe8;
  --examen-bg:#fff4d6;
  --examen-borde:#e0a800;
  --examen-txt:#7a5b00;
  --radio:18px;
  --radio-sm:12px;
  font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
[data-theme="dark"]{
  --fondo:#141917;
  --panel:#1e2523;
  --panel-alt:#262f2b;
  --texto:#eef1ee;
  --texto-gris:#9aa39c;
  --borde:#333d37;
  --verde-osc:#7fd9ac;
  --verde:#3f8a68;
  --verde-med:#57a683;
  --verde-suave:#16332a;
  --examen-bg:#3a2f12;
  --examen-borde:#e0a800;
  --examen-txt:#f0c95a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body,html{margin:0;padding:0;background:var(--fondo);color:var(--texto)}
#app{max-width:820px;margin:0 auto;min-height:100vh;padding:18px 18px 60px}
h1,h2,h3{margin:0;color:var(--verde-osc);font-family:Georgia,'Times New Roman',serif}
p{margin:0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;position:sticky;top:0;background:var(--fondo);padding:10px 0;z-index:10}
.topbar h1{font-size:22px}
.theme-toggle{display:flex;background:var(--panel-alt);border-radius:20px;padding:4px;gap:2px}
.theme-btn{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--texto-gris);cursor:pointer;font-family:inherit}
.theme-btn.active{background:var(--panel);color:var(--verde-osc)}

.layout{display:flex;gap:20px;align-items:flex-start}
.sidebar{width:220px;flex:none;background:var(--panel);border-radius:var(--radio);padding:14px;position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-y:auto}
.sidebar h3{font-size:12px;letter-spacing:1px;color:var(--texto-gris);text-transform:uppercase;margin-bottom:10px}
.tema-nav-item{display:block;padding:10px 12px;border-radius:var(--radio-sm);font-size:14px;font-weight:600;color:var(--texto);cursor:pointer;margin-bottom:4px}
.tema-nav-item:hover{background:var(--panel-alt)}
.tema-nav-item.active{background:var(--verde-suave);color:var(--verde-osc)}

.content{flex:1;min-width:0}
.esquema{background:var(--panel);border-radius:var(--radio);padding:24px;margin-bottom:18px;display:none}
.esquema.active{display:block}
.esquema-head{margin-bottom:16px;border-bottom:1px solid var(--borde);padding-bottom:14px}
.esquema-head .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--texto-gris);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.esquema-head h2{font-size:24px}

.bloque{margin-bottom:18px}
.bloque h3{font-size:16px;color:var(--verde-med);margin-bottom:8px}
.bloque ul{margin:0;padding-left:20px}
.bloque li{font-size:14.5px;line-height:1.6;color:var(--texto);margin-bottom:6px}

.placeholder{text-align:center;color:var(--texto-gris);padding:60px 20px;font-size:14.5px}

/* ---- Método Prefortia: leyenda de colores ---- */
.leyenda{display:flex;flex-wrap:wrap;gap:14px;background:var(--panel-alt);border-radius:var(--radio-sm);padding:10px 14px;margin-bottom:18px}
.leyenda span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--texto)}
.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.leyenda i.lc-destacable{background:#f7c9a8}
.leyenda i.lc-autoridad{background:#bfe3c4}
.leyenda i.lc-plazo{background:#a9d3ea}
.leyenda i.lc-accion{background:#c9b7e0}
.leyenda i.lc-personalizado{background:#f7e79a}
.leyenda i.lc-clave{background:none;border-bottom:3px solid #d1332a;border-radius:0;width:16px}

/* ---- Marcado inline por categorías (subrayados de color) ---- */
mark.m-destacable{background:#f7c9a8;color:#3a2213;padding:1px 3px;border-radius:3px}
mark.m-autoridad{background:#bfe3c4;color:#173a1e;padding:1px 3px;border-radius:3px}
mark.m-plazo{background:#a9d3ea;color:#0f2c3d;padding:1px 3px;border-radius:3px}
mark.m-accion{background:#c9b7e0;color:#2c1c40;padding:1px 3px;border-radius:3px}
mark.m-personalizado{background:#f7e79a;color:#463a04;padding:1px 3px;border-radius:3px}
u.m-clave{text-decoration:underline;text-decoration-color:#d1332a;text-decoration-thickness:2px;text-underline-offset:2px}
[data-theme="dark"] mark.m-destacable{background:#6b3d1f;color:#ffd9b8}
[data-theme="dark"] mark.m-autoridad{background:#265331;color:#c9f0cf}
[data-theme="dark"] mark.m-plazo{background:#1f4a63;color:#c8e9fb}
[data-theme="dark"] mark.m-accion{background:#4a3768;color:#e6d9fa}
[data-theme="dark"] mark.m-personalizado{background:#5a4a12;color:#fff0b0}

/* ---- Título de artículo ---- */
.articulo{margin-bottom:16px;border:1px solid var(--borde);border-radius:var(--radio-sm);overflow:hidden}
.articulo-head{background:var(--panel-alt);padding:8px 14px;font-weight:800;font-size:14px;color:var(--verde-osc)}
.articulo-body{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.articulo-body .txt{flex:1;font-size:14px;line-height:1.7}
.articulo-body .txt p{margin-bottom:6px}
.sello-examen{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid #d1332a;color:#d1332a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;transform:rotate(-8deg)}
.margen-nota{font-size:11px;color:var(--verde-med);font-weight:700;line-height:1.4;text-align:right;max-width:150px;border-left:2px dashed var(--borde);padding-left:8px;flex:none}

.bloque-titulo{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:#555;color:#fff;padding:6px 12px;border-radius:8px;margin:22px 0 12px}
[data-theme="dark"] .bloque-titulo{background:#3a4640}

.trampa{background:var(--examen-bg);border:1.5px dashed var(--examen-borde);border-radius:var(--radio-sm);padding:12px 16px;margin:14px 0}
.trampa b{color:var(--examen-txt);display:block;margin-bottom:4px;font-size:13.5px}
.trampa p{font-size:13.5px;line-height:1.5;color:var(--examen-txt)}

.recuerda{background:var(--verde-suave);border:1.5px solid var(--verde-med);border-radius:var(--radio-sm);padding:14px 18px;margin-top:20px}
.recuerda b.titulo-recuerda{display:block;color:var(--verde-osc);font-size:15px;margin-bottom:8px}
.recuerda ul{margin:0;padding-left:18px}
.recuerda li{font-size:13.5px;line-height:1.6;color:var(--texto);margin-bottom:5px}

.btn-pdf{display:flex;align-items:center;gap:6px;border:1.5px solid var(--verde-med);background:transparent;color:var(--verde-med);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-pdf:hover{background:var(--verde-suave)}

@media (max-width:720px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}
  .sidebar h3{width:100%}
  .tema-nav-item{margin-bottom:0}
  .topbar{flex-wrap:wrap}
}

@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  body,html{background:#fff}
  .topbar,.sidebar,.btn-pdf{display:none!important}
  .layout{display:block}
  .content{width:100%}
  .esquema{display:none!important;box-shadow:none;border-radius:0;padding:0}
  .esquema.active{display:block!important}
  .articulo{break-inside:avoid}
  .trampa,.recuerda{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>📚 Esquemas de Estudio</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-pdf" id="btn-exportar-pdf">⬇️ PDF</button>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme-btn="light">Claro</button>
        <button class="theme-btn" data-theme-btn="dark">Oscuro</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="nav-temas">
      <h3>Temas</h3>
      <!-- Los temas se listan aquí automáticamente -->
    </div>

    <div class="content" id="lista-esquemas">
      <!-- Los esquemas se insertan aquí -->
    </div>
  </div>
</div>

<script>
// ---- ESQUEMAS ----
// Cada esquema es un objeto: { id, tema, titulo, bloques: [{ titulo, puntos: [{texto, examen:true/false}] }] }
// Los 27 temas del programa (Materias Profesionales) están precargados como pendientes.
// Se van rellenando uno a uno con los artículos/puntos que se vayan indicando.
const temasPrograma = [
  "TEMA 1.- DERECHOS HUMANOS",
  "TEMA 2.- TERRORISMO Y DELINCUENCIA TRANSNACIONAL",
  "TEMA 3.- TRATADOS DE LA UNIÓN EUROPEA",
  "TEMA 4.- LA GESTIÓN DE LAS FRONTERAS DE LA UNIÓN EUROPEA",
  "TEMA 5.- BASES DE DATOS EUROPEAS",
  "TEMA 6.- ENTRADA Y PERMANENCIA DE EXTRANJEROS EN ESPAÑA",
  "TEMA 7.- DERECHOS Y DEBERES FUNDAMENTALES EN LA CE Y SU PROTECCIÓN",
  "TEMA 8.- PODER JUDICIAL",
  "TEMA 9.- DEFENSA NACIONAL",
  "TEMA 10.- DERECHO CIVIL",
  "TEMA 11.- DERECHO ADMINISTRATIVO",
  "TEMA 12.- GOBIERNO Y ADMINISTRACIÓN",
  "TEMA 13.- JURISDICCIÓN CONTENCIOSO-ADMINISTRATIVA",
  "TEMA 14.- EL DEFENSOR DEL PUEBLO",
  "TEMA 15.- PROTECCIÓN INTEGRAL CONTRA LA VIOLENCIA DE GÉNERO",
  "TEMA 16.- IGUALDAD EFECTIVA Y ACOSO SEXUAL/POR RAZÓN DE SEXO",
  "TEMA 17.- RESPONSABILIDAD PENAL DE LOS MENORES",
  "TEMA 18.- DERECHO PENAL. PARTE GENERAL",
  "TEMA 19.- DERECHO PENAL. PARTE ESPECIAL",
  "TEMA 20.- DERECHO PROCESAL PENAL (I)",
  "TEMA 21.- DERECHO PROCESAL PENAL (II) - NORMAS COMPLEMENTARIAS",
  "TEMA 22.- SEGURIDAD CIUDADANA",
  "TEMA 23.- SEGURIDAD PRIVADA",
  "TEMA 24.- ESTRUCTURAS ORGÁNICAS BÁSICAS",
  "TEMA 25.- COORDINACIÓN Y COOPERACIÓN POLICIAL",
  "TEMA 26.- ESTATUTO DEL PERSONAL DE LA GUARDIA CIVIL",
  "TEMA 27.- DEONTOLOGÍA PROFESIONAL"
];

// Helpers para construir el HTML de un esquema con el estilo Método Prefortia
function leyenda(){
  return `<div class="leyenda">
    <span><i class="lc-destacable"></i>Palabras destacables</span>
    <span><i class="lc-autoridad"></i>Autoridades y cargos públicos</span>
    <span><i class="lc-plazo"></i>Plazos</span>
    <span><i class="lc-accion"></i>Acciones</span>
    <span><i class="lc-personalizado"></i>Personalizado</span>
    <span><i class="lc-clave"></i>Palabras clave</span>
  </div>`;
}
function bloqueTitulo(t){ return `<div class="bloque-titulo">${t}</div>`; }
function articulo(cab, html, examen){
  return `<div class="articulo">
    <div class="articulo-head">${cab}</div>
    <div class="articulo-body">
      <div class="txt">${html}</div>
      ${examen ? '<div class="sello-examen">EX</div>' : ''}
    </div>
  </div>`;
}
function trampa(titulo, html){
  return `<div class="trampa"><b>⚠ ${titulo || 'Trampa de examen'}</b><p>${html}</p></div>`;
}
function recuerda(items){
  return `<div class="recuerda"><b class="titulo-recuerda">✔ RECUERDA — Resumen conceptual y puntos clave de examen</b>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
  </div>`;
}

// Datos base: cada esquema tiene un campo `html` con el contenido ya maquetado.
const esquemas = temasPrograma.map((tema, i) => ({
  id: "tema-" + (i + 1),
  tema: tema,
  titulo: "Pendiente de rellenar",
  html: leyenda() + `<div class="placeholder">Dicta los artículos y puntos de este tema para generar el esquema rápido en el estilo Método Prefortia.</div>`
}));

// ---- TEMA 7 (relleno con los artículos y puntos dictados, texto legal real) ----
(function(){
  const t7 = esquemas[6];
  t7.titulo = "7.1 y 7.2 — Resumen esquemático";
  t7.html = leyenda()

    + bloqueTitulo("LEY ORGÁNICA 2/1979, DEL TRIBUNAL CONSTITUCIONAL — TÍTULO I, CAPÍTULO I: Organización y atribuciones")

    + articulo("Artículo 2 — Competencias del Tribunal Constitucional", `
      <p><b>1.</b> <mark class="m-accion">El Tribunal Constitucional conocerá</mark> en los <mark class="m-destacable">casos y en la forma</mark> que esta Ley determina:</p>
      <p>a) Del <mark class="m-destacable">recurso y de la cuestión de inconstitucionalidad</mark> contra <mark class="m-personalizado">Leyes, disposiciones normativas o actos con fuerza de Ley</mark>.</p>
      <p><mark class="m-personalizado">b) Del recurso de amparo</mark> por <mark class="m-accion">violación</mark> de los <mark class="m-destacable">derechos y libertades públicos</mark> relacionados en el art. 53.2 CE (protección de los derechos y libertades fundamentales).</p>
      <p>c) De los <mark class="m-destacable">conflictos constitucionales de competencia</mark> entre el <mark class="m-autoridad">Estado</mark> y las <mark class="m-autoridad">CC.AA.</mark> o de los de éstas entre sí.</p>
      <p>d) De los <mark class="m-destacable">conflictos entre los órganos constitucionales</mark> del Estado. d bis) De los <mark class="m-destacable">conflictos en defensa de la autonomía local</mark>.</p>
      <p>e) De la <mark class="m-destacable">declaración sobre la constitucionalidad de los tratados internacionales</mark>. e bis) Del <mark class="m-destacable">control previo de inconstitucionalidad</mark> del art. 79 LOTC (control previo de Tratados internacionales).</p>
      <p>f) De las <mark class="m-destacable">impugnaciones</mark> previstas en el art. 161.2 CE (suspensión de disposiciones y resoluciones de las CC.AA. impugnadas por el Gobierno).</p>
      <p><mark class="m-personalizado">g) De la verificación de los nombramientos</mark> de los <mark class="m-autoridad">Magistrados del Tribunal Constitucional</mark>, para <mark class="m-accion">juzgar</mark> si reúnen los <mark class="m-destacable">requisitos</mark> exigidos por la Constitución y esta Ley.</p>
      <p>h) De las <mark class="m-destacable">demás materias</mark> que le atribuyen la <mark class="m-autoridad">Constitución</mark> y las <mark class="m-autoridad">Leyes orgánicas</mark>.</p>
      <p><b>2.</b> El <mark class="m-autoridad">TC</mark> <mark class="m-accion">podrá dictar</mark> <mark class="m-destacable">reglamentos</mark> sobre su propio funcionamiento y organización, <u class="m-clave">así como</u> sobre el <mark class="m-destacable">régimen de su personal y servicios</mark>. Estos reglamentos deberán ser <mark class="m-accion">aprobados</mark> por el Tribunal en <mark class="m-autoridad">Pleno</mark> y se <mark class="m-accion">publicarán</mark> en el <mark class="m-destacable">BOE</mark>, autorizados por su <mark class="m-autoridad">Presidente</mark>.</p>
    `)

    + articulo("Artículo 3 — Competencia sobre cuestiones prejudiciales", `
      <p><mark class="m-destacable">La competencia</mark> del <mark class="m-autoridad">Tribunal Constitucional</mark> <mark class="m-accion">se extiende</mark> al <mark class="m-accion">conocimiento y decisión</mark> de las <mark class="m-destacable">cuestiones prejudiciales e incidentales</mark> <u class="m-clave">no</u> pertenecientes al <mark class="m-destacable">orden constitucional</mark>, <mark class="m-personalizado">directamente relacionadas</mark> con la materia de que conoce, a los <mark class="m-personalizado">solos efectos</mark> del <mark class="m-personalizado">enjuiciamiento constitucional</mark> de ésta.</p>
    `)

    + articulo("Artículo 4.1, 4.2 y 4.3 — Delimitación de jurisdicción", `
      <p><b>1.</b> En <u class="m-clave">ningún caso</u> se podrá <mark class="m-accion">promover</mark> <mark class="m-destacable">cuestión de jurisdicción o competencia</mark> al TC. El TC <mark class="m-accion">delimitará</mark> el <mark class="m-destacable">ámbito de su jurisdicción</mark> y <mark class="m-accion">adoptará</mark> cuantas <mark class="m-destacable">medidas</mark> sean necesarias para preservarla, incluyendo la <mark class="m-destacable">declaración de nulidad</mark> de aquellos actos o resoluciones que la menoscaben; <mark class="m-personalizado">asimismo</mark> podrá <mark class="m-accion">apreciar</mark> de <u class="m-clave">oficio o a instancia de parte</u> su <mark class="m-destacable">competencia o incompetencia</mark>.</p>
      <p><b>2.</b> Las <mark class="m-destacable">resoluciones</mark> del TC <u class="m-clave">no podrán ser enjuiciadas</u> por <u class="m-clave">ningún</u> órgano jurisdiccional del Estado.</p>
      <p><b>3.</b> Cuando el TC <mark class="m-accion">anule</mark> un acto o resolución que contravenga lo anterior, lo hará <mark class="m-destacable">motivadamente</mark> y <mark class="m-personalizado">previa audiencia</mark> al <mark class="m-autoridad">Ministerio Fiscal</mark> y al <mark class="m-autoridad">órgano autor del acto</mark> o resolución.</p>
    `)

    + articulo("Artículo 5 — Composición del Tribunal", `
      <p>El <mark class="m-autoridad">Tribunal Constitucional</mark> <mark class="m-accion">está integrado</mark> por <mark class="m-plazo">doce</mark> miembros, con el título de <mark class="m-autoridad">Magistrados del Tribunal Constitucional</mark>.</p>
    `)

    + articulo("Artículo 6.2 — El Pleno", `
      <p><b>2.</b> El <mark class="m-autoridad">Pleno</mark> <mark class="m-accion">está integrado</mark> por <u class="m-clave">todos</u> los <mark class="m-autoridad">Magistrados</mark> del Tribunal. Lo <mark class="m-accion">preside</mark> el <mark class="m-autoridad">Presidente</mark> del Tribunal y, en su defecto, el <mark class="m-autoridad">Vicepresidente</mark> y, a falta de ambos, el <mark class="m-destacable">Magistrado más antiguo</mark> en el cargo y, en caso de igual antigüedad, el de <mark class="m-destacable">mayor edad</mark>.</p>
    `)

    + articulo("Artículo 7.1, 7.2 y 7.3 — Las Salas", `
      <p><b>1.</b> El TC <mark class="m-accion">consta</mark> de <mark class="m-plazo">dos Salas</mark>. Cada Sala está compuesta por <mark class="m-plazo">seis Magistrados</mark> <mark class="m-accion">nombrados</mark> por el Tribunal en Pleno.</p>
      <p><b>2.</b> El <mark class="m-autoridad">Presidente</mark> del Tribunal lo es también de la <mark class="m-destacable">Sala Primera</mark>, que <mark class="m-accion">presidirá</mark>; en su defecto, el <mark class="m-destacable">Magistrado más antiguo</mark> y, en caso de igual antigüedad, el de <mark class="m-destacable">mayor edad</mark>.</p>
      <p><b>3.</b> El <mark class="m-autoridad">Vicepresidente</mark> del Tribunal <mark class="m-accion">presidirá</mark> la <mark class="m-destacable">Sala Segunda</mark> y, en su defecto, el <mark class="m-destacable">Magistrado más antiguo</mark> y, en caso de igual antigüedad, el de <mark class="m-destacable">mayor edad</mark>.</p>
    `)

    + trampa("Trampa de examen", "Presidente → preside el Pleno y la Sala Primera. Vicepresidente → preside la Sala Segunda. Es la confusión más típica: no intercambiar qué Sala preside cada uno.")

    + articulo("Artículo 8.1, 8.2 y 8.3 — Las Secciones", `
      <p><b>1.</b> Para el <mark class="m-destacable">despacho ordinario</mark> y la <mark class="m-destacable">decisión o propuesta sobre admisibilidad</mark> de procesos constitucionales, el <mark class="m-autoridad">Pleno</mark> y las <mark class="m-autoridad">Salas</mark> <mark class="m-accion">constituirán</mark> <mark class="m-destacable">Secciones</mark> compuestas por el respectivo <mark class="m-autoridad">Presidente</mark> (o quien le sustituya) y <mark class="m-plazo">dos Magistrados</mark>.</p>
      <p><b>2.</b> Se <mark class="m-accion">dará cuenta</mark> al Pleno de las <mark class="m-destacable">propuestas de admisión o inadmisión</mark> de asuntos de su competencia; en caso de admisión, el Pleno podrá <mark class="m-accion">deferir</mark> a la Sala que corresponda el <mark class="m-destacable">conocimiento del asunto</mark>.</p>
      <p><b>3.</b> Podrá corresponder también a las Secciones el <mark class="m-destacable">conocimiento y resolución</mark> de los <mark class="m-destacable">asuntos de amparo</mark> que la Sala correspondiente les <mark class="m-accion">defiera</mark>.</p>
    `)

    + articulo("Artículo 11.1 y 11.2 — Competencia de las Salas", `
      <p><b>1.</b> Las <mark class="m-autoridad">Salas</mark> del Tribunal Constitucional <mark class="m-accion">conocerán</mark> de los asuntos que, atribuidos a la <mark class="m-destacable">justicia constitucional</mark>, <u class="m-clave">no</u> sean <mark class="m-destacable">competencia del Pleno</mark>.</p>

function render(){
  const nav = document.getElementById('nav-temas');
  const lista = document.getElementById('lista-esquemas');
  nav.innerHTML = '<h3>Temas</h3>';
  lista.innerHTML = '';

  if(!esquemas.length){
    lista.innerHTML = '<div class="placeholder">Todavía no hay esquemas. Dime el tema, los artículos o puntos y los voy añadiendo aquí.</div>';
    return;
  }

  esquemas.forEach((es, i) => {
    const navItem = document.createElement('div');
    navItem.className = 'tema-nav-item' + (i===0 ? ' active' : '');
    navItem.textContent = es.tema;
    navItem.onclick = () => mostrar(es.id);
    navItem.dataset.target = es.id;
    nav.appendChild(navItem);

    const div = document.createElement('div');
    div.className = 'esquema' + (i===0 ? ' active' : '');
    div.id = es.id;
    div.innerHTML = `
      <div class="esquema-head">
        <div class="eyebrow">${es.tema}</div>
        <h2>${es.titulo}</h2>
      </div>
      ${es.html}
    `;
    lista.appendChild(div);
  });
}

function mostrar(id){
  document.querySelectorAll('.esquema').forEach(e => e.classList.toggle('active', e.id === id));
  document.querySelectorAll('.tema-nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === id));
}

      <p>Su <mark class="m-destacable">finalidad</mark> es <mark class="m-accion">prevenir y combatir</mark> la <mark class="m-destacable">trata</mark>, <mark class="m-accion">proteger y ayudar</mark> a las <mark class="m-destacable">víctimas</mark> y <mark class="m-accion">promover</mark> la cooperación de los <mark class="m-autoridad">Estados Parte</mark>.</p>
      <p><mark class="m-accion">Se tipificará</mark> como <mark class="m-destacable">delito</mark> la <mark class="m-destacable">tentativa</mark>, la <mark class="m-destacable">participación como cómplice</mark> y la <mark class="m-destacable">organización o dirección de otras personas</mark> para la comisión.</p>
      <p><b>Cláusula de salvaguardia:</b> nada de lo dispuesto <mark class="m-accion">afectará</mark> a la normativa de <mark class="m-destacable">derechos humanos</mark> así como al <mark class="m-destacable">principio de non-refoulement</mark>.</p>
      <p><b>Entrada en vigor:</b> el <mark class="m-plazo">25 de diciembre de 2003</mark>.</p>
    `, true)

      <p>Un <mark class="m-autoridad">Estado Parte</mark> que <mark class="m-accion">tenga</mark> <mark class="m-personalizado">motivos razonables</mark> para <mark class="m-personalizado">sospechar</mark> que un buque de otro Estado <mark class="m-accion">está involucrado</mark> en el <mark class="m-destacable">tráfico ilícito de migrantes</mark> <mark class="m-accion">podrá notificarlo</mark> al Estado, <mark class="m-accion">pedir</mark> que <mark class="m-accion">compruebe</mark> la matrícula y, si lo <mark class="m-accion">confirma</mark>, <mark class="m-accion">solicitarle autorización</mark> para <mark class="m-accion">tomar</mark> medidas.</p>

    `, true)

    + articulo("Autoridades designadas, cooperación y entrada en vigor", `
      <p>Cada Estado <mark class="m-accion">designará</mark> a una, o de ser necesario a varias, <mark class="m-autoridad">autoridades</mark> para <mark class="m-accion">recibir y atender</mark> <mark class="m-destacable">solicitudes de asistencia</mark>. <mark class="m-accion">Se dará a conocer</mark> a los demás Estados Parte por conducto del <mark class="m-autoridad">Secretario General</mark> dentro del <mark class="m-plazo">mes siguiente</mark> a la designación.</p>
      <p><b>Cooperación para el desarrollo</b> en los planos <mark class="m-destacable">regional, nacional e internacional</mark>. <mark class="m-accion">Considerarán</mark> la posibilidad de <mark class="m-accion">celebrar</mark> <mark class="m-destacable">acuerdos bilaterales o regionales</mark>.</p>
      <p><b>Entrada en vigor:</b> <mark class="m-plazo">28 de enero de 2004</mark>.</p>
    `)

    + bloqueTitulo("2.7 — PROTOCOLO CONTRA LA FABRICACIÓN Y EL TRÁFICO ILÍCITOS DE ARMAS DE FUEGO, SUS PIEZAS Y COMPONENTES Y MUNICIONES")

    + articulo("Finalidad, registros y marcación de armas de fuego", `
      <p>Su <mark class="m-destacable">finalidad</mark> es <mark class="m-accion">promover, facilitar y reforzar</mark> la cooperación con el propósito de <mark class="m-accion">prevenir, combatir y erradicar</mark> la fabricación y el tráfico ilícito de armas de fuego.</p>
      <p><b>Registros:</b> <mark class="m-accion">mantenimiento</mark> por un periodo <u class="m-clave">no inferior</u> a <mark class="m-plazo">10 años</mark> de la información de las armas de fuego, y <u class="m-clave">cuando</u> sea <mark class="m-personalizado">apropiado y factible</mark>, de sus piezas, componentes y municiones.</p>
      <p><b>Marcación de las armas de fuego</b> en el momento de la <mark class="m-destacable">fabricación</mark>: <mark class="m-accion">se usará</mark> una marca distintiva que <mark class="m-accion">indique</mark> el <mark class="m-destacable">nombre del fabricante</mark>, <mark class="m-destacable">país o lugar de fabricación</mark> y <mark class="m-destacable">número de serie</mark> u otra marca distintiva.</p>
      <p><b>Armas importadas:</b> marca sencilla y apropiada del <mark class="m-destacable">país de importación</mark>, y <mark class="m-personalizado">de ser posible</mark>, <mark class="m-plazo">año</mark> y marca distintiva.</p>
    `, true)

    + articulo("Principios generales de desactivación", `
      <p>Las <mark class="m-destacable">piezas esenciales</mark> <mark class="m-accion">se tornarán</mark> <mark class="m-personalizado">permanentemente inservibles</mark> y no susceptibles de ser <mark class="m-accion">retiradas, sustituidas o modificadas</mark> de forma que puedan <mark class="m-accion">permitir</mark> su <mark class="m-destacable">reactivación</mark>.</p>
      <p>Una <mark class="m-autoridad">autoridad competente</mark> <mark class="m-accion">verificará</mark> las medidas de desactivación, mediante la <mark class="m-accion">expedición</mark> de un <mark class="m-destacable">certificado</mark> o <mark class="m-destacable">anotación en un registro</mark> o la <mark class="m-accion">inclusión</mark> de una <mark class="m-destacable">marca</mark>.</p>
    `)

    + articulo("Cooperación, órgano de enlace y corredores", `
      <p>Los Estados <mark class="m-accion">cooperarán</mark> en los planos <mark class="m-destacable">regional, nacional e internacional</mark>. Cada <mark class="m-autoridad">Estado Parte</mark> <mark class="m-accion">designará</mark> un <mark class="m-autoridad">órgano nacional o punto de contacto central</mark> encargado de <mark class="m-accion">mantener</mark> el enlace.</p>
      <p><b>Corredores y corretaje</b> <mark class="m-accion">podría incluir</mark> alguna de estas medidas: <mark class="m-destacable">inscripción</mark> de los corredores en un <mark class="m-destacable">registro</mark>; <mark class="m-accion">exigir</mark> <mark class="m-destacable">licencia o autorización</mark> para el ejercicio de corretaje; <mark class="m-destacable">licencia o autorización de importación o exportación</mark>, o <mark class="m-accion">consignar</mark> en la documentación adjunta a la mercancía el <mark class="m-destacable">nombre y ubicación</mark> de los corredores.</p>
    `, true)

    + recuerda([
      "(2.1) La Ley 19/2003 sanciona la presentación fuera de plazo (hasta 300€/600€ según hayan pasado más o menos de 6 meses) y fija la obligación de declarar medios de pago superiores a 6.000€ (viaje) y 80.500€ (movimiento nacional).",
      "(2.1) Inversión extranjera directa = 10% del capital social; titularidad real = más del 25% del capital del inversor.",
      "(2.2) El Convenio de Varsovia (2005) tipifica provocación pública, reclutamiento y adiestramiento terrorista sin exigir que el delito llegue a cometerse; la reserva a la cláusula de excepción política dura 3 años renovables.",
      "(2.3) La Ley 10/2010 eleva los umbrales de declaración a 10.000€ (entrada/salida) y 100.000€ (movimiento nacional), y crea el Registro de Titularidades Reales en el Ministerio de Justicia (conservación 10 años).",
      "(2.3) Multas muy graves: desde 150.000€ (entidades) y 60.000€–10.000.000€ (cargos); graves: desde 60.000€ (entidades) y 3.000€–5.000.000€ (cargos); leves: hasta 60.000€.",
      "(2.4) Convención de Palermo: grupo delictivo organizado = 3 o más personas concertadas; delito grave = pena máxima de al menos 4 años de privación de libertad. Entrada en vigor: 90 días tras el 40º instrumento depositado.",
      "(2.5) Protocolo de trata: entrada en vigor 25 de diciembre de 2003, protege el principio de non-refoulement.",
      "(2.6) Protocolo de tráfico de migrantes: entrada en vigor 28 de enero de 2004; medidas sobre buques sospechosos: visitar, registrar y adoptar medidas apropiadas.",
      "(2.7) Protocolo de armas de fuego: registros conservados no menos de 10 años; marcación obligatoria en fabricación (fabricante, país, nº de serie) e importación (país de importación)."
    ]);
})();

// ---- TEMA CLARO / OSCURO ----
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeBtn === t));
  try{ localStorage.setItem('esquemas-theme', t); }catch(e){}
}
document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));

let saved = 'light';
try{ saved = localStorage.getItem('esquemas-theme') || 'light'; }catch(e){}
setTheme(saved);

// Usa el diálogo de impresión del navegador (elegir "Guardar como PDF") solo sobre el esquema activo.
document.getElementById('btn-exportar-pdf').addEventListener('click', () => {
  window.print();
});

render();
