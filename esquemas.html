  + articuloResp("Artículos 17 y 18 — Escolta de seguridad en los vuelos", ["decide cada Parte de forma autónoma","agentes de policía u otros empleados públicos con formación","notificación por escrito al menos tres días antes","confidencial, con los datos del Anexo 1","autorización general para llevar armas","al bajar, entrega bajo escolta en un punto de entrega y custodia"], "<p><b>17.1.</b> <mark class=\"m-resp\">Cada Parte Contratante decidirá de forma autónoma, con arreglo a su política nacional de seguridad aérea</mark>, acerca del empleo de escoltas de seguridad en los vuelos de las aeronaves matriculadas en dicha Parte Contratante. El empleo de dichos escoltas de seguridad se ajustará al <mark class=\"m-personalizado\">Convenio Internacional de Chicago de 7 de diciembre de 1944</mark> (…), en particular el Anexo n.° 17 (…), y teniendo en cuenta las facultades del comandante de a bordo con arreglo al <mark class=\"m-personalizado\">Convenio de Tokio de 14 de septiembre de 1963</mark> (…).</p><p><b>17.2.</b> Los <mark class=\"m-destacable\">escoltas de seguridad de los vuelos</mark> (…) serán <mark class=\"m-resp\">agentes de policía u otros empleados públicos con la formación correspondiente</mark> encargados de garantizar la seguridad a bordo de las aeronaves.</p><p><b>17.4.</b> Antes de realizar la escolta de seguridad de un vuelo, el punto de coordinación nacional competente (…) deberá notificar por escrito la utilización de dicha escolta. La notificación se efectuará <mark class=\"m-resp\">como mínimo tres días antes del vuelo</mark> de que se trate (…). En caso de peligro inminente, la notificación ulterior se efectuará de manera inmediata antes del aterrizaje.</p><p><b>17.5.</b> La notificación escrita, que <mark class=\"m-resp\">las Partes Contratantes tratarán con carácter confidencial, contendrá los datos indicados en el Anexo 1</mark> del presente Tratado. <mark class=\"m-resp\">Las Partes Contratantes podrán modificar el Anexo 1 mediante un acuerdo   + articuloResp("Artículos 20 a 23 — Asesores en materia de documentos y repatriación · R29 R30", ["envío a Estados de origen o tránsito de la migración ilegal","funciones 1-3","puntos nacionales de contacto y de coordinación como interlocutores","repatriación por otro territorio: decide la Parte de tránsito"], "<p><b>20.1.</b> Las Partes Contratantes acordarán (…) el envío de <mark class=\"m-destacable\">asesores en materia de documentos</mark> <mark class=\"m-resp\">a Estados que se hayan calificado de Estados de origen o tránsito de la migración ilegal</mark>.</p><p><b>21.</b> Los asesores en materia de documentos (…) desempeñarán en particular las siguientes FUNCIONES: 1. <mark class=\"m-resp\">asesoramiento y formación a las representaciones en el extranjero de las Partes Contratantes sobre cuestiones relacionadas con pasaportes y visados, en particular para el reconocimiento de documentos falsos y documentos manipulados</mark> (…); 2. asesoramiento y formación a las empresas de transporte (…); 3. <mark class=\"m-resp\">asesoramiento y formación a las autoridades e instituciones del país anfitrión competentes en materia de control policial en las fronteras. No resultarán afectadas por ello las competencias de las representaciones en el extranjero ni de las autoridades de las Partes Contratantes encargadas de funciones policiales en las fronteras</mark>.</p><p><b>22.</b> Las Partes Contratantes designarán puntos nacionales de contacto y de coordinación <mark class=\"m-resp\">como interlocutores para acordar lo relativo al envío de asesores en materia de documentos y la planificación, ejecución, supervisión y revisión de las medidas de asesoramiento y formación</mark>.</p><p><b>23.2.</b> Una Parte Contratante podrá proceder, en la medida en que sea necesario, a la repatriación de una persona a través del territorio de otra Parte Contratante. <mark class=\"m-resp\">La Parte Contratante por cuyo territorio se realice la repatriación</mark> decidirá acerca de la misma. (…)</p>", false)
  + articuloResp("Artículos 24 a 27 — Intervención conjunta, peligro inminente, grandes eventos y cooperación previa petición · R31", ["facultades soberanas bajo la dirección y, como norma, en presencia de agentes del Estado del territorio","peligro inminente: cruzar sin autorización y adoptar medidas provisionales","permanecen hasta que el Estado del territorio adopte medidas","asistencia: agentes, especialistas, asesores y equipos","permisos de conducción y patentes de navegación"], "<p><b>24.1.</b> Con OBJETO de intensificar la cooperación policial, las autoridades competentes (…) podrán organizar <mark class=\"m-destacable\">patrullas comunes y otras formas de intervención conjunta</mark> (…).</p><p><b>24.2.</b> (…) En todo caso, las facultades soberanas solo podrán ejercerse <mark class=\"m-resp\">bajo la dirección y como norma en presencia de agentes del Estado del territorio</mark>. A estos efectos, los agentes de la otra Parte Contratante estarán sujetos al derecho interno del Estado del territorio. Sus actos serán imputables al Estado del territorio.</p><p><b>25.1.</b> En caso de <mark class=\"m-personalizado\">urgente necesidad</mark>, los agentes de una Parte Contratante podrán, <mark class=\"m-resp\">sin la autorización previa</mark> de la otra Parte Contratante, <mark class=\"m-resp\">cruzar la frontera común para adoptar en la zona próxima a la frontera</mark> (…) <mark class=\"m-resp\">las medidas provisionales necesarias para evitar un peligro inminente para la vida o la integridad física de las personas</mark>.</p><p><b>25.3.</b> Los agentes que realicen esta intervención deberán informar inmediatamente al Estado del territorio. (…) Los agentes que realicen la intervención sólo podrán permanecer en el Estado del territorio <mark class=\"m-resp\">hasta que el mismo haya adoptado las medidas necesarias para evitar dicho peligro</mark>. (…)</p><p><b>26.</b> Las autoridades competentes de las Partes Contratantes se prestarán apoyo recíproco (…) en los eventos masivos y otros acontecimientos similares, catástrofes y accidentes graves, de la manera siguiente: <mark class=\"m-resp\">1. se informarán recíprocamente lo antes posible de los sucesos o eventos con repercusión transfronteriza y los datos pertinentes; 2. en situaciones de repercusión transfronteriza, tomarán y coordinarán las medidas policiales necesarias en su territorio; 3. a petición de la Parte Contratante en cuyo territorio se produzca la situación pertinente, prestarán asistencia en la medida de lo posible mediante el envío de agentes, especialistas y asesores, así como el suministro de equipos</mark>. (…)</p><p><b>27.2.</b> Las autoridades competentes de las Partes Contratantes se prestarán asistencia recíproca (…), en particular mediante: 1. la averiguación de la identidad del propietario y el usuario y la investigación sobre los conductores de vehículos terrestres, acuáticos y aéreos (…); 2. <mark class=\"m-resp\">la información sobre permisos de conducción, patentes de navegación y habilitaciones semejantes</mark>; 3. la averiguación de la residencia y del lugar de domicilio; 4. la comprobación de los títulos de residencia; (…) 6. la averiguación de la identidad; (…)</p>", false)
  + articuloResp("Artículos 28 a 32 — Armas, protección, responsabilidad y situación de los agentes", ["uniforme de servicio nacional","armas del Anexo 2 solo en legítima defensa (incluido auxilio necesario)","misma protección que a sus propios agentes","responsabilidad: art. 43 del Convenio de Schengen (no a los arts. 17 y 18)","penal: equiparados a los agentes de la otra Parte","disciplinario: disposiciones de su propio Estado"], "<p><b>28.1.</b> Los agentes de una Parte Contratante que se encuentren en el territorio de otra Parte Contratante en el marco de una intervención conjunta podrán utilizar allí <mark class=\"m-resp\">su uniforme de servicio nacional</mark>. Podrán llevar consigo las armas de servicio, municiones y equipos permitidos por el derecho interno de su Estado de origen. (…)</p><p><b>28.2.</b> Las armas de servicio, municiones y equipos enumerados en el Anexo 2 <mark class=\"m-resp\">solo podrán utilizarse en caso de legítima defensa, incluido el auxilio necesario</mark>. En casos concretos, <mark class=\"m-resp\">el agente responsable del Estado del territorio podrá autorizar</mark> (…) una utilización (…) que exceda de lo previsto (…). El empleo de armas de servicio (…) se regirá por el derecho del Estado del territorio. (…)</p><p><b>29.</b> Las Partes Contratantes estarán obligadas a prestar a los agentes enviados por otras Partes Contratantes <mark class=\"m-resp\">la misma protección y apoyo en el desempeño de sus funciones que a sus propios agentes</mark>.</p><p><b>30.</b> A la responsabilidad derivada del presente Tratado se le aplicará por analogía <mark class=\"m-resp\">el artículo 43</mark> del Convenio de 19 de junio de 1990 de aplicación del Acuerdo de Schengen (…). Lo dispuesto en la primera frase <mark class=\"m-resp\">no será aplicable a los artículos 17 y 18</mark>.</p><p><b>31.</b> Los agentes que intervengan en el territorio de otra Parte Contratante (…) estarán equiparados <mark class=\"m-resp\">a los agentes de dicha otra Parte Contratante</mark> en relación con los delitos que cometan o de que sean víctimas (…).</p><p><b>32.</b> Los agentes que intervengan en el territorio de otra Parte Contratante (…) seguirán sujetos a <mark class=\"m-resp\">las disposiciones de servicio vigentes en su propio Estado, en particular en materia de derecho disciplinario</mark>.</p>", false)
  + articuloResp("Artículos 33 a 40 — Protección de datos · R32 R33", ["bloqueo: marcado para limitar el tratamiento futuro","transmisión solo cuando el capítulo esté incorporado al derecho interno (decide el Comité de Ministros)","fines del art. 35.2","bloqueo en lugar de supresión si afecta a intereses dignos de protección","documentación 1-4","consulta solo por agentes autorizados","datos del registro en 4 semanas","registro conservado DOS años","control por muestreo 18 meses","reembolso total de la indemnización"], "<p><b>33.1.</b> (…) 3. por «<mark class=\"m-destacable\">marcado</mark>» se entenderá la inserción de una marca en los datos almacenados de carácter personal <u class=\"m-clave\">sin</u> que con ello se pretenda limitar su tratamiento en el futuro; 4. por «<mark class=\"m-destacable\">bloqueo</mark>» se entenderá <mark class=\"m-resp\">el marcado de los datos almacenados de carácter personal con el fin de limitar su tratamiento en el futuro</mark>.</p><p><b>34.2.</b> La transmisión de datos de carácter personal en virtud del presente Tratado sólo podrá iniciarse <mark class=\"m-resp\">cuando en el territorio de las Partes Contratantes que participen en dicha transmisión se hayan incorporado al derecho interno las disposiciones del presente capítulo</mark>. <mark class=\"m-resp\">El Comité de Ministros</mark> previsto en el artículo 43 determinará <mark class=\"m-resp\">mediante una decisión</mark> si se cumple este requisito.</p><p><b>35.2.</b> El tratamiento de los datos transmitidos con arreglo a los artículos 3, 4 y 9 por la Parte Contratante que realice la consulta o la comparación se permitirá exclusivamente en relación con: <mark class=\"m-resp\">1. la comprobación de si existe o no coincidencia entre los perfiles de ADN o datos dactiloscópicos comparados; 2. la preparación y presentación de una solicitud de asistencia administrativa o judicial con arreglo al derecho interno en el supuesto de que los datos coincidan; 3. el registro con arreglo sados por la utilización de datos transmitidos inexactos, el órgano transmitente deberá <mark class=\"m-resp\">reembolsar a la instancia receptora el importe total de la indemnización de daños abonada</mark>.</p>", false)

  + articuloResp("Artículos 43 a 52 — Comité de Ministros y disposiciones finales", ["Comité de Ministros por unanimidad","Países Bajos y Francia: solo la parte europea","prevalece el derecho de la UE futuro","frente a otros convenios prevalece el Tratado","depositario: Gobierno de Alemania","vigor: 90 días tras el segundo instrumento","denuncia: efecto a los seis meses"], "<p><b>43.1.</b> Las Partes Contratantes crearán un <mark class=\"m-autoridad\">Comité integrado por los ministros</mark> de las Partes Contratantes. (…) Las decisiones del Comité de Ministros se adoptarán <mark class=\"m-resp\">por unanimidad entre todas las Partes Contratantes</mark>.</p><p><b>45.</b> (…) Por lo que respecta al Reino de los Países Bajos, el presente Tratado <mark class=\"m-resp\">sólo será aplicable a la parte del Reino situada en Europa</mark>. Por lo que respecta a la República Francesa, (…) sólo será aplicable a la parte de la República situada en Europa.</p><p><b>46.</b> Cada Parte Contratante correrá con los gastos en que incurran sus autoridades en la aplicación del presente Tratado. (…)</p><p><b>47.1.</b> (…) Si en el futuro la Unión Europea adoptara normas que puedan afectar al ámbito de aplicación del presente Tratado, <mark class=\"m-resp\">las disposiciones correspondientes del presente Tratado dejarán de aplicarse en beneficio del derecho de la Unión Europea</mark>. (…)</p><p><b>47.2.</b> (…) En caso de incompatibilidad con los derechos u obligaciones derivados de esos otros convenios, <mark class=\"m-resp\">prevalecerán las disposiciones del presente Tratado</mark>.</p><p><b>49.1.</b> El depositario del presente Tratado es <mark class=\"m-resp\">el Gobierno de la República Federal de Alemania</mark>.</p><p><b>50.1.</b> El presente Tratado entrará en vigor entre las Partes Contratantes que lo hayan ratificado <mark class=\"m-resp\">90 días después del depósito del segundo instrumento de ratificación, aceptación o aprobación</mark>. Para las demás Partes Contratantes,   + articuloResp("Artículos 19 y 46 y Declaración de España — Puntos de contacto de escolta, gastos y Gibraltar", ["escolta y armas: un punto nacional de contacto y de coordinación","gastos: cada Parte los suyos (salvo casos especiales)","España: declaración sobre Gibraltar","en vigor para España el 1-11-2006"], "<p><b>19.</b> Para el desempeño de las funciones indicadas en los artículos 17 y 18 (escolta de seguridad en vuelos y armas), <mark class=\"m-resp\">cada una de las Partes Contratantes designará un punto nacional de contacto y de coordinación</mark>.</p><p><b>46.</b> <mark class=\"m-resp\">Cada Parte Contratante correrá con los gastos en que incurran sus autoridades en la aplicación del presente Tratado. En casos especiales, las Partes Contratantes interesadas podrán adoptar un sistema diferente</mark>.</p><p>Declaración III. El Reino de España declara, por lo que respecta a la primera frase del artículo 45 (ámbito territorial), que considera que al Tratado le resulta de aplicación el «Régimen acordado relativo a las autoridades de <mark class=\"m-resp\">Gibraltar</mark> (…)», de 19 de abril de 2000 (…).</p><p>El presente Convenio entró en vigor para España el <mark class=\"m-plazo\">1 de noviembre de 2006</mark>.</p>", true)
  + bloqueTitulo("4.4 — DECISIÓN 2008/615/JAI DEL CONSEJO, DE 23 DE JUNIO DE 2008 (DECISIÓN PRÜM): COOPERACIÓN TRANSFRONTERIZA CONTRA EL TERRORISMO Y LA DELINCUENCIA TRANSFRONTERIZA")
  + articuloResp("Artículo 1 — Objeto y ámbito de aplicación", ["ámbitos a)-d): ADN, dactiloscopia y vehículos","acontecimientos importantes","prevención de atentados terroristas","cooperación policial (NO retorno)"], "<p>Mediante la presente Decisión, los Estados miembros pretenden intensificar la <mark class=\"m-destacable\">cooperación transfronteriza</mark> (…), en particular el intercambio de información entre las autoridades responsables de la prevención y la persecución de delitos. A tal fin, la presente Decisión contiene normas en los ámbitos siguientes: <mark class=\"m-resp\">a) disposiciones sobre las condiciones y procedimientos de transferencia automatizada de perfiles de ADN, datos dactiloscópicos y ciertos datos de los registros nacionales de matriculación de vehículos (capítulo 2); b) disposiciones sobre las condiciones de suministro de datos relacionados con acontecimientos importantes que tengan una dimensión transfronteriza (capítulo 3); c) disposiciones relativas a las condiciones de suministro de información con el fin de prevenir atentados terroristas (capítulo 4); d) disposiciones sobre las condiciones y procedimientos de intensificación de la cooperación policial transfronteriza a través de diversas medidas (capítulo 5)</mark>.</p>", true)

  + articuloResp("Artículos 2 a 7 — Perfiles de ADN", ["crearán y mantendrán ficheros nacionales de ADN","índices: parte no codificante y un NÚMERO de referencia","no atribuidos = «perfiles de ADN no identificados»","comunicación a la Secretaría General del Consejo","consulta para casos concretos según el Derecho del requirente","recibe el índice de referencia de la concordancia","comparación solo si lo prevé el Derecho del requirente","otros datos: Derecho del requerido","requisitos a)-c)"], "<p><b>2.1.</b> Los Estados miembros <mark class=\"m-resp\">crearán y mantendrán ficheros nacionales de análisis del ADN</mark> para los fines de la persecución de delitos. (…)</p><p><b>2.2.</b> (…) Dichos índices de referencia contendrán exclusivamente perfiles de ADN obtenidos a partir de la parte no codificante del ADN y un <mark class=\"m-personalizado\">número de referencia</mark>. Los índices de referencia no contendrán datos que permitan identificar directamente al interesado. <mark class=\"m-resp\">Los índices de referencia que no se atribuyan a ninguna persona (perfiles de ADN no identificados) deberán poder reconocerse como tales</mark>.</p><p><b>2.3.</b> Cada Estado miembro <mark class=\"m-resp\">comunicará a la Secretaría General del Consejo</mark> (…) los ficheros nacionales de análisis del ADN a los que sean de aplicación los artículos 2 a 6 (…).</p><p><b>3.1.</b> (…) Las consultas solo podrán realizarse para casos concretos y <mark class=\"m-resp\">con arreglo al Derecho interno del Estado miembro requirente</mark>.</p><p><b>3.2.</b> Si en el curso de una consulta automatizada se comprueba la concordancia (…), el punto de contacto nacional del Estado miembro que efectúa la consulta recibirá de forma automatizada <mark class=\"m-resp\">el índice de referencia con el que se haya producido la concordancia</mark>. (…)</p><p><b>4.1.</b> Los Estados miembros llevarán a cabo, de mutuo acuerdo y a través de sus puntos de contacto nacionales, comparaciones de los perfiles de ADN de sus perfiles de ADN no identificados con todos los perfiles de ADN contenidos en los índices de referencia de los demás ficheros nacionales (…). La transmisión para fines de comparación de los perfiles de ADN no identificados <mark class=\"m-resp\">únicamente tendrá lugar en los casos en que se prevea dicha transmisión en el Derecho interno del Estado miembro requirente</mark>.</p><p><b>5.</b> En caso de que se compruebe que existe concordancia entre perfiles de ADN (…), la transmisión de otros datos de carácter personal (…) se efectuará con arreglo <mark class=\"m-resp\">al Derecho interno del Estado miembro requerido, incluidas las disposiciones en materia de asistencia judicial</mark>.</p><p><b>6.1.</b> A efectos de la transmisión de datos prevista en los artículos 3 y 4, cada Estado miembro designará <mark class=\"m-resp\">un punto de contacto nacional</mark>. (…)</p><p><b>7.</b> Si en el curso de una investigación o proceso penal no se dispone del perfil de ADN de una persona determinada que se encuentre en el territorio de un Estado miembro requerido, este último deberá prestar asistencia judicial (…), siempre que: a) <mark class=\"m-resp\">el Estado miembro requirente comunique el fin para el que se requiere</mark>; b) el Estado miembro requirente <mark class=\"m-resp\">presente una orden o declaración de investigación de la autoridad competente</mark>, exigible con arreglo a su Derecho interno (…), y c) se cumplan los requisitos (…) con arreglo al Derecho del Estado miembro requerido.</p>", true)

  + articuloResp("Artículos 8, 9 y 12 — Datos dactiloscópicos y registros de vehículos · R34 R35", ["índices: datos dactiloscópicos y un número de referencia","no identificados: deben poder reconocerse","confirma la concordancia el punto de contacto del requirente","vehículos: datos de propietarios o usuarios y de vehículos","número de bastidor completo o matrícula completa","también infracciones de otro tipo y orden público"], "<p><b>8.</b> (…) Los índices de referencia contendrán exclusivamente <mark class=\"m-resp\">datos dactiloscópicos y un número de referencia</mark>. (…) Los índices de referencia que no puedan atribuirse a ninguna persona (datos dactiloscópicos no identificados) deberán <mark class=\"m-personalizado\">poder reconocerse como tales</mark>.</p><p><b>9.2.</b> La confirmación de una concordancia formal entre un dato dactiloscópico y un índice de referencia del Estado miembro que gestione el fichero será efectuada por <mark class=\"m-resp\">el punto de contacto nacional del Estado miembro requirente</mark> (…).</p><p><b>12.1.</b> Los Estados miembros permitirán que los puntos de contacto nacionales de los demás Estados miembros (…), para los fines de la prevención y persecución de delitos y <mark class=\"m-resp\">de la persecución de infracciones de otro tipo que sean competencia de los tribunales o de las fiscalías</mark> del Estado miembro que realice la consulta, y <mark class=\"m-resp\">para el mantenimiento del orden público</mark>, tengan acceso a los siguientes datos contenidos en los registros nacionales de vehículos (…): a) <mark class=\"m-resp\">datos de los propietarios o usuarios</mark>, y b) datos de los vehículos. La consulta solo podrá efectuarse utilizando <mark class=\"m-resp\">un número de bastidor completo o una matrícula completa</mark>. (…)</p>", true)
  + articuloResp("Artículos 13, 14 y 16 — Acontecimientos importantes y prevención de atentados terroristas", ["datos de carácter no personal, previa petición o por iniciativa propia","en particular, el deporte o las reuniones del Consejo Europeo","datos personales si condenas firmes u otras circunstancias","supresión en un año","terrorismo: Decisión marco 2002/475/JAI (arts. 1 a 3)","nombre, apellidos, fecha y lugar de nacimiento y hechos"], "<p><b>13.</b> Los Estados miembros se transmitirán mutuamente, <mark class=\"m-resp\">tanto previa petición como por iniciativa propia</mark> (…), los <mark class=\"m-destacable\">datos de carácter no personal</mark> que puedan resultar necesarios para los fines de la prevención de delitos y del mantenimiento de la seguridad y el orden públicos en relación con acontecimientos importantes de alcance transfronterizo, en particular <mark class=\"m-resp\">en el ámbito del deporte</mark> o de las reuniones del Consejo Europeo.</p><p><b>14.1.</b> (…) los Estados miembros se transmitirán mutuamente (…) datos relativos a personas, cuando <mark class=\"m-resp\">la existencia de condenas firmes o de otras circunstancias justifiquen la presunción de que estas personas van a cometer un delito</mark> con motivo del acontecimiento de que se trate <mark class=\"m-resp\">o suponen una amenaza para la seguridad y el orden públicos</mark> (…).</p><p><b>14.2.</b> (…) En todo caso, los datos facilitados deberán suprimirse transcurrido como máximo <mark class=\"m-resp\">un año</mark>.</p><p><b>16.1.</b> Con objeto de prevenir <mark class=\"m-destacable\">atentados terroristas</mark>, los Estados miembros podrán, <u class=\"m-clave\">sin necesidad de petición previa</u>, transmitir (…) los datos de carácter personal (…) en la medida en que sea necesario porque determinados hechos justifiquen la presunción de que las personas de que se trate van a cometer delitos contemplados en <mark class=\"m-resp\">los artículos 1 a 3 de la Decisión marco 2002/475/JAI del Consejo, de 13 de junio de 2002</mark>, sobre la lucha contra el terrorismo.</p><p><b>16.2.</b> Los datos que se transmitirán comprenderán <mark class=\"m-resp\">el nombre, apellidos, fecha y lugar de nacimiento, así como la descripción de los hechos que justifican la presunción</mark> (…).</p><p><b>16.4.</b> El Estado miembro transmisor podrá establecer condiciones, con arreglo a su Derecho interno, respecto de la utilización de dichos datos (…). El Estado miembro receptor estará sujeto a dichas condiciones.</p>", true)
  + articuloResp("Artículos 17 a 23 — Operaciones conjuntas, asistencia, armas y responsabilidad · R36", ["patrullas comunes y otras operaciones conjuntas","competencias ejecutivas bajo la dirección del EM de acogida, que asume la responsabilidad","instrucciones de la autoridad del EM de acogida","asistencia: agentes, especialistas, asesores y equipos","uniforme nacional","el EM de acogida puede prohibir armas","autoriza más uso el agente al mando","mismas normas de tráfico","misma protección","responsabilidad civil del EM cuyos funcionarios actúan","reembolso por negligencia muy grave o falta deliberada","penal: equiparados a los del EM de acogida","disciplina: Derecho del trabajo de su propio Estado"], "<p><b>17.1.</b> Con objeto de intensificar la cooperación policial, las autoridades competentes designadas por los Estados miembros podrán (…) organizar <mark class=\"m-resp\">patrullas comunes y otras operaciones conjuntas</mark> (…).</p><p><b>17.2.</b> (…) Dichas competencias ejecutivas solo podrán ejercerse bajo la dirección de agentes del Estado miembro de acogida y, en general, en presencia de estos. (…) <mark class=\"m-resp\">El Estado miembro de acogida asumirá la responsabilidad de los actos de los agentes</mark>.</p><p><b>17.3.</b> <mark class=\"m-resp\">Los agentes destacados por otros Estados miembros para que participen en operaciones conjuntas se atendrán a las instrucciones impartidas por la autoridad competente del Estado miembro de acogida</mark>.</p><p><b>18.</b> Las autoridades competentes de los Estados miembros se prestarán apoyo recíproco (…) en caso de concentraciones masivas y acontecimientos similares, catástrofes y accidentes graves (…): a) se informarán recíprocamente lo antes posible de las situaciones de esta índole que tengan repercusión transfronteriza e intercambiarán los datos pertinentes; b) en situaciones con repercusión transfronteriza, tomarán y coordinarán las medidas policiales necesarias en su territorio; c) a petición del Estado miembro en cuyo territorio se produzca la situación pertinente, prestarán asistencia <mark class=\"m-resp\">en la medida de lo posible mediante el envío de agentes, especialistas y asesores y el suministro de equipos</mark>.</p><p><b>19.1.</b> Los agentes destacados por un Estado miembro para que participen en una operación conjunta (…) podrán utilizar allí su <mark class=\"m-personalizado\">uniforme de servicio nacional</mark>. Podrán llevar consigo las armas de servicio, municiones y equipos permitidos por el Derecho interno de su Estado de origen. El Estado miembro de acogida podrá <mark class=\"m-resp\">prohibir que los agentes destacados por otro Estado miembro lleven determinadas armas de servicio, municiones y equipos</mark>.</p><p><b>19.2.</b> (…) En casos concretos, <mark class=\"m-resp\">el agente del Estado miembro de acogida que esté efectivamente al mando de la operación</mark> podrá autorizar (…) una utilización de las armas de servicio, municiones y equipos que exceda de los fines indicados [legítima defensa o auxilio de terceros]. El empleo de armas de servicio (…) se regirá por el Derecho del Estado miembro de acogida. (…)</p><p><b>19.3.</b> En caso de que los agentes de un Estado miembro utilicen vehículos de motor en el territorio de otro Estado miembro (…), estarán sujetos a <mark class=\"m-resp\">las mismas normas de tráfico que los agentes del Estado miembro de acogida</mark> (…).</p><p><b>20.</b> Los Estados miembros estarán obligados a prestar a los agentes enviados a su territorio por otros Estados miembros <mark class=\"m-resp\">la misma protección y asistencia en el desempeño de sus funciones que a sus propios agentes</mark>.</p><p><b>21.1.</b> Cuando en un Estado miembro actúen funcionarios de otro Estado miembro de conformidad con el artículo 17, <mark class=\"m-resp\">este último será responsable de los daños y perjuicios que estos causen en el ejercicio de sus funciones, de acuerdo con el Derecho interno del Estado miembro en cuyo territorio estén actuando</mark>.</p><p><b>21.5.</b> Cuando los daños o perjuicios a que hace referencia el apartado 4 [caso del art. 18] se deban a <mark class=\"m-resp\">una negligencia muy grave o una falta deliberada</mark>, el Estado miembro anfitrión podrá dirigirse al Estado miembro de origen con el fin de que este le reembolse las cantidades que haya abonado (…).</p><p><b>22.</b> Los agentes que intervengan en el territorio de otro Estado miembro (…) estarán equiparados <mark class=\"m-resp\">a los agentes del Estado miembro de acogida</mark> en relación con los delitos que cometan o de que sean víctimas (…).</p><p><b>23.</b> Los agentes que intervengan en el territorio de otro Estado miembro en virtud de la presente Decisión seguirán sujetos a <mark class=\"m-resp\">las disposiciones de Derecho del trabajo aplicables en su propio Estado, en particular en materia disciplinaria</mark>.</p>", true)
  + articuloResp("Artículos 24 a 32 — Protección de datos", ["marcado: sin limitar el tratamiento","bloqueo: con el fin de limitarlo","nivel: Convenio de 1981, Protocolo de 2001 y Recomendación R(87) 15","decide el CONSEJO por unanimidad","no aplica a quien ya transmite por el Tratado de Prüm","otros fines: autorización previa del titular del fichero","art. 12: cancelación salvo registro","comunicación ulterior: autorización del transmisor","datos rebatidos: marcados","bloqueo en lugar de supresión","documentación a)-d)","datos del registro en 4 semanas y conservados DOS años","control jurídico: autoridades de protección de datos o judiciales","reembolso total","informar sobre el tratamiento y el resultado"], "<p><b>24.1.</b> (…) c) «<mark class=\"m-destacable\">marcado</mark>»: <mark class=\"m-resp\">la inserción de una marca en los datos almacenados de carácter personal sin que con ello se pretenda limitar su tratamiento en el futuro</mark>; d) «<mark class=\"m-destacable\">bloqueo</mark>»: <mark class=\"m-resp\">el marcado de los datos almacenados de carácter personal con el fin de limitar su tratamiento en el futuro</mark>.</p><p><b>25.1.</b> (…) cada Estado miembro garantizará que su Derecho interno ofrezca un nivel de protección de datos <mark class=\"m-resp\">equivalente como mínimo al que resulta del Convenio del Consejo de Europa de 28 de enero de 1981 (…) y del Protocolo adicional de 8 de noviembre de 2001, y se atendrá a la Recomendación no R(87) 15</mark> (…).</p><p><b>25.2.</b> La transmisión de datos de carácter personal en virtud de la presente Decisión solo podrá iniciarse cuando (…) se hayan incorporado al Derecho interno las disposiciones del presente capítulo. <mark class=\"m-resp\">El Consejo decidirá por unanimidad</mark> si se cumple o no esta condición.</p><p><b>25.3.</b> El apartado 2 no se aplicará a los Estados miembros <mark class=\"m-resp\">que ya hayan iniciado la transmisión de datos personales regulada por la presente Decisión en virtud del Tratado de 27 de mayo de 2005</mark> (…) («el Tratado de Prüm»).</p><p><b>26.1.</b> (…) El tratamiento de los datos para otros fines requerirá <mark class=\"m-resp\">la autorización previa del Estado miembro titular del fichero</mark> y se hará con sujeción al Derecho interno del Estado miembro receptor. (…)</p><p><b>26.2.</b> El tratamiento de los datos transmitidos con arreglo a los artículos 3, 4 y 9 (…) se permitirá exclusivamente en relación con: a) la comprobación de si existe o no coincidencia (…); b) la preparación y presentación de una solicitud de asistencia administrativa o judicial (…); c) el registro en el sentido del artículo 30. (…)</p><p><b>26.3.</b> (…) [los datos transmitidos en virtud del artículo 12] <mark class=\"m-resp\">se cancelarán inmediatamente</mark> una vez respondida la consulta automatizada, <mark class=\"m-resp\">salvo que se requiera su ulterior tratamiento para el registro</mark> con arreglo al artículo 30.</p><p><b>27.</b> (…) la ulterior comunicación de los datos a otras instancias requerirá <mark class=\"m-resp\">la autorización previa del Estado miembro transmisor y estará sujeta al Derecho interno del Estado miembro receptor</mark>.</p><p><b>28.1.</b> Los Estados miembros velarán por la exactitud y actualidad de los datos de carácter personal. Si se comprueba (…) que se han transmitido datos inexactos o datos que no podían transmitirse, este hecho se comunicará inmediatamente al Estado o Estados miembros receptores. Dichos Estados estarán obligados a rectificar o cancelar los datos. (…)</p><p><b>28.2.</b> Los datos cuya exactitud sea rebatida por la persona a la que se refieran, pero cuya exactitud o inexactitud no pueda determinarse, <mark class=\"m-resp\">deberán ser marcados</mark>, con arreglo al Derecho interno de los Estados miembros, si así lo exige el interesado. (…)</p><p><b>28.3.</b> <mark class=\"m-resp\">Se cancelarán los datos de carácter personal transmitidos que no hubieran debido transmitirse o recibirse</mark>. (…) Cuando existan motivos para creer que la supresión podría afectar a intereses de protección del interesado, en lugar de la supresión <mark class=\"m-resp\">se procederá al bloqueo de los datos con arreglo al Derecho interno</mark>. (…)</p><p><b>30.1.</b> (…) La documentación comprenderá los extremos siguientes: <mark class=\"m-resp\">a) el motivo de la transmisión; b) los datos transmitidos; c) la fecha de la transmisión, y d) la designación o código de referencia del servicio que realice la consulta y del servicio titular del fichero</mark>.</p><p><b>30.3.</b> El servicio que realice el registro comunicará, previa solicitud, los datos del registro a las autoridades competentes en materia de control de la protección de datos (…) <mark class=\"m-resp\">de manera inmediata y, en todo caso, en las cuatro semanas siguientes a la recepción de la solicitud</mark>. (…)</p><p><b>30.4.</b> Los datos del registro se protegerán de toda utilización no autorizada (…), y se conservarán durante <mark class=\"m-resp\">dos años</mark>. Una vez transcurrido el plazo de conservación, los datos del registro se cancelarán inmediatamente.</p><p><b>30.5.</b> El control jurídico de la transmisión o recepción de datos de carácter personal corresponderá <mark class=\"m-resp\">a las autoridades de protección de datos independientes o, cuando proceda, a las autoridades judiciales de cada uno de los Estados miembros</mark>. (…) Los resultados de esta actividad de control se conservarán durante <mark class=\"m-plazo\">18 meses</mark> (…).</p><p><b>31.2.</b> (…) Si el servicio receptor indemniza los daños causados por la utilización de datos transmitidos inexactos, el servicio transmisor deberá <mark class=\"m-resp\">reembolsar al servicio receptor el importe total de la indemnización de daños abonada</mark>.</p><p><b>32.</b> El Estado miembro receptor <mark class=\"m-resp\">informará al Estado miembro transmisor, previa petición, sobre el tratamiento de los datos transmitidos y el resultado obtenido</mark>.</p>", true)
