  + articuloResp("Artículos 4 a 6 — Composición, Agencia y rendición de cuentas · R12", ["autoridades nacionales de fronteras (incluidos guardacostas), autoridades de retorno y la Agencia","cuerpo permanente de hasta 10.000","rinde cuentas ante el PE y el Consejo"], "<p><b>4.</b> La Guardia Europea de Fronteras y Costas estará compuesta por <mark class=\"m-resp\">las autoridades nacionales de los Estados miembros responsables de la gestión de las fronteras, incluidos los guardacostas en la medida en que lleven a cabo tareas de control fronterizo, las autoridades nacionales responsables en materia de retorno y la Agencia Europea de la Guardia de Fronteras y Costas</mark> («Agencia»).</p><p><b>5.2.</b> La Agencia comprenderá el <mark class=\"m-destacable\">cuerpo permanente</mark> de la Guardia Europea de Fronteras y Costas (…) a que se refiere el artículo 54, con una capacidad de hasta <mark class=\"m-resp\">10.000 miembros de personal operativo</mark>, de conformidad con el anexo I.</p><p><b>5.4.</b> La Agencia contribuirá a la aplicación constante y uniforme del Derecho de la Unión, incluido el acervo (…) en materia de derechos fundamentales, en particular la <mark class=\"m-destacable\">Carta</mark> (…).</p><p><b>6.</b> La Agencia deberá rendir cuentas ante <mark class=\"m-resp\">el Parlamento Europeo y el Consejo</mark>, de conformidad con el presente Reglamento.</p>", true)
  + articuloResp("Artículo 7 — Responsabilidad compartida", ["principales responsables de sus secciones: los Estados miembros","únicos responsables de las decisiones de retorno: los Estados miembros","la Agencia NO participa en controles en fronteras interiores","informe del director ejecutivo al consejo al menos una vez al año"], "<p><b>1.</b> La Guardia Europea de Fronteras y Costas realizará la gestión europea integrada de las fronteras como <mark class=\"m-destacable\">responsabilidad compartida</mark> de la Agencia y de las autoridades nacionales responsables de la gestión de las fronteras (…). <mark class=\"m-resp\">Los Estados miembros</mark> serán los <mark class=\"m-personalizado\">principales responsables</mark> de la gestión de sus secciones de las fronteras exteriores.</p><p><b>2.</b> La Agencia proporcionará asistencia técnica y operativa en la aplicación de las medidas relativas a los retornos (…). <mark class=\"m-resp\">Los Estados miembros</mark> serán los <mark class=\"m-personalizado\">únicos responsables</mark> de emitir las decisiones de retorno y de la adopción de las medidas relativas al internamiento de los retornados (…).</p><p><b>4.</b> (…) La Agencia <mark class=\"m-resp\">no apoyará medidas ni participará en actividades relacionadas con controles en las fronteras interiores</mark>. (…)</p><p><b>5.</b> Los Estados miembros podrán cooperar a nivel operativo con otros Estados miembros o terceros países siempre que esta cooperación sea compatible con las tareas de la Agencia. (…) El <mark class=\"m-autoridad\">director ejecutivo</mark> informará al consejo de administración sobre estos asuntos periódicamente, y por lo menos <mark class=\"m-resp\">una vez al año</mark>.</p>", true)
  + articuloResp("Artículos 8 y 9 — Ciclo de política estratégica plurianual y planificación integrada", ["cinco años","cuatro fases","documento político: la Comisión","evaluación completa a los cuatro años","plan de contingencia","el consejo de administración se reúne al menos una vez al año para la hoja de ruta de capacidades"], "<p><b>8.1.</b> La <mark class=\"m-autoridad\">Comisión</mark> y la Guardia Europea de Fronteras y Costas garantizarán la efectividad de la gestión europea integrada de las fronteras a través de un <mark class=\"m-destacable\">ciclo de política estratégica plurianual</mark> (…).</p><p><b>8.2.</b> (…) Establecerá las prioridades políticas y las orientaciones estratégicas para un período de <mark class=\"m-resp\">cinco años</mark> (…).</p><p><b>8.3.</b> El ciclo (…) constará de <mark class=\"m-resp\">cuatro fases</mark> (…).</p><p><b>8.4.</b> Sobre la base del análisis estratégico de riesgos (…), <mark class=\"m-resp\">la Comisión</mark> preparará un <mark class=\"m-destacable\">documento político</mark> que desarrolle una política estratégica plurianual (…). La Comisión presentará este documento político al Parlamento Europeo y al Consejo para debate. Tras este debate, la Comisión adoptará una comunicación (…).</p><p><b>8.5.</b> (…) la Agencia elaborará, mediante decisión del consejo de administración a propuesta del director ejecutivo (…), una <mark class=\"m-destacable\">estrategia técnica y operativa</mark> (…).</p><p><b>8.7.</b> <mark class=\"m-resp\">Al cabo de cuatro años</mark> tras la adopción de la política estratégica plurianual (…), la Comisión llevará a cabo una <mark class=\"m-destacable\">evaluación completa</mark> de su ejecución. (…)</p><p><b>9.3.</b> Los Estados miembros adoptarán <mark class=\"m-resp\">un plan de contingencia</mark> para la gestión de sus fronteras y el retorno. En consonancia con las estrategias nacionales (…), los planes de contingencia describirán todas las medidas y recursos necesarios para el posible   + articuloResp("Artículo 10 — Tareas de la Agencia", ["funciones a)-ag)","equipos de apoyo a la gestión de la migración en puntos críticos","asistencia en el retorno sin analizar los fundamentos de las decisiones","cooperar con Europol y Eurojust"], "<p><b>1.</b> La <mark class=\"m-autoridad\">Agencia</mark> ejercerá las siguientes funciones: a) supervisar los flujos migratorios y realizar <mark class=\"m-destacable\">análisis de riesgos</mark> (…); b) supervisar las necesidades operativas de los Estados miembros en relación con la aplicación de los retornos (…); c) realizar <mark class=\"m-destacable\">evaluaciones de la vulnerabilidad</mark> (…); d) supervisar la gestión de las fronteras exteriores mediante funcionarios de enlace de la Agencia en los Estados miembros; e) supervisar el respeto de los derechos fundamentales (…); f) apoyar el desarrollo y el funcionamiento de EUROSUR; g) (…) coordinación y organización de <mark class=\"m-destacable\">operaciones conjuntas</mark> (…); h) (…) poniendo en marcha <mark class=\"m-destacable\">intervenciones fronterizas rápidas</mark> en las fronteras exteriores de los Estados miembros sometidos a retos concretos y desproporcionados (…); i) prestar ayuda técnica y operativa (…) para apoyar las operaciones de búsqueda y salvamento (…); j) desplegar el cuerpo permanente en el marco de los equipos de gestión de fronteras, los equipos de apoyo a la gestión de la migración y los equipos de retorno (…); (…) m) en el marco de los <mark class=\"m-resp\">equipos de apoyo a la gestión de la migración</mark> en los puntos críticos: i) desplegar personal operativo y equipamiento técnico para ofrecer asistencia en materia de filtrado, entrevista, identificación y toma de impresiones digitales (…); n) prestar asistencia en todas las fases del proceso de retorno <u class=\"m-clave\">sin analizar</u> los fundamentos de las decisiones de retorno, que siguen siendo competencia exclusiva de los Estados miembros (…); o) crear un contingente   + articuloResp("Artículos 11, 13 y 14 — Cooperación de buena fe, puntos de contacto y red de comunicación · R13", ["cooperar de buena fe e intercambiar información","un punto de contacto nacional","máximo dos funcionarios de enlace","red 24 h / 7 días","hasta «CONFIDENTIEL UE/EU CONFIDENTIAL»"], "<p><b>11.</b> La Agencia, las autoridades nacionales responsables de la gestión de las fronteras, incluidos los guardacostas en la medida en que lleven a cabo tareas de control fronterizo, y las autoridades nacionales responsables del retorno, estarán sujetas a la obligación de <mark class=\"m-resp\">cooperar de buena fe y de intercambiar información</mark>.</p><p><b>13.1.</b> Cada Estado miembro nombrará <mark class=\"m-resp\">un punto de contacto nacional</mark> para la comunicación con la Agencia sobre todas las cuestiones relacionadas con las actividades de la Agencia (…). El punto de contacto nacional deberá estar localizable <mark class=\"m-plazo\">en todo momento</mark> (…).</p><p><b>13.2.</b> Los Estados miembros podrán designar a <mark class=\"m-resp\">un máximo de dos miembros del personal</mark> que representen a su punto de contacto nacional en la Agencia como <mark class=\"m-autoridad\">funcionarios de enlace</mark>. (…)</p><p><b>14.1.</b> La Agencia establecerá y mantendrá una <mark class=\"m-destacable\">red de comunicación</mark> (…) de forma segura y en <mark class=\"m-plazo\">tiempo cuasirreal</mark> con y entre los centros nacionales de coordinación. (…) La red de comunicación estará operativa <mark class=\"m-resp\">las veinticuatro horas del día y los siete días de la semana</mark>, y permitirá: a) el intercambio bilateral y multilateral de información en tiempo cuasirreal; b) audio y videoconferencias; c) la gestión, el almacenamiento, la transmisión y el tratamiento seguros de la información sensible no clasificada; d) <mark class=\"m-resp\">la gestión, el almacenamiento, la transmisión y el tratamiento seguros de la información clasificada de la UE   + articuloResp("Artículos 31 y 32 — Funcionarios de enlace de la Agencia y evaluación de la vulnerabilidad · R14", ["hasta cuatro EM próximos","propuesta del director ejecutivo aprobada por el consejo de administración","funciones a)-k)","solo instrucciones de la Agencia","supervisión al menos una vez al año y todos los EM al menos cada tres años","incumplimiento: al consejo de administración e informa a la Comisión","comunicación al menos una vez al año"], "<p><b>31.1.</b> La Agencia garantizará un seguimiento regular de la gestión de las fronteras exteriores y en materia de retorno (…) mediante <mark class=\"m-autoridad\">funcionarios de enlace de la Agencia</mark>. La Agencia podrá decidir que un funcionario de enlace sea responsable de <mark class=\"m-resp\">hasta cuatro Estados miembros</mark> que se encuentren geográficamente próximos entre sí.</p><p><b>31.2.</b> El <mark class=\"m-autoridad\">director ejecutivo</mark> nombrará a expertos del personal estatutario para su despliegue como funcionarios de enlace. (…) La propuesta del director ejecutivo deberá ser aprobada por <mark class=\"m-resp\">el consejo de administración</mark>. (…)</p><p><b>31.3.</b> Los funcionarios de enlace actuarán en nombre de la Agencia (…). En concreto, los funcionarios de enlace deberán: a) actuar de interfaz entre la Agencia y las autoridades nacionales (…); b) apoyar la recogida de la información (…) para supervisar la inmigración ilegal y los análisis de riesgos (…); c) apoyar la recogida de la información (…) para llevar a cabo la evaluación de la vulnerabilidad (…); d) realizar un seguimiento de las medidas adoptadas (…) en las secciones (…) con nivel de impacto elevado o crítico (…); e) <mark class=\"m-resp\">contribuir a promover la aplicación del acervo de la Unión relativo a la gestión de las fronteras exteriores y al retorno, también por lo que respecta al respeto de los derechos fundamentales</mark>; f) cooperar con el agente de derechos fundamentales (…); g) cuando se   + articuloResp("Artículos 34 y 35 — Niveles de impacto y reacción · R15 R16 R17", ["bajo: insignificante","medio: moderado","alto: significativo","crítico (temporal): impacto decisivo","sin acuerdo: se mantiene el nivel anterior","crítico: la Agencia lo notifica a la Comisión y el director ejecutivo emite recomendación"], "<p><b>34.1.</b> La Agencia (…) y de acuerdo con el Estado miembro interesado, atribuirá a cada una de las secciones de las fronteras exteriores uno de los siguientes <mark class=\"m-destacable\">niveles de impacto</mark> (…): a) <mark class=\"m-plazo\">NIVEL DE IMPACTO BAJO</mark>, cuando los incidentes (…) tengan un impacto <mark class=\"m-personalizado\">insignificante</mark> en la seguridad de las fronteras; b) <mark class=\"m-plazo\">NIVEL DE IMPACTO MEDIO</mark>, (…) un impacto <mark class=\"m-personalizado\">moderado</mark> (…); c) <mark class=\"m-plazo\">NIVEL DE IMPACTO ALTO</mark>, (…) un impacto <mark class=\"m-personalizado\">significativo</mark> (…).</p><p><b>34.2.</b> (…) cuando el análisis de riesgos de la Agencia muestre que los incidentes (…) tengan un <mark class=\"m-personalizado\">impacto decisivo</mark> en la seguridad de las fronteras que pueda poner en peligro el funcionamiento del espacio Schengen, la Agencia atribuirá <mark class=\"m-resp\">temporalmente</mark> a dicha sección de la frontera exterior un nivel de impacto <mark class=\"m-resp\">«CRÍTICO»</mark>, de acuerdo con el Estado miembro afectado.</p><p><b>34.3.</b> En caso de que el Estado miembro afectado y la Agencia no lleguen a un acuerdo sobre la atribución de un nivel de impacto (…), <mark class=\"m-resp\">el nivel de impacto que tenía previamente atribuido dicha sección de la frontera no se modificará</mark>.</p><p><b>35.1.</b> (…) d) cuando se atribuya un nivel de impacto crítico a una sección de la frontera exterior, la Agencia <mark class=\"m-resp\">lo notificará a la Comisión</mark>; el director ejecutivo (…) <mark class=\"m-resp\">emitirá una recomendaci   + articuloResp("Artículos 36 y 37 — Medidas de la Agencia, operaciones conjuntas e intervenciones fronterizas rápidas", ["con cargo a su presupuesto","financiación adicional: informa sin demora al PE, Consejo y Comisión","el EM puede indicar los perfiles del personal","intervención rápida durante un período limitado","el director ejecutivo evalúa, aprueba y coordina","precedidas de análisis de riesgos detallado, fiable y actualizado"], "<p><b>36.3.</b> La Agencia financiará o cofinanciará las actividades contempladas en el apartado 2 <mark class=\"m-resp\">con cargo a su presupuesto, de acuerdo con la normativa financiera que le es aplicable</mark>.</p><p><b>36.4.</b> Si la Agencia requiere una financiación adicional sustancial (…), informará de ello sin demora <mark class=\"m-resp\">al Parlamento Europeo, al Consejo y a la Comisión</mark>.</p><p><b>37.1.</b> Un Estado miembro podrá pedir a la Agencia que inicie <mark class=\"m-destacable\">operaciones conjuntas</mark> (…). Como parte de esa solicitud, un Estado miembro también podrá indicar <mark class=\"m-resp\">los perfiles del personal operativo que necesita para la operación conjunta en cuestión, incluidos aquellos que exijan competencias ejecutivas, si procede</mark>.</p><p><b>37.2.</b> A solicitud de un Estado miembro que se encuentre ante una situación de <mark class=\"m-personalizado\">retos concretos y desproporcionados</mark> (…), la Agencia podrá desplegar, durante <mark class=\"m-resp\">un período limitado de tiempo</mark>, una <mark class=\"m-destacable\">intervención fronteriza rápida</mark> en el territorio de dicho Estado miembro de acogida.</p><p><b>37.3.</b> <mark class=\"m-resp\">El director ejecutivo</mark> evaluará, aprobará y coordinará las propuestas de operaciones conjuntas e intervenciones fronterizas rápidas presentadas por los Estados miembros. Las operaciones conjuntas y las intervenciones fronterizas rápidas deberán ir precedidas de <mark class=\"m-resp\">un análisis de riesgos detallado, fiable y actualizado</mark> (…).</p>", true)
  + articuloResp("Artículo 38 — Plan operativo para las operaciones conjuntas", ["redacta el director ejecutivo","acuerdan el director ejecutivo y el EM de acogida","vinculante para la Agencia, el EM de acogida y los participantes","elementos a)-o)","modificación: acuerdo de ambos, previa consulta a los participantes"], "<p><b>2.</b> <mark class=\"m-resp\">El director ejecutivo</mark> redactará un <mark class=\"m-destacable\">plan operativo</mark> para las operaciones conjuntas llevadas a cabo en las fronteras exteriores. <mark class=\"m-resp\">El director ejecutivo y el Estado miembro de acogida</mark>, en estrecha y oportuna consulta con los Estados miembros participantes, acordarán el plan operativo (…).</p><p><b>3.</b> El plan operativo será vinculante para <mark class=\"m-resp\">la Agencia, para el Estado miembro de acogida y para los Estados miembros participantes</mark>. Abarcará todos los aspectos que se consideren necesarios para la realización de la operación conjunta, incluidos los siguientes elementos: <mark class=\"m-resp\">a) una descripción de la situación junto con el procedimiento y los objetivos del despliegue, incluidos los objetivos operativos; b) el tiempo estimado que se espera sea necesario para que la operación conjunta pueda alcanzar sus objetivos; c) la zona geográfica donde se llevará a cabo la operación conjunta</mark>; d) una descripción de las funciones (…), las armas de servicio, la munición y el equipamiento que pueden llevar (…); e) la composición de los equipos (…); f) las disposiciones de mando y control (…); g) el equipamiento técnico (…); h) (…) un sistema de notificación inmediata de incidentes (…); i) un sistema de información y evaluación (…); j) en operaciones marítimas, (…) jurisdicción (…) interceptación, salvamento marítimo y desembarque (…); k) los términos de la cooperación con terceros países (…); l) instrucciones generales sobre (…) derechos fundamentales (…); m) los procedimientos (…) para personas que necesiten protección internacional, víctimas de trata, menores no acompañados (…); n) (…) un mecanismo destinado a recibir y comunicar a la Agencia las quejas (…); o) los preparativos logísticos (…).</p><p><b>4.</b> Toda modificación o adaptación del plan operativo requerirá <mark class=\"m-resp\">el acuerdo del director ejecutivo y del Estado miembro de acogida, previa consulta a los Estados miembros participantes</mark>. (…)</p>", true)
  + articuloResp("Artículo 39 — Procedimiento para el inicio de una intervención fronteriza rápida", ["el director ejecutivo informa de inmediato al consejo de administración","decisión en 2 días hábiles","notifica por escrito al EM y al consejo de administración","plan operativo en 3 días hábiles","primeros equipos en 5 días hábiles","equipos adicionales en 12 días hábiles"], "<p><b>2.</b> El director ejecutivo <mark class=\"m-resp\">informará de inmediato al consejo de administración</mark> cuando un Estado miembro solicite el inicio de una intervención fronteriza rápida.</p><p><b>5.</b> El director ejecutivo tomará una decisión sobre la solicitud de iniciar una intervención fronteriza rápida en un plazo de <mark class=\"m-resp\">dos días hábiles</mark> a partir de la fecha en la que se reciba dicha solicitud. El director ejecutivo notificará su decisión por escrito simultáneamente <mark class=\"m-resp\">al Estado miembro de que se trate y al consejo de administración</mark>. En la decisión se expondrán los principales motivos en que se basa.</p><p><b>8.</b> El director ejecutivo y el Estado miembro de acogida redactarán y acordarán de inmediato el plan operativo (…), y en todo caso en un plazo de <mark class=\"m-resp\">tres días hábiles</mark> a partir de la fecha de la decisión.</p><p><b>14.</b> El despliegue de los primeros equipos de gestión de fronteras reasignados (…) tendrá lugar a más tardar en el plazo de <mark class=\"m-plazo\">cinco días hábiles</mark> a partir de la fecha en que (…) hayan acordado el plan operativo. Cuando resulte necesario, el despliegue de equipos de gestión de fronteras adicionales se llevará a cabo a más tardar en los <mark class=\"m-resp\">doce días hábiles</mark> siguientes a la fecha en que se haya acordado el plan operativo.</p>", true)
  + trampa("Trampa de examen", "La decisión se notifica al Estado miembro y al CONSEJO DE ADMINISTRACIÓN (la Comisión no figura en el art. 39.5).")
  + articuloResp("Artículos 40 y 41 — Equipos de apoyo a la gestión de la migración y acciones propuestas", ["solicitud y evaluación de necesidades a la Comisión","la Comisión coordina en los puntos críticos","el director ejecutivo recomienda","respuesta del EM en 6 días hábiles"], "<p><b>40.1.</b> Cuando un Estado miembro se enfrente a <mark class=\"m-personalizado\">retos migratorios desproporcionados</mark> en puntos críticos concretos (…), podrá solicitar el refuerzo técnico y operativo de los <mark class=\"m-destacable\">equipos de apoyo a la gestión de la migración</mark> (…). Dicho Estado miembro presentará <mark class=\"m-resp\">a la Comisión una solicitud de refuerzo y una evaluación de sus necesidades</mark>. (…)</p><p><b>40.3.</b> <mark class=\"m-resp\">La Comisión</mark>, en cooperación con el Estado miembro de acogida y con los órganos y organismos de la Unión competentes, (…) establecerá las condiciones de la cooperación en los puntos críticos y <mark class=\"m-resp\">será responsable de la coordinación de las actividades de los equipos de apoyo a la gestión de la migración</mark>.</p><p><b>40.4.</b> El refuerzo técnico y operativo (…) podrá incluir: a) (…) la prestación de asistencia en el examen de los nacionales de terceros países que lleguen a las fronteras exteriores, incluida su identificación, registro y entrevista y (…) la toma de sus impresiones dactilares (…); b) información inicial a las personas que deseen solicitar protección internacional (…); c) asistencia técnica y operativa en materia de retorno (…); d) el equipamiento técnico necesario.</p><p><b>41.1.</b> El director ejecutivo, basándose en los resultados de la evaluación de la vulnerabilidad o cuando se atribuya un impacto crítico (…), <mark class=\"m-resp\">recomendará al Estado miembro de que se trate que solicite a la Agencia la puesta en marcha, la realización o la adaptación de operaciones conjuntas, intervenciones fronterizas rápidas o cualquier otra medida pertinente</mark> (…).</p><p><b>41.2.</b> El Estado miembro de que se trate responderá a la recomendación del director ejecutivo (…) en el plazo de <mark class=\"m-resp\">seis días hábiles</mark>. En caso de respuesta negativa (…), también justificará su respuesta. (…)</p>", true)
  + articuloResp("Artículo 42 — Situación en las fronteras exteriores que requiera medidas urgentes", ["decide el Consejo, a propuesta de la Comisión, mediante acto de ejecución","informar al PE","director ejecutivo en 2 días hábiles: acciones y proyecto de plan operativo","acuerdo en 3 días hábiles","personal en 5 días y adicionales en 12","equipamiento en 10 días hábiles","30 días sin ejecutar: art. 29 del Código de Fronteras Schengen"], "<p><b>1.</b> Cuando el control de las fronteras exteriores sea tan ineficaz que pueda poner en peligro el funcionamiento del espacio Schengen (…), <mark class=\"m-resp\">el Consejo, a propuesta de la Comisión</mark>, podrá adoptar sin demora una decisión, mediante un <mark class=\"m-personalizado\">acto de ejecución</mark>, en la que se fijen las medidas que deberá adoptar la Agencia (…). La Comisión consultará a la Agencia antes de presentar su propuesta.</p><p><b>2.</b> Cuando surja una situación que requiera una acción urgente, se informará sin demora de dicha situación al <mark class=\"m-autoridad\">Parlamento Europeo</mark> (…).</p><p><b>4.</b> El director ejecutivo, en un plazo de <mark class=\"m-plazo\">dos días hábiles</mark> a partir de la fecha de adopción de la decisión del Consejo (…): a) determinará las acciones que deban realizarse para la ejecución práctica de las medidas (…); b) <mark class=\"m-resp\">elaborará un proyecto de plan operativo y lo presentará a los Estados miembros de que se trate</mark>.</p><p><b>5.</b> El director ejecutivo y el Estado miembro en cuestión alcanzarán un acuerdo sobre el plan operativo (…) en un plazo de <mark class=\"m-resp\">tres días hábiles a partir de la fecha de su presentación</mark>.</p><p><b>6.</b> (…) la Agencia desplegará de inmediato, y en cualquier caso en el plazo de <mark class=\"m-plazo\">cinco días hábiles</mark> (…), el personal operativo necesario del cuerpo permanente. En una segunda fase se desplegarán los equipos adicionales (…) en el plazo de <mark class=\"m-plazo\">doce días hábiles</mark> (…).</p><p><b>7.</b> La Agencia y los Estados miembros enviarán de inmediato, y en cualquier caso en el plazo de <mark class=\"m-plazo\">diez días hábiles</mark> a partir de la fecha en que se fije el plan operativo, <mark class=\"m-resp\">el equipamiento técnico necesario y el personal competente al lugar de destino</mark> (…).</p><p><b>10.</b> La Comisión supervisará la aplicación de las medidas (…). Si el Estado miembro en cuestión no ejecuta la decisión del Consejo (…) en el plazo de <mark class=\"m-plazo\">treinta días</mark> y no coopera con la Agencia (…), la Comisión podrá activar el procedimiento previsto en <mark class=\"m-resp\">el artículo 29 del Reglamento (UE) 2016/399</mark>.</p>", true)
  + articuloResp("Artículos 43 a 47 — Instrucciones, agente de coordinación, gastos, suspensión y evaluación", ["instrucciones: el EM de acogida (o el tercer país con acuerdo de estatuto)","disciplinarias: el EM de origen","agente de coordinación con al menos un observador de derechos fundamentales","la Agencia sufraga desplazamiento, vacunación, seguros, sanidad y dietas","fin si ya no se dan las condiciones","violaciones graves: consulta al agente de derechos fundamentales e informa al EM","informes de evaluación en 60 días"], "<p><b>43.1.</b> Durante el despliegue de los equipos (…), <mark class=\"m-resp\">el Estado miembro de acogida o, en caso de que se coopere con un tercer país conforme a un acuerdo sobre el estatuto, el tercer país de que se trate</mark> impartirá instrucciones a los equipos de conformidad con el plan operativo.</p><p><b>43.5.</b> Los miembros de los equipos que no sean miembros del personal estatutario seguirán estando sujetos a las medidas disciplinarias <mark class=\"m-resp\">de su Estado miembro de origen</mark>. (…)</p><p><b>44.3.</b> El <mark class=\"m-autoridad\">agente de coordinación</mark> actuará en nombre de la Agencia en todos los aspectos del despliegue de los equipos. (…) contará con la asistencia y el asesoramiento de <mark class=\"m-resp\">al menos un observador de los derechos fundamentales</mark>. (…)</p><p><b>45.1.</b> La Agencia sufragará en su totalidad los gastos siguientes en que incurran los Estados miembros cuando pongan a disposición a miembros de su personal para despliegues de corta duración (…): a) gastos de desplazamiento (…); b) <mark class=\"m-resp\">gastos de vacunación</mark>; c) gastos de los seguros especiales necesarios; d) gastos de atención sanitaria, incluidos los gastos de asistencia psicológica; e) dietas, incluidos los gastos de alojamiento.</p><p><b>46.1.</b> El director ejecutivo pondrá fin a las actividades de la Agencia <mark class=\"m-resp\">si ya no se dan las condiciones necesarias para llevar a cabo dichas actividades</mark>. (…)</p><p><b>46.4.</b> El director ejecutivo podrá, <mark class=\"m-resp\">tras consultar con el agente de derechos fundamentales e informar al Estado miembro de que se trate</mark>, retirar la financiación de cualquier actividad de la Agencia o suspender o poner fin (…) a tal actividad, si considera que se están produciendo violaciones de derechos fundamentales (…) graves (…).</p><p><b>47.</b> El director ejecutivo evaluará los resultados de todas las actividades operativas de la Agencia y enviará al consejo de administración los informes de evaluación detallados en un plazo de <mark class=\"m-resp\">sesenta días</mark> a partir del momento en que finalicen dichas actividades, junto con las observaciones del <mark class=\"m-autoridad\">agente de derechos fundamentales</mark>. (…)</p>", true)
  + bloqueTitulo("ACTUACIÓN DE LA AGENCIA EN EL ÁMBITO DEL RETORNO")
  + articuloResp("Artículos 49 y 50 — Plataforma de gestión del retorno y operaciones de retorno", ["solo datos biográficos o listas de pasajeros","sin analizar el fondo de las decisiones de retorno","consulta del SIS antes del retorno"], "<p><b>49.1.</b> La Agencia utilizará y desarrollará ulteriormente (…) una <mark class=\"m-destacable\">plataforma integrada de gestión del retorno</mark> (…). Los datos personales <mark class=\"m-resp\">solo podrán incluir datos biográficos o listas de pasajeros</mark>. (…) Esos datos personales únicamente se transmitirán a la plataforma tras la adopción de la decisión de iniciar una operación de retorno, y se suprimirán tan pronto como concluya la operación. (…)</p><p><b>50.1.</b> <u class=\"m-clave\">Sin entrar a analizar</u> el fondo de las decisiones de retorno, que sigue siendo responsabilidad exclusiva de los Estados miembros, la Agencia prestará asistencia técnica y operativa a los Estados miembros y garantizará la coordinación o la organización de las operaciones de retorno, lo que podrá incluir el <mark class=\"m-personalizado\">flete de aeronaves</mark> (…) o la organización de retornos en vuelos regulares o por otros medios de transporte. (…)</p><p><b>50.2.</b> (…) Cuando se desplieguen los miembros de los equipos, estos consultarán el <mark class=\"m-destacable\">Sistema de Información de Schengen</mark> antes del retorno de los retornados para comprobar si se ha suspendido la decisión de retorno (…).</p>", true)
  + articuloResp("Artículos 50 a 53 — Retorno de recogida, supervisores del retorno forzoso e intervenciones de retorno · R18", ["recogida: al menos un representante del EM y un supervisor del retorno forzoso","plan de retorno sin demora","informe del supervisor al director ejecutivo, al agente de derechos fundamentales y a las autoridades de los EM participantes","informe de evaluación cada seis meses","solicitud de supervisores: 21 días hábiles (5 en intervención rápida)","intervención de retorno rápida: decisión en máximo 5 días hábiles"], "<p><b>50.3.</b> (…) la coordinación o la organización de operaciones de retorno para las que los medios de transporte y los escoltas de retorno sean facilitados por un tercer país de retorno («<mark class=\"m-destacable\">operaciones de retorno de recogida</mark>»). (…) A lo largo de toda la operación de retorno, y hasta la llegada al tercer país de retorno, se encontrará presente <mark class=\"m-resp\">al menos un representante del Estado miembro y un supervisor del retorno forzoso</mark> (…).</p><p><b>50.4.</b> El director ejecutivo elaborará <mark class=\"m-plazo\">SIN DEMORA</mark> un plan de retorno para las operaciones de retorno de recogida. (…) será vinculante para la Agencia y para cualquier Estado miembro participante. (…)</p><p><b>50.5.</b> (…) El <mark class=\"m-autoridad\">supervisor del retorno forzoso</mark> presentará un informe sobre cada operación de retorno forzoso <mark class=\"m-resp\">al director ejecutivo, al agente de derechos fundamentales y a las autoridades nacionales competentes de todos los Estados miembros que participen en dicha operación</mark>. (…)</p><p><b>50.7.</b> El director ejecutivo evaluará los resultados de las operaciones de retorno y enviará <mark class=\"m-resp\">cada seis meses</mark> al Parlamento Europeo, al Consejo, a la Comisión y al consejo de administración un informe de evaluación detallado (…).</p><p><b>51.3.</b> (…) Dicha solicitud [de supervisores del retorno forzoso] se presentará, como mínimo, con <mark class=\"m-plazo\">veintiún días hábiles</mark> de antelación al despliegue previsto, o con <mark class=\"m-resp\">cinco días hábiles de antelación en el caso de una intervención de retorno rápida</mark>.</p><p><b>53.2.</b> Si la obligación de retornar a retornados supone un <mark class=\"m-personalizado\">reto concreto y desproporcionado</mark> para un Estado miembro, la Agencia deberá (…) facilitar la asistencia técnica y operativa adecuada mediante una <mark class=\"m-destacable\">intervención de retorno rápida</mark>. (…)</p><p><b>53.3.</b> En el contexto de una intervención de retorno, el director ejecutivo elaborará <mark class=\"m-plazo\">sin demora</mark> un plan operativo de acuerdo con el Estado miembro de acogida y con los Estados miembros participantes. (…)</p><p><b>53.4.</b> El director ejecutivo tomará una decisión sobre el plan operativo lo antes posible y, en el caso al que se refiere el apartado 2, en un <mark class=\"m-resp\">plazo máximo de cinco días hábiles</mark>. La decisión será notificada inmediatamente y por escrito a los Estados miembros en cuestión y al consejo de administración.</p>", true)

  + articuloResp("Artículos 54 y 55 — Cuerpo permanente y personal estatutario · R19", ["cuatro categorías (1 estatutario, 2 comisión de servicios larga, 3 corta duración, 4 reserva de reacción rápida)","NO personal de otras agencias","decisión anual antes del 31 de marzo","personal de apoyo hasta el 4 %","mecanismo de supervisión del uso de la fuerza: el consejo de administración","escolta en retorno FORZOSO"], "<p><b>54.1.</b> Formará parte de la Agencia un <mark class=\"m-destacable\">cuerpo permanente</mark> de la Guardia Europea de Fronteras y Costas con la capacidad definida en el anexo I. Dicho cuerpo estará compuesto por las <mark class=\"m-resp\">cuatro categorías de personal</mark> siguientes (…): a) <mark class=\"m-plazo\">CATEGORÍA 1</mark>: <mark class=\"m-resp\">miembros del personal estatutario</mark> desplegados como miembros de equipos (…), así como personal responsable del funcionamiento de la unidad central SEIAV; b) <mark class=\"m-plazo\">CATEGORÍA 2</mark>: personal adscrito a la Agencia enviado por los Estados miembros a la Agencia para una larga duración (…); c) <mark class=\"m-plazo\">CATEGORÍA 3</mark>: <mark class=\"m-resp\">personal de los Estados miembros preparado para ser proporcionado a la Agencia para despliegues de corta duración</mark> (…), y d) <mark class=\"m-plazo\">CATEGORÍA 4</mark>: <mark class=\"m-resp\">una reserva de reacción rápida</mark> compuesta por personal de los Estados miembros preparado para ser desplegado (…) a los efectos de intervenciones fronterizas rápidas (…).</p><p><b>54.4.</b> Sobre la base de una propuesta del director ejecutivo (…), el consejo de administración adoptará, a más tardar el <mark class=\"m-resp\">31 de marzo de cada año</mark>, una decisión tendente a: a) definir los perfiles y establecer los requisitos para el personal operativo; b) fijar el número de miembros del personal operativo (…) de las categorías 1, 2 y 3 (…); (…)</p><p><b>54.7.</b> La Agencia podrá contratar un número suficiente de miembros de personal estatutario, que podrá representar hasta <mark class=\"m-resp\">el 4 % del número total de miembros del cuerpo permanente</mark> (…), como personal con funciones de apoyo o supervisión para la creación del cuerpo permanente (…).</p><p><b>55.2.</b> En el proceso de contratación, la Agencia garantizará que se seleccionen <u class=\"m-clave\">ÚNICAMENTE</u> candidatos que demuestren un alto grado de profesionalidad, respeten estrictos valores éticos y posean unas competencias lingüísticas adecuadas.</p><p><b>55.5.</b> <mark class=\"m-resp\">El consejo de administración</mark>, a propuesta del director ejecutivo: a) creará un <mark class=\"m-destacable\">mecanismo de supervisión</mark> adecuado para el seguimiento de la aplicación de las disposiciones relativas al uso de la fuerza por el personal estatutario de la Agencia (…); b) elaborará normas por las que se permita al director ejecutivo autorizar a los miembros del personal estatutario a llevar y usar armas (…); c) elaborará normas específicas para facilitar el almacenamiento de armas, municiones y otro equipamiento (…).</p><p><b>55.7.</b> El personal estatutario que se desplegará como miembros de equipos (…) estará facultado para desempeñar las siguientes tareas, que requieren <mark class=\"m-destacable\">competencias ejecutivas</mark> (…): a) verificación de la identidad y la nacionalidad de las personas (…); b) autorización de entrada (…); c) denegación de entrada (…); d) sellado de los documentos de viaje (…); e) expedición o denegación de visados en la frontera (…); f) vigilancia de fronteras, incluidas las patrullas entre los pasos fronterizos (…), incluida la interceptación/detención; g) registro de huellas dactilares (…) en Eurodac (…); h) contactos con terceros países con vistas a la identificación de nacionales de terceros países y obtención de documentos de viaje (…); i) <mark class=\"m-resp\">escolta de nacionales de terceros países sujetos a un procedimiento de retorno forzoso</mar   + articuloResp("Artículos 56 a 58 — Comisión de servicios de larga duración, despliegues de corta duración y reserva de reacción rápida · R20", ["comisión de servicios de 24 meses (prórroga 12 o 24)","candidatos: 30 de junio","aceptación: 15 de septiembre","lugar y duración: el director ejecutivo","lista provisional (cat. 3): 30 de junio","lista definitiva: 1 de diciembre","hasta 4 meses por año civil","refuerzo: 20 días hábiles","máximo la mitad de la contribución","mínimo 30 días","reserva: cuando ya estén desplegadas las categorías 1, 2 y 3"], "<p><b>56.1.</b> Los Estados miembros contribuirán al cuerpo permanente enviando personal operativo en comisión de servicios a la Agencia como miembros de los equipos (categoría 2). La duración de las comisiones de servicio individuales será de <mark class=\"m-resp\">veinticuatro meses</mark>. Con el consentimiento del Estado miembro de acogida y de la Agencia, las comisiones de servicio individuales se podrán prorrogar una vez por otros <mark class=\"m-plazo\">doce o veinticuatro meses</mark>. (…)</p><p><b>56.3.</b> (…) Se considerará <mark class=\"m-destacable\">Estado miembro de origen</mark> al Estado miembro que haya enviado en comisión de servicios a dicho personal operativo. Durante la comisión de servicios, <mark class=\"m-resp\">el director ejecutivo</mark> decidirá el lugar o lugares y la duración del despliegue o despliegues (…).</p><p><b>56.4.</b> A más tardar el <mark class=\"m-plazo\">30 de junio</mark> de cada año, cada Estado miembro designará a los candidatos a la comisión de servicios (…). A más tardar el <mark class=\"m-resp\">15 de septiembre</mark> de cada año, la Agencia <mark class=\"m-resp\">aceptará a los candidatos propuestos o los rechazará</mark>, en caso de incumplimiento de los perfiles requeridos, competencias lingüísticas insuficientes, conducta indebida o infracción de las normas aplicables (…).</p><p><b>57.1.</b> Además de las comisiones de servicio (…), a más tardar el <mark class=\"m-resp\">30 de junio</mark> de cada año, los Estados miembros contribuirán al cuerpo permanente designando a guardias de fronteras y a otro personal pertinente para la lista nacional provisional de personal operativo disponible para despliegues de corta duración (categoría 3) (…). Se confirmará a la Agencia la composición definitiva de la lista anual tras la conclusión de las negociaciones bilaterales anuales a más tardar el <mark class=\"m-resp\">1 de diciembre</mark> de ese año.</p><p><b>57.2.</b> (…) Cada miembro del personal estará disponible durante un período de hasta <mark class=\"m-resp\">cuatro meses dentro de un año civil</mark>. (…)</p><p><b>57.8.</b> En caso de aumento de las necesidades para el refuerzo de una operación conjunta en curso (…), los miembros de los equipos serán desplegados desde cada Estado miembro en un plazo de <mark class=\"m-resp\">veinte días hábiles</mark> desde la presentación de dicha solicitud formal (…).</p><p><b>57.9.</b> (…) esas contribuciones acumuladas no excederán <mark class=\"m-resp\">la mitad de la contribución de dicho Estado miembro para ese año fijada en el anexo III</mark>. (…)</p><p><b>57.10.</b> La duración del despliegue para una operación específica la decidirá el Estado miembro de origen, pero <u class=\"m-clave\">en ningún caso</u> será inferior a <mark class=\"m-resp\">treinta días</mark>, salvo que la operación de la que el despliegue forma parte tenga una duración inferior a treinta días.</p><p><b>58.1.</b> Los Estados miembros contribuirán al cuerpo permanente con una <mark class=\"m-destacable\">reserva de reacción rápida</mark> (categoría 4) que se activará para intervenciones fronterizas rápidas (…), siempre que <mark class=\"m-resp\">ya se haya desplegado en su totalidad el personal operativo de las categorías 1, 2 y 3</mark> para la intervención fronteriza rápida de que se trate.</p>", true)

  + articuloResp("Artículos 60 y 61 — Antenas y apoyo financiero", ["funciones de las antenas a)-j)","jefe de la antena nombrado por el director ejecutivo","informe trimestral al consejo de administración","100 % / 37 % / pago único 50 %"], "<p><b>60.3.</b> Cuando proceda, las <mark class=\"m-destacable\">antenas</mark>: a) prestarán apoyo operativo y logístico y garantizarán la coordinación de las actividades de la Agencia en las zonas de operaciones (…); b) prestarán apoyo operativo al Estado miembro o al tercer país (…); c) supervisarán las actividades de los equipos e informarán periódicamente a la sede de la Agencia; (…)</p><p><b>60.4.</b> Cada antena estará gestionada por un representante de la Agencia, nombrado <mark class=\"m-autoridad\">jefe de la antena</mark> por el director ejecutivo. (…)</p><p><b>60.7.</b> El director ejecutivo informará <mark class=\"m-resp\">trimestralmente</mark> al consejo de administración sobre las actividades de las antenas. Las actividades de las antenas se describirán en una sección separada del informe anual de actividades.</p><p><b>61.1.</b> Los Estados miembros tendrán derecho a recibir cada año financiación (…). Dicha financiación (…) ascenderá, en su caso: a) al <mark class=\"m-plazo\">100 %</mark> del importe de referencia multiplicado por el número de personal operativo que se indique para el año N+2 para comisión de servicios (…); b) <mark class=\"m-resp\">al 37 % del importe de referencia multiplicado por el número de personal operativo efectivamente desplegado</mark> de conformidad con el artículo 57 (…) y (…) el artículo 58 (…); c) al pago único del <mark class=\"m-plazo\">50 %</mark> del importe de referencia multiplicado por el número de personal operativo contratado por la Agencia como personal estatutario (…) que no lleve en activo más de <mark class=\"m-plazo\">quince años</mark> (…).</p>", true)
  + articuloResp("Artículos 63 y 64 — Adquisición de equipamiento y contingente de equipamiento técnico", ["equipamiento propio: plenamente disponible","copropiedad superior al 50 %: según acuerdo con un EM","cantidad mínima: el consejo de administración a más tardar el 31 de marzo","reacción rápida: máximo 10 días","solicitud: 45 días (importante) y 30 días (resto)","si no se alcanza la cantidad mínima: informa SIN DEMORA al consejo de administración"], "<p><b>63.1.</b> La Agencia podrá adquirir, por sí sola o en régimen de copropiedad con un Estado miembro, o arrendar <mark class=\"m-destacable\">equipamiento técnico</mark> (…).</p><p><b>64.2.</b> El equipamiento que sea propiedad exclusiva de la Agencia estará plenamente disponible para su despliegue en cualquier momento.</p><p><b>64.3.</b> El equipamiento del que la Agencia sea copropietaria en una proporción superior al <mark class=\"m-plazo\">50 %</mark> <mark class=\"m-resp\">también estará disponible para su despliegue de conformidad con un acuerdo celebrado entre un Estado miembro y la Agencia</mark> (…).</p><p><b>64.6.</b> Sobre la base de una propuesta del director ejecutivo que tenga en cuenta el análisis de riesgos de la Agencia y los resultados de las evaluaciones de la vulnerabilidad, el consejo de administración establecerá, <mark class=\"m-resp\">a más tardar el 31 de marzo de cada año, la cantidad mínima de artículos del equipamiento técnico que se requiere para satisfacer las necesidades de la Agencia el año siguiente</mark> (…).</p><p><b>64.8.</b> (…) El Estado miembro interesado enviará el equipamiento enumerado en esta lista [del contingente de equipamiento de reacción rápida] (…) lo antes posible, y en ningún caso más de <mark class=\"m-plazo\">diez días</mark> después de la fecha en la que se acuerde el plan operativo. (…)</p><p><b>64.9.</b> Los Estados miembros contribuirán al contingente de equipamiento técnico. (…) La solicitud de la Agencia se presentará, como mínimo, con <mark class=\"m-resp\">cuarenta y cinco días de antelación al despliegue previsto del equipamiento técnico importante y con treinta días</mark> de antelación en el caso de los demás equipamientos. (…)</p><p><b>64.13.</b> (…) En caso de que no se alcance la cantidad mínima de artículos del equipamiento técnico requerido en el contingente, el director ejecutivo informará al consejo de administración <mark class=\"m-resp\">sin demora</mark>. (…)</p>", true)

  + bloqueTitulo("COOPERACIÓN")
  + articuloResp("Artículos 67 a 70 — SEIAV, cooperación con la Unión, guardacostas, Irlanda y Reino Unido", ["creación y funcionamiento de la unidad central SEIAV","acuerdos de trabajo con aprobación previa de la Comisión","MAOC-N","manual de guardacostas en forma de recomendación","Gibraltar: aplicación suspendida"], "<p><b>67.</b> La Agencia garantizará <mark class=\"m-resp\">la creación y el funcionamiento de la unidad central SEIAV</mark> contemplada en el artículo 7 del Reglamento (UE) 2018/1240.</p><p><b>68.1.</b> La Agencia cooperará con las instituciones, órganos y organismos de la Unión (…), en particular, con: a) la Comisión y el SEAE; b) Europol; c) la EASO; d) la FRA; e) Eurojust; f) el Centro de Satélites de la Unión Europea; g) la AESM y la AECP; h) eu-LISA; i) la AESA y el gestor de la red europea de gestión del tránsito aéreo; j) las misiones y operaciones de la PCSD (…). La Agencia podrá cooperar asimismo con las siguientes organizaciones internacionales (…): a) las Naciones Unidas (…); b) Interpol; c) la OSCE; d) el Consejo de Europa (…); e) <mark class=\"m-resp\">el Centro de Análisis y Operaciones Marítimas en Materia de Drogas (MAOC-N)</mark>.</p><p><b>68.2.</b> La cooperación (…) tendrá lugar en el marco de los <mark class=\"m-destacable\">acuerdos de trabajo</mark> (…). Estos acuerdos estarán sujetos a la aprobación previa de <mark class=\"m-resp\">la Comisión</mark>. La Agencia informará al Parlamento Europeo y al Consejo sobre esos acuerdos.</p><p><b>69.3.</b> La Comisión (…) facilitará un <mark class=\"m-destacable\">manual práctico</mark> sobre la cooperación europea en las funciones de guardacostas. (…) La Comisión aprobará el manual <mark class=\"m-resp\">en forma de recomendación</mark>.</p><p><b>70.8.</b> La aplicación del presente Reglamento a las fronteras de <mark class=\"m-destacable\">Gibraltar</mark> <mark class=\"m-resp\">se suspenderá hasta la fecha en que se llegue a un acuerdo sobre el ámbito de aplicación de las medidas relativas al cruce de las fronteras exteriores por las personas</mark>.</p>", true)
  + articuloResp("Artículos 73 a 77 — Cooperación con terceros países", ["acuerdo sobre el estatuto (modelo del art. 76.1 y art. 218 TFUE)","acciones en un tercer país: requieren su acuerdo","aprobación del EM de origen no más tarde de 21 días antes","modelo: consulta a EM, Agencia, FRA y SEPD","acuerdos de trabajo: aprobación previa de la Comisión e información al PE","lista de prioridades de funcionarios de enlace: el consejo de administración cada año"], "<p><b>73.3.</b> En circunstancias que exijan el despliegue de equipos de gestión de fronteras del cuerpo permanente en un tercer país en el que los miembros de los equipos ejercerán <mark class=\"m-personalizado\">competencias ejecutivas</mark>, la Unión celebrará <mark class=\"m-resp\">un acuerdo sobre el estatuto</mark> con el tercer país de que se trate, elaborado sobre la base del <mark class=\"m-resp\">modelo de acuerdo sobre el estatuto a que se refiere el artículo 76, apartado 1, y sobre la base del artículo 218 del TFUE</mark>. (…)</p><p><b>74.2.</b> La Agencia podrá llevar a cabo acciones relacionadas con la gestión europea integrada de las fronteras en el territorio de un tercer país, para lo que se requerirá <mark class=\"m-resp\">el acuerdo de dicho tercer país</mark>.</p><p><b>74.5.</b> (…) El despliegue de personal en comisión de servicios (…) estará supeditado a la aprobación del Estado miembro de origen, comunicada previa notificación por la Agencia y <mark class=\"m-resp\">no más tarde de veintiún días antes de la fecha del despliegue</mark>.</p><p><b>76.1.</b> La Comisión, previa consulta <mark class=\"m-resp\">a los Estados miembros, a la Agencia, a la FRA y al Supervisor Europeo de Protección de Datos</mark>, elaborará un modelo de acuerdo sobre el estatuto para acciones que se desarrollen en el territorio de terceros países.</p><p><b>76.4.</b> Antes de que el consejo de administración apruebe acuerdos de trabajo entre la Agencia y las autoridades competentes de terceros países, <mark class=\"m-resp\">la Agencia se los notificará a la Comisión, la cual dará su aprobación previa</mark>. Antes de que se celebren esos acuerdos de trabajo, <mark class=\"m-resp\">la Agencia informará al Parlamento Europeo</mark> y le proporcionará información pormenorizada sobre las partes del acuerdo de trabajo y su contenido previsto.</p><p><b>77.2.</b> (…) deberá concederse prioridad al despliegue de <mark class=\"m-autoridad\">funcionarios de enlace</mark> en aquellos terceros países que (…) sean países de origen o tránsito para la migración ilegal. (…) <mark class=\"m-resp\">El consejo de administración adoptará cada año la lista de prioridades</mark>, a propuesta del director ejecutivo. El despliegue de los funcionarios de enlace deberá recibir la aprobación del consejo de administración, previo dictamen de la Comisión.</p>", true)
  + articuloResp("Artículos 79 y 81 — FADO y código de conducta", ["la Agencia asume y explota el sistema FADO","códigos de conducta en cooperación con el foro consultivo"], "<p><b>79.</b> <mark class=\"m-resp\">La Agencia</mark> asumirá y explotará el sistema <mark class=\"m-resp\">Documentos Auténticos y Falsos en Red (FADO)</mark> establecido de conformidad con la Acción común 98/700/JAI.</p><p><b>81.1.</b> La Agencia, en cooperación con <mark class=\"m-resp\">el foro consultivo</mark>, elaborará y desarrollará un <mark class=\"m-destacable\">código de conducta</mark> que se aplicará a todas las operaciones de control fronterizo coordinadas por la Agencia (…), prestando especial atención a las personas vulnerables (…).</p><p><b>81.2.</b> La Agencia, en cooperación con el foro consultivo, elaborará y desarrollará un código de conducta para las operaciones de retorno y las intervenciones de retorno (…).</p>", true)
  + articuloResp("Artículos 82, 84 y 85 — Funciones de los miembros de los equipos y responsabilidad civil y penal · R22", ["uniforme, identificación personal visible y brazalete AZUL con insignias de la Unión y de la Agencia","documento acreditativo","armas del personal estatutario: art. 82 y anexo V","denegaciones de entrada: guardias del EM de acogida (o equipos autorizados)","responsabilidad civil: el EM de acogida (reembolso del EM de origen o de la Agencia si hay negligencia grave o dolo)","daños al equipamiento: la Agencia","penal: mismo trato que los funcionarios del EM de acogida"], "<p><b>82.4.</b> (…) los miembros de los equipos solo podrán desempeñar funciones y ejercer competencias <u class=\"m-clave\">bajo las instrucciones</u> de los guardias de fronteras o del personal del Estado miembro de acogida (…) y, como norma general, en su presencia. (…)</p><p><b>82.6.</b> El personal estatutario que sea miembro de los equipos llevará el <mark class=\"m-destacable\">uniforme del cuerpo permanente</mark> (…). Los miembros de los equipos que hayan sido enviados por los Estados miembros (…) llevarán <mark class=\"m-resp\">su propio uniforme</mark> (…). Todos los miembros de los equipos también llevarán en sus uniformes una identificación personal visible y <mark class=\"m-resp\">un brazalete azul con las insignias de la Unión y de la Agencia</mark> (…). Para la identificación ante las autoridades nacionales del Estado miembro de acogida, los miembros de los equipos llevarán en todo momento <mark class=\"m-resp\">un documento acreditativo</mark> que presentarán cuando así se les requiera.</p><p><b>82.7.</b> Para el personal enviado en comisión de servicios (…), el porte y uso de armas reglamentarias (…) estarán sujetos a la legislación nacional del <mark class=\"m-personalizado\">Estado miembro de origen</mark>. El porte y uso de armas reglamentarias, munición y equipamiento por parte de miembros del personal estatutario de la Agencia (…) estará sujeto <mark class=\"m-resp\">al marco y a las normas detalladas que se establecen en el presente artículo y en el anexo V</mark>. (…)</p><p><b>82.9.</b> Las armas reglamentarias, la munición y el equipamiento podrán utilizarse en <mark class=\"m-destacable\">legítima defensa</mark> propia y en legítima defensa de los miembros de los equipos o de otras personas (…).</p><p><b>82.11.</b> Las decisiones por las que se deniegue la entrada (…) y las decisiones de denegación de visados en la frontera (…) las tomarán <mark class=\"m-resp\">exclusivamente los guardias de fronteras del Estado miembro de acogida o los miembros de los equipos si el Estado miembro de acogida los autoriza para actuar en su nombre</mark>.</p><p><b>84.1.</b> (…) mientras los miembros de los equipos estén interviniendo en el Estado miembro de acogida, <mark class=\"m-resp\">ese Estado miembro será responsable, de conformidad con su Derecho nacional, de los daños y perjuicios</mark> que causen durante sus operaciones.</p><p><b>84.2.</b> Cuando tales daños y perjuicios sean consecuencia de <mark class=\"m-personalizado\">negligencia grave o dolo</mark> de los miembros de los equipos enviados en comisión de servicios o desplegados por los Estados miembros, el Estado miembro de acogida podrá dirigirse <mark class=\"m-resp\">al Estado miembro de origen</mark> para que le reembolse (…). Cuando tales daños y perjuicios sean consecuencia de negligencia grave o dolo del personal estatutario de la Agencia, el Estado miembro de acogida podrá solicitar <mark class=\"m-resp\">a la Agencia</mark> que le reembolse (…).</p><p><b>84.5.</b> (…) <mark class=\"m-resp\">la Agencia</mark> sufragará los costes relativos a los daños que sufra el equipamiento durante el despliegue, <u class=\"m-clave\">salvo</u> cuando sean consecuencia de negligencia grave o dolo.</p><p><b>85.</b> (…) los miembros de los equipos que se encuentren en el territorio del Estado miembro de acogida, incluido el personal estatutario de la Agencia, <mark class=\"m-resp\">recibirán el mismo trato que los funcionarios del Estado miembro de acogida en lo relativo a las infracciones penales</mark> que puedan cometerse contra ellos o que ellos puedan cometer.</p>", true)
  + articuloResp("Artículos 86 a 92 — Datos personales e información clasificada", ["Reglamento 2018/1725","restringir arts. 14 a 22, 35 y 36","categorías de datos a)-c)","sospechosos de delincuencia transfronteriza","conservación máxima 90 días","retorno: 30 días tras terminar","art. 90: examen a los 3 meses y luego cada 6","acuerdos de información clasificada con terceros países: aprobación previa de la Comisión"], "<p><b>86.2.</b> (…) La Agencia, de conformidad con el artículo 25 del Reglamento (UE) 2018/1725, podrá adoptar normas internas para restringir la aplicación de <mark class=\"m-resp\">los artículos 14 a 22, 35 y 36</mark> de dicho Reglamento. (…)</p><p><b>88.1.</b> (…) la Agencia únicamente tratará las siguientes categorías de datos personales (…): a) <mark class=\"m-resp\">datos personales de individuos que crucen las fronteras exteriores sin autorización</mark>; b) <mark class=\"m-resp\">datos personales que sean necesarios para confirmar la identidad y la nacionalidad de los nacionales de terceros países en el marco de las actividades de retorno, incluidas las listas de pasajeros</mark>; c) números de matrícula de vehículos, números de identificación de vehículos, números de teléfono o números de identificación de barcos y de aeronaves (…).</p><p><b>90.1.</b> (…) Los datos personales tratados con este fin (…) se referirán a personas físicas, <mark class=\"m-resp\">con respecto a las cuales las autoridades competentes de los Estados miembros, Europol, Eurojust o la Agencia tengan motivos razonables para sospechar que están involucradas en actividades de delincuencia transfronteriza</mark>. (…)</p><p><b>91.1.</b> La Agencia eliminará los datos personales en cuanto hayan sido transmitidos (…). El período de conservación <u class=\"m-clave\">no superará en ningún caso</u> los <mark class=\"m-resp\">noventa días desde la fecha de recogida</mark> de dichos datos. En los resultados de los análisis de riesgos, los datos se presentarán anonimizados.</p><p><b>91.2.</b> Los datos personales tratados para desempeñar tareas relacionadas con el retorno se eliminarán tan pronto como se logre el objetivo (…), y a más tardar <mark class=\"m-plazo\">treinta días</mark> después de que dichas tareas hayan terminado.</p><p><b>91.3.</b> (…) la Agencia examinará la necesidad de conservar dichos datos <mark class=\"m-resp\">a más tardar tres meses después del comienzo del tratamiento inicial de los datos y, posteriormente, cada seis meses</mark>. (…)</p><p><b>92.1.</b> (…) <mark class=\"m-resp\">Todo acuerdo administrativo sobre el intercambio de información clasificada con las autoridades pertinentes de un tercer país o, cuando no exista dicho acuerdo, toda cesión ad hoc de ICUE a esas autoridades con carácter excepcional</mark> estará sujeta a la <mark class=\"m-personalizado\">aprobación previa de la Comisión</mark>.</p>", true)
  + bloqueTitulo("MARCO GENERAL Y ORGANIZACIÓN DE LA AGENCIA")
  + articuloResp("Artículos 93, 95 y 96 — Estatuto jurídico, sede, personal y privilegios · R23", ["organismo de la Unión con personalidad jurídica","independiente en su mandato técnico y operativo","la representa su director ejecutivo","sede en VARSOVIA","contratos de cinco años, renovables una vez","Protocolo n.º 7"], "<p><b>93.1.</b> La Agencia será un <mark class=\"m-destacable\">organismo de la Unión</mark>. Tendrá <mark class=\"m-personalizado\">personalidad jurídica</mark>.</p><p><b>93.3.</b> La Agencia será independiente a la hora de ejecutar su mandato técnico y operativo.</p><p><b>93.4.</b> La Agencia estará representada por <mark class=\"m-resp\">su director ejecutivo</mark>.</p><p><b>93.5.</b> La sede de la Agencia se establecerá en <mark class=\"m-resp\">Varsovia (Polonia)</mark>.</p><p><b>95.3.</b> Los miembros del personal estatutario sujetos al régimen aplicable a los otros agentes serán contratados inicialmente por un <mark class=\"m-resp\">período fijo de cinco años</mark>. En principio, sus contratos solo podrán renovarse una vez, por un período fijo de cinco años como máximo. Toda posible renovación ulterior se considerará por tiempo indefinido.</p><p><b>96.</b> <mark class=\"m-resp\">El Protocolo nº 7 sobre los privilegios e inmunidades de la Unión Europea</mark> anejo al TUE y al TFUE será aplicable a la Agencia y a su personal estatutario.</p>", true)
  + articuloResp("Artículo 100 — Funciones del consejo de administración", ["nombra director ejecutivo y adjuntos a propuesta de la Comisión","antenas: dos tercios","documento único de programación antes del 30 de noviembre por dos tercios","presupuesto por dos tercios","peticiones de Irlanda y Reino Unido: el consejo de administración","actuaciones en un EM: voto favorable de su representante","junta ejecutiva: máximo 4 representantes (incluido el presidente) y 1 de la Comisión"], "<p><b>1.</b> El <mark class=\"m-autoridad\">consejo de administración</mark> será responsable de adoptar las <mark class=\"m-destacable\">decisiones estratégicas</mark> de la Agencia (…).</p><p><b>2.</b> El consejo de administración: a) nombrará al director ejecutivo, sobre la base de una propuesta de la Comisión (…); b) nombrará a los directores ejecutivos adjuntos, sobre la base de una propuesta de la Comisión (…); c) adoptará la decisión de crear antenas o de prorrogar su duración (…) por <mark class=\"m-resp\">mayoría de dos tercios de los miembros con derecho de voto</mark>; (…) j) aprobará el informe anual de actividades (…) y, a más tardar el <mark class=\"m-plazo\">1 de julio</mark> de cada año, lo enviará al Parlamento Europeo, al Consejo, a la Comisión y al Tribunal de Cuentas; k) antes del <mark class=\"m-resp\">30 de noviembre</mark> de cada año (…) aprobará por una <mark class=\"m-plazo\">mayoría de dos tercios</mark> de los miembros con derecho de voto <mark class=\"m-resp\">un documento único de programación que contenga, entre otros, la programación plurianual de la Agencia y su programa de trabajo para el año siguiente</mark> (…); (…) m) adoptará, por <mark class=\"m-plazo\">mayoría de dos tercios</mark> (…), el presupuesto anual de la Agencia (…); (…) z) nombrará a un agente de derechos fundamentales y a un agente de derechos fundamentales adjunto (…); (…) ab) aprobará los acuerdos de trabajo con terceros países; (…)</p><p><b>3.</b> Las propuestas de decisiones del cons   + articuloResp("Artículos 101 a 105 — Composición, programación, presidencia, reuniones y votación · R25", ["un representante por EM y dos de la Comisión, con voto","mandato de cuatro años, renovable","reasignación superior al 2 % = modificación sustancial","presidente y vicepresidente por dos tercios, cuatro años renovables una vez","expiran al dejar de ser miembros","reuniones al menos dos veces al año","el director ejecutivo sin voto","regla general: mayoría absoluta"], "<p><b>101.1.</b> (…) el consejo de administración estará formado por <mark class=\"m-resp\">un representante de cada Estado miembro y dos representantes de la Comisión, todos ellos con derecho de voto</mark>. (…) La duración del mandato será de <mark class=\"m-resp\">cuatro años</mark>. El mandato podrá renovarse.</p><p><b>102.1.</b> A más tardar el <mark class=\"m-plazo\">30 de noviembre</mark> de cada año, el consejo de administración adoptará un <mark class=\"m-destacable\">documento de programación único</mark> (…), basada en un proyecto presentado por el director ejecutivo (…).</p><p><b>102.8.</b> Cualquier modificación sustancial del programa de trabajo anual, en especial la modificación que resulte en una <mark class=\"m-resp\">reasignación de los recursos presupuestarios superior al 2 % del presupuesto anual</mark>, se adoptará con arreglo al mismo procedimiento aplicable a la adopción del programa de trabajo anual inicial. (…)</p><p><b>103.1.</b> El consejo de administración elegirá a un <mark class=\"m-autoridad\">presidente</mark> y a un <mark class=\"m-autoridad\">vicepresidente</mark> de entre sus miembros con derecho de voto. El presidente y el vicepresidente serán elegidos por <mark class=\"m-resp\">mayoría de dos tercios de los miembros del consejo de administración con derecho de voto</mark>. (…)</p><p><b>103.2.</b> <mark class=\"m-resp\">Los mandatos del presidente y del vicepresidente expirarán en el momento en que dejen de ser miembros del consejo de administración</mark>. A reserva de esta disposición, la duración de los mandatos (…) será de <mark class=\"m-plazo\">cuatro años</mark>. Ambos mandatos podrán renovarse una vez.</p><p><b>104.2.</b> El <mark class=\"m-resp\">director ejecutivo</mark> participará en las deliberaciones, pero lo hará <mark class=\"m-resp\">sin derecho de voto</mark>.</p><p><b>104.3.</b> El consejo de administración se reunirá <mark class=\"m-resp\">al menos dos veces al año</mark> en sesión ordinaria. Además, se reunirá a iniciativa del presidente, a petición de la Comisión o a petición de, como mínimo, un tercio de sus miembros. (…)</p><p><b>104.5.</b> <mark class=\"m-resp\">El Reino Unido</mark> será invitado a asistir a las reuniones del consejo de administración que se celebren antes de la fecha en que los Tratados dejen de aplicarse al Reino Unido (…).</p><p><b>105.1.</b> (…) el consejo de administración adoptará sus decisiones por <mark class=\"m-resp\">mayoría absoluta de sus miembros con derecho de voto</mark>.</p>", true)
  + articuloResp("Artículos 106 y 107 — Director ejecutivo y directores ejecutivos adjuntos · R26", ["informes en un plazo de seis meses","respuestas a diputados en quince días naturales","ejecuta el presupuesto","rinde cuentas ante el consejo de administración","representante legal","mínimo tres candidatos de la Comisión","nombramiento por dos tercios","tres directores adjuntos","mandato de cinco años, prorrogable una vez"], "<p><b>106.2.</b> (…) El director ejecutivo también hará una declaración ante el Parlamento Europeo, si este así lo solicita, y responderá por escrito a cualquier pregunta de los diputados al Parlamento Europeo en un plazo de <mark class=\"m-resp\">quince días naturales</mark> tras la recepción de dicha pregunta. (…)</p><p><b>106.3.</b> <mark class=\"m-resp\">Salvo en los casos en que ya se establezcan plazos específicos en el presente Reglamento, el director ejecutivo se asegurará de que los informes se transmitan al Parlamento Europeo, al Consejo o a la Comisión lo antes posible y, en cualquier caso, en un plazo de seis meses a contar desde el final del período sobre el que se informa, salvo que el director ejecutivo justifique debidamente por escrito un retraso</mark>.</p><p><b>106.4.</b> (…) e) preparar un proyecto de estado de previsiones de los ingresos y gastos de la Agencia (…) y <mark class=\"m-resp\">ejecutar el presupuesto</mark> (…).</p><p><b>106.5.</b> El director ejecutivo deberá rendir cuentas de sus actividades <mark class=\"m-resp\">ante el consejo de administración</mark>.</p><p><b>106.6.</b> El director ejecutivo será el <mark class=\"m-personalizado\">representante legal</mark> de la Agencia.</p><p><b>107.1.</b> La Comisión propondrá un mínimo de <mark class=\"m-plazo\">tres candidatos</mark> para el puesto de director ejecutivo y para cada uno de los puestos de director ejecutivo adjunto (…).</p><p><b>107.2.</b> (…) El consejo de administración decidirá por <mark class=\"m-plazo\">mayoría de dos tercios</mark> de los miembr   + articuloResp("Artículos 109 a 111 — Agente de derechos fundamentales, observadores y mecanismo de denuncias", ["agente: el consejo de administración, lista de tres candidatos, previa consulta al foro consultivo","el agente selecciona y gestiona a los observadores e informa al director ejecutivo","observadores: al menos 40 antes del 5-12-2020","el director ejecutivo evalúa anualmente su aumento","denuncia por escrito ante la Agencia"], "<p><b>109.1.</b> <mark class=\"m-resp\">El consejo de administración</mark> designará a un <mark class=\"m-autoridad\">agente responsable en materia de derechos fundamentales</mark> <mark class=\"m-resp\">a partir de una lista de tres candidatos, previa consulta al foro consultivo</mark>. (…)</p><p><b>109.2.</b> El agente de derechos fundamentales desempeñará las siguientes tareas: a) contribuir a la estrategia de la Agencia en materia de derechos humanos (…); b) supervisar el cumplimiento de los derechos fundamentales por parte de la Agencia (…); (…) i) <mark class=\"m-resp\">informar al director ejecutivo de posibles violaciones de los derechos fundamentales</mark> durante las actividades de la Agencia; j) <mark class=\"m-resp\">seleccionar y gestionar a los observadores de derechos fundamentales</mark>; (…)</p><p><b>109.3.</b> A efectos del apartado 2, (…) letra j), el agente de derechos fundamentales deberá, en particular: a) <mark class=\"m-resp\">nombrar a los observadores de los derechos fundamentales</mark>; b) asignar operaciones y actividades a los observadores (…); c) designar observadores de los derechos fundamentales en calidad de supervisores del retorno forzoso (…); d) garantizar que los observadores (…) reciban la formación adecuada; e) informar <mark class=\"m-resp\">al director ejecutivo</mark> de posibles violaciones de derechos fundamentales que le hayan sido comunicadas por los observadores (…).</p><p><b>110.2.</b> Los <mark class=\"m-autoridad\">observadores de los derechos fundamentales</mark> desempeñarán las siguientes tareas: a) <mark class=\"m-resp\">supervisar el cumplimiento de los derechos fundamentales y prestar asesoramiento y asistencia</mark> (…); b) <mark class=\"m-resp\">actuar en calidad de supervisores del retorno forzoso</mark>; c) <mark class=\"m-resp\">contribuir a las actividades de formación de la FRA</mark> (…), en particular impartiendo formación sobre los derechos fundamentales.</p><p><b>110.5.</b> Los observadores de los derechos fundamentales serán nombrados por el agente de derechos fundamentales y estarán bajo su supervisión jerárquica. Serán independientes en el ejercicio de sus funciones. Cuando se encuentren en una zona de operaciones, portarán un distintivo que permita identificarles claramente (…).</p><p><b>110.6.</b> La Agencia garantizará que, a más tardar el <mark class=\"m-plazo\">5 de diciembre de 2020</mark>, la Agencia contrate a un mínimo de <mark class=\"m-resp\">cuarenta</mark> observadores de los derechos fundamentales. <mark class=\"m-resp\">El director ejecutivo</mark>, en consulta con el agente de derechos fundamentales, evaluará anualmente si es necesario aumentar esa cifra. (…)</p><p><b>111.2.</b> Cualquier persona directamente afectada por las acciones u omisiones del personal (…) y que considere que (…) se han violado sus derechos fundamentales (…) podrá presentar una denuncia <mark class=\"m-resp\">por escrito ante la Agencia</mark>.</p><p><b>111.4.</b> El agente de derechos fundamentales será el responsable de gestionar las denuncias recibidas por la Agencia (…).</p>", true)

  + articuloResp("Artículos 113 a 124 — Régimen lingüístico, presupuesto, evaluación, comité, derogación y entrada en vigor · R27", ["Reglamento n.º 1","gastos administrativos, de infraestructura, operativos y de personal","contingente operativo financiero de al menos el 2 %","evaluación cada cuatro años desde el 5-12-2023","«Comité de la Guardia Europea de Fronteras y Costas»","derogados del 2016/1624 a 1-1-2021: arts. 20, 30 y 31","en vigor a los veinte días"], "<p><b>113.1.</b> <mark class=\"m-resp\">El Reglamento nº 1</mark> será aplicable a la Agencia.</p><p><b>115.2.</b> El gasto de la Agencia incluirá sus gastos: • administrativos, • de infraestructura, • operativos y • de personal.</p><p><b>115.4.</b> Los ingresos y los gastos deberán estar <mark class=\"m-personalizado\">equilibrados</mark>.</p><p><b>115.14.</b> Con el objetivo de financiar el despliegue de intervenciones fronterizas rápidas e intervenciones de retorno, el presupuesto de la Agencia (…) incluirá un contingente operativo financiero de <mark class=\"m-resp\">al menos el 2 %</mark> de la asignación prevista conjuntamente para las operaciones conjuntas en las fronteras exteriores y para las actividades operativas en la zona de retorno. (…)</p><p><b>121.1.</b> (…) a más tardar el <mark class=\"m-plazo\">5 de diciembre de 2023</mark> y <mark class=\"m-resp\">cada cuatro años</mark> a partir de entonces, la Comisión llevará a cabo una evaluación del presente Reglamento. (…)</p><p><b>122.1.</b> La Comisión estará asistida por un comité (el «<mark class=\"m-resp\">Comité de la Guardia Europea de Fronteras y Costas</mark>»). (…)</p><p><b>123.2.</b> Queda derogado el Reglamento (UE) 2016/1624 a excepción de sus <mark class=\"m-resp\">artículos 20, 30 y 31</mark>, que quedan derogados con efectos a partir del <mark class=\"m-plazo\">1 de enero de 2021</mark>.</p><p><b>124.1.</b> El presente Reglamento entrará en vigor a los <mark class=\"m-plazo\">veinte días</mark> de su publicación en el Diario Oficial de la Unión Europea.</p>", true)
  + articuloResp("Anexos I y V — Capacidad del cuerpo permanente y uso de la fuerza", ["10.000 efectivos en 2027 y después (3.000 / 1.500 / 5.500 / 0)","principios de necesidad, proporcionalidad y precaución","formación continua anual: mínimo 24 horas (8 teóricas y 16 prácticas)"], "<p><b>Anexo I.</b> Capacidad del cuerpo permanente por año y por categoría: 2021: <mark class=\"m-plazo\">6.500</mark> · 2022: 6.500 · 2023: 7.500 · 2024: 8.000 · 2025: 8.000 · 2026: 9.000 · <mark class=\"m-resp\">2027 y después: 10.000</mark> (categoría 1: 3.000; categoría 2: 1.500; categoría 3: 5.500; categoría 4: 0).</p><p><b>Anexo V.1.</b> (…) el uso de la fuerza y de armas por el personal estatutario desplegado como miembro de los equipos respetará los principios de <mark class=\"m-destacable\">necesidad, proporcionalidad y precaución</mark> («principios fundamentales»). (…)</p><p><b>Anexo V.4.</b> (…) La formación continua anual debe durar <mark class=\"m-resp\">un mínimo de veinticuatro horas en total, dedicando al menos ocho horas a la formación teórica y dieciséis a la práctica</mark>. La formación práctica se dividirá en al menos ocho horas de formación física, empleando técnicas de inmovilización, y al menos ocho horas para el uso de armas de fuego.</p>", true)

  + articuloResp("Artículo 1 — Fundamentos del Convenio", ["iniciativa para trasladarlo al marco de la UE en máximo tres años","informan conjuntamente al Consejo de la UE y a la Comisión"], "<p><b>(1)</b> Mediante el presente Tratado, las Partes Contratantes pretenden reforzar la <mark class=\"m-destacable\">cooperación transfronteriza</mark>, en particular en el campo del intercambio de información entre ellas.</p><p><b>(2)</b> Dicha cooperación no afectará al derecho de la Unión Europea y (…) estará abierta a la adhesión de cualquier Estado miembro de la Unión Europea.</p><p><b>(4)</b> Como máximo <mark class=\"m-plazo\">tres años</mark> después de la entrada en vigor del presente Tratado, se pondrá en marcha <mark class=\"m-resp\">una iniciativa para trasladar las disposiciones del mismo al marco jurídico de la Unión Europea</mark> (…).</p><p><b>(5)</b> Las Partes Contratantes informarán conjuntamente <mark class=\"m-resp\">al Consejo de la Unión Europea y a la Comisión Europea</mark> con carácter periódico acerca de los avances en la cooperación.</p>", false)
  + articuloResp("Artículos 2 a 7 — Perfiles de ADN", ["ficheros nacionales de análisis del ADN","índices de referencia: perfiles de la parte NO codificante y una referencia","consulta solo para casos concretos","comparación de huellas abiertas de mutuo acuerdo y por los puntos de contacto, automatizada","otros datos: derecho interno de la Parte requerida","un punto de contacto nacional","orden o declaración de investigación"], "<p><b>2.1.</b> Las Partes Contratantes se comprometen a crear y mantener <mark class=\"m-resp\">ficheros nacionales de análisis del ADN</mark> para los fines de la persecución de los delitos. (…)</p><p><b>2.2.</b> (…) Dichos <mark class=\"m-destacable\">índices de referencia</mark> contendrán exclusivamente <mark class=\"m-resp\">perfiles de ADN obtenidos a partir de la parte no codificante del ADN y una referencia</mark>. Los índices de referencia <u class=\"m-clave\">no</u> podrán contener datos que permitan identificar directamente a la persona concernida. Los índices de referencia que no puedan atribuirse a ninguna persona (<mark class=\"m-personalizado\">huellas abiertas</mark>) deberán poder reconocerse como tales.</p><p><b>3.1.</b> Las Partes Contratantes permitirán que los puntos de contacto nacionales de las demás Partes Contratantes (…) tengan acceso, para los fines de la persecución de delitos, a los índices de referencia de sus ficheros de análisis del ADN, lo que incluirá el derecho a consultarlos de manera automatizada (…). La consulta deberá formularse <mark class=\"m-resp\">únicamente para casos concretos</mark> y con arreglo al derecho de la Parte Contratante que realice la consulta.</p><p><b>3.2.</b> Si (…) se comprueba la coincidencia (…), el punto de contacto nacional requirente recibirá de forma automatizada información sobre la existencia de una concordancia y su referencia. Si no se encuentra coincidencia alguna, este hecho se comunicará de forma automatizada.</p><p><b>4.1.</b> Las Partes Contratantes llevarán a cabo,   + articuloResp("Artículos 8, 9 y 12 — Datos dactiloscópicos y registros de vehículos · R28", ["índices: exclusivamente datos dactiloscópicos y una referencia","conexión definitiva: el punto de contacto que consulta","vehículos: número completo de identificación o matrícula completa"], "<p><b>8.</b> (…) Los índices de referencia contendrán exclusivamente <mark class=\"m-resp\">datos dactiloscópicos y una referencia</mark>. (…)</p><p><b>9.2.</b> La conexión definitiva de un dato dactiloscópico con un índice de referencia de la Parte Contratante que mantenga el fichero se efectuará por <mark class=\"m-resp\">el punto de contacto nacional que realice la consulta</mark> (…).</p><p><b>12.1.</b> (…) tengan acceso a los siguientes datos contenidos en los registros nacionales de vehículos (…): 1. datos de los propietarios o usuarios y 2. datos de los vehículos. La consulta solo podrá efectuarse utilizando <mark class=\"m-resp\">un número completo de identificación de un vehículo o una matrícula completa</mark>. (…)</p>", false)
  + articuloResp("Artículos 13, 14 y 16 — Grandes eventos y prevención de atentados terroristas", ["grandes eventos: información de carácter NO personal","datos personales si condenas firmes u otras circunstancias justifican la presunción","supresión máximo en un año","terrorismo: sin petición previa, en casos concretos","nombre, apellidos, fecha y lugar de nacimiento y descripción de los hechos","la autoridad transmitente puede fijar condiciones"], "<p><b>13.</b> Para los fines de la prevención de los delitos y la prevención de amenazas para la seguridad y el orden públicos en relación con <mark class=\"m-destacable\">grandes eventos de alcance transfronterizo</mark>, en particular en el ámbito del deporte o de las reuniones del Consejo Europeo, las Partes Contratantes se transmitirán mutuamente (…) <mark class=\"m-resp\">informaciones de carácter no personal</mark> (…).</p><p><b>14.1.</b> (…) las Partes Contratantes se transmitirán mutuamente (…) datos relativos a personas, <mark class=\"m-resp\">cuando la existencia de condenas firmes o de otras circunstancias justifiquen la presunción de que estas personas van a cometer un delito con motivo del evento o suponen una amenaza para la seguridad y el orden públicos</mark> (…).</p><p><b>14.2.</b> (…) En todo caso, los datos deberán suprimirse transcurrido como máximo <mark class=\"m-plazo\">un año</mark>.</p><p><b>16.1.</b> Con objeto de prevenir <mark class=\"m-destacable\">atentados terroristas</mark>, las Partes Contratantes podrán transmitir a los puntos de contacto nacionales de las demás Partes Contratantes (…), <mark class=\"m-resp\">con arreglo al derecho interno, en casos concretos, sin necesidad de petición previa</mark>, los datos de carácter personal (…).</p><p><b>16.2.</b> Los datos e informaciones que se transmitirán comprenderán <mark class=\"m-resp\">el nombre, apellidos, fecha y lugar de nacimiento, así como la descripción de los hechos que justifican la presunción</mark> (…).</p><p><b>16.4.</b> <mark
