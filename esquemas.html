// ---- LECTOR DE VOZ (Web Speech API) ----
(function(){
  const bar = document.getElementById('voz-bar');
  if(!('speechSynthesis' in window)){ bar.remove(); return; }
  const synth = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  let cola = [], pos = 0, estado = 'parado', marcado = null, token = 0;

  function cargarVoces(){
    const sel = $('voz-voz');
    const voces = synth.getVoices().filter(v => /^es/i.test(v.lang));
    if(!voces.length) return;
    const prev = sel.value;
    sel.innerHTML = voces.map(v => `<option value="${v.name}">${v.name.replace(/Microsoft |Google /,'')} (${v.lang})</option>`).join('');
    let guardada = ''; try{ guardada = localStorage.getItem('esquemas-voz') || ''; }catch(e){}
    const elegida = [prev, guardada].find(n => n && voces.some(v => v.name === n)) || (voces.find(v => /es-ES/i.test(v.lang)) || voces[0]).name;
    sel.value = elegida;
  }
  cargarVoces();
  synth.onvoiceschanged = cargarVoces;

  // Trocea un texto largo en trozos de <= 110 caracteres (los móviles fallan o cortan con locuciones largas)
  function trocear(t){
    const MAX = 110, out = [];
    (t.match(/.+?(?:[.;:!?]+(?=s|$)|$)s*/g) || [t]).forEach(f => {
      f = f.trim();
      while(f.length > MAX){
        let cut = f.lastIndexOf(',', MAX); if(cut < 40) cut = f.lastIndexOf(' ', MAX); if(cut < 1) cut = MAX;
        out.push(f.slice(0, cut + 1).trim()); f = f.slice(cut + 1).trim();
      }
      if(f) out.push(f);
    });
    // junta trozos muy cortos con el siguiente
    const res = [];
    out.forEach(c => { if(res.length && res[res.length-1].length + c.length < 90) res[res.length-1] += ' ' + c; else res.push(c); });
    return res;
  }
  function limpiar(t){
    return t.replace(/⚠|🎯|✔|→|•/g,' ').replace(/\bEX\b/g,'').replace(/\barts\.\s*/gi,'artículos ').replace(/\bart\.\s*/gi,'artículo ').replace(/\s+/g,' ').trim();
  }
  function construirCola(){
    const act = document.querySelector('.esquema.active');
    cola = []; pos = 0;
    if(!act) return;
    const resumen = $('voz-modo').value === 'resumen';
    const sel = resumen
      ? '.esquema-head h2, .articulo-head, .resp-strip, .trampa, .recuerda li'
      : '.esquema-head h2, .bloque-titulo, .articulo-head, .resp-strip, .txt, .trampa, .recuerda li';
    act.querySelectorAll(sel).forEach(el => {
      let bloques = [el];
      if(el.classList.contains('txt')){
        const ps = Array.from(el.querySelectorAll('p,li')).filter(n => !n.querySelector('p,li'));
        if(ps.length) bloques = ps;
      }
      bloques.forEach(b => {
        const texto = limpiar(b.innerText || b.textContent);
        if(texto.length < 2) return;
        trocear(texto).forEach(c => cola.push({texto:c, el:b}));
      });
    });
  }
  function marcar(el){
    if(marcado) marcado.classList.remove('leyendo');
    marcado = el;
    if(el){ el.classList.add('leyendo'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
  }
  function hablar(){
    if(pos >= cola.length){ parar(); return; }
    const mi = ++token;
    const u = new SpeechSynthesisUtterance(cola[pos].texto);
    const v = synth.getVoices().find(x => x.name === $('voz-voz').value);
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'es-ES';
    u.rate = parseFloat($('voz-vel').value) || 1;
    u.onend = () => { if(mi !== token || estado !== 'leyendo') return; pos++; hablar(); };
    u.onerror = e => { if(mi !== token) return; if(e.error === 'interrupted' || e.error === 'canceled') return; $('voz-info').textContent = 'Error de voz: ' + e.error; pos++; hablar(); };
    marcar(cola[pos].el);
    $('voz-info').textContent = `Fragmento ${pos+1} de ${cola.length}`;
    synth.speak(u);
  }
  function actualizarBoton(){ $('voz-play').textContent = estado === 'leyendo' ? '⏸' : '▶'; }
  function reproducir(){
    if(estado === 'pausado'){ estado = 'leyendo'; synth.resume(); actualizarBoton(); return; }
    synth.cancel(); construirCola(); if(!cola.length) return;
    estado = 'leyendo'; actualizarBoton(); hablar();
  }
  function pausar(){ estado = 'pausado'; synth.pause(); actualizarBoton(); }
  function parar(){
    estado = 'parado'; token++; synth.cancel(); marcar(null);
    $('voz-info').textContent = ''; actualizarBoton();
  }
  function saltar(d){
    if(estado === 'parado'){ reproducir(); return; }
    let i = pos; const el = cola[pos] && cola[pos].el;
    if(d > 0){ while(i < cola.length && cola[i].el === el) i++; }
    else { i = Math.max(0, pos - 1); const e2 = cola[i].el; while(i > 0 && cola[i-1].el === e2) i--; }
    pos = Math.min(Math.max(i, 0), cola.length - 1);
    token++; synth.cancel(); estado = 'leyendo'; actualizarBoton(); hablar();
  }
  function reiniciarSiLeyendo(){
    if(estado === 'parado') return;
    token++; synth.cancel(); construirCola();
    if(cola.length){ estado = 'leyendo'; actualizarBoton(); hablar(); }
  }

  $('voz-play').onclick = () => estado === 'leyendo' ? pausar() : reproducir();
  $('voz-stop').onclick = parar;
  $('voz-sig').onclick = () => saltar(1);
  $('voz-ant').onclick = () => saltar(-1);
  $('voz-vel').onchange = () => { if(estado === 'leyendo'){ token++; synth.cancel(); hablar(); } };
  $('voz-voz').onchange = () => { try{ localStorage.setItem('esquemas-voz', $('voz-voz').value); }catch(e){} if(estado === 'leyendo'){ token++; synth.cancel(); hablar(); } };
  $('voz-modo').onchange = reiniciarSiLeyendo;

  // Al cambiar de tema o volver al listado, se detiene la lectura
  document.getElementById('btn-volver').addEventListener('click', parar);
  document.getElementById('nav-temas').addEventListener('click', parar);
  window.addEventListener('beforeunload', () => synth.cancel());

  // Controles de pantalla de bloqueo / volante (si el navegador lo permite)
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play', reproducir);
      navigator.mediaSession.setActionHandler('pause', pausar);
      navigator.mediaSession.setActionHandler('nexttrack', () => saltar(1));
      navigator.mediaSession.setActionHandler('previoustrack', () => saltar(-1));
    }catch(e){}
  }
})();
</script>
