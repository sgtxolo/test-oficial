<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Esquemas de Estudio</title>
<meta name="theme-color" content="#1c4d3c">
<style>
:root{
  --fondo:#f5f4ee;
  --panel:#ffffff;
  --panel-alt:#eeece3;
  --texto:#1f2a24;
  --texto-gris:#767a70;
  --borde:#e2e0d5;
  --verde-osc:#163f30;
  --verde:#1c4d3c;
  --verde-med:#2f6b52;
  --verde-suave:#e7efe8;
  --examen-bg:#fff4d6;
  --examen-borde:#e0a800;
  --examen-txt:#7a5b00;
  --radio:18px;
  --radio-sm:12px;
  font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
[data-theme="dark"]{
  --fondo:#141917;
  --panel:#1e2523;
  --panel-alt:#262f2b;
  --texto:#eef1ee;
  --texto-gris:#9aa39c;
  --borde:#333d37;
  --verde-osc:#7fd9ac;
  --verde:#3f8a68;
  --verde-med:#57a683;
  --verde-suave:#16332a;
  --examen-bg:#3a2f12;
  --examen-borde:#e0a800;
  --examen-txt:#f0c95a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body,html{margin:0;padding:0;background:var(--fondo);color:var(--texto)}
#app{max-width:820px;margin:0 auto;min-height:100vh;padding:18px 18px 60px}
h1,h2,h3{margin:0;color:var(--verde-osc);font-family:Georgia,'Times New Roman',serif}
p{margin:0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;position:sticky;top:0;background:var(--fondo);padding:10px 0;z-index:10}
.topbar h1{font-size:22px}
.theme-toggle{display:flex;background:var(--panel-alt);border-radius:20px;padding:4px;gap:2px}
.theme-btn{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--texto-gris);cursor:pointer;font-family:inherit}
.theme-btn.active{background:var(--panel);color:var(--verde-osc)}

.layout{display:flex;gap:20px;align-items:flex-start}
.sidebar{width:220px;flex:none;background:var(--panel);border-radius:var(--radio);padding:14px;position:sticky;top:78px}
.sidebar h3{font-size:12px;letter-spacing:1px;color:var(--texto-gris);text-transform:uppercase;margin-bottom:10px}
.tema-nav-item{display:block;padding:10px 12px;border-radius:var(--radio-sm);font-size:14px;font-weight:600;color:var(--texto);cursor:pointer;margin-bottom:4px}
.tema-nav-item:hover{background:var(--panel-alt)}
.tema-nav-item.active{background:var(--verde-suave);color:var(--verde-osc)}

.content{flex:1;min-width:0}
.esquema{background:var(--panel);border-radius:var(--radio);padding:24px;margin-bottom:18px;display:none}
.esquema.active{display:block}
.esquema-head{margin-bottom:16px;border-bottom:1px solid var(--borde);padding-bottom:14px}
.esquema-head .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--texto-gris);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.esquema-head h2{font-size:24px}

.bloque{margin-bottom:18px}
.bloque h3{font-size:16px;color:var(--verde-med);margin-bottom:8px}
.bloque ul{margin:0;padding-left:20px}
.bloque li{font-size:14.5px;line-height:1.6;color:var(--texto);margin-bottom:6px}

.placeholder{text-align:center;color:var(--texto-gris);padding:60px 20px;font-size:14.5px}

/* ---- Método Prefortia: leyenda de colores ---- */
.leyenda{display:flex;flex-wrap:wrap;gap:14px;background:var(--panel-alt);border-radius:var(--radio-sm);padding:10px 14px;margin-bottom:18px}
.leyenda span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--texto)}
.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.leyenda i.lc-destacable{background:#f7c9a8}
.leyenda i.lc-autoridad{background:#bfe3c4}
.leyenda i.lc-plazo{background:#a9d3ea}
.leyenda i.lc-accion{background:#c9b7e0}
.leyenda i.lc-personalizado{background:#f7e79a}
.leyenda i.lc-clave{background:none;border-bottom:3px solid #d1332a;border-radius:0;width:16px}

/* ---- Marcado inline por categorías (subrayados de color) ---- */
mark.m-destacable{background:#f7c9a8;color:#3a2213;padding:1px 3px;border-radius:3px}
mark.m-autoridad{background:#bfe3c4;color:#173a1e;padding:1px 3px;border-radius:3px}
mark.m-plazo{background:#a9d3ea;color:#0f2c3d;padding:1px 3px;border-radius:3px}
mark.m-accion{background:#c9b7e0;color:#2c1c40;padding:1px 3px;border-radius:3px}
mark.m-personalizado{background:#f7e79a;color:#463a04;padding:1px 3px;border-radius:3px}
u.m-clave{text-decoration:underline;text-decoration-color:#d1332a;text-decoration-thickness:2px;text-underline-offset:2px}
[data-theme="dark"] mark.m-destacable{background:#6b3d1f;color:#ffd9b8}
[data-theme="dark"] mark.m-autoridad{background:#265331;color:#c9f0cf}
[data-theme="dark"] mark.m-plazo{background:#1f4a63;color:#c8e9fb}
[data-theme="dark"] mark.m-accion{background:#4a3768;color:#e6d9fa}
[data-theme="dark"] mark.m-personalizado{background:#5a4a12;color:#fff0b0}

/* ---- Título de artículo ---- */
.articulo{margin-bottom:16px;border:1px solid var(--borde);border-radius:var(--radio-sm);overflow:hidden}
.articulo-head{background:var(--panel-alt);padding:8px 14px;font-weight:800;font-size:14px;color:var(--verde-osc)}
.articulo-body{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.articulo-body .txt{flex:1;font-size:14px;line-height:1.7}
.articulo-body .txt p{margin-bottom:6px}
.sello-examen{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid #d1332a;color:#d1332a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;transform:rotate(-8deg)}
.margen-nota{font-size:11px;color:var(--verde-med);font-weight:700;line-height:1.4;text-align:right;max-width:150px;border-left:2px dashed var(--borde);padding-left:8px;flex:none}

.bloque-titulo{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:#555;color:#fff;padding:6px 12px;border-radius:8px;margin:22px 0 12px}
[data-theme="dark"] .bloque-titulo{background:#3a4640}

.trampa{background:var(--examen-bg);border:1.5px dashed var(--examen-borde);border-radius:var(--radio-sm);padding:12px 16px;margin:14px 0}
.trampa b{color:var(--examen-txt);display:block;margin-bottom:4px;font-size:13.5px}
.trampa p{font-size:13.5px;line-height:1.5;color:var(--examen-txt)}

.recuerda{background:var(--verde-suave);border:1.5px solid var(--verde-med);border-radius:var(--radio-sm);padding:14px 18px;margin-top:20px}
.recuerda b.titulo-recuerda{display:block;color:var(--verde-osc);font-size:15px;margin-bottom:8px}
.recuerda ul{margin:0;padding-left:18px}
.recuerda li{font-size:13.5px;line-height:1.6;color:var(--texto);margin-bottom:5px}

.btn-pdf{display:flex;align-items:center;gap:6px;border:1.5px solid var(--verde-med);background:transparent;color:var(--verde-med);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-pdf:hover{background:var(--verde-suave)}

@media (max-width:720px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}
  .sidebar h3{width:100%}
  .tema-nav-item{margin-bottom:0}
  .topbar{flex-wrap:wrap}
}

@media print{
  body,html{background:#fff}
  .topbar,.sidebar,.btn-pdf{display:none!important}
  .layout{display:block}
  .content{width:100%}
  .esquema{display:none!important;box-shadow:none;border-radius:0;padding:0}
  .esquema.active{display:block!important}
  .examen{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>📚 Esquemas de Estudio</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-pdf" id="btn-exportar-pdf">⬇️ PDF</button>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme-btn="light">Claro</button>
        <button class="theme-btn" data-theme-btn="dark">Oscuro</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="nav-temas">
      <h3>Temas</h3>
      <!-- Los temas se listan aquí automáticamente -->
    </div>

    <div class="content" id="lista-esquemas">
      <!-- Los esquemas se insertan aquí -->
    </div>
  </div>
</div>

<script>
// ---- ESQUEMAS ----
// Cada esquema es un objeto: { id, tema, titulo, bloques: [{ titulo, puntos: [{texto, examen:true/false}] }] }
// Los 27 temas del programa (Materias Profesionales) están precargados como pendientes.
// Se van rellenando uno a uno con los artículos/puntos que se vayan indicando.
const temasPrograma = [
  "TEMA 1.- DERECHOS HUMANOS",
  "TEMA 2.- TERRORISMO Y DELINCUENCIA TRANSNACIONAL",
  "TEMA 3.- TRATADOS DE LA UNIÓN EUROPEA",
  "TEMA 4.- LA GESTIÓN DE LAS FRONTERAS DE LA UNIÓN EUROPEA",
  "TEMA 5.- BASES DE DATOS EUROPEAS",
  "TEMA 6.- ENTRADA Y PERMANENCIA DE EXTRANJEROS EN ESPAÑA",
  "TEMA 7.- DERECHOS Y DEBERES FUNDAMENTALES EN LA CE Y SU PROTECCIÓN",
  "TEMA 8.- PODER JUDICIAL",
  "TEMA 9.- DEFENSA NACIONAL",
  "TEMA 10.- DERECHO CIVIL",
  "TEMA 11.- DERECHO ADMINISTRATIVO",
  "TEMA 12.- GOBIERNO Y ADMINISTRACIÓN",
  "TEMA 13.- JURISDICCIÓN CONTENCIOSO-ADMINISTRATIVA",
  "TEMA 14.- EL DEFENSOR DEL PUEBLO",
  "TEMA 15.- PROTECCIÓN INTEGRAL CONTRA LA VIOLENCIA DE GÉNERO",
  "TEMA 16.- IGUALDAD EFECTIVA Y ACOSO SEXUAL/POR RAZÓN DE SEXO",
  "TEMA 17.- RESPONSABILIDAD PENAL DE LOS MENORES",
  "TEMA 18.- DERECHO PENAL. PARTE GENERAL",
  "TEMA 19.- DERECHO PENAL. PARTE ESPECIAL",
  "TEMA 20.- DERECHO PROCESAL PENAL (I)",
  "TEMA 21.- DERECHO PROCESAL PENAL (II) - NORMAS COMPLEMENTARIAS",
  "TEMA 22.- SEGURIDAD CIUDADANA",
  "TEMA 23.- SEGURIDAD PRIVADA",
  "TEMA 24.- ESTRUCTURAS ORGÁNICAS BÁSICAS",
  "TEMA 25.- COORDINACIÓN Y COOPERACIÓN POLICIAL",
  "TEMA 26.- ESTATUTO DEL PERSONAL DE LA GUARDIA CIVIL",
  "TEMA 27.- DEONTOLOGÍA PROFESIONAL"
];

// Helpers para construir el HTML de un esquema con el estilo Método Prefortia
function leyenda(){
  return `<div class="leyenda">
    <span><i class="lc-destacable"></i>Palabras destacables</span>
    <span><i class="lc-autoridad"></i>Autoridades y cargos públicos</span>
    <span><i class="lc-plazo"></i>Plazos</span>
    <span><i class="lc-accion"></i>Acciones</span>
    <span><i class="lc-personalizado"></i>Personalizado</span>
    <span><i class="lc-clave"></i>Palabras clave</span>
  </div>`;
}
function bloqueTitulo(t){ return `<div class="bloque-titulo">${t}</div>`; }
function articulo(cab, html, examen){
  return `<div class="articulo">
    <div class="articulo-head">${cab}</div>
    <div class="articulo-body">
      <div class="txt">${html}</div>
      ${examen ? '<div class="sello-examen">EX</div>' : ''}
    </div>
  </div>`;
}
function trampa(titulo, html){
  return `<div class="trampa"><b>⚠ ${titulo || 'Trampa de examen'}</b><p>${html}</p></div>`;
}
function recuerda(items){
  return `<div class="recuerda"><b class="titulo-recuerda">✔ RECUERDA — Resumen conceptual y puntos clave de examen</b>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
  </div>`;
}

// Datos base: cada esquema tiene un campo `html` con el contenido ya maquetado.
const esquemas = temasPrograma.map((tema, i) => ({
  id: "tema-" + (i + 1),
  tema: tema,
  titulo: "Pendiente de rellenar",
  html: leyenda() + `<div class="placeholder">Dicta los artículos y puntos de este tema para generar el esquema rápido en el estilo Método Prefortia.</div>`
}));

// ---- TEMA 7 (relleno con los artículos y puntos dictados, texto legal real) ----
(function(){
  const t7 = esquemas[6];
  t7.titulo = "7.1 y 7.2 — Resumen esquemático";
  t7.html = leyenda()

    + bloqueTitulo("LEY ORGÁNICA 2/1979, DEL TRIBUNAL CONSTITUCIONAL — TÍTULO I, CAPÍTULO I: Organización y atribuciones")

    + articulo("Artículo 2 — Competencias del Tribunal Constitucional", `
      <p><b>1.</b> <mark class="m-accion">El Tribunal Constitucional conocerá</mark> en los casos y en la forma que esta Ley determina:</p>
      <p>a) Del recurso y de la cuestión de <mark class="m-destacable">inconstitucionalidad</mark> contra Leyes, disposiciones normativas o actos con fuerza de Ley.</p>
      <p><mark class="m-personalizado">b) Del recurso de amparo</mark> por violación de los derechos y libertades públicos relacionados en el art. 53.2 CE (protección de los derechos y libertades fundamentales).</p>
      <p>c) De los <mark class="m-destacable">conflictos constitucionales de competencia</mark> entre el Estado y las CC.AA. o de los de éstas entre sí.</p>
      <p>d) De los conflictos entre los <mark class="m-destacable">órganos constitucionales</mark> del Estado. d bis) De los conflictos en defensa de la autonomía local.</p>
      <p>e) De la declaración sobre la <mark class="m-destacable">constitucionalidad de los tratados internacionales</mark>. e bis) Del control previo de inconstitucionalidad del art. 79 LOTC (control previo de Tratados internacionales).</p>
      <p>f) De las impugnaciones previstas en el art. 161.2 CE (suspensión de disposiciones y resoluciones de las CC.AA. impugnadas por el Gobierno).</p>
      <p><mark class="m-personalizado">g) De la verificación de los nombramientos de los Magistrados</mark> del Tribunal Constitucional, para juzgar si reúnen los requisitos exigidos por la Constitución y esta Ley.</p>
      <p>h) De las demás materias que le atribuyen la Constitución y las Leyes orgánicas.</p>
      <p><b>2.</b> El TC <mark class="m-accion">podrá dictar</mark> <mark class="m-destacable">reglamentos</mark> sobre su propio funcionamiento y organización, así como sobre el régimen de su personal y servicios. Estos reglamentos deberán ser aprobados por el Tribunal en <mark class="m-autoridad">Pleno</mark> y se publicarán en el BOE, autorizados por su <mark class="m-autoridad">Presidente</mark>.</p>
    `)

    + articulo("Artículo 3 — Competencia sobre cuestiones prejudiciales", `
      <p><mark class="m-destacable">La competencia</mark> del <mark class="m-autoridad">Tribunal Constitucional</mark> se extiende al <mark class="m-accion">conocimiento y decisión</mark> de las cuestiones prejudiciales e incidentales <u class="m-clave">no</u> pertenecientes al orden constitucional, directamente relacionadas con la materia de que conoce, a los solos efectos del <mark class="m-personalizado">enjuiciamiento constitucional</mark> de ésta.</p>
    `)

    + articulo("Artículo 4.1, 4.2 y 4.3 — Delimitación de jurisdicción", `
      <p><b>1.</b> En <u class="m-clave">ningún caso</u> se podrá promover cuestión de jurisdicción o competencia al TC. El TC <mark class="m-accion">delimitará</mark> el ámbito de su jurisdicción y adoptará cuantas medidas sean necesarias para preservarla, incluyendo la declaración de nulidad de aquellos actos o resoluciones que la menoscaben; asimismo podrá apreciar de oficio o a instancia de parte su competencia o incompetencia.</p>
      <p><b>2.</b> Las resoluciones del TC <u class="m-clave">no podrán ser enjuiciadas</u> por ningún órgano jurisdiccional del Estado.</p>
      <p><b>3.</b> Cuando el TC <mark class="m-accion">anule</mark> un acto o resolución que contravenga lo anterior, lo hará <mark class="m-destacable">motivadamente</mark> y previa audiencia al <mark class="m-autoridad">Ministerio Fiscal</mark> y al órgano autor del acto o resolución.</p>
    `)

    + articulo("Artículo 5 — Composición del Tribunal", `
      <p>El Tribunal Constitucional <mark class="m-accion">está integrado</mark> por <mark class="m-plazo">doce</mark> miembros, con el título de <mark class="m-autoridad">Magistrados del Tribunal Constitucional</mark>.</p>
    `)

    + articulo("Artículo 6.2 — El Pleno", `
      <p><b>2.</b> El <mark class="m-autoridad">Pleno</mark> <mark class="m-accion">está integrado</mark> por todos los Magistrados del Tribunal. Lo preside el <mark class="m-autoridad">Presidente</mark> del Tribunal y, en su defecto, el <mark class="m-autoridad">Vicepresidente</mark> y, a falta de ambos, el Magistrado más antiguo en el cargo y, en caso de igual antigüedad, el de mayor edad.</p>
    `)

    + articulo("Artículo 7.1, 7.2 y 7.3 — Las Salas", `
      <p><b>1.</b> El TC consta de <mark class="m-plazo">dos Salas</mark>. Cada Sala está compuesta por <mark class="m-plazo">seis Magistrados</mark> nombrados por el Tribunal en Pleno.</p>
      <p><b>2.</b> El <mark class="m-autoridad">Presidente</mark> del Tribunal lo es también de la <mark class="m-destacable">Sala Primera</mark>, que presidirá; en su defecto, el Magistrado más antiguo y, en caso de igual antigüedad, el de mayor edad.</p>
      <p><b>3.</b> El <mark class="m-autoridad">Vicepresidente</mark> del Tribunal presidirá la <mark class="m-destacable">Sala Segunda</mark> y, en su defecto, el Magistrado más antiguo y, en caso de igual antigüedad, el de mayor edad.</p>
    `)

    + articulo("Artículo 8.1, 8.2 y 8.3 — Las Secciones", `
      <p><b>1.</b> Para el despacho ordinario y la decisión o propuesta sobre admisibilidad de procesos constitucionales, el <mark class="m-autoridad">Pleno</mark> y las <mark class="m-autoridad">Salas</mark> constituirán <mark class="m-destacable">Secciones</mark> compuestas por el respectivo Presidente (o quien le sustituya) y <mark class="m-plazo">dos Magistrados</mark>.</p>
      <p><b>2.</b> Se dará cuenta al Pleno de las propuestas de admisión o inadmisión de asuntos de su competencia; en caso de admisión, el Pleno podrá <mark class="m-accion">deferir</mark> a la Sala que corresponda el conocimiento del asunto.</p>
      <p><b>3.</b> Podrá corresponder también a las Secciones el conocimiento y resolución de los asuntos de amparo que la Sala correspondiente les <mark class="m-accion">defiera</mark>.</p>
    `)

    + articulo("Artículo 11.1 y 11.2 — Competencia de las Salas", `
      <p><b>1.</b> Las <mark class="m-autoridad">Salas</mark> del Tribunal Constitucional <mark class="m-accion">conocerán</mark> de los asuntos que, atribuidos a la justicia constitucional, <u class="m-clave">no</u> sean competencia del Pleno.</p>
      <p><b>2.</b> También conocerán las Salas de aquellas cuestiones que, habiendo sido atribuidas a las Secciones, entiendan que por su importancia deba resolver la propia Sala.</p>
    `)

    + articulo("Artículo 9.1, 9.2, 9.3 y 9.4 — Elección de Presidente y Vicepresidente", `
      <p><b>1.</b> El Tribunal en <mark class="m-autoridad">Pleno</mark> <mark class="m-accion">elige</mark> de entre sus miembros, por <mark class="m-destacable">votación secreta</mark>, a su Presidente y propone al Rey su nombramiento.</p>
      <p><b>2.</b> En primera votación se requerirá <mark class="m-destacable">mayoría absoluta</mark>. Si no se alcanza, segunda votación: elegido quien obtenga mayor número de votos. En caso de empate, última votación; si se repite, se propone al de mayor antigüedad en el cargo y, en igualdad, al de mayor edad.</p>
      <p><b>3.</b> El nombre del elegido se elevará al <mark class="m-autoridad">Rey</mark> para su nombramiento por un período de <mark class="m-plazo">tres años</mark>, expirado el cual podrá ser reelegido <u class="m-clave">por una sola vez</u>.</p>
      <p><b>4.</b> El Pleno elegirá entre sus miembros, por el mismo procedimiento y por el mismo período de <mark class="m-plazo">tres años</mark>, un <mark class="m-autoridad">Vicepresidente</mark>, al que incumbe sustituir al Presidente (vacante, ausencia u otro motivo legal) y presidir la Sala Segunda.</p>
    `)

    + articulo("Artículo 10 — Competencias del Pleno", `
      <p><b>1.</b> El Tribunal en Pleno conoce de los siguientes asuntos (mención importante):</p>
      <p><mark class="m-personalizado">b) De los recursos de inconstitucionalidad</mark> contra las leyes y demás disposiciones con valor de ley, excepto los de mera aplicación de doctrina (atribuibles a las Salas en el trámite de admisión).</p>
      <p><mark class="m-personalizado">c) De las cuestiones de constitucionalidad</mark> que reserve para sí; las demás deberán deferirse a las Salas según un turno objetivo.</p>
      <p><mark class="m-personalizado">d) De los conflictos constitucionales de competencia</mark> entre el Estado y las CC.AA. o de los de éstas entre sí.</p>
      <p><mark class="m-personalizado">f) De los conflictos en defensa de la autonomía local</mark>.</p>
      <p><mark class="m-personalizado">n) De cualquier otro asunto</mark> que sea competencia del Tribunal pero recabe para sí el Pleno, a propuesta del Presidente o de tres Magistrados, así como de los demás asuntos que le puedan ser atribuidos expresamente por una ley orgánica.</p>
    `)

    + articulo("Artículo 10.3 — Presupuesto del Tribunal", `
      <p><b>3.</b> El Tribunal en Pleno, en ejercicio de su <mark class="m-destacable">autonomía como órgano constitucional</mark>, <mark class="m-accion">elabora</mark> su <mark class="m-destacable">presupuesto</mark>, que se integra como una sección independiente dentro de los Presupuestos Generales del Estado.</p>
    `)

      <p>La <mark class="m-destacable">distribución de asuntos</mark> entre las Salas del Tribunal <mark class="m-accion">se efectuará</mark> según un <u class="m-clave">turno establecido por el Pleno</u> a propuesta de su Presidente.</p>

      <p><b>1.</b> Mediante estos procedimientos, el TC <mark class="m-accion">garantiza</mark> la <mark class="m-destacable">primacía de la Constitución</mark> y enjuicia la conformidad o disconformidad con ella de las Leyes, disposiciones o actos impugnados.</p>
      <p><b>2.</b> Son susceptibles de declaración de inconstitucionalidad: a) los <mark class="m-destacable">Estatutos de Autonomía</mark> y demás Leyes orgánicas; b) las demás Leyes, disposiciones normativas y actos del Estado con fuerza de Ley; c) los <mark class="m-destacable">Tratados Internacionales</mark>; d) los Reglamentos de las Cámaras y de las Cortes Generales; e) las Leyes, actos y disposiciones con fuerza de ley de las CC.AA.; f) los Reglamentos de las Asambleas legislativas de las CC.AA.</p>

      <p><b>1.</b> La declaración de inconstitucionalidad podrá <mark class="m-accion">promoverse</mark> mediante: a) el <mark class="m-destacable">recurso de inconstitucionalidad</mark>; b) la <mark class="m-destacable">cuestión de inconstitucionalidad</mark> promovida por Jueces o Tribunales.</p>
      <p><b>2.</b> La desestimación, por razones de forma, de un recurso de inconstitucionalidad <u class="m-clave">no será obstáculo</u> para que la misma Ley, disposición o acto puedan ser objeto de una cuestión de inconstitucionalidad con ocasión de su aplicación en otro proceso.</p>

      <p><b>2.</b> Contra Leyes, disposiciones o actos con fuerza de Ley del Estado que puedan <mark class="m-destacable">afectar a su propio ámbito de autonomía</mark>, están también <mark class="m-accion">legitimados</mark> los órganos colegiados ejecutivos y las Asambleas de las CC.AA., previo acuerdo adoptado al efecto.</p>

      <p><b>1.</b> El recurso se formulará dentro del plazo de <mark class="m-plazo">tres meses</mark> a partir de la publicación de la Ley, disposición o acto con fuerza de Ley impugnado, mediante demanda ante el TC.</p>
      <p><b>2.</b> No obstante, el Presidente del Gobierno y los órganos colegiados ejecutivos de las CC.AA. podrán interponer el recurso en el plazo de <mark class="m-plazo">nueve meses</mark> si concurren: a) reunión de la Comisión Bilateral de Cooperación; b) acuerdo de iniciación de negociaciones dentro de dicha Comisión; c) comunicación del acuerdo al TC dentro de los <mark class="m-plazo">tres meses</mark> siguientes a la publicación, insertándose en el BOE y en el Diario Oficial de la CC.AA.</p>

      <p><b>2.</b> Solo podrá plantearla una vez concluso el procedimiento y dentro del plazo para dictar sentencia. Debe concretar la norma, el precepto infringido y justificar la dependencia del fallo. Antes de resolver, oirá a las partes y al Ministerio Fiscal en plazo común e improrrogable de <mark class="m-plazo">10 días</mark>; después, el juez resolverá en el plazo de <mark class="m-plazo">tres días</mark> mediante auto no susceptible de recurso.</p>
      <p><b>3.</b> El planteamiento de la cuestión originará la <mark class="m-accion">suspensión provisional</mark> de las actuaciones en el proceso judicial hasta que el TC se pronuncie sobre su admisión; producida ésta, el proceso permanecerá suspendido hasta que el TC resuelva definitivamente.</p>

      <p><b>1.</b> El Tribunal podrá rechazar en trámite de admisión, mediante auto y con audiencia solo del <mark class="m-autoridad">Fiscal General del Estado</mark>, la cuestión cuando falten condiciones procesales o sea notoriamente infundada.</p>
      <p><b>2.</b> Publicada en el BOE la admisión, quienes sean parte podrán personarse ante el TC dentro de los <mark class="m-plazo">15 días</mark> siguientes, para formular alegaciones en el plazo de otros <mark class="m-plazo">15 días</mark>.</p>
      <p><b>3.</b> El TC dará traslado al Congreso, Senado, Fiscal General del Estado, Gobierno y, en su caso, órganos de la CC.AA., que podrán personarse y alegar en plazo común improrrogable de <mark class="m-plazo">quince días</mark>. Concluido éste, el Tribunal dictará sentencia en el plazo de <mark class="m-plazo">quince días</mark>, salvo que estime necesario un plazo más amplio que no podrá exceder de <mark class="m-plazo">treinta días</mark>.</p>

    + articulo("Artículo 38.1, 38.2 y 38.3 — Efectos de la sentencia", `
      <p><b>1.</b> Las sentencias recaídas en procedimientos de inconstitucionalidad tendrán valor de <u class="m-clave">cosa juzgada</u>, vincularán a todos los Poderes Públicos y producirán efectos generales desde su <mark class="m-destacable">publicación en el BOE</mark>.</p>
      <p><b>2.</b> Las sentencias desestimatorias en recursos de inconstitucionalidad y conflictos en defensa de la autonomía local impedirán un planteamiento ulterior por cualquiera de las dos vías, fundado en la misma infracción de idéntico precepto.</p>
      <p><b>3.</b> En cuestiones de inconstitucionalidad, el TC lo comunicará de inmediato al órgano judicial competente, que notificará la sentencia a las partes. El Juez quedará vinculado desde que conozca la sentencia; las partes, desde que sean notificadas.</p>

      <p><b>1.</b> Los <mark class="m-destacable">derechos y libertades</mark> reconocidos en los arts. 14 a 29 CE serán susceptibles de amparo constitucional, sin perjuicio de su tutela general encomendada a los Tribunales de Justicia. Igual protección será aplicable a la <mark class="m-destacable">objeción de conciencia</mark> reconocida en el art. 30 CE.</p>

    + articulo("Artículo 43.1, 43.2 y 43.3 — Amparo frente al Gobierno y ejecutivos autonómicos", `

      <p><b>3.</b> El recurso solo podrá fundarse en la infracción, por una resolución firme, de los preceptos constitucionales que reconocen los derechos o libertades susceptibles de amparo.</p>

      <p><b>2.</b> Si el recurso se promueve por el Defensor del Pueblo o el Ministerio Fiscal, la Sala lo comunicará a los posibles agraviados conocidos y ordenará anunciar la interposición en el BOE, con carácter preferente.</p>

    + articulo("Artículo 49.1, 49.3 y 49.4 — Iniciación de la demanda de amparo", `

      <p><b>1.</b> La Sección, por <u class="m-clave">unanimidad</u>, acordará mediante providencia la admisión solo cuando concurran todos los requisitos: a) que la demanda cumpla lo dispuesto en los arts. 41 a 46 y 49; b) que el contenido justifique una decisión sobre el fondo por su <mark class="m-destacable">especial trascendencia constitucional</mark>.</p>
      <p><b>2.</b> Cuando la admisión, aun obteniendo mayoría, no alcance la unanimidad, la Sección trasladará la decisión a la Sala respectiva.</p>
      <p><b>3.</b> Las providencias de inadmisión especificarán el requisito incumplido y se notificarán al demandante y al Ministerio Fiscal. Solo podrán recurrirse en súplica por el Ministerio Fiscal en el plazo de <mark class="m-plazo">tres días</mark>, resolviéndose mediante auto no susceptible de impugnación.</p>

      <p><b>4.</b> Cuando en la demanda concurran defectos subsanables, se procederá conforme al art. 49.4 (plazo de 10 días para subsanar); de no producirse la subsanación, la Sección acordará la inadmisión mediante providencia, sin recurso posible.</p>

      <p><b>3.</b> La Sala, o en su caso la Sección, pronunciará la sentencia en el plazo de <mark class="m-plazo">10 días</mark> a partir del día señalado para la vista o deliberación.</p>

    + articulo("Artículo 56.1, 56.4 y 56.6 — Suspensión y medidas cautelares", `
      <p><b>1.</b> La interposición del recurso de amparo <u class="m-clave">no suspenderá</u> los efectos del acto o sentencia impugnados.</p>
      <p><b>4.</b> La suspensión u otra medida cautelar podrá pedirse en cualquier momento antes de la sentencia. El incidente se sustanciará con audiencia de las partes y del Ministerio Fiscal, por plazo común no superior a <mark class="m-plazo">tres días</mark>.</p>

    + articulo("Artículo 1.1, 1.2 y 1.3 — Objeto y naturaleza del derecho", `
      <p><b>1.</b> El derecho fundamental al <mark class="m-destacable">honor</mark>, a la <mark class="m-destacable">intimidad personal y familiar</mark> y a la <mark class="m-destacable">propia imagen</mark>, garantizado en el art. 18 CE, será protegido civilmente frente a todo género de intromisiones ilegítimas.</p>
      <p><b>2.</b> El carácter delictivo de la intromisión no impedirá el recurso al procedimiento de tutela judicial del art. 9 de esta Ley. En todo caso, serán aplicables los criterios de esta Ley para la responsabilidad civil derivada de delito.</p>
      <p><b>3.</b> Este derecho es <u class="m-clave">irrenunciable, inalienable e imprescriptible</u>. La renuncia a la protección será nula, sin perjuicio de los supuestos de autorización o consentimiento del art. 2.</p>
    `, true)

    + articulo("Artículo 2.1, 2.2 y 2.3 — Delimitación, autorización y consentimiento", `
      <p><b>1.</b> La protección civil del honor, de la intimidad y de la propia imagen quedará <mark class="m-accion">delimitada</mark> por las <mark class="m-destacable">leyes y los usos sociales</mark>, atendiendo al ámbito que, por sus propios actos, mantenga cada persona reservado para sí o su familia.</p>
      <p><b>2.</b> No se apreciará intromisión ilegítima cuando esté expresamente <mark class="m-destacable">autorizada por Ley</mark> o cuando el titular haya otorgado su <mark class="m-destacable">consentimiento expreso</mark>; tampoco cuando, por el art. 71 CE (inviolabilidad de Diputados y Senadores por sus opiniones en el ejercicio de sus funciones), se trate de opiniones de Diputados o Senadores en el ejercicio de sus funciones. Iniciado un proceso civil en aplicación de esta Ley, <u class="m-clave">no podrá seguirse</u> contra un Diputado o Senador sin la <mark class="m-destacable">previa autorización</mark> del Congreso o del Senado, tramitada por el procedimiento previsto para los <mark class="m-personalizado">suplicatorios</mark>.</p>
      <p><b>3.</b> El consentimiento será <mark class="m-accion">revocable</mark> en cualquier momento, pero habrán de indemnizarse los daños y perjuicios causados, incluidas las expectativas justificadas.</p>
    `)

    + articulo("Artículo 3.1 y 3.2 — Consentimiento de menores e incapaces", `
      <p><b>1.</b> El consentimiento de los menores e incapaces deberá prestarse por ellos mismos si sus <mark class="m-destacable">condiciones de madurez</mark> lo permiten, de acuerdo con la legislación civil.</p>
      <p><b>2.</b> En los demás casos, el consentimiento se otorgará por escrito por el <mark class="m-autoridad">representante legal</mark>, quien deberá ponerlo en conocimiento previo del <mark class="m-autoridad">Ministerio Fiscal</mark>. Si en el plazo de <mark class="m-plazo">ocho días</mark> el Fiscal se opusiere, resolverá el Juez.</p>

    + articulo("Artículo 4.1, 4.2, 4.3 y 4.4 — Legitimación tras el fallecimiento y víctimas de delito", `
      <p><b>1.</b> El ejercicio de las acciones de protección civil del honor, intimidad o imagen de una persona fallecida corresponde a quien ésta haya designado a tal efecto en su testamento. La designación puede recaer en una <mark class="m-destacable">persona jurídica</mark>.</p>
      <p><b>2.</b> No existiendo designación, estarán legitimados el <mark class="m-autoridad">cónyuge</mark>, los descendientes, ascendientes y hermanos de la persona afectada que viviesen al tiempo del fallecimiento.</p>
      <p><b>3.</b> A falta de todos ellos, corresponderá al <mark class="m-autoridad">Ministerio Fiscal</mark>, de oficio o a instancia de interesado, siempre que no hayan transcurrido más de <mark class="m-plazo">ochenta años</mark> desde el fallecimiento. Igual plazo si actúa una persona jurídica designada en testamento.</p>
      <p><b>4.</b> En los supuestos de intromisión ilegítima en los derechos de las <mark class="m-destacable">víctimas de un delito</mark> (art. 7.8 — utilización del delito por el condenado para notoriedad o provecho económico), estará legitimado el <mark class="m-autoridad">ofendido o perjudicado</mark> por el delito, haya o no ejercido la acción penal o civil, y en todo caso también el <mark class="m-autoridad">Ministerio Fiscal</mark>.</p>
    `, true)

    + bloqueTitulo("CAPÍTULO II. De la protección civil del honor, de la intimidad y de la propia imagen")

    + articulo("Artículo 7 — Intromisiones ilegítimas", `
      <p>Tendrán la consideración de <mark class="m-destacable">intromisiones ilegítimas</mark> en el ámbito del art. 2 de esta Ley:</p>
      <p>1. El emplazamiento de aparatos de escucha, filmación o dispositivos ópticos aptos para grabar la vida íntima. 2. La utilización de dichos aparatos para conocer la vida íntima, manifestaciones o cartas privadas, así como su grabación, registro o reproducción. 3. La <mark class="m-accion">divulgación</mark> de hechos de la vida privada que afecten a la <mark class="m-destacable">reputación y buen nombre</mark>, o la revelación de cartas, memorias o escritos íntimos. 4. La revelación de datos privados conocidos por actividad profesional u oficial. 5. La captación, reproducción o publicación de la imagen de una persona en su vida privada (salvo art. 8.2). 6. La <mark class="m-accion">utilización</mark> del nombre, voz o imagen con fines <mark class="m-destacable">publicitarios, comerciales</mark> o análogos. 7. La imputación de hechos o juicios de valor que lesionen la dignidad de otra persona. 8. La utilización del delito por el condenado en sentencia firme para notoriedad pública o provecho económico, o la divulgación de datos falsos que menoscaben la dignidad de las víctimas.</p>
    `, true)

    + articulo("Artículo 8.1 y 8.2 — Excepciones: intromisiones no ilegítimas", `
      <p><b>1.</b> No se reputarán, con carácter general, intromisiones ilegítimas las actuaciones autorizadas o acordadas por la <mark class="m-autoridad">Autoridad competente</mark> de acuerdo con la ley, ni cuando predomine un <mark class="m-destacable">interés histórico, científico o cultural</mark> relevante.</p>
      <p><b>2.</b> El derecho a la propia imagen no impedirá: a) su captación o publicación de personas con <mark class="m-destacable">cargo público o proyección pública</mark> captada en acto público o lugar abierto al público; b) la utilización de la caricatura según el uso social; c) información gráfica de un suceso público en que la persona aparezca de forma meramente accesoria. Estas excepciones no se aplican a quienes desempeñen funciones que requieran el <u class="m-clave">anonimato</u>.</p>
    `)

    + articulo("Artículo 9.1, 9.2, 9.3 y 9.5 — Tutela judicial e indemnización", `
      <p><b>1.</b> La tutela judicial frente a intromisiones ilegítimas podrá recabarse por las vías procesales ordinarias o por el procedimiento del art. 53.2 CE. También podrá acudirse al <mark class="m-destacable">recurso de amparo</mark> ante el TC.</p>
      <p><b>2.</b> La tutela judicial comprenderá: a) <mark class="m-accion">restablecimiento</mark> del perjudicado (declaración de la intromisión, cese inmediato, reposición; en el honor, incluye la publicación de la sentencia condenatoria); b) prevenir intromisiones inminentes o ulteriores; c) indemnización de daños y perjuicios; d) apropiación por el perjudicado del lucro obtenido con la intromisión.</p>
      <p><b>3.</b> La existencia de perjuicio <mark class="m-accion">se presumirá</mark> siempre que se acredite la intromisión ilegítima. La indemnización se extenderá al <mark class="m-destacable">daño moral</mark>, valorado según las circunstancias y la gravedad de la lesión.</p>
      <p><b>5.</b> Las acciones de protección frente a intromisiones ilegítimas <mark class="m-accion">caducarán</mark> transcurridos <mark class="m-plazo">cuatro años</mark> desde que el legitimado pudo ejercitarlas.</p>
    `)

    + recuerda([
      "LOTC: En ningún caso se podrá promover cuestión de jurisdicción o competencia al Tribunal Constitucional.",
      "LOTC: El TC está integrado por doce Magistrados.",
      "LOTC: El TC actúa en Pleno, Sala o Sección.",
      "LOTC: La distribución de asuntos entre Salas se hace según un turno establecido por el Pleno a propuesta de su Presidente.",
      "LOTC: Plazo del recurso de amparo del art. 43: veinte días siguientes a la notificación de la resolución judicial.",
      "LOTC: El conocimiento del amparo corresponde a las Salas y, en su caso, a las Secciones.",
      "LOTC: La sentencia de amparo pronuncia otorgamiento o denegación de amparo.",
      "LOTC: La interposición del amparo no suspende los efectos del acto o sentencia impugnados.",
      "LOTC: Las peticiones de indemnización se presentan dentro del plazo de un año a partir de la publicación de la sentencia del TC.",
      "LO 1/1982: El derecho al honor, intimidad y propia imagen es irrenunciable, inalienable e imprescriptible.",
      "LO 1/1982: El consentimiento de menores e incapaces se presta por ellos mismos si sus condiciones de madurez lo permiten.",
      "LO 1/1982: No son intromisiones ilegítimas las actuaciones autorizadas por Autoridad competente, ni cuando predomine un interés histórico, científico o cultural relevante.",
      "LO 1/1982: Se presume siempre la existencia de perjuicio cuando se acredita la intromisión ilegítima."
    ]);
})();

function render(){
  const nav = document.getElementById('nav-temas');
  const lista = document.getElementById('lista-esquemas');
  nav.innerHTML = '<h3>Temas</h3>';
  lista.innerHTML = '';

  if(!esquemas.length){
    lista.innerHTML = '<div class="placeholder">Todavía no hay esquemas. Dime el tema, los artículos o puntos y los voy añadiendo aquí.</div>';
    return;
  }

  esquemas.forEach((es, i) => {
    const navItem = document.createElement('div');
    navItem.className = 'tema-nav-item' + (i===0 ? ' active' : '');
    navItem.textContent = es.tema;
    navItem.onclick = () => mostrar(es.id);
    navItem.dataset.target = es.id;
    nav.appendChild(navItem);

    const div = document.createElement('div');
    div.className = 'esquema' + (i===0 ? ' active' : '');
    div.id = es.id;
    div.innerHTML = `
      <div class="esquema-head">
        <div class="eyebrow">${es.tema}</div>
        <h2>${es.titulo}</h2>
      </div>
      ${es.html}
    `;
    lista.appendChild(div);
  });
}

function mostrar(id){
  document.querySelectorAll('.esquema').forEach(e => e.classList.toggle('active', e.id === id));
  document.querySelectorAll('.tema-nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === id));
}

// ---- TEMA CLARO / OSCURO ----
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeBtn === t));
  try{ localStorage.setItem('esquemas-theme', t); }catch(e){}
}
document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));

let saved = 'light';
try{ saved = localStorage.getItem('esquemas-theme') || 'light'; }catch(e){}
setTheme(saved);

// ---- EXPORTAR A PDF ----
// Usa el diálogo de impresión del navegador (elegir "Guardar como PDF") solo sobre el esquema activo.
document.getElementById('btn-exportar-pdf').addEventListener('click', () => {
  window.print();
});

render();
</script>
</body>
</html>
