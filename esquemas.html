  + articuloResp("Artículo 12 — De la libertad provisional", ["se remite a la Corte a través del Ministerio de Justicia","plazo NO INFERIOR a veinte días","prisión provisional el tiempo estrictamente necesario","sin documentación: libertad hasta CIENTO OCHENTA DÍAS"], "<p><b>1.</b> <u class=\"m-clave\">Si</u> el detenido solicitara (…) su <mark class=\"m-destacable\">libertad provisional</mark>, el <mark class=\"m-autoridad\">Juez Central de Instrucción</mark> acordará <mark class=\"m-accion\">remitir</mark> dicha solicitud a la Corte, <mark class=\"m-resp\">a través del Ministerio de Justicia</mark>, con indicación del plazo para recibir sus <mark class=\"m-destacable\">recomendaciones</mark>, que <mark class=\"m-resp\">no será inferior a veinte días</mark>. En la misma resolución el Juez Central de Instrucción acordará la <mark class=\"m-destacable\">prisión provisional</mark> del detenido por el <mark class=\"m-personalizado\">tiempo estrictamente necesario</mark> para recibir las recomendaciones de la Corte (…).</p><p><b>2.</b> Una vez recibida (…) la comunicación de la Corte con las recomendaciones (…), el Juez Central de Instrucción, <u class=\"m-clave\">previa</u> valoración de dichas recomendaciones, <u class=\"m-clave\">podrá</u> acordar la libertad provisional del detenido <u class=\"m-clave\">cuando</u> existan <mark class=\"m-personalizado\">circunstancias urgentes y excepcionales</mark> que lo justifiquen (…).</p><p><b>3.</b> <u class=\"m-clave\">Si</u> en el plazo establecido en las reglas de procedimiento y prueba la Corte <u class=\"m-clave\">no</u> hubiera remitido la <mark class=\"m-destacable\">documentación para la entrega</mark> prevista en el artículo 91.2 y 3 del Estatuto, el Juez Central de Instrucción <u class=\"m-clave\">podrá</u> acordar la libertad provisional y las <mark class=\"m-destacable\">medidas cautelares</mark> adecuadas, que se mantendrán por un <mark class=\"m-resp\">tiempo máximo de ciento ochenta días</mark>, <u class=\"m-clave\">sin perjuicio</u> de volver a decretar la prisión una vez recibida la documentación de la Corte.</p><p><b>4.</b> Cuando se acordare la libertad provisional, se <mark class=\"m-accion\">informará</mark> a la <mark class=\"m-autoridad\">Sala de Cuestiones Preliminares</mark> y, posteriormente, cuantas veces ésta lo solicite.</p>")
  + articuloResp("Artículo 13 — De la entrega simplificada", ["si consiente: auto de entrega SIN MÁS TRÁMITES y sin documentación del art. 91 ER","consentimiento parcial: solo por los hechos de la solicitud (art. 101.2 ER)","si se opuso: puede consentir en QUINCE DÍAS","el consentimiento es IRREVOCABLE"], "<p><b>1.</b> En la comparecencia regulada en el artículo 11 de esta ley se <mark class=\"m-accion\">interrogará</mark> a la persona reclamada acerca de si <mark class=\"m-accion\">consiente</mark> en su entrega y, si diere el <mark class=\"m-destacable\">consentimiento</mark>, el <mark class=\"m-autoridad\">Juez Central de Instrucción</mark> dictará <mark class=\"m-destacable\">auto</mark> acordando la entrega a la Corte <mark class=\"m-resp\">sin más trámites y sin que sea necesario que la Corte remita la documentación prevista en el artículo 91 del Estatuto</mark>.</p><p>Se procederá de la misma manera si también consiente en la entrega respecto a otros hechos no comprendidos en la solicitud de la Corte (…) y, si no accediere, <mark class=\"m-resp\">la entrega se efectuará sólo por los hechos contenidos en la solicitud</mark>, <u class=\"m-clave\">sin perjuicio</u> de lo que proceda, después de la entrega, en aplicación del <mark class=\"m-resp\">apartado 2 del artículo 101 del Estatuto</mark> (principio de especialidad). Fuera de este caso, <u class=\"m-clave\">no</u> se admitirá un <mark class=\"m-destacable\">consentimiento parcial</mark>.</p><p><b>2.</b> El Juez Central de Instrucción <mark class=\"m-accion\">remitirá</mark> <mark class=\"m-plazo\">urgentemente</mark> copia del auto al <mark class=\"m-autoridad\">Ministerio de Justicia</mark>, que <mark class=\"m-accion\">informará</mark> <mark class=\"m-plazo\">de inmediato</mark> a la Corte (…).</p><p><b>3.</b> La persona reclamada, aunque se hubiere <mark class=\"m-accion\">opuesto</mark> a la entrega en la citada comparecencia, <u class=\"m-clave\">podrá</u> dar su consentimiento <mark class=\"m-resp\">dentro de los quince días siguientes</mark> (…).</p><p><b>4.</b> En la misma comparecencia se informará al detenido de que el consentimiento, una vez dado, es <mark class=\"m-personalizado\">irrevocable</mark>.</p>")
  + articuloResp("Artículo 14 — De la orden de comparecencia de un imputado ante la Corte", ["juez de instrucción del DOMICILIO O RESIDENCIA de la persona buscada","medidas de aseguramiento CON EXCLUSIÓN de las privativas de libertad"], "<p><u class=\"m-clave\">Cuando</u>, en lugar de una solicitud de detención, la Corte hubiere dictado una <mark class=\"m-destacable\">orden de comparecencia</mark>, el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-accion\">remitirá</mark> la solicitud de la Corte al <mark class=\"m-resp\">juez de instrucción del domicilio o residencia de la persona buscada</mark>, el cual <mark class=\"m-accion\">citará</mark> a ésta <mark class=\"m-personalizado\">personalmente</mark>, informándole de la fecha y demás circunstancias relativas a dicha comparecencia, y adoptará las <mark class=\"m-destacable\">medidas de aseguramiento de la comparecencia</mark> previstas en la legislación procesal española que considere más adecuadas, <mark class=\"m-resp\">con exclusión de las privativas de libertad</mark>, remitiendo las diligencias practicadas al Ministerio de Justicia, que las transmitirá a la Corte.</p>")
  + trampa("Trampa de examen", "Nota del temario: orden de detención (o de detención y entrega) → JUEZ CENTRAL DE INSTRUCCIÓN; orden de comparecencia → JUEZ DE INSTRUCCIÓN del domicilio o residencia de la persona buscada.")
  + articuloResp("Artículo 15 — De la entrega a la Corte · R4", ["audiencia en el plazo máximo de DIEZ DÍAS","cosa juzgada: comunica a Justicia y APLAZA la resolución (consultas del art. 89.2 ER)","resuelve por auto en TRES DÍAS"], "<p><b>1.</b> <u class=\"m-clave\">No</u> habiéndose accedido a la <mark class=\"m-destacable\">entrega simplificada</mark>, (…) se pondrá ésta de manifiesto en Secretaría y se <mark class=\"m-accion\">convocará</mark> a una <mark class=\"m-destacable\">audiencia</mark> que tendrá lugar <mark class=\"m-resp\">en el plazo máximo de diez días</mark>, con citación de la persona reclamada y su defensor y, en su caso, de un intérprete, así como del <mark class=\"m-autoridad\">Ministerio Fiscal</mark>. A dicha audiencia <u class=\"m-clave\">podrá</u> asistir e intervenir un <mark class=\"m-autoridad\">delegado del Fiscal de la Corte</mark>.</p><p><u class=\"m-clave\">No</u> se admitirán otras alegaciones o pruebas que las relativas a la concurrencia o no de los requisitos establecidos en los apartados 2 o 3 del artículo 91 del Estatuto (…).</p><p><b>2.</b> <u class=\"m-clave\">Cuando</u> se alegare la <mark class=\"m-destacable\">excepción de cosa juzgada</mark>, el Juzgado Central de Instrucción <mark class=\"m-resp\">lo comunicará al Ministerio de Justicia, aplazando la resolución sobre la entrega</mark>, mientras el Ministerio de Justicia efectúa las <mark class=\"m-resp\">consultas con la Corte previstas en el artículo 89.2 del Estatuto</mark>. <u class=\"m-clave\">Si</u> de tales consultas resultare que la causa ha sido declarada <mark class=\"m-personalizado\">admisible</mark> por la Corte, el Juzgado Central de Instrucción <mark class=\"m-accion\">alzará</mark> la suspensión. (…)</p><p><b>3.</b> Concluida la vista, el <mark class=\"m-autoridad\">Juzgado Central de Instrucción</mark> <mark class=\"m-accion\">resolverá</mark> sobre la petición de entrega, por medio de <mark class=\"m-destacable\">auto</mark>, <mark class=\"m-resp\">en el plazo de tres días</mark>.</p><p><b>4.</b> <u class=\"m-clave\">Si</u> en el citado auto se <mark class=\"m-accion\">denegare</mark> la entrega, <u class=\"m-clave\">podrá</u> mantenerse la situación de <mark class=\"m-destacable\">prisión provisional</mark> hasta la <mark class=\"m-destacable\">firmeza</mark> de dicha resolución.</p><p><b>5.</b> (…) 6. <u class=\"m-clave\">Si</u> la resolución fuere denegatoria de la entrega, una vez firme, se pondrá <mark class=\"m-plazo\">urgentemente</mark> en libertad a la persona detenida (…).</p>")
  + articuloResp("Artículo 16 — De las solicitudes concurrentes", ["se tramitan CONJUNTAMENTE en el JCI que conoce de la entrega","decide la SALA DE LO PENAL de la AN","sin tratado: preferencia a la CORTE"], "<p><b>1.</b> <u class=\"m-clave\">Cuando</u> concurriere con la solicitud de entrega de la Corte una <mark class=\"m-destacable\">solicitud de extradición</mark> de un Estado, sea o no parte en el Estatuto, o una <mark class=\"m-destacable\">orden europea de detención y entrega</mark>, se <mark class=\"m-accion\">notificará</mark> este hecho a la Corte y al Estado requirente y <mark class=\"m-resp\">se tramitarán conjuntamente ambos procedimientos en el Juzgado Central de Instrucción que estuviere conociendo de la solicitud de entrega</mark>.</p><p><b>2.</b> El Juez Central de Instrucción se <mark class=\"m-accion\">abstendrá</mark> de decidir sobre la entrega, elevando ambos procesos a la <mark class=\"m-resp\">Sala de lo Penal de la Audiencia Nacional</mark>, que <mark class=\"m-accion\">resolverá</mark> de acuerdo con el Estatuto y, en su caso, de acuerdo con el <mark class=\"m-destacable\">tratado</mark> que existiere con el Estado requirente. <u class=\"m-clave\">Cuando no</u> existiere tratado, <mark class=\"m-resp\">se dará preferencia a la solicitud de la Corte</mark>.</p><p><b>3.</b> El <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-accion\">informará</mark> a la Corte cuando, habiendo sido declarada inadmisible la causa por ésta, asimismo se hubiere denegado la extradición al Estado requirente.</p>")
  + articuloResp("Artículo 17 — De los recursos", ["apelación ante la SALA DE LO PENAL de la AN","situación personal: art. 766 LECrim, auto en CINCO DÍAS","entrega: art. 790 LECrim","autos de la Sala: NO susceptibles de recurso alguno"], "<p><b>1.</b> Contra las resoluciones del Juez Central de Instrucción relativas a la <mark class=\"m-destacable\">situación personal</mark> del reclamado cabe <mark class=\"m-destacable\">recurso de apelación</mark> <mark class=\"m-resp\">ante la Sala de lo Penal de la Audiencia Nacional</mark>, que se sustanciará conforme a lo previsto en el <mark class=\"m-destacable\">artículo 766 de la Ley de Enjuiciamiento Criminal</mark> y se resolverá por auto <mark class=\"m-resp\">en el plazo de cinco días</mark>.</p><p><b>2.</b> Contra el auto del Juez Central de Instrucción en el que se resuelve sobre la <mark class=\"m-destacable\">entrega</mark> cabe recurso de apelación ante la Sala de lo Penal de la Audiencia Nacional, que se sustanciará conforme a lo prevenido en el <mark class=\"m-destacable\">artículo 790 de la Ley de Enjuiciamiento Criminal</mark>, si bien (…) <u class=\"m-clave\">no</u> se podrán formular otras alegaciones que las relativas a <mark class=\"m-destacable\">quebrantamiento de las normas y garantías procesales</mark> en el expediente y las relativas a la concurrencia de los requisitos establecidos en los artículos 89.2 y 91.2 o 3 (…) del Estatuto.</p><p><b>3.</b> Los autos de la Sala de lo Penal de la Audiencia Nacional resolviendo los recursos de los apartados anteriores <mark class=\"m-resp\">no serán susceptibles de recurso alguno</mark>.</p>")
  + articuloResp("Artículo 18 — De la entrega temporal a la Corte", ["persona cumpliendo condena o sujeta a proceso en España por hechos distintos","Justicia consulta con la Corte si NO SE OPUSIERE el Tribunal sentenciador o el instructor","resolución motivada","se computa el período pasado a disposición de la Corte"], "<p><b>1.</b> <u class=\"m-clave\">Cuando</u> se hubiere acordado la entrega a la Corte y la persona que deba ser entregada estuviere <mark class=\"m-resp\">cumpliendo condena en España o sujeta a proceso por hechos distintos de los que han servido de base para la entrega</mark>, el <mark class=\"m-autoridad\">Ministerio de Justicia</mark>, <mark class=\"m-resp\">si no se opusiere el Tribunal sentenciador o el instructor</mark>, <mark class=\"m-accion\">celebrará</mark> <mark class=\"m-destacable\">consultas</mark> con la Corte, a efectos de decidir sobre la <mark class=\"m-destacable\">entrega temporal</mark> a la Corte mediante <mark class=\"m-personalizado\">resolución motivada</mark>, con las modalidades de la restitución a España que se determinen y <mark class=\"m-resp\">computándose en todo caso el período pasado a disposición de la Corte</mark>.</p><p><b>2.</b> Por el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> se <mark class=\"m-accion\">transmitirán</mark> las informaciones precisas a los órganos judiciales competentes (…) y al <mark class=\"m-autoridad\">Ministerio del Interior</mark>, para efectuar el desplazamiento y en su momento el retorno.</p>")
  + articuloResp("Artículo 19 — De las actuaciones posteriores a la entrega", ["conducta anterior a la entrega: al JUZGADO CENTRAL DE INSTRUCCIÓN (o Sala de lo Penal, art. 16)","traslado a otro Estado: información al JCI de la AN","devolución a España si inadmisible por el art. 17.1.a) ER"], "<p><b>1.</b> <u class=\"m-clave\">Si</u>, después de la entrega, la Corte pidiere <mark class=\"m-destacable\">autorización</mark> a España para proceder por una <mark class=\"m-personalizado\">conducta anterior a la entrega</mark>, se trasladará la petición <mark class=\"m-resp\">al Juzgado Central de Instrucción, o a la Sala de lo Penal en el caso previsto en el artículo 16</mark> de esta ley (solicitudes concurrentes), que resolverán de acuerdo con el criterio establecido en el apartado 2 del artículo 101 del Estatuto. (…)</p><p><b>2.</b> <u class=\"m-clave\">Cuando</u> la persona entregada fuere puesta en libertad por la Corte por razones distintas del cumplimiento de la sentencia y la Corte se propusiera <mark class=\"m-accion\">trasladarla</mark> a otro Estado, se remitirá esta información <mark class=\"m-resp\">al Juzgado Central de Instrucción de la Audiencia Nacional</mark> y, en su caso, por el Ministerio de Justicia se dará el <mark class=\"m-destacable\">consentimiento</mark> de España para tal traslado o se <mark class=\"m-accion\">solicitará</mark> su <mark class=\"m-destacable\">devolución</mark> a España si la razón de la puesta en libertad se debiere a que la causa fue declarada <mark class=\"m-personalizado\">inadmisible</mark> por la Corte por el motivo previsto en el <mark class=\"m-resp\">artículo 17.1.a) del Estatuto</mark> (asunto investigado o enjuiciado por un Estado con jurisdicción).</p>")
  + articuloResp("Artículo 20 — De otras formas de cooperación con la Corte", ["solicitudes del art. 93 ER: si NO estuvieran prohibidas en la legislación española y su fin fuera también facilitar el proceso","defensa o seguridad nacionales: consultas por EXTERIORES (con Justicia, Interior y Defensa)","concurrencia: art. 93.9.b) ER"], "<p><b>1.</b> Los <mark class=\"m-autoridad\">órganos judiciales</mark> y las restantes autoridades intervinientes <mark class=\"m-accion\">darán cumplimiento</mark> a las <mark class=\"m-destacable\">solicitudes de cooperación</mark> formuladas por la Corte previstas en el <mark class=\"m-destacable\">artículo 93 del Estatuto</mark> que <mark class=\"m-resp\">no estuvieran prohibidas en la legislación española y cuyo fin fuera también facilitar el proceso ante la Corte</mark>.</p><p>El <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-accion\">acusará recibo</mark> e <mark class=\"m-accion\">informará</mark> a la Corte acerca del órgano interno al que se haya transmitido la solicitud.</p><p><b>2.</b> <u class=\"m-clave\">Cuando</u> la solicitud de la Corte pudiera afectar a la <mark class=\"m-destacable\">defensa o a la seguridad nacionales</mark> o tenga por objeto <mark class=\"m-destacable\">documentos o informaciones</mark> que hubieren sido transmitidos a España con <mark class=\"m-personalizado\">carácter confidencial</mark> por un Estado, una organización internacional o una organización intergubernamental, el <mark class=\"m-resp\">Ministerio de Asuntos Exteriores, en coordinación con los Ministerios de Justicia, del Interior y de Defensa</mark> u otros Ministerios competentes, <mark class=\"m-accion\">efectuará consultas</mark> con el Estado u organización de que proceda la información (…).</p><p><b>3.</b> Cualquier otra dificultad en el cumplimiento de la solicitud será objeto de consultas por el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> con la Corte.</p><p><b>4.</b> El objeto de las consultas será exponer a la Corte la razón fundada por la que no puede prestarse la asistencia solicitada, considerar la posibilidad de atenderla de otra manera o con arreglo a otras condiciones, estudiar su modificación o retirada, así como asegurar la protección de informaciones de carácter confidencial o restringido.</p><p><b>5.</b> En el caso de <mark class=\"m-destacable\">concurrencia de solicitudes de asistencia</mark> de la Corte y de un Estado, si aparecieren dificultades para atender a ambas, el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-accion\">celebrará consultas</mark> con la Corte y dicho Estado, con el fin de <mark class=\"m-accion\">postergar o condicionar</mark> una de ellas, informando en su caso a la Corte, conforme al <mark class=\"m-resp\">artículo 93.9.b) del Estatuto</mark>, de que las informaciones, bienes o personas objeto de la solicitud están bajo el control de un <mark class=\"m-personalizado\">tercer Estado u organización internacional</mark>.</p>")
  + articuloResp("Artículo 21 — De las personas sujetas a la jurisdicción de la Corte · R5", ["peritos y testigos por comisión rogatoria: MISMAS obligaciones y responsabilidades que en una causa en España","comparecencia en la sede de la Corte: VOLUNTARIA","sin consentimiento: condenado por la Corte que cumple condena en España","personas en tránsito: INMUNIDAD"], "<p><b>1.</b> Las personas citadas como <mark class=\"m-destacable\">peritos o testigos</mark> para comparecer ante los tribunales españoles en cumplimiento de una <mark class=\"m-destacable\">comisión rogatoria</mark> expedida por la Corte tendrán <mark class=\"m-resp\">las mismas obligaciones y responsabilidades que si hubieren sido citadas en una causa que se siguiere en España</mark>.</p><p><u class=\"m-clave\">Si</u> la comparecencia fuere en la <mark class=\"m-destacable\">sede de la Corte</mark>, tendrá <mark class=\"m-resp\">carácter voluntario</mark>, solicitándose de ésta por el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> información acerca de las <mark class=\"m-destacable\">inmunidades</mark> y plazo de vigencia para la persona citada, que será transmitida a dicha persona, <mark class=\"m-accion\">anticipándose</mark> los <mark class=\"m-destacable\">gastos</mark> por el Ministerio de Justicia. (…)</p><p><u class=\"m-clave\">No será necesario</u> el <mark class=\"m-destacable\">consentimiento</mark> <u class=\"m-clave\">cuando</u> se tratare de <mark class=\"m-resp\">un condenado por la Corte que se encontrare cumpliendo condena en España</mark>, en cuyo caso se efectuará el <mark class=\"m-destacable\">traslado temporal</mark>, en las condiciones que se acuerden con la Corte.</p><p><b>2.</b> Cuando la solicitud de comparecencia en la sede de la Corte se refiriese a una persona <mark class=\"m-personalizado\">detenida en España</mark>, el Ministerio de Justicia se dirigirá al órgano judicial que estuviere conociendo del asunto para que interrogue a dicha persona acerca de si <mark class=\"m-accion\">consiente</mark> el traslado (…).</p><p><b>3.</b> Las personas en <mark class=\"m-destacable\">tránsito</mark> en España para comparecer ante la Corte <mark class=\"m-accion\">gozarán</mark> de <mark class=\"m-destacable\">inmunidad</mark>.</p><p><b>4.</b> (…) 5. El <mark class=\"m-autoridad\">Ministerio de Justicia</mark>, en coordinación con el <mark class=\"m-autoridad\">Ministerio del Interior</mark> (…), <u class=\"m-clave\">podrá</u> <mark class=\"m-accion\">convenir</mark> con el <mark class=\"m-autoridad\">Secretario de la Corte</mark> la <mark class=\"m-destacable\">acogida temporal</mark> de <mark class=\"m-personalizado\">víctimas traumatizadas</mark> o de <mark class=\"m-personalizado\">testigos que pudieran correr peligro</mark> por su testimonio.</p>")
  + articuloResp("Artículo 22 — De la ejecución de las penas en España", ["llegada del recluso al juez de vigilancia penitenciaria en VEINTICUATRO HORAS","hechos anteriores a la entrega: comunicación a Justicia y ABSTENERSE hasta que decida la Corte","evasión: consulta si España pide la extradición o la Corte insta la entrega","multa o decomiso: al Fiscal General del Estado (apartado 7)"], "<p><b>1.</b> De conformidad con el acuerdo que eventualmente se celebre entre España y la Corte y con la disposición adicional única de la Ley Orgánica 6/2000 (…), el <mark class=\"m-autoridad\">Ministerio de Justicia</mark>, previas las consultas oportunas, <mark class=\"m-accion\">comunicará</mark> a la Corte las condiciones en las que España estuviese dispuesta a aceptar el <mark class=\"m-destacable\">traslado de un condenado</mark> a pena privativa de libertad (…).</p><p>Por el Ministerio de Justicia se transmitirán las oportunas informaciones al <mark class=\"m-autoridad\">Ministerio del Interior</mark> para la realización del traslado, debiendo comunicarse por las <mark class=\"m-autoridad\">autoridades penitenciarias</mark> al <mark class=\"m-autoridad\">juez de vigilancia penitenciaria</mark> competente la llegada del recluso, <mark class=\"m-resp\">en un plazo de veinticuatro horas</mark>.</p><p><b>2.</b> (…) 3. Los <mark class=\"m-autoridad\">jueces de vigilancia penitenciaria</mark> y el <mark class=\"m-autoridad\">Ministerio del Interior</mark> prestarán el <mark class=\"m-personalizado\">máximo apoyo</mark> a Magistrados y funcionarios de la Corte que se personaren en España para <mark class=\"m-accion\">supervisar</mark> la ejecución de las penas.</p><p><b>4.</b> Para que se pueda proceder en España contra un condenado que estuviere cumpliendo una condena impuesta por la Corte en un establecimiento penitenciario español, por <mark class=\"m-personalizado\">hechos anteriores a su entrega</mark> a España, el juez instructor o el tribunal competente <mark class=\"m-resp\">dirigirá la comunicación y la documentación pertinente al Ministerio de Justicia</mark>, que las trasladará a la Corte, <mark class=\"m-resp\">absteniéndose de proceder hasta la decisión de ésta</mark>. Igualmente se actuará para la extradición a un Estado.</p><p><b>5.</b> (…) 6. En caso de <mark class=\"m-destacable\">evasión</mark> del condenado, el <mark class=\"m-autoridad\">Ministerio de Justicia</mark> <mark class=\"m-accion\">informará</mark> <mark class=\"m-plazo\">con urgencia</mark> al <mark class=\"m-autoridad\">Secretario de la Corte</mark> de tal circunstancia y <mark class=\"m-accion\">consultará</mark> con ella acerca de <mark class=\"m-resp\">si España solicita su extradición al Estado en que se encuentre o si la Corte insta su entrega a dicho Estado</mark>.</p><p><b>7.</b> <u class=\"m-clave\">Cuando</u> la petición de ejecución de la Corte se refiriese a una <mark class=\"m-destacable\">multa u orden de decomiso</mark>, el Ministerio de Justicia <mark class=\"m-accion\">transmitirá</mark> la documentación pertinente al <mark class=\"m-autoridad\">Fiscal General del Estado</mark> para que inste la ejecución ante el órgano judicial competente y, en su caso, se pongan a disposición del Ministerio de Justicia los bienes o sumas obtenidas para su transferencia a la Corte.</p>")
  + articuloResp("Artículo 23 — De las medidas de reparación", ["observaciones en el plazo indicado por la Corte o en el más breve plazo posible","atribución a una organización: consulta con EXTERIORES","ejecución: apartado 7 del art. 22"], "<p><b>1.</b> El <mark class=\"m-autoridad\">Ministerio de Justicia</mark>, <mark class=\"m-resp\">en el plazo indicado por la Corte o, en su caso, en el más breve plazo posible</mark>, <mark class=\"m-accion\">remitirá</mark> <mark class=\"m-destacable\">observaciones</mark> sobre las cuestiones planteadas por la Corte, incluidas las relativas a las observaciones formuladas por los <mark class=\"m-destacable\">peritos</mark> (…).</p><p><b>2.</b> <u class=\"m-clave\">Cuando</u> las observaciones se refiriesen a la atribución del importe de la <mark class=\"m-destacable\">reparación</mark> a una <mark class=\"m-personalizado\">organización intergubernamental o internacional</mark>, el Ministerio de Justicia <mark class=\"m-accion\">consultará</mark> con el <mark class=\"m-resp\">Ministerio de Asuntos Exteriores</mark>.</p><p><b>3.</b> <u class=\"m-clave\">Cuando</u> para cumplimentar la comunicación de la Corte hubieran de adoptarse <mark class=\"m-destacable\">medidas de ejecución</mark>, se procederá, en lo que sea pertinente, conforme al procedimiento previsto en el <mark class=\"m-resp\">apartado 7 del artículo 22</mark> de esta ley (multas y decomisos: a través del Fiscal General del Estado).</p>")
  + articuloResp("Artículo 24 — De la intervención de España en calidad de «amicus curiae»", ["requiere INVITACIÓN de la Corte","Justicia consulta con Exteriores la conveniencia u oportunidad","y fija los términos de la participación"], "<p><u class=\"m-clave\">Si</u> España recibiere una <mark class=\"m-resp\">invitación de la Corte</mark> para participar en un proceso en calidad de <mark class=\"m-destacable\">«amicus curiae»</mark>, el <mark class=\"m-resp\">Ministerio de Justicia</mark> <mark class=\"m-accion\">consultará</mark> con el <mark class=\"m-autoridad\">Ministerio de Asuntos Exteriores</mark> para <mark class=\"m-resp\">determinar la conveniencia u oportunidad de hacerlo</mark> y, en su caso, <mark class=\"m-resp\">fijar los términos de dicha participación</mark>.</p>")
  + articuloResp("Artículo 25 — De la celebración del juicio y otras actuaciones procesales en España · R6", ["decide y comunica el MINISTERIO DE JUSTICIA","previa consulta con Exteriores, Interior y otras autoridades competentes","aspectos no jurisdiccionales: ACUERDO ESPECÍFICO con la Corte"], "<p><u class=\"m-clave\">Si</u> la Corte <mark class=\"m-accion\">propusiere</mark> la celebración del <mark class=\"m-destacable\">juicio u otras actuaciones procesales en España</mark>, el <mark class=\"m-resp\">Ministerio de Justicia</mark>, <u class=\"m-clave\">previa</u> consulta con los <mark class=\"m-autoridad\">Ministerios de Asuntos Exteriores y del Interior</mark> y <mark class=\"m-resp\">otras autoridades competentes</mark>, <mark class=\"m-accion\">comunicará</mark> a la Corte la decisión al respecto. En su caso, los <mark class=\"m-destacable\">aspectos no jurisdiccionales</mark> de dichas actuaciones estarán sometidos al <mark class=\"m-resp\">acuerdo específico que se celebre con la Corte</mark>.</p>")
  + articuloResp("Disposiciones adicionales y finales", ["delitos contra la administración de justicia: SOLO a solicitud de la Corte","militar: Juzgado Togado Militar Central Decano y Tribunal Militar Central","carácter orgánico: arts. 7 a 13 (salvo 13.2), 15 y 21.3","vigor: día siguiente a su publicación en el BOE"], "<p><b>D.A. 1.ª</b> Las <mark class=\"m-destacable\">reglas de procedimiento y prueba</mark> así como sus enmiendas se <mark class=\"m-accion\">publicarán</mark> en el <mark class=\"m-destacable\">«Boletín Oficial del Estado»</mark>.</p><p><b>D.A. 2.ª</b> (delitos contra la administración de justicia por la Corte) 2. <u class=\"m-clave\">Sólo</u> se podrá proceder en España en relación a estos delitos <mark class=\"m-resp\">a solicitud de la Corte</mark>. 3. <u class=\"m-clave\">Si</u> la Corte se inhibiere en favor de la jurisdicción española, el Ministerio de Justicia remitirá la solicitud al <mark class=\"m-autoridad\">Fiscal de la Audiencia Nacional</mark>, si el delito hubiera sido cometido por un español <mark class=\"m-personalizado\">en el extranjero</mark>, o al <mark class=\"m-autoridad\">Fiscal General del Estado</mark> cuando el delito se hubiera cometido <mark class=\"m-personalizado\">en España</mark>.</p><p><b>D.A. 3.ª</b> 1. Las referencias que esta ley hace al Juzgado Central de Instrucción y a la Sala de lo Penal de la Audiencia Nacional deben entenderse hechas, cuando la cooperación sea de la competencia de la <mark class=\"m-destacable\">jurisdicción militar</mark>, al <mark class=\"m-resp\">Juzgado Togado Militar Central Decano</mark> y al <mark class=\"m-resp\">Tribunal Militar Central</mark>, respectivamente. (…) al <mark class=\"m-autoridad\">Fiscal Jurídico Militar</mark> y al <mark class=\"m-autoridad\">Juez Togado Militar de Vigilancia Penitenciaria</mark>.</p><p><b>D.F. 1.ª</b> Tienen <mark class=\"m-destacable\">carácter orgánico</mark> los artículos <mark class=\"m-resp\">7, 8, 9, 10, 11, 12, 13 (excepto su apartado 2), 15 y 21.3</mark>, la disposición adicional segunda y el apartado 2 de la disposición adicional tercera. Los restantes preceptos tienen <mark class=\"m-destacable\">carácter ordinario</mark> (art. 149.1.3.ª, 5.ª y 6.ª CE).</p><p><b>D.F. 2.ª</b> La presente ley orgánica <mark class=\"m-accion\">entrará en vigor</mark> el <mark class=\"m-resp\">día siguiente de su publicación en el «Boletín Oficial del Estado»</mark>.</p>");
/* T1_CARTA */ T1.carta = bloqueTitulo("1.2 — CARTA DE LOS DERECHOS FUNDAMENTALES DE LA UNIÓN EUROPEA (proclamada en Niza el 7-12-2000 · revisada en Estrasburgo el 12-12-2007 · jurídicamente vinculante desde el 1-12-2009 con el Tratado de Lisboa)")
  + articuloResp("Datos y estructura de la Carta", ["vinculante desde el 1 de diciembre de 2009 (Tratado de Lisboa)","I Dignidad (1-5) · II Libertades (6-19) · III Igualdad (20-26) · IV Solidaridad (27-38) · V Ciudadanía (39-46) · VI Justicia (47-50) · VII Disposiciones generales (51-54)"], "<p><b>Proclamación solemne:</b> <mark class=\"m-plazo\">7 de diciembre de 2000</mark> (<mark class=\"m-destacable\">Niza</mark>). <b>Publicación:</b> DOUE <mark class=\"m-plazo\">18 de diciembre de 2000</mark>. <b>Revisión:</b> <mark class=\"m-plazo\">12 de diciembre de 2007</mark> (<mark class=\"m-destacable\">Estrasburgo</mark>). <b>Jurídicamente vinculante desde:</b> <mark class=\"m-resp\">1 de diciembre de 2009 (con el Tratado de Lisboa)</mark>. <b>Órganos emisores:</b> <mark class=\"m-autoridad\">Parlamento, Consejo y Comisión europeos</mark>.</p><p><b>Títulos</b> (es objeto de examen saber el nombre de cada Título y los derechos que recoge): <mark class=\"m-resp\">I. Dignidad</mark> (arts. 1-5: dignidad, vida, integridad, tortura, esclavitud) · <mark class=\"m-destacable\">II. Libertades</mark> (6-19) · <mark class=\"m-destacable\">III. Igualdad</mark> (20-26) · <mark class=\"m-destacable\">IV. Solidaridad</mark> (27-38) · <mark class=\"m-destacable\">V. Ciudadanía</mark> (39-46) · <mark class=\"m-destacable\">VI. Justicia</mark> (47-50) · <mark class=\"m-destacable\">VII. Disposiciones generales que rigen la interpretación y la aplicación de la Carta</mark> (51-54).</p>")
  + bloqueTitulo("TÍTULO I. DIGNIDAD")
  + articuloResp("Artículos 1 a 5 — Dignidad humana, vida, integridad, tortura y esclavitud", ["dignidad: inviolable; RESPETADA Y PROTEGIDA","vida en el Título I","nadie condenado a la pena de muerte ni ejecutado","prohibición de las prácticas EUGENÉSICAS (selección de personas)","tratos INHUMANOS O DEGRADANTES","se prohíbe la TRATA de seres humanos"], "<p><b>Art. 1.</b> La <mark class=\"m-destacable\">dignidad humana</mark> es <mark class=\"m-personalizado\">inviolable</mark>. Será <mark class=\"m-resp\">respetada y protegida</mark>.</p><p><b>Art. 2.</b> 1. Toda persona tiene <mark class=\"m-resp\">derecho a la vida</mark>. 2. Nadie podrá ser <mark class=\"m-resp\">condenado a la pena de muerte ni ejecutado</mark>.</p><p><b>Art. 3.</b> 1. Toda persona tiene derecho a su <mark class=\"m-destacable\">integridad física y psíquica</mark>. 2. En el marco de la <mark class=\"m-destacable\">medicina y la biología</mark> se <mark class=\"m-accion\">respetarán</mark> <u class=\"m-clave\">en particular</u>: a) el <mark class=\"m-destacable\">consentimiento libre e informado</mark> de la persona de que se trate, de acuerdo con las modalidades establecidas por la ley; b) <mark class=\"m-resp\">la prohibición de las prácticas eugenésicas, en particular las que tienen como finalidad la selección de las personas</mark>; c) la prohibición de que el <mark class=\"m-destacable\">cuerpo humano</mark> o partes del mismo en cuanto tales se conviertan en <mark class=\"m-personalizado\">objeto de lucro</mark>; d) la prohibición de la <mark class=\"m-destacable\">clonación reproductora</mark> de seres humanos.</p><p><b>Art. 4.</b> Nadie podrá ser sometido a <mark class=\"m-destacable\">tortura</mark> ni a penas o tratos <mark class=\"m-resp\">inhumanos o degradantes</mark>.</p><p><b>Art. 5.</b> 1. Nadie podrá ser sometido a <mark class=\"m-destacable\">esclavitud o servidumbre</mark>. 2. Nadie podrá ser constreñido a realizar un <mark class=\"m-destacable\">trabajo forzado u obligatorio</mark>. 3. Se prohíbe la <mark class=\"m-resp\">trata de seres humanos</mark>.</p>", true)
  + trampa("Trampa de examen", "El art. 3.2 NO prohíbe «toda investigación con células madre»: solo eugenesia, lucro con el cuerpo humano y clonación REPRODUCTORA.")
  + bloqueTitulo("TÍTULO II. LIBERTADES")
  + articuloResp("Artículos 8, 9 y 10 — Datos personales, matrimonio y familia, pensamiento y objeción de conciencia", ["datos: control de una AUTORIDAD INDEPENDIENTE","matrimonio y familia: según las LEYES NACIONALES que regulen su ejercicio","objeción de conciencia: de acuerdo con las leyes nacionales"], "<p><b>Art. 8.</b> 1. Toda persona tiene derecho a la <mark class=\"m-destacable\">protección de los datos de carácter personal</mark> que le conciernan. 2. Estos datos se tratarán de modo <mark class=\"m-personalizado\">leal</mark>, para <mark class=\"m-personalizado\">fines concretos</mark> y sobre la base del <mark class=\"m-destacable\">consentimiento</mark> de la persona afectada o en virtud de otro fundamento legítimo previsto por la ley. Toda persona tiene derecho a <mark class=\"m-accion\">acceder</mark> a los datos recogidos que le conciernan y a obtener su <mark class=\"m-accion\">rectificación</mark>. 3. El respeto de estas normas estará sujeto al control de <mark class=\"m-resp\">una autoridad independiente</mark>.</p><p><b>Art. 9.</b> Se <mark class=\"m-accion\">garantizan</mark> el derecho a <mark class=\"m-destacable\">contraer matrimonio</mark> y el derecho a <mark class=\"m-destacable\">fundar una familia</mark> según <mark class=\"m-resp\">las leyes nacionales que regulen su ejercicio</mark>.</p><p><b>Art. 10.</b> 1. Toda persona tiene derecho a la <mark class=\"m-destacable\">libertad de pensamiento, de conciencia y de religión</mark>. (…) 2. Se reconoce el derecho a la <mark class=\"m-destacable\">objeción de conciencia</mark> <mark class=\"m-resp\">de acuerdo con las leyes nacionales que regulen su ejercicio</mark>.</p>", true)
  + articuloResp("Artículos 12 a 15 — Partidos políticos, artes y ciencias, educación y trabajo", ["partidos a escala de la Unión: expresar la VOLUNTAD POLÍTICA de los ciudadanos","se respeta la LIBERTAD DE CÁTEDRA","recibir gratuitamente la ENSEÑANZA OBLIGATORIA","nacionales de terceros países: condiciones laborales EQUIVALENTES"], "<p><b>Art. 12.2.</b> Los <mark class=\"m-autoridad\">partidos políticos a escala de la Unión</mark> <mark class=\"m-accion\">contribuyen</mark> a <mark class=\"m-resp\">expresar la voluntad política de los ciudadanos de la Unión</mark>.</p><p><b>Art. 13.</b> Las <mark class=\"m-destacable\">artes</mark> y la <mark class=\"m-destacable\">investigación científica</mark> son <mark class=\"m-personalizado\">libres</mark>. Se respeta la <mark class=\"m-resp\">libertad de cátedra</mark>.</p><p><b>Art. 14.</b> 1. Toda persona tiene derecho a la <mark class=\"m-destacable\">educación</mark> y al acceso a la <mark class=\"m-destacable\">formación profesional y permanente</mark>. 2. Este derecho incluye la facultad de <mark class=\"m-resp\">recibir gratuitamente la enseñanza obligatoria</mark>. (…)</p><p><b>Art. 15.3.</b> Los <mark class=\"m-autoridad\">nacionales de terceros países</mark> que estén autorizados a trabajar en el territorio de los Estados miembros tienen derecho a unas <mark class=\"m-resp\">condiciones laborales equivalentes a aquellas de que disfrutan los ciudadanos de la Unión</mark>.</p>")
  + articuloResp("Artículos 17, 18 y 19 — Propiedad, asilo y protección en caso de devolución, expulsión y extradición", ["privación: utilidad pública + justa indemnización EN UN TIEMPO RAZONABLE","asilo: Convención de Ginebra de 28-7-1951 y Protocolo de 31-1-1967","se prohíben las EXPULSIONES COLECTIVAS"], "<p><b>Art. 17.1.</b> Toda persona tiene derecho a disfrutar de la <mark class=\"m-destacable\">propiedad</mark> de los bienes que haya adquirido legalmente (…). Nadie puede ser privado de su propiedad más que por causa de <mark class=\"m-destacable\">utilidad pública</mark>, en los casos y condiciones previstos en la ley y a cambio, <mark class=\"m-resp\">en un tiempo razonable</mark>, de una <mark class=\"m-destacable\">justa indemnización</mark> por su pérdida. (…) 2. Se protege la <mark class=\"m-destacable\">propiedad intelectual</mark>.</p><p><b>Art. 18.</b> Se garantiza el <mark class=\"m-destacable\">derecho de asilo</mark> dentro del respeto de las normas de la <mark class=\"m-resp\">Convención de Ginebra de 28 de julio de 1951 y del Protocolo de 31 de enero de 1967</mark> sobre el Estatuto de los Refugiados (…).</p><p><b>Art. 19.</b> 1. Se prohíben las <mark class=\"m-resp\">expulsiones colectivas</mark>. 2. Nadie podrá ser <mark class=\"m-accion\">devuelto, expulsado o extraditado</mark> a un Estado en el que corra un <mark class=\"m-personalizado\">grave riesgo</mark> de ser sometido a la <mark class=\"m-destacable\">pena de muerte</mark>, a <mark class=\"m-destacable\">tortura</mark> o a otras penas o tratos inhumanos o degradantes.</p>")
  + bloqueTitulo("TÍTULO III. IGUALDAD")
  + articuloResp("Artículos 20, 23 y 24 — Igualdad ante la ley, igualdad entre mujeres y hombres y derechos del niño · R7 R8", ["todas las personas son IGUALES ANTE LA LEY","ventajas concretas en favor del SEXO MENOS REPRESENTADO","interés superior del niño = consideración PRIMORDIAL (no «subsidiaria»)"], "<p><b>Art. 20.</b> <mark class=\"m-resp\">Todas las personas son iguales ante la ley</mark>.</p><p><b>Art. 22.</b> La <mark class=\"m-autoridad\">Unión</mark> <mark class=\"m-accion\">respeta</mark> la <mark class=\"m-destacable\">diversidad cultural, religiosa y lingüística</mark>.</p><p><b>Art. 23.</b> La <mark class=\"m-destacable\">igualdad entre mujeres y hombres</mark> <u class=\"m-clave\">deberá</u> garantizarse en todos los ámbitos, inclusive en materia de empleo, trabajo y retribución. El principio de igualdad <u class=\"m-clave\">no impide</u> el mantenimiento o la adopción de medidas que supongan <mark class=\"m-destacable\">ventajas concretas</mark> en favor <mark class=\"m-resp\">del sexo menos representado</mark>.</p><p><b>Art. 24.</b> 1. Los niños tienen derecho a la <mark class=\"m-destacable\">protección</mark> y a los <mark class=\"m-destacable\">cuidados</mark> necesarios para su bienestar. <u class=\"m-clave\">Podrán</u> expresar su opinión libremente. Ésta será tenida en cuenta para los asuntos que les afecten, en función de su <mark class=\"m-personalizado\">edad y madurez</mark>. 2. En todos los actos relativos a los niños llevados a cabo por <mark class=\"m-autoridad\">autoridades públicas o instituciones privadas</mark>, el <mark class=\"m-destacable\">interés superior del niño</mark> constituirá una <mark class=\"m-resp\">consideración primordial</mark>. 3. Todo niño tiene derecho a mantener de forma <mark class=\"m-personalizado\">periódica</mark> relaciones personales y contactos directos con su padre y con su madre, <u class=\"m-clave\">salvo</u> si ello es contrario a sus intereses.</p>", true)
  + trampa("Trampa de examen", "Pregunta oficial: la opción INCORRECTA es la que dice que el interés superior del niño es una consideración «subsidiaria». El texto dice PRIMORDIAL.")
  + bloqueTitulo("TÍTULO IV. SOLIDARIDAD")
  + articuloResp("Artículos 29, 32, 34 y 37 — Colocación, trabajo infantil, ayuda social y medio ambiente · R10", ["servicio GRATUITO de colocación","edad mínima: la de fin de la ESCOLARIDAD OBLIGATORIA","ayuda social y ayuda de VIVIENDA","nivel elevado de protección del medio ambiente y la mejora de su calidad (desarrollo sostenible)"], "<p><b>Art. 29.</b> Toda persona tiene derecho a acceder a un <mark class=\"m-resp\">servicio gratuito</mark> de <mark class=\"m-destacable\">colocación</mark>.</p><p><b>Art. 31.</b> 1. Todo trabajador tiene derecho a trabajar en condiciones que respeten su <mark class=\"m-destacable\">salud, seguridad y dignidad</mark>. 2. (…) a la limitación de la duración máxima del trabajo y a períodos de descanso diarios y semanales, así como a un período de <mark class=\"m-destacable\">vacaciones anuales retribuidas</mark>.</p><p><b>Art. 32.</b> Se <mark class=\"m-accion\">prohíbe</mark> el <mark class=\"m-destacable\">trabajo infantil</mark>. La <mark class=\"m-destacable\">edad mínima de admisión al trabajo</mark> <u class=\"m-clave\">no podrá</u> ser inferior <mark class=\"m-resp\">a la edad en que concluye el período de escolaridad obligatoria</mark>, <u class=\"m-clave\">sin perjuicio</u> de disposiciones más favorables para los jóvenes y <u class=\"m-clave\">salvo</u> excepciones limitadas. (…)</p><p><b>Art. 34.3.</b> Con el fin de combatir la <mark class=\"m-destacable\">exclusión social</mark> y la <mark class=\"m-destacable\">pobreza</mark>, la Unión reconoce y respeta el derecho a <mark class=\"m-resp\">una ayuda social y a una ayuda de vivienda</mark> para garantizar una <mark class=\"m-personalizado\">existencia digna</mark> a todos aquellos que no dispongan de recursos suficientes (…).</p><p><b>Art. 37.</b> En las políticas de la Unión se <mark class=\"m-accion\">integrarán y garantizarán</mark>, conforme al principio de <mark class=\"m-destacable\">desarrollo sostenible</mark>, <mark class=\"m-resp\">un nivel elevado de protección del medio ambiente y la mejora de su calidad</mark>.</p>", true)
  + bloqueTitulo("TÍTULO V. CIUDADANÍA")
  + articuloResp("Artículos 39, 41 y 42 — Sufragio, buena administración y acceso a los documentos", ["diputados al PE: sufragio universal LIBRE, DIRECTO Y SECRETO","contestación en ESA MISMA LENGUA","documentos de las instituciones, órganos y organismos, CUALQUIERA QUE SEA SU SOPORTE"], "<p><b>Art. 39.</b> 1. Todo ciudadano de la Unión tiene derecho de <mark class=\"m-destacable\">sufragio activo y pasivo</mark> en las elecciones al Parlamento Europeo en el Estado miembro en que <mark class=\"m-personalizado\">resida</mark> (…). 2. Los <mark class=\"m-autoridad\">diputados al Parlamento Europeo</mark> serán elegidos por <mark class=\"m-resp\">sufragio universal libre, directo y secreto</mark>.</p><p><b>Art. 41.</b> 1. Toda persona tiene derecho a que las instituciones (…) traten sus asuntos <mark class=\"m-personalizado\">imparcial y equitativamente</mark> y dentro de un <mark class=\"m-plazo\">plazo razonable</mark>. (…) 4. Toda persona <u class=\"m-clave\">podrá</u> dirigirse a las instituciones de la Unión en una de las <mark class=\"m-destacable\">lenguas de los Tratados</mark> y <u class=\"m-clave\">deberá</u> recibir una contestación <mark class=\"m-resp\">en esa misma lengua</mark>.</p><p><b>Art. 42.</b> Todo ciudadano de la Unión y toda persona física o jurídica que resida o tenga su domicilio social en un Estado miembro tiene derecho a acceder a los <mark class=\"m-resp\">documentos de las instituciones, órganos y organismos de la Unión, cualquiera que sea su soporte</mark>.</p>")
  + articuloResp("Artículos 43, 44 y 46 — Defensor del Pueblo Europeo, petición y protección diplomática", ["Defensor: casos de MALA ADMINISTRACIÓN","excluido el TJUE en sus funciones jurisdiccionales","petición ante el PARLAMENTO EUROPEO","protección en un tercer país donde NO esté representado su Estado"], "<p><b>Art. 43.</b> Todo ciudadano de la Unión y toda persona física o jurídica que resida o tenga su domicilio social en un Estado miembro tiene derecho a someter al <mark class=\"m-autoridad\">Defensor del Pueblo Europeo</mark> los <mark class=\"m-resp\">casos de mala administración en la actuación de las instituciones, órganos u organismos de la Unión</mark>, <mark class=\"m-resp\">con exclusión del Tribunal de Justicia de la Unión Europea en el ejercicio de sus funciones jurisdiccionales</mark>.</p><p><b>Art. 44.</b> (…) tiene el <mark class=\"m-destacable\">derecho de petición</mark> ante el <mark class=\"m-resp\">Parlamento Europeo</mark>.</p><p><b>Art. 46.</b> Todo ciudadano de la Unión <u class=\"m-clave\">podrá</u> acogerse, en el territorio de un tercer país <mark class=\"m-resp\">en el que no esté representado el Estado miembro del que sea nacional</mark>, a la <mark class=\"m-destacable\">protección de las autoridades diplomáticas y consulares</mark> de cualquier Estado miembro, en las <mark class=\"m-personalizado\">mismas condiciones</mark> que los nacionales de este Estado.</p>")
  + bloqueTitulo("TÍTULO VI. JUSTICIA")
  + articuloResp("Artículos 47, 48 y 50 — Tutela judicial, presunción de inocencia y «non bis in idem»", ["asistencia jurídica gratuita SIEMPRE Y CUANDO sea necesaria para la efectividad del acceso a la justicia","inocente MIENTRAS su culpabilidad no haya sido declarada legalmente","absuelto o condenado EN LA UNIÓN por sentencia penal firme"], "<p><b>Art. 47.</b> Toda persona (…) tiene derecho a la <mark class=\"m-destacable\">tutela judicial efectiva</mark> (…). Toda persona tiene derecho a que su causa sea oída <mark class=\"m-personalizado\">equitativa y públicamente</mark> y dentro de un <mark class=\"m-plazo\">plazo razonable</mark> por un <mark class=\"m-autoridad\">juez independiente e imparcial</mark>, establecido previamente por la ley. (…) Se prestará <mark class=\"m-destacable\">asistencia jurídica gratuita</mark> a quienes no dispongan de recursos suficientes <mark class=\"m-resp\">siempre y cuando dicha asistencia sea necesaria para garantizar la efectividad del acceso a la justicia</mark>.</p><p><b>Art. 48.</b> 1. Todo acusado se <mark class=\"m-destacable\">presume inocente</mark> <mark class=\"m-resp\">mientras su culpabilidad no haya sido declarada legalmente</mark>. 2. Se garantiza a todo acusado el respeto de los <mark class=\"m-destacable\">derechos de la defensa</mark>.</p><p><b>Art. 50.</b> Nadie podrá ser <mark class=\"m-accion\">juzgado o condenado</mark> penalmente por una infracción respecto de la cual ya haya sido absuelto o condenado <mark class=\"m-resp\">en la Unión mediante sentencia penal firme conforme a la ley</mark>.</p>")
  + bloqueTitulo("TÍTULO VII. DISPOSICIONES GENERALES QUE RIGEN LA INTERPRETACIÓN Y LA APLICACIÓN DE LA CARTA")
  + articuloResp("Artículos 51 y 52 — Ámbito de aplicación y alcance de los derechos y principios", ["Carta: NO amplía el ámbito del Derecho de la Unión, NO crea competencias, NO modifica las de los Tratados","derechos del CEDH: mismo sentido y alcance, sin obstar a una protección MÁS EXTENSA","principios: SOLO alegables en la interpretación y control de legalidad de los actos"], "<p><b>Art. 51.</b> 1. Las disposiciones de la presente Carta están dirigidas a las <mark class=\"m-autoridad\">instituciones, órganos y organismos de la Unión</mark>, dentro del respeto del <mark class=\"m-destacable\">principio de subsidiariedad</mark>, así como a los <mark class=\"m-autoridad\">Estados miembros</mark> <u class=\"m-clave\">únicamente cuando</u> apliquen el <mark class=\"m-destacable\">Derecho de la Unión</mark>. (…)</p><p><b>2.</b> La presente Carta <mark class=\"m-resp\">no amplía el ámbito de aplicación del Derecho de la Unión</mark> más allá de las competencias de la Unión, <mark class=\"m-resp\">ni crea ninguna competencia o misión nuevas</mark> para la Unión, <mark class=\"m-resp\">ni modifica las competencias y misiones definidas en los Tratados</mark>.</p><p><b>Art. 52.</b> 1. Cualquier <mark class=\"m-destacable\">limitación</mark> del ejercicio de los derechos y libertades (…) <u class=\"m-clave\">deberá</u> ser establecida por la <mark class=\"m-destacable\">ley</mark> y respetar el <mark class=\"m-destacable\">contenido esencial</mark> (…).</p><p><b>3.</b> En la medida en que la presente Carta contenga derechos que correspondan a derechos garantizados por el <mark class=\"m-destacable\">Convenio Europeo para la Protección de los Derechos Humanos</mark> (…), <mark class=\"m-resp\">su sentido y alcance serán iguales a los que les confiere dicho Convenio</mark>. Esta disposición <mark class=\"m-resp\">no obstará a que el Derecho de la Unión conceda una protección más extensa</mark>.</p><p><b>5.</b> Las disposiciones de la presente Carta que contengan <mark class=\"m-destacable\">principios</mark> <u class=\"m-clave\">podrán</u> aplicarse mediante actos legislativos y ejecutivos (…). <mark class=\"m-resp\">Sólo podrán alegarse ante un órgano jurisdiccional en lo que se refiere a la interpretación y control de la legalidad de dichos actos</mark>.</p>", true);
/* T1_COE */ T1.coe = bloqueTitulo("1.3 — ESTATUTO DEL CONSEJO DE EUROPA, HECHO EN LONDRES EL 5 DE MAYO DE 1949 (España: miembro de pleno derecho desde el 24-11-1977)")
  + bloqueTitulo("CAPÍTULO I. FINALIDAD DEL CONSEJO DE EUROPA")
  + articuloResp("Artículo 1 — Finalidad · R11", ["unión más estrecha para salvaguardar ideales y principios","la DEFENSA NACIONAL no es competencia del Consejo de Europa"], "<p>a) La <mark class=\"m-destacable\">finalidad</mark> del Consejo de Europa consiste en realizar <mark class=\"m-destacable\">unión más estrecha</mark> entre sus miembros para <mark class=\"m-accion\">salvaguardar y promover</mark> los <mark class=\"m-destacable\">ideales y los principios</mark> que constituyen su <mark class=\"m-personalizado\">patrimonio común</mark> y favorecer su <mark class=\"m-destacable\">progreso económico y social</mark>.</p><p>b) Esta finalidad se perseguirá a través de los órganos del Consejo, mediante el examen de los asuntos de interés común, la conclusión de acuerdos y la adopción de una acción conjunta en los campos económicos, social, cultural, científico, jurídico y administrativo, así como la salvaguardia y la mayor efectividad de los <mark class=\"m-destacable\">derechos humanos y las libertades fundamentales</mark>.</p><p>c) La participación de los Miembros en los trabajos del Consejo de Europa <u class=\"m-clave\">no</u> debe alterar su contribución a la obra de las <mark class=\"m-autoridad\">Naciones Unidas</mark> (…).</p><p>d) Los asuntos relativos a la <mark class=\"m-destacable\">defensa nacional</mark> <mark class=\"m-resp\">no son de competencia del Consejo de Europa</mark>.</p>")
  + bloqueTitulo("CAPÍTULO II. COMPOSICIÓN")
  + articuloResp("Artículos 3, 4, 5 y 6 — Principios, miembros y miembros asociados", ["principio del IMPERIO DEL DERECHO y derechos humanos","invita el COMITÉ DE MINISTROS","Miembro tan pronto como se remita al Secretario General el instrumento de adhesión","asociados: SOLO representados en la ASAMBLEA CONSULTIVA"], "<p><b>Art. 3.</b> Cada uno de los Miembros del Consejo de Europa reconoce el principio <mark class=\"m-resp\">del imperio del Derecho</mark> y el principio en virtud del cual cualquier persona que se halle bajo su jurisdicción ha de gozar de los <mark class=\"m-destacable\">derechos humanos y de las libertades fundamentales</mark>, y se compromete a colaborar <mark class=\"m-personalizado\">sincera y activamente</mark> en la consecución de la finalidad definida en el capítulo primero.</p><p><b>Art. 4.</b> Cualquier <mark class=\"m-autoridad\">Estado europeo</mark>, considerado capaz de cumplir las posiciones del artículo 3, y que tenga voluntad de hacerlo <u class=\"m-clave\">podrá</u> ser <mark class=\"m-accion\">invitado</mark> por el <mark class=\"m-autoridad\">Comité de Ministros</mark> a convertirse en Miembro del Consejo de Europa. El Estado así invitado tendrá la calidad de Miembro <mark class=\"m-resp\">tan pronto como se remita en su nombre al Secretario General un instrumento de adhesión</mark> al presente Estatuto.</p><p><b>Art. 5.</b> a) En <mark class=\"m-personalizado\">circunstancias especiales</mark>, un país europeo (…) <u class=\"m-clave\">podrá</u> ser invitado por el <mark class=\"m-autoridad\">Comité de Ministros</mark> a hacerse <mark class=\"m-destacable\">Miembro asociado</mark> (…). Los miembros asociados <u class=\"m-clave\">únicamente</u> tendrán derecho a estar representados en la <mark class=\"m-resp\">Asamblea Consultiva</mark>. b) El término «Miembro» (…) se refiere también a los Miembros asociados, <u class=\"m-clave\">salvo</u> cuando se trate de la representación en el Comité de Ministros.</p><p><b>Art. 6.</b> <u class=\"m-clave\">Antes</u> de dirigir la invitación (…), el <mark class=\"m-autoridad\">Comité de Ministros</mark> <mark class=\"m-accion\">determinará</mark> el <mark class=\"m-destacable\">número de representantes</mark> a que el futuro Miembro tendrá derecho en la Asamblea Consultiva y su parte proporcional de <mark class=\"m-destacable\">contribución financiera</mark>.</p>", true)
  + articuloResp("Artículos 7, 8 y 9 — Retirada y suspensión · R12", ["retirada: notificando al Secretario General","primeros 9 meses: efecto al concluir el año financiero EN CURSO","últimos 3 meses: al finalizar el año financiero SIGUIENTE","infracción grave del art. 3: suspender representación e invitar a retirarse","deudas: suspender representación en el Comité y en la Asamblea"], "<p><b>Art. 7.</b> Cualquier Miembro del Consejo de Europa <u class=\"m-clave\">podrá</u> <mark class=\"m-accion\">retirarse</mark> del mismo notificando su decisión al <mark class=\"m-autoridad\">Secretario General</mark>. La notificación <mark class=\"m-accion\">surtirá efecto</mark> <mark class=\"m-resp\">al concluir el año financiero en curso, si tuvo lugar en los primeros nueve meses de este año, y al finalizar el año financiero siguiente, si se realizó en los tres últimos meses</mark>.</p><p><b>Art. 8.</b> El <mark class=\"m-autoridad\">Comité de Ministros</mark> del Consejo de Europa <u class=\"m-clave\">podrá</u> <mark class=\"m-resp\">dejar en suspenso el derecho de representación</mark> del Miembro del Consejo de Europa que <mark class=\"m-personalizado\">infrinja gravemente</mark> lo dispuesto en el artículo 3 (imperio del Derecho y derechos humanos), <mark class=\"m-resp\">e invitarle a retirarse</mark> en las condiciones previstas en el artículo 7. <u class=\"m-clave\">Si no</u> atiende a dicha invitación, el Comité puede decidir que el Miembro de que se trata ha <mark class=\"m-accion\">cesado</mark> de pertenecer al Consejo a partir de una fecha que determinará el propio Comité.</p><p><b>Art. 9.</b> <u class=\"m-clave\">Cuando</u> un Miembro <u class=\"m-clave\">no</u> cumpla sus <mark class=\"m-destacable\">obligaciones financieras</mark>, el <mark class=\"m-autoridad\">Comité de Ministros</mark> <u class=\"m-clave\">podrá</u> <mark class=\"m-resp\">suspender su derecho de representación en el Comité y en la Asamblea Consultiva durante el tiempo en que deje de satisfacer dichas obligaciones</mark>.</p>", true)
  + bloqueTitulo("CAPÍTULO III. DISPOSICIONES GENERALES")
  + articuloResp("Artículos 10, 11 y 12 — Órganos, sede e idiomas", ["órganos: COMITÉ DE MINISTROS y ASAMBLEA CONSULTIVA (asistidos por la Secretaría)","sede: ESTRASBURGO","idiomas oficiales: FRANCÉS E INGLÉS"], "<p><b>Art. 10.</b> Los <mark class=\"m-destacable\">órganos</mark> del Consejo de Europa son: i) <mark class=\"m-resp\">El Comité de Ministros</mark>. ii) <mark class=\"m-resp\">La Asamblea Consultiva</mark>. Estos dos órganos serán asistidos por la <mark class=\"m-autoridad\">Secretaría</mark> del Consejo de Europa.</p><p><b>Art. 11.</b> La <mark class=\"m-destacable\">sede</mark> del Consejo de Europa es <mark class=\"m-resp\">Estrasburgo</mark>.</p><p><b>Art. 12.</b> Los <mark class=\"m-destacable\">idiomas oficiales</mark> del Consejo de Europa son <mark class=\"m-resp\">el francés y el inglés</mark>. Los Reglamentos internos del Comité de Ministros y de la Asamblea Consultiva determinarán las circunstancias y las condiciones en las cuales pueden ser empleados otros idiomas.</p>")
  + trampa("Trampa de examen", "La sede del Consejo de Europa (y del TEDH) es Estrasburgo; la de la Corte Penal Internacional es La Haya. El Estatuto se hizo en Londres.")
  + bloqueTitulo("CAPÍTULO IV. EL COMITÉ DE MINISTROS")
  + articuloResp("Artículos 13, 14 y 15 — Naturaleza y composición del Comité · R13", ["un representante y un voto por Miembro","representantes: los MINISTROS DE ASUNTOS EXTERIORES","suplente: si es posible, miembro del Gobierno","conclusiones: recomendaciones a los Gobiernos"], "<p><b>Art. 13.</b> El <mark class=\"m-autoridad\">Comité de Ministros</mark> es el <mark class=\"m-destacable\">órgano competente</mark> que actúa en nombre del Consejo de Europa con arreglo a los artículos 15 y 16.</p><p><b>Art. 14.</b> Cada Miembro tendrá <mark class=\"m-plazo\">un representante</mark> en el Comité de Ministros y cada representante tiene <mark class=\"m-plazo\">un voto</mark>. Los representantes en el Comité son <mark class=\"m-resp\">los Ministros de Asuntos Exteriores</mark>. Cuando un Ministro de Asuntos Exteriores no pueda asistir a las sesiones, o cuando otras circunstancias lo aconsejen, <u class=\"m-clave\">podrá</u> designarse un <mark class=\"m-destacable\">suplente</mark> que actúe en su lugar; éste será, en la medida de lo posible, un <mark class=\"m-personalizado\">miembro del Gobierno de su país</mark>.</p><p><b>Art. 15.</b> a) El Comité de Ministros <mark class=\"m-accion\">examinará</mark>, por recomendación de la Asamblea Consultiva o por iniciativa propia, las medidas adecuadas para realizar la finalidad del Consejo de Europa (…). b) Las conclusiones del Comité de Ministros <u class=\"m-clave\">podrán</u> (…) revestir la forma de <mark class=\"m-destacable\">recomendaciones a los Gobiernos</mark>.</p>")
  + articuloResp("Artículos 16, 17 y 18 — Organización interior y Reglamento interno del Comité", ["resuelve con carácter OBLIGATORIO la organización y el régimen interior","el Reglamento interno determinará: el QUÓRUM, la designación del Presidente…"], "<p><b>Art. 16.</b> <u class=\"m-clave\">Sin perjuicio</u> de los poderes de la Asamblea Consultiva (…), el Comité de Ministros <mark class=\"m-accion\">resolverá</mark>, con <mark class=\"m-personalizado\">carácter obligatorio</mark>, cualquier cuestión relativa a la <mark class=\"m-destacable\">organización y el régimen interior</mark> del Consejo de Europa. Con este fin adoptará los reglamentos financieros y administrativos necesarios.</p><p><b>Art. 17.</b> El Comité de Ministros <u class=\"m-clave\">podrá</u> <mark class=\"m-accion\">constituir</mark> Comités o Comisiones de carácter <mark class=\"m-personalizado\">consultivo o técnico</mark> (…).</p><p><b>Art. 18.</b> El Comité de Ministros adoptará su <mark class=\"m-destacable\">Reglamento interno</mark>, que determinará <u class=\"m-clave\">especialmente</u>: i) <mark class=\"m-resp\">El quórum</mark>; ii) La forma de designación del <mark class=\"m-autoridad\">Presidente</mark> y la duración de sus funciones; iii) El procedimiento que ha de seguirse para incluir temas en el orden del día, así como para presentar propuestas de resoluciones; iv) Las condiciones en que se notificará la designación de los suplentes (…).</p>")
  + articuloResp("Artículo 20 — Mayorías del Comité de Ministros", ["cuestiones importantes: UNANIMIDAD de los votos emitidos + mayoría de los representantes","reglamento interno y regímenes financiero y administrativo: MAYORÍA SIMPLE","arts. 4 y 5 (nuevos miembros): DOS TERCIOS de los representantes","demás: dos tercios de los votos emitidos + mayoría de representantes"], "<p>a) Se adoptarán por <mark class=\"m-plazo\">unanimidad de los votos emitidos</mark>, y por <mark class=\"m-plazo\">mayoría de los representantes</mark> con derecho a participar en las sesiones del Comité de Ministros, las resoluciones relativas a las siguientes <mark class=\"m-personalizado\">cuestiones importantes</mark>: i) las recomendaciones a que se refiere el artículo 15 b); ii) las del artículo 19 (informes a la Asamblea); iii) las del artículo 21, a) y b) (reuniones y publicidad); iv) las del artículo 33 (sede de las sesiones de la Asamblea); v) las recomendaciones relativas a las enmiendas de los artículos 1 d), 7, 15, 20 y 22; vi) (…).</p><p>b) Las cuestiones que se planteen como consecuencia del <mark class=\"m-destacable\">reglamento interno</mark> o de los <mark class=\"m-destacable\">regímenes financiero y administrativo</mark> <u class=\"m-clave\">podrán</u> resolverse por <mark class=\"m-resp\">mayoría simple de los representantes con derecho a formar parte del Comité</mark>.</p><p>c) Las resoluciones del Comité, adoptadas en cumplimiento de los <mark class=\"m-destacable\">artículos 4 y 5</mark> (invitación a Miembros y Miembros asociados), <u class=\"m-clave\">requerirán</u> una <mark class=\"m-resp\">mayoría de los dos tercios de los representantes con derecho a participar en las sesiones del Comité</mark>.</p><p>d) Todas las demás resoluciones del Comité se adoptarán por <mark class=\"m-plazo\">mayoría de dos tercios de los votos emitidos</mark> y por la <mark class=\"m-plazo\">mayoría de los representantes</mark> con derecho a formar parte de aquél, incluso y especialmente   + articuloResp("Artículo 21 — Reuniones del Comité de Ministros", ["salvo acuerdo en contrario: A PUERTA CERRADA y EN LA SEDE del Consejo","se reúne obligatoriamente antes de la apertura de las reuniones de la Asamblea y al comienzo"], "<p>a) <u class=\"m-clave\">Salvo</u> acuerdo en contrario del Comité de Ministros, sus reuniones se celebrarán: i) <mark class=\"m-resp\">A puerta cerrada</mark>; ii) <mark class=\"m-resp\">En la sede del Consejo</mark>.</p><p>b) El Comité resolverá en cuanto a la información que haya de publicarse acerca de las deliberaciones a puerta cerrada y sus conclusiones.</p><p>c) El Comité se reunirá <u class=\"m-clave\">obligatoriamente</u> <u class=\"m-clave\">antes</u> de la apertura de las reuniones de la Asamblea Consultiva y al comienzo de estas reuniones; se reunirá, además, cuantas veces lo estime conveniente.</p><p><i>Recuerda (temario): para las reuniones a puerta abierta y para publicar información de las deliberaciones a puerta cerrada se decide por <mark class=\"m-plazo\">unanimidad</mark> y <mark class=\"m-plazo\">mayoría de los representantes</mark>.</i></p>")
  + bloqueTitulo("CAPÍTULO V. LA ASAMBLEA CONSULTIVA")
  + articuloResp("Artículos 22 y 25 — Asamblea Consultiva: naturaleza y representantes · R14", ["órgano DELIBERANTE","transmite sus conclusiones al Comité en forma de RECOMENDACIONES","representantes: nacionalidad del Miembro y NO miembros a la vez del Comité de Ministros"], "<p><b>Art. 22.</b> La <mark class=\"m-autoridad\">Asamblea Consultiva</mark> es el <mark class=\"m-destacable\">órgano deliberante</mark> del Consejo de Europa. Deliberará acerca de los asuntos que sean de su competencia (…) y <mark class=\"m-accion\">transmitirá</mark> sus conclusiones al <mark class=\"m-autoridad\">Comité de Ministros</mark> bajo la forma de <mark class=\"m-resp\">recomendaciones</mark>.</p><p><b>Art. 25.</b> a) La Asamblea Consultiva estará constituida por representantes de cada Miembro, elegidos por su <mark class=\"m-autoridad\">Parlamento</mark> de entre los miembros de éste o designados (…). Cada uno de los representantes <mark class=\"m-resp\">tendrá la nacionalidad del Miembro que represente y no podrá ser a la vez miembro del Comité de Ministros</mark>. (…) b) Ningún representante podrá ser privado de su puesto en el curso de una reunión de la Asamblea <u class=\"m-clave\">sin</u> el consentimiento de ésta. c) Cada representante <u class=\"m-clave\">podrá</u> tener un <mark class=\"m-destacable\">suplente</mark> (…).</p>", true)
  + articuloResp("Artículos 26 y 28 — Número de representantes y Presidente de la Asamblea", ["ESPAÑA: 12 representantes","Presidente: dirige las deliberaciones pero NO participa en los debates ni en la votación","vota su suplente"], "<p><b>Art. 26.</b> Los Miembros tienen derecho al número de representantes que se indica: Austria 6 · Bélgica 7 · Chipre 3 · Dinamarca 5 · <mark class=\"m-resp\">España 12</mark> · Francia 18 · Grecia 7 · Irlanda 4 · Islandia 3 · Italia 18 · Luxemburgo 3 · Malta 3 · Noruega 5 · Países Bajos 7 · Portugal 7 · Reino Unido 18 · República Federal de Alemania 18 · Suecia 6 · Suiza 6 · Turquía 12.</p><p><b>Art. 28.</b> a) La Asamblea Consultiva adoptará su <mark class=\"m-destacable\">Reglamento interno</mark>, y <mark class=\"m-accion\">elegirá</mark> entre sus miembros a su <mark class=\"m-autoridad\">Presidente</mark>, el cual permanecerá en el ejercicio de sus funciones hasta la <mark class=\"m-plazo\">siguiente reunión ordinaria</mark>. b) El Presidente <mark class=\"m-resp\">dirigirá las deliberaciones, pero no participará en los debates ni en la votación</mark>. El <mark class=\"m-autoridad\">suplente del Presidente</mark> <u class=\"m-clave\">podrá</u> asistir a las sesiones, hacer uso de la palabra y <mark class=\"m-accion\">votar</mark> en su lugar. c) El Reglamento interno establecerá «inter alia» (entre otras cosas): i) el <mark class=\"m-destacable\">quórum</mark>; (…)</p>")
  + trampa("Trampa de examen", "España, como Turquía, tiene 12 representantes; los «grandes» (Francia, Italia, Reino Unido y Alemania) tienen 18.")
  + articuloResp("Artículos 29 a 35 — Votaciones, sesiones y publicidad de la Asamblea · R15", ["resoluciones: DOS TERCIOS de los votos emitidos (salvo art. 30)","una sesión ordinaria al año, no más de UN MES","ordinarias en la sede del Consejo","deliberaciones PÚBLICAS, salvo que ella acuerde lo contrario"], "<p><b>Art. 29.</b> <u class=\"m-clave\">Sin perjuicio</u> de lo dispuesto en el artículo 30 (cuestiones de procedimiento), todas las resoluciones de la Asamblea Consultiva se tomarán por <mark class=\"m-resp\">mayoría de los dos tercios de los votos emitidos</mark>, incluso las que tengan por objeto: i) hacer recomendaciones al Comité de Ministros; ii) proponer al Comité los asuntos que han de ser inscritos en el programa de la Asamblea; iii) crear Comités o Comisiones; iv) fijar la fecha de la apertura de las sesiones; y v) determinar la mayoría requerida (…).</p><p><b>Art. 30.</b> Las resoluciones de la Asamblea Consultiva sobre las <mark class=\"m-destacable\">cuestiones de procedimiento</mark>, y en particular la elección de los miembros de la Mesa, (…) se adoptarán por la mayoría que la Asamblea determine de acuerdo con el artículo 29 (v).</p><p><b>Art. 32.</b> La Asamblea Consultiva celebrará <mark class=\"m-plazo\">cada año</mark> una <mark class=\"m-destacable\">sesión ordinaria</mark> (…). La duración de las reuniones ordinarias <mark class=\"m-resp\">no excederá de un mes</mark>, <u class=\"m-clave\">a no ser que</u> la Asamblea y el Comité de Ministros resuelvan en contrario de común acuerdo.</p><p><b>Art. 33.</b> Las sesiones ordinarias de la Asamblea Consultiva se celebrarán en la <mark class=\"m-destacable\">sede del Consejo</mark>, <u class=\"m-clave\">salvo</u> decisión en contrario adoptada de común acuerdo por la Asamblea y el Comité de Ministros.</p><p><b>Art. 34.</b> La Asamblea Consultiva <u class=\"m-clave\">podrá</u> convocarse para una <mark class=\"m-destacable\">sesión extraordinaria</mark> por iniciativa del <mark class=\"m-autoridad\">Comité de Ministros</mark> o del <mark class=\"m-autoridad\">Presidente de la Asamblea</mark>, previo acuerdo entre ellos (…).</p><p><b>Art. 35.</b> Las deliberaciones de la Asamblea Consultiva serán <mark class=\"m-resp\">públicas, a menos que ella misma acuerde lo contrario</mark>.</p>")
  + trampa("Trampa de examen", "Comité de Ministros = A PUERTA CERRADA (art. 21); Asamblea Consultiva = PÚBLICAS (art. 35). Comité: unanimidad para las cuestiones importantes; Asamblea: dos tercios de los votos emitidos.")
  + bloqueTitulo("CAPÍTULOS VI y VII. LA SECRETARÍA Y FINANCIACIÓN")
  + articuloResp("Artículos 36 y 37 — La Secretaría", ["Secretario General y Adjunto: nombrados por la ASAMBLEA CONSULTIVA por recomendación del COMITÉ DE MINISTROS","el Secretario General responde ante el Comité de Ministros"], "<p><b>Art. 36.</b> a) La <mark class=\"m-autoridad\">Secretaría</mark> estará compuesta por: un <mark class=\"m-autoridad\">Secretario General</mark>, un <mark class=\"m-autoridad\">Secretario General Adjunto</mark> y el personal necesario. b) El Secretario General y el Secretario General Adjunto serán <mark class=\"m-resp\">nombrados por la Asamblea Consultiva por recomendación del Comité de Ministros</mark>. c) Los restantes miembros de la Secretaría serán nombrados por el <mark class=\"m-autoridad\">Secretario General</mark> con arreglo al Reglamento administrativo. d) Ningún miembro de la Secretaría <u class=\"m-clave\">podrá</u> desempeñar un cargo remunerado por un Gobierno, ser miembro de la Asamblea Consultiva o de un Parlamento nacional (…).</p><p><b>Art. 37.</b> a) La Secretaría estará instalada en la <mark class=\"m-destacable\">sede del Consejo</mark>. b) El <mark class=\"m-autoridad\">Secretario General</mark> es <mark class=\"m-destacable\">responsable</mark> de la actividad de la Secretaría ante el <mark class=\"m-autoridad\">Comité de Ministros</mark>. (…)</p>")
  + articuloResp("Artículos 38 y 39 — Financiación", ["gastos comunes: en las proporciones que fije el Comité SEGÚN EL CENSO DE POBLACIÓN","contribuciones exigibles el día de la notificación y abonadas en un máximo de SEIS MESES"], "<p><b>Art. 38.</b> a) Cada miembro <mark class=\"m-accion\">sufragará</mark> los gastos de su propia representación en el Comité de Ministros y en la Asamblea Consultiva. b) Los gastos de la Secretaría y cualesquiera otros gastos comunes se <mark class=\"m-accion\">repartirán</mark> entre los miembros <mark class=\"m-resp\">en las proporciones que fijará el Comité según el censo de la población de cada uno de los miembros</mark>. El Comité fijará las contribuciones de los miembros asociados. c) El <mark class=\"m-autoridad\">Secretario General</mark> someterá <mark class=\"m-plazo\">todos los años</mark> el <mark class=\"m-destacable\">presupuesto</mark> del Consejo a la aprobación del Comité (…).</p><p><b>Art. 39.</b> El Secretario General notificará <mark class=\"m-plazo\">todos los años</mark> a los Gobiernos de los Miembros la suma a que asciende su contribución. Las contribuciones se considerarán <mark class=\"m-personalizado\">exigibles</mark> el día mismo de esta notificación, y se abonarán al Secretario General en el <mark class=\"m-resp\">plazo máximo de seis meses</mark>.</p>")
  + bloqueTitulo("CAPÍTULOS IX y X. ENMIENDAS Y DISPOSICIONES FINALES")
  + articuloResp("Artículos 41 y 42 — Enmiendas y entrada en vigor", ["Protocolos de enmienda: firmados y ratificados por las DOS TERCERAS PARTES de los Miembros","arts. 23 a 35, 38 y 39: en la fecha del ACTA «AD HOC» del Secretario General","vigor del Estatuto: SIETE instrumentos de ratificación","hecho en LONDRES el 5 de mayo de 1949"], "<p><b>Art. 41.</b> a) <u class=\"m-clave\">Podrán</u> hacerse proposiciones de enmienda del presente Estatuto al <mark class=\"m-autoridad\">Comité de Ministros</mark> o, en las condiciones previstas en el artículo 23, a la <mark class=\"m-autoridad\">Asamblea Consultiva</mark>. b) El Comité recomendará, y dispondrá que se incorporen a un <mark class=\"m-destacable\">Protocolo</mark>, las enmiendas al Estatuto que estime conveniente. c) Cada uno de los Protocolos de enmienda <mark class=\"m-accion\">entrará en vigor</mark> <mark class=\"m-resp\">una vez firmado y ratificado por las dos terceras partes de los Miembros</mark>. d) <u class=\"m-clave\">No obstante</u> (…), las enmiendas a los <mark class=\"m-destacable\">artículos 23 a 35, 38 y 39</mark>, que hayan sido aprobadas por el Comité y la Asamblea, entrarán en vigor <mark class=\"m-resp\">en la fecha del acta «ad hoc» del Secretario General comunicada a los Gobiernos de los Miembros</mark> en que se certifique la aprobación otorgada a dichas enmiendas. (…)</p><p><b>Art. 42.</b> a) El presente Estatuto se someterá a <mark class=\"m-destacable\">ratificación</mark>. Las ratificaciones se depositarán en poder del <mark class=\"m-autoridad\">Gobierno del Reino Unido</mark> de Gran Bretaña e Irlanda del Norte. b) El presente Estatuto estará en vigor una vez depositados <mark class=\"m-resp\">siete instrumentos de ratificación</mark>. (…)</p><p>Hecho en <mark class=\"m-resp\">Londres, a los cinco días del mes de mayo de 1949</mark>, en inglés y francés (…). España depositó su Instrumento de Adhesión el <mark class=\"m-plazo\">24 de noviembre de 1977</mark> y es miembro de pleno derecho desde esa fecha (art. 4).</p>");
/* T1_CEDH */ T1.cedh = bloqueTitulo("1.4 — CONVENIO PARA LA PROTECCIÓN DE LOS DERECHOS HUMANOS Y DE LAS LIBERTADES FUNDAMENTALES (CEDH), HECHO EN ROMA EL 4 DE NOVIEMBRE DE 1950, Y SUS PROTOCOLOS")
  + bloqueTitulo("TÍTULO I. DERECHOS Y LIBERTADES")
  + articuloResp("Artículos 2, 4 y 5 — Vida, trabajo forzado y libertad · R16", ["fuerza absolutamente necesaria: legítima defensa, detener o impedir la evasión, reprimir una revuelta (NO ejecutar una expulsión)","NO es trabajo forzado: obligaciones cívicas NORMALES (no «especiales»)","informado en el más breve plazo y en una lengua que comprenda"], "<p><b>Art. 2.</b> 1. El derecho de toda persona a la <mark class=\"m-destacable\">vida</mark> está protegido por la <mark class=\"m-destacable\">Ley</mark>. Nadie podrá ser privado de su vida <mark class=\"m-personalizado\">intencionadamente</mark>, <u class=\"m-clave\">salvo</u> en ejecución de una condena que imponga <mark class=\"m-destacable\">pena capital</mark> dictada por un tribunal (…). 2. La muerte <u class=\"m-clave\">no</u> se considerará infligida con infracción del presente artículo <u class=\"m-clave\">cuando</u> se produzca como consecuencia de un recurso a la fuerza que sea <mark class=\"m-personalizado\">absolutamente necesario</mark>: a) <mark class=\"m-resp\">En defensa de una persona contra una agresión ilegítima</mark>. b) <mark class=\"m-resp\">Para detener a una persona conforme a derecho o para impedir la evasión de un preso o detenido legalmente</mark>. c) <mark class=\"m-resp\">Para reprimir, de acuerdo con la ley, una revuelta o insurrección</mark>.</p><p><b>Art. 3.</b> Nadie podrá ser sometido a <mark class=\"m-destacable\">tortura</mark> ni a penas o tratos <mark class=\"m-destacable\">inhumanos o degradantes</mark>.</p><p><b>Art. 4.</b> 1. Nadie podrá ser sometido a <mark class=\"m-destacable\">esclavitud o servidumbre</mark>. 2. Nadie podrá ser constreñido a realizar un <mark class=\"m-destacable\">trabajo forzado u obligatorio</mark>. 3. <u class=\"m-clave\">No</u> se considera como «trabajo forzado u obligatorio» (…): a) todo trabajo exigido normalmente a una persona <mark class=\"m-personalizado\">privada de libertad</mark> (…) o durante su libertad condicional; b) todo servicio de <mark class=\"m-destacable\">carácter militar</mark> o, en el caso de <mark class=\"m-destacable\">objetores de conciencia</mark> (…), cualquier otro servicio sustitutivo (…); c) todo servicio exigido cuando alguna <mark class=\"m-destacable\">emergencia o calamidad</mark> amenacen la vida o el bienestar de la comunidad; d) todo trabajo o servicio que forme parte de las <mark class=\"m-resp\">obligaciones cívicas normales</mark>.</p><p><b>Art. 5.</b> 1. Toda persona tiene derecho a la <mark class=\"m-destacable\">libertad y a la seguridad</mark>. Nadie puede ser privado de su libertad, <u class=\"m-clave\">salvo</u> en los casos siguientes y con arreglo al procedimiento establecido por la ley: (…) 2. Toda persona <mark class=\"m-personalizado\">detenida preventivamente</mark> debe ser informada, <mark class=\"m-resp\">en el más breve plazo</mark> (no dice «en el momento de la detención») <mark class=\"m-resp\">y en una lengua que comprenda</mark>, de los <mark class=\"m-destacable\">motivos de su detención</mark> y de cualquier acusación formulada contra ella. 3. (…) deberá ser conducida <mark class=\"m-plazo\">sin dilación</mark> a presencia de un <mark class=\"m-autoridad\">juez</mark> (…) y tendrá derecho a ser juzgada en un <mark class=\"m-plazo\">plazo razonable</mark> o a ser puesta en libertad durante el procedimiento. (…)</p>", true)
  + trampa("Trampa de examen", "Pregunta oficial sobre el art. 4.3: la opción INCORRECTA es la que habla de obligaciones cívicas «especiales»; el texto dice «normales».")
  + articuloResp("Artículos 6, 12, 15 y 16 — Proceso equitativo, matrimonio, derogación y actividad política de extranjeros", ["intérprete GRATUITO si no comprende o no habla la lengua de la Audiencia","matrimonio a partir de la EDAD NÚBIL, según las leyes nacionales","NO derogables: arts. 2 (salvo actos lícitos de guerra), 3, 4.1 y 7","restricciones a extranjeros: arts. 10, 11 y 14"], "<p><b>Art. 6.</b> 1. Toda persona tiene derecho a que su causa sea oída <mark class=\"m-personalizado\">equitativa, públicamente</mark> y dentro de un <mark class=\"m-plazo\">plazo razonable</mark>, por un <mark class=\"m-autoridad\">Tribunal independiente e imparcial</mark>, establecido por la Ley (…). 2. Toda persona acusada de una infracción se <mark class=\"m-destacable\">presume inocente</mark> hasta que su culpabilidad haya sido legalmente declarada. 3. Todo acusado tiene, <u class=\"m-clave\">como mínimo</u>, los siguientes derechos: a) a ser informado, en el más breve plazo, en una lengua que comprenda y detalladamente, de la naturaleza y de la causa de la acusación (…); (…) e) a ser asistido <mark class=\"m-personalizado\">gratuitamente</mark> de un <mark class=\"m-destacable\">intérprete</mark>, <mark class=\"m-resp\">si no comprende o no habla la lengua empleada en la Audiencia</mark>.</p><p><b>Art. 12.</b> <mark class=\"m-resp\">A partir de la edad núbil</mark>, el hombre y la mujer tienen derecho a <mark class=\"m-destacable\">casarse y a fundar una familia</mark> <mark class=\"m-resp\">según las leyes nacionales</mark> que rijan el ejercicio de este derecho.</p><p><b>Art. 15.</b> 1. En caso de <mark class=\"m-destacable\">guerra</mark> o de otro <mark class=\"m-destacable\">peligro público</mark> que amenace la vida de la nación, cualquier Alta Parte Contratante <u class=\"m-clave\">podrá</u> tomar medidas que <mark class=\"m-accion\">deroguen</mark> las obligaciones previstas en el presente Convenio en la <mark class=\"m-personalizado\">medida estricta</mark> en que lo
