["Título","Tema siete. El Tribunal Constitucional. Empezamos con la Ley Orgánica dos de mil novecientos setenta y nueve, la ley del propio Tribunal. Es la parte que más cae en el examen, así que vamos despacio y con las frases tal cual las dice la ley."],
["Artículo 1 · Naturaleza","Empieza diciéndonos qué es. Atento: «El Tribunal Constitucional, como intérprete supremo de la Constitución, es independiente de los demás órganos constitucionales y está sometido sólo a la Constitución y a la presente Ley Orgánica». Fíjate: sometido sólo a la Constitución y a su ley orgánica, y a nada más. Por eso es falso que esté sometido a la Ley Orgánica del Poder Judicial. Y sigue: «Es único en su orden y extiende su jurisdicción a todo el territorio nacional»."],
["Artículo 2 · Competencias","Ahora, qué asuntos lleva. La ley lo abre así: «El Tribunal Constitucional conocerá en los casos y en la forma que esta Ley determina». Y enumera. Primero: «Del recurso y de la cuestión de inconstitucionalidad contra Leyes, disposiciones normativas o actos con fuerza de Ley». Segundo: «Del recurso de amparo por violación de los derechos y libertades públicos relacionados en el artículo cincuenta y tres, dos de la Constitución», es decir, los artículos catorce a veintinueve y la objeción de conciencia del treinta. Tercero: «De los conflictos constitucionales de competencia entre el Estado o las Comunidades Autónomas o de los de éstas entre sí». Cuarto: «De los conflictos en defensa de la autonomía local». Quinto: «De la declaración sobre la constitucionalidad de los Tratados Internacionales». Y por último: «De la verificación de los nombramientos de los Magistrados del Tribunal Constitucional, para juzgar si los mismos reúnen los requisitos requeridos por la Constitución y la presente Ley». Cuando te pregunten por algo que no esté en esta lista, desconfía."],
["Artículo 3 · Cuestiones prejudiciales e incidentales","Un artículo corto, pero con trampa. Dice: «La competencia del Tribunal Constitucional se extiende al conocimiento y decisión de las cuestiones prejudiciales e incidentales no pertenecientes al orden constitucional, directamente relacionadas con la materia de que conoce, a los solos efectos del enjuiciamiento constitucional de ésta». Quédate con el final: a los solos efectos del enjuiciamiento constitucional. Puede mirar esas cuestiones, pero solo para poder juzgar lo constitucional."],
["Artículo 4 · Defensa de su jurisdicción","Aquí el Tribunal se blinda: «En ningún caso se podrá promover cuestión de jurisdicción o competencia al Tribunal Constitucional». Él mismo «delimitará el ámbito de su jurisdicción y adoptará cuantas medidas sean necesarias para preservarla, incluyendo la declaración de nulidad de aquellos actos o resoluciones que la menoscaben», y puede apreciar su competencia «de oficio o a instancia de parte». Y la frase final, muy preguntada: sus resoluciones «no podrán ser enjuiciadas por ningún órgano jurisdiccional del Estado»."],
["Artículo 5 · Composición","Corto y de memoria: «El Tribunal Constitucional está integrado por doce miembros, con el título de Magistrados del Tribunal Constitucional». Doce."],
["Artículo 6 · Pleno, Sala y Sección","Cómo actúa: «El Tribunal Constitucional actúa en Pleno, en Sala o en Sección». Pleno, Sala o Sección; no hay Gran Sala. Y del Pleno dice: «El Pleno está integrado por todos los Magistrados del Tribunal. Lo preside el Presidente del Tribunal y, en su defecto, el Vicepresidente y a falta de ambos, el Magistrado más antiguo en el cargo y en caso de igual antigüedad, el de mayor edad». Es una cadena: Presidente, Vicepresidente, más antiguo, mayor de edad."],
["Artículo 7 · Las Salas","Los doce se reparten así: «El Tribunal Constitucional consta de dos Salas. Cada Sala está compuesta por seis Magistrados nombrados por el Tribunal en Pleno». Y las presidencias, que cae mucho: «El Presidente del Tribunal lo es también de la Sala Primera», y «El Vicepresidente del Tribunal presidirá en la Sala Segunda». En su defecto, en ambas, «el Magistrado más antiguo o en caso de igual antigüedad, el de mayor edad». Truco: primero con primera, segundo con segunda."],
["Artículo 8 · Las Secciones","Las Secciones hacen el trabajo de filtro. Se constituyen «para el despacho ordinario y la decisión o propuesta, según proceda, sobre la admisibilidad o inadmisibilidad de procesos constitucionales», y están «compuestas por el respectivo Presidente o quien le sustituya y dos Magistrados». Tres personas. Después: «Se dará cuenta al Pleno de las propuestas de admisión o inadmisión de asuntos de su competencia. En el caso de admisión, el Pleno podrá deferir a la Sala que corresponda el conocimiento del asunto de que se trate». Y por último: podrá corresponder a las Secciones «el conocimiento y resolución de aquellos asuntos de amparo que la Sala correspondiente les defiera»."],
["Artículo 9 · Presidente y Vicepresidente","Cómo se elige al jefe. Según el esquema, «el Pleno elige de entre sus miembros, por votación secreta, a su Presidente y propone su nombramiento al Rey». En la primera votación hace falta mayoría absoluta; en la segunda, resulta elegido quien obtenga mayor número de votos; y si hay empate, se hace una última votación y, si se repite, decide el de mayor antigüedad en el cargo y, a igualdad, el de mayor edad. El Rey lo nombra por tres años, y es reelegible una sola vez. El Vicepresidente se elige por el mismo procedimiento y por el mismo período de tres años."],
["Artículo 10 · Competencias del Pleno","Y qué hace el Pleno. Según el esquema, conoce del control de normas: de «los recursos de inconstitucionalidad contra leyes y disposiciones con valor de ley», excepto los de mera aplicación de doctrina; de los conflictos constitucionales de competencia y de los conflictos en defensa de la autonomía local; de verificar los requisitos para el nombramiento de Magistrado, de nombrar a los Magistrados de cada Sala, de las recusaciones y de aprobar el reglamento. Y la frase que cae: el Pleno conoce de «cualquier otro asunto» que recabe para sí, «a propuesta del Presidente o de tres Magistrados». El resto, el artículo once, lo llevan las Salas."],
["Cierre","Lo que te llevas: doce Magistrados; Pleno de doce y dos Salas de seis; Presidente en la Primera y Vicepresidente en la Segunda; Secciones de tres; y la última palabra, siempre del Tribunal."]
