<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muestra narrado · Tema 7</title><style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#fff;font:16px "Segoe UI",system-ui,sans-serif}iframe{flex:1;border:0;width:100%;min-height:0}.barra{background:#0f2438;color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.barra button,.barra select{font-size:17px;padding:7px 13px;border:0;border-radius:9px;cursor:pointer}.barra .g{background:#fff;color:#0f2438;font-weight:700;min-width:100px}.barra small{opacity:.9}</style></head><body><iframe id="clave" src="repaso-t7-esquema-clave-nuevo.html" title="Esquema clave Tema 7"></iframe><div class="barra"><button id="ant">⏮</button><button id="pl" class="g">▶ Escuchar</button><button id="sig">⏭</button><select id="vel"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option></select><small id="est">Pulsa ▶: oyes el narrado y el esquema te va marcando por dónde va.</small></div><script>var T=[["Título","Tema siete. El Tribunal Constitucional. Empezamos con la ley del propio Tribunal, la Ley Orgánica dos de mil novecientos setenta y nueve. Es la parte que más cae en el examen, así que voy a contártela con mis palabras y a subrayarte las frases exactas que tienes que reconocer."],
["Artículo 1 · Naturaleza","Lo primero: qué es el Tribunal. Es el máximo intérprete de la Constitución y no depende de nadie. La frase que cae es esta: es independiente de los demás órganos constitucionales y «está sometido sólo a la Constitución y a la presente Ley Orgánica». Sólo a esas dos. Por eso es falso que esté sometido a la Ley Orgánica del Poder Judicial. Además, es «único en su orden» y su jurisdicción se extiende «a todo el territorio nacional»."],
["Artículo 2 · Competencias","Ahora, qué casos lleva. Piensa en seis bloques. Primero, el control de las leyes: el recurso y la cuestión de inconstitucionalidad. Segundo, proteger a los ciudadanos: el recurso de amparo, por los derechos de los artículos catorce a veintinueve de la Constitución y la objeción de conciencia. Tercero, los conflictos de competencia entre el Estado y las Comunidades Autónomas, o de éstas entre sí. Cuarto, los conflictos en defensa de la autonomía local. Quinto, la constitucionalidad de los Tratados Internacionales. Y sexto, la verificación de los nombramientos de sus propios Magistrados. Si te preguntan por algo fuera de esta lista, desconfía."],
["Artículo 3 · Cuestiones prejudiciales e incidentales","Aquí hay una trampa con el final de la frase. Puede decidir cuestiones que no son constitucionales, pero con un límite: sólo «a los solos efectos del enjuiciamiento constitucional de ésta». Es decir, las mira únicamente para poder juzgar lo constitucional."],
["Artículo 4 · Defensa de su jurisdicción","El Tribunal se blinda. La regla principal: «En ningún caso se podrá promover cuestión de jurisdicción o competencia al Tribunal Constitucional». Él decide hasta dónde llega y puede anular los actos que lo menoscaben. Y atento a esta frase: sus resoluciones «no podrán ser enjuiciadas por ningún órgano jurisdiccional del Estado»."],
["Artículo 5 · Composición","Un dato de memoria: son «doce miembros, con el título de Magistrados del Tribunal Constitucional». Doce."],
["Artículo 6 · Pleno, Sala y Sección","Trabaja de tres maneras: «en Pleno, en Sala o en Sección». No hay Gran Sala. El Pleno son los doce Magistrados y lo preside el Presidente. Si falta, lo sustituye el Vicepresidente; y si faltan ambos, «el Magistrado más antiguo en el cargo» y, a igual antigüedad, «el de mayor edad»."],
["Artículo 7 · Las Salas","Los doce se reparten en dos Salas: «dos Salas» de «seis Magistrados» cada una, nombrados por el Pleno. Y la trampa de las presidencias: el Presidente del Tribunal preside la Sala Primera, y el Vicepresidente, la Sala Segunda. Primero con primera, segundo con segunda."],
["Artículo 8 · Las Secciones","Las Secciones son el filtro del día a día: deciden o proponen sobre si un asunto se admite o no. Cada una la forman el Presidente de la Sala, o quien le sustituya, y dos Magistrados: tres personas. Una cosa clave: «Se dará cuenta al Pleno de las propuestas de admisión o inadmisión». Y pueden resolver amparos, pero sólo los que la Sala les defiera."],
["Artículo 9 · Presidente y Vicepresidente","Cómo se elige al jefe. El Pleno elige entre sus miembros, por votación secreta, a su Presidente, y propone su nombramiento al Rey. En la primera votación hace falta mayoría absoluta; en la segunda, gana quien tenga más votos. Si hay empate, decide la antigüedad y, a igualdad, la edad. El mandato es de tres años, y se puede repetir una sola vez. El Vicepresidente se elige igual y por el mismo período."],
["Artículo 10 · Competencias del Pleno","Qué decide el Pleno: lo grande. El control de normas, o sea los recursos de inconstitucionalidad, salvo los de mera aplicación de doctrina; los conflictos de competencia y los de autonomía local; y su propio gobierno, como verificar los nombramientos, nombrar a los Magistrados de cada Sala, resolver recusaciones y aprobar su reglamento. La frase de examen: puede conocer «cualquier otro asunto» que recabe para sí, siempre «a propuesta del Presidente o de tres Magistrados». Lo que no sea del Pleno, lo llevan las Salas."],
["Cierre","Lo que te llevas: doce Magistrados; Pleno de doce y dos Salas de seis; Presidente en la Primera y Vicepresidente en la Segunda; Secciones de tres; y la última palabra, siempre del Tribunal."]];
